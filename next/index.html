    const hist = S.g.history || [];
    const done = { ...S.g.game, ...v, events: v.events || S.g.game.events, ended: true };
    S.invite = null; Awake.off(); Popup.clear(); S.sheet = null;
    Diag.add('app', '2p the game ended — final page');
    showFinal(done, hist);
  },
  gone(msg) {
    Two.stop(); const was = S.g && S.g.remote; if (!was) return;
    S.g = null; S.invite = null; Awake.off(); Popup.clear();
    if (S.screen === 'game') { S.stack = []; go('home', {}, false); }
    toast(msg); loadHome(); Two.checkInvite();
  },
  // Someone started a game you're in (heard live, the moment they tap PLAY BALL)
  async checkInvite() {
    if (!FCab || !S.user || (S.g && !S.g.remote)) return;
    try { S.invite = await withTimeout(FCab.myInvite(), 8000); } catch (e) { return; }
    render();
  },
  listen() { if (Two.stopLive) Two.stopLive(); Two.stopLive = FCab.watchLive(() => Two.checkInvite()); },
};

// Backstop: while a screen is waiting on the other phone, re-check Firebase every few seconds. If the live connection went
// quiet (iPhones can drop it in the background), the game still moves on — and the Problem log says the backstop was needed.
setInterval(() => {
  if (!S.g || !FCab || document.visibilityState !== 'visible' || !Two.multi()) return;
  if (FCab.isStale(S.g.game.id) && !Two.reloading) { Diag.add('app', '2p backstop: this phone’s copy was out of date — reloading'); return Two.reload(); }
  if (S.screen !== 'game') return;
  let v; try { v = G.view(); } catch (e) { return; }
  if (v !== 'wait' && !(S.g.remote && v === 'after')) return;
  const id = S.g.game.id, before = Two.lastSig;
  FCab.peekGame(id).then(g => {
    if (!g || !S.g || S.g.game.id !== id) return;
    Two.sync(g);
    if (Two.lastSig !== before) Diag.add('app', '2p backstop caught an update the live connection missed');
  }).catch(() => {});
}, 4000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.g && FCab) { Two.watch(); if (S.g.remote) Two.reload(); } });

// ── Home: "Zach started a game — JOIN" ──
function inviteCard() {

  if (S.g && S.g.remote) return '';                // already in it: the LIVE card / bar takes you back
  const back = inv.game.joined && inv.game.joined[inv.me];
  return `<div class="card" style="border-radius:22px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid rgba(255,90,80,.45)">
    <div style="display:flex;align-items:center;gap:7px"><span class="live" style="width:8px;height:8px;border-radius:4px;background:var(--live)"></span>
      <span class="cond" style="font-size:16px;font-weight:800;letter-spacing:.8px;color:var(--livetext)">${esc(inv.hostName.toUpperCase())} STARTED A GAME</span></div>
    <span style="font-size:15px;line-height:1.4;color:var(--text2)">${back ? 'You’re picking in this game on this phone.' : 'You’re in it. Make your own picks from this phone — or ' + esc(inv.hostName) + ' can pick for you.'}</span>
    <button class="press cond big-btn" style="margin-top:4px;height:50px;font-size:21px" ${act('joinGame')}>${back ? 'BACK TO THE GAME' : 'JOIN GAME'}</button></div>`;

// ── The "waiting" screen: someone else is picking, or the host is saving ──
SCREENS.wait = () => {
  const s = S.g.s, g = S.g.game, rem = !!S.g.remote;
  const n = s.needsPick3 ? G.p3Next() : G.pickNext();
  const nm = i => esc((g.players[i] || {}).name || '?'), NM = i => nm(i).toUpperCase();   // never trips over a bad player number
  const host = esc(Two.hostName()), HOST = host.toUpperCase();
  const me = Two.me();
  const myP3 = S.g.pending.p3[me], myPick = S.g.pending.picks[me];
  const mine = s.needsPick3 ? (me in S.g.pending.p3 ? (myP3 ? 'Your Pick 3: ' + myP3.map(code).join(' · ') : 'You skipped Pick 3') : '')
    : (myPick ? 'Your pick: ' + code(myPick.pick) + (myPick.conf ? ' · confident' : '') : '');
  const taken = Object.entries(S.g.pending.picks).map(([j, v]) => `${code(v.pick)} (${nm(j)})`).join(', ');
  let title, label, head, text, btns = '';
  if (n === undefined) {
    title = s.needsPick3 ? 'PICK 3 IS IN' : 'PICKS ARE IN'; label = 'LIVE';
    head = 'SAVING…';
    text = (mine ? mine + '. ' : '') + 'Your screen updates the moment it’s saved.';
  } else if (s.needsPick3 && Two.lastV && Two.lastV.head && Two.lastV.head.undid && Two.lastV.head.by === (g.players[n] || {}).id) {
    title = `${NM(n)} IS CHANGING THEIR PICK 3`; label = 'PICK 3'; head = `WAITING ON ${NM(n)}`;
    text = (mine ? mine + '. ' : '') + 'Your Pick 3 stays in. Pick 3 saves again the moment they lock it.';
  } else if (rem) {
    title = `${NM(n)} IS PICKING…`; label = n === s.priority ? 'PRIORITY PICKS FIRST' : 'WAITING';
    head = `WAITING ON ${NM(n)}`; text = (mine ? mine + '. ' : '') + (n === s.priority ? `${nm(n)} has priority, so they pick first.` : 'Your turn comes after.');
  } else {
    title = `${NM(n)} IS PICKING…`; label = `ON ${NM(n)}’S PHONE`; head = `WAITING ON ${NM(n)}`;
    text = `${nm(n)} is picking on their own phone.` + (taken ? ' Taken so far: ' + taken + '.' : '');
    btns = `<button class="press cond mid-btn" style="margin-top:4px;height:46px;font-size:17px" ${act('pickFor', n)}>PICK FOR ${NM(n)}</button>`;
  }
  if (rem && (s.needsPick3 ? me in S.g.pending.p3 : myPick)) btns += `<button class="press cond mid-btn" style="margin-top:4px;height:42px;font-size:16px" ${act('changeMyPick')}>CHANGE MY PICK</button>`;
  const lastPlay = [...g.events].reverse().find(e => e.type === 'play');
  return `<div class="fixedpage" style="gap:12px">
  ${gameTop(backBtn('gBack'), halfName(s) + (s.needsPick3 ? ' · PICK 3' : ''))}
  ${rem ? `<div style="align-self:center;display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:14px;background:var(--card);font-size:13px;font-weight:700;color:var(--text2)"><span style="width:7px;height:7px;border-radius:4px;background:var(--green)"></span>${host}’s game · you’re in</div>` : ''}
  ${scoreCard()}
  ${lastPlay ? `<span class="courier onphoto" style="font-size:13px;font-weight:700;color:var(--text2)">Last play: ${code(lastPlay.outcome)}${lastPlay.runs ? ' · ' + lastPlay.runs + ' run' + (lastPlay.runs > 1 ? 's' : '') : ''}</span>` : ''}
  <h1 class="cond onphoto" style="margin:-2px 0 0;font-size:36px;font-weight:800;line-height:1">${title}</h1>
  <div class="card" style="flex-shrink:0;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1.5px solid rgba(122,171,255,.5)">
    <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.9px;color:var(--link)">${label}</span>
    <span class="cond" style="font-size:26px;font-weight:800;line-height:1.05">${head}</span>
    <span style="font-size:14px;line-height:1.4;color:var(--text2)">${text}</span>${btns}</div>
  <div class="grow"></div>
</div>`;
};

Object.assign(ACT, {
  joinGame: async () => {
    const inv = S.invite; if (!inv) return;
    if (S.g && !S.g.remote) return toast('You have your own live game going');
    try { await FCab.setJoined(inv.game, inv.me, true); } catch (e) { S.invite = null; render(); return toast('That game has ended', true); }
    let g = inv.game; try { g = (await withTimeout(FCab.loadGame(inv.game.id), 8000)) || g; } catch (e) { /* use what we have */ }
    S.g = { game: g, remote: true, me: inv.me, s: null, pending: { p3: {}, picks: {} }, sel: null, p3sel: [], res: { outcome: null, runs: 0, extraOuts: 0 }, view: null, history: null, popup: null };
    G.replay(); Two.sync(g, true); Two.watch();
    S.stack = []; S.screen = 'game'; render(); Awake.on();
    loadGameHistory();                                   // (for award popups on this phone)
    Diag.add('app', 'joined ' + inv.hostName + '’s game');
  },
  twoLeave: () => ACT.gLeave('home'),
  twoNext: () => { S.g.view = null; Popup.clear(); render(); },   // a joined player moves on at their own pace                 // the game keeps going; RETURN on Home / the LIVE bar brings you back
  stopPicking: async () => {
    const g = S.g; if (!g || !g.remote) return;
    S.sheet = null;
    try { await FCab.setJoined(g.game, g.me, false); } catch (e) { /* the game may have ended */ }
    Two.gone(Two.hostName() + ' will pick for you from here');
  },
  pickFor: i => { S.g.pickFor = +i; buzz(); render(); },
  changeMyPick: () => {
    const g = S.g, me = g.me, s = g.s;
    if (s.needsPick3) { delete g.pending.p3[me]; g.p3sel = []; } else { g.sel = g.pending.picks[me] || null; delete g.pending.picks[me]; }
    Two.unsend(me); render();
  },
});

// ── Hooks into the one-phone game (so every pick also lands in the shared slot) ──
(() => {

  const settle = () => { S.g.sel = null; S.g.p3sel = []; S.g.pickFor = null; render(); toast('Their pick just came in from their phone'); };
  wrap('p3Lock', orig => { const i = G.p3Next(); if ((S.g.p3sel || []).filter(Boolean).length < 3) return render(); if (i === undefined || (Two.elsewhere(i) && S.g.pickFor !== i) || (S.g.shownP3 != null && S.g.shownP3 !== i)) return settle();
    const picks = (S.g.p3sel || []).slice(0, 3); Two.send(i, { p3: picks }); S.g.pickFor = null; return orig(); });
  wrap('p3Skip', orig => { const i = G.p3Next(); if (i === undefined || (S.g.shownP3 != null && S.g.shownP3 !== i)) return settle(); Two.send(i, { skip: true }); S.g.pickFor = null; return orig(); });

    Two.send(i, { pick: sel.pick, conf: !!sel.conf }); S.g.pickFor = null; return orig(); });

const TIPS_SINCE = Date.UTC(2026, 8, 28, 23, 0);
const TIP = {

const Tips = {

// In-game tip: a gold card on the page. Returns '' when there's nothing to show.
function tipCard(id, vars = {}) {

// The first tip on this screen that still wants showing (one at a time)
const firstTip = (list, vars) => { for (const id of list) { const h = tipCard(id, vars); if (h) return h; } return ''; };

// ── Popups pointing at something (outside games) ──
Tips.pop = null;
Tips.candidates = () => {

      out.push(['captain:' + S.scope, '[data-act=clubSettings]', false, made ? null : `YOU’RE NOW A CAPTAIN OF ${(c.name || '').toUpperCase()}`]);

};
Tips.show = ({ id, el, title }) => {

  const close = e => { e.preventDefault(); e.stopPropagation(); wrap.remove(); if (Tips.pop && Tips.pop.el === wrap) Tips.pop = null; Tips.done(id); render(); };

ACT.tipX = id => { Tips.done(id); render(); };
ACT.tipsAgain = () => {

[['p3Lock', 'p3'], ['p3Skip', 'p3'], ['pickLock', 'pick'], ['pickLock', 'conf'], ['pickLock', 'priority'], ['pickConf', 'conf'],

// ════════════ Start-up ════════════
// Show the loading line immediately. If someone was signed in on this phone, open straight to
// their saved Home — no waiting on Firebase or the internet.
// Photo runs up behind the clock (see-through status bar). Some iPhones then report the home-screen app's
// window 47pt too short (e.g. 797 instead of 844), which cut off the tab bar in build 2 — so size the app
// from the real screen height when that happens.
// Some iPhones report a home-screen app's window shorter than the real screen (the tab bar then floats up with a black
// band below it). The fix doesn't guess per phone model: as a home-screen app, upright, with no keyboard open, the app
// always fills the whole screen. (With the keyboard open it keeps its last size, so sheets still lift above the keys.)
const safeTop = () => { const p = document.createElement('div'); p.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top)';
  document.body.appendChild(p); const t = parseFloat(getComputedStyle(p).paddingTop) || 0; p.remove(); return t; };
const typing = () => { const el = document.activeElement; return !!(el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) || !!(window.visualViewport && innerHeight - visualViewport.height > 120); };
let lastShort = 0, fill = false;
// Build 14: iOS can shrink the window a moment AFTER the app opens, without telling the app (seen in live logs on

const shortBy = () => {

  const portrait = innerHeight > innerWidth, iosApp = navigator.standalone === true,
    standalone = iosApp || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  fill = iosApp && portrait;

  return lastShort;
};
function sizeApp() {

  if (!typing() && (window.scrollY || window.scrollX)) window.scrollTo(0, 0);   // iOS can leave the whole page nudged up: put it back
  logLayout();
}
const recheck = () => [0, 300, 1000, 2500].forEach(t => setTimeout(sizeApp, t));

setInterval(() => { const w = innerWidth + 'x' + innerHeight; if (w !== seenWin) { seenWin = w; sizeApp(); } }, 1500);   // a quiet size change: catch it
// For the Problem log (and live logs in Guess Ball Next): what size the phone says it is, and what the app did about it

    const v = window.visualViewport, app = document.getElementById('app');
    const line = `layout: screen ${screen.width}×${screen.height}, window ${innerWidth}×${innerHeight}${v ? ', visible ' + Math.round(v.height) : ''}, top ${safeTop()}, ios app ${navigator.standalone === true ? 'yes' : 'no'}, fill ${fill ? 'yes' : 'no'}, app ${app ? app.offsetHeight : '?'}, scrolled ${Math.round(window.scrollY)}`;

  }, 600);
}
sizeApp(); recheck(); addEventListener('resize', sizeApp); addEventListener('orientationchange', () => setTimeout(sizeApp, 300));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recheck(); });

// When the keyboard opens, lift sheets so their lists stay above it
if (window.visualViewport) {
  const kb = () => {
    const v = visualViewport, open = innerHeight - v.height - v.offsetTop;
    const appEl = document.getElementById('app'), extra = Math.max(0, (appEl ? appEl.offsetHeight : innerHeight) - innerHeight);   // app taller than the window: lift by that too
    const gap = Math.max(0, open > 100 ? open + extra : open);

  visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb); kb();
}
wire();

(() => {
