<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GB Next">
<meta name="theme-color" content="#000000">
<title>Guess Ball</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=Courier+Prime:wght@400;700&family=Norican&display=swap">
<style>
/* ── Theme: every color lives here, so light mode and accents are a swap, not a rewrite ── */
:root {
  --bg: #000000; --card: #1C1C1F; --card2: #2A2A2F; --card3: #3A3A40; --inner: #242428;
  --sheet: #161618; --sheetcard: #1F1F22; --grab: #48484E;
  --text: #F5F5F7; --text2: #A1A1AA; --text3: #8E8E96; --text4: #6E6E76; --text5: #C7C7CC;
  --line: #2A2A2F; --line2: #34343A;
  --accent: #2F6FE4; --onaccent: #FFFFFF; --link: #7AABFF;
  --gold: #F2C14E; --goldfill: #F2C14E; --green: #5BD27A; --orange: #FF8A65; --live: #FF5A4E; --livetext: #FF7B70;
  --cream: #F4F1E8; --swoosh: #D63A2F; --toggle: #34C759;
  --nav: rgba(30,30,34,0.86); --navpill: rgba(255,255,255,0.11); --scrim: rgba(0,0,0,0.6);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;
       -webkit-text-size-adjust: 100%; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
button { font-family: inherit; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; color: inherit; background: none; padding: 0; }
a { color: var(--link); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.press { transition: transform .16s cubic-bezier(.3,.7,.4,1), opacity .2s, background-color .2s; }
.press:active { transform: scale(.96); }
.cond { font-family: "Barlow Condensed", -apple-system, sans-serif; }
.shoulders { font-family: "Big Shoulders Display", -apple-system, sans-serif; }
.courier { font-family: "Courier Prime", "Courier New", monospace; }
.script { font-family: "Norican", cursive; }
.num { font-variant-numeric: tabular-nums; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both } .rise2 { animation: rise .6s cubic-bezier(.2,.8,.2,1) .15s both }
@keyframes up { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
.up { animation: up .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fade { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
.fade { animation: fade .22s ease-out both; }
@keyframes slide { from { opacity: 0; transform: translateX(18px) } to { opacity: 1; transform: none } }
.slide { animation: slide .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes spin { to { transform: rotate(360deg) } }
.spin { animation: spin 1s linear infinite; transform-origin: center; }

/* ── Layout ── */
#app { position: fixed; inset: 0; max-width: 520px; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.page { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        padding: calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 24px); display: flex; flex-direction: column; gap: 14px; }
.page > * { flex-shrink: 0; }
.page.tabbed { --bar: max(12px, calc(var(--safe-bot) - 13px)); padding-bottom: calc(var(--bar) + 110px);
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - var(--bar) - 94px), transparent calc(100% - var(--bar) - 66px));
          mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - var(--bar) - 94px), transparent calc(100% - var(--bar) - 66px)); }
.fixedpage { position: absolute; inset: 0; padding: calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 20px); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.fixedpage > * { flex-shrink: 0; }
.grow { flex-grow: 1 !important; flex-shrink: 1 !important; }

.card { background: var(--card); border-radius: 18px; }
.list { background: var(--card); border-radius: 16px; padding: 0 14px; }
.row { width: 100%; min-height: 50px; display: flex; align-items: center; gap: 10px; text-align: left; }
.list > .row + .row, .list > * + .row { border-top: 1px solid var(--line); }
.h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: .4px; }
.h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .6px; }
.label { padding: 0 4px; font-size: 15px; font-weight: 800; letter-spacing: .8px; color: var(--text3); }
.meta { font-size: 11px; font-weight: 700; color: var(--text3); }
.big-btn { height: 58px; border-radius: 29px; background: var(--accent); color: var(--onaccent); font-size: 22px; font-weight: 800; letter-spacing: .8px; width: 100%; }
.mid-btn { height: 50px; border-radius: 25px; background: var(--card); color: var(--text); font-size: 20px; font-weight: 800; letter-spacing: .8px; width: 100%;
           display: flex; align-items: center; justify-content: center; gap: 8px; }
.small-btn { height: 34px; padding: 0 16px; border-radius: 17px; font-size: 16px; font-weight: 800; letter-spacing: .6px; background: var(--card2); color: var(--text); }
.big-btn:disabled, .mid-btn:disabled, .small-btn:disabled { opacity: .4; }
.back { width: 36px; height: 36px; border-radius: 18px; background: var(--card); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.field { height: 52px; border-radius: 14px; background: var(--card); display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.field input { flex-grow: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font-family: inherit; font-size: 17px; font-weight: 600; }
.field input::placeholder { color: var(--text4); font-weight: 500; }
.search { height: 44px; border-radius: 12px; }
.search input { font-size: 16px; font-weight: 500; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .8px; padding: 0 5px; border-radius: 5px; border: 1.5px solid #4A4A52; color: var(--text5); white-space: nowrap; }
.tag.gold { color: var(--gold); border-color: rgba(242,193,78,.55); }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); }
.seg button { height: 40px; border-radius: 10px; font-size: 17px; font-weight: 800; letter-spacing: .6px; color: var(--text3); }
.seg button.on { background: var(--card3); color: var(--text); }
.toggle { width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; padding: 2px; display: flex; align-items: center; transition: background-color .25s; background: var(--card3); }
.toggle span { width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .25s; }
.toggle.on { background: var(--toggle); } .toggle.on span { transform: translateX(20px); }
.chev { flex-shrink: 0; }

/* ── Info (i) bubbles ── */
.info-btn { display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.info-i { width: 17px; height: 17px; border-radius: 9px; border: 1.5px solid var(--text4); color: var(--text3); font: 700 11px/14px Georgia, serif; font-style: italic;
          display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.bubble { background: #2C2C31; color: var(--text5); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 500; line-height: 1.45; position: relative; margin-top: 6px; }
.bubble::before { content: ""; position: absolute; top: -6px; left: 14px; border: 6px solid transparent; border-top: 0; border-bottom-color: #2C2C31; }

/* ── Tab bar (floating glass capsule) ── */
.tabbar { z-index: 10; position: absolute; left: 16px; right: 16px; bottom: max(12px, calc(var(--safe-bot) - 13px)); height: 64px; padding: 6px; display: flex; gap: 4px; border-radius: 32px;
  background: var(--nav); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid rgba(255,255,255,.10); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.tabbar button { flex: 1; height: 52px; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text2); font-size: 11px; font-weight: 700; letter-spacing: .6px; }
.tabbar button.on { background: var(--navpill); color: var(--link); }

/* ── Sheets, toasts ── */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; z-index: 21; background: var(--sheet); border-radius: 28px 28px 0 0;
         padding: 10px 20px calc(var(--safe-bot) + 24px); display: flex; flex-direction: column; gap: 12px; }
.sheet > * { flex-shrink: 0; }
.grab { align-self: center; width: 38px; height: 5px; border-radius: 3px; background: var(--grab); }
.sheet .list { background: var(--sheetcard); }
.toast { position: absolute; left: 20px; right: 20px; bottom: calc(max(12px, calc(var(--safe-bot) - 13px)) + 76px); z-index: 30; background: #2C2C31; color: var(--text); border-radius: 16px;
         padding: 12px 16px; font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.bad { color: var(--orange); }
.spinner { width: 22px; height: 22px; }
body.bigtext .page { zoom: 1.08; }

</style>

<div id="app"></div>
<script>
// Register the offline helper first thing, so the app can open with no signal
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script>
// ════════════════════════════════════════════════════════════════
//  GUESS BALL — one file, five sections:
//  1 Scorebook (the list of events in a game — lives inside each game)
//  2 Umpire (rules)  3 Statistician (stats + awards)
//  4 Filing Cabinet (saving/loading)  5 Screens
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
//  SECTION 2 — THE UMPIRE (game rules)
//  Pure functions only: no screen, no storage, no internet.
//  Give it the game setup + the scorebook (list of events) and it
//  works out everything about the game at that moment.
// ════════════════════════════════════════════════════════════════
const Umpire = (() => {

  // ── Outcome table (borrowed from v1.9) ──
  // pickable: players can choose it · outs: outs it adds · midAtBat: at-bat continues after it
  const OUTCOMES = [
    { id: 'strikeout',       label: 'STRIKEOUT',        pts: 1,  outs: 1, pickable: true  },
    { id: 'in_play_out',     label: 'IN PLAY OUT',      pts: 1,  outs: 1, pickable: true  },
    { id: 'double_play',     label: 'DOUBLE PLAY',      pts: 3,  outs: 2, pickable: true  },
    { id: 'fielders_choice', label: "FIELDER'S CHOICE", pts: 2,  outs: 1, pickable: true  },
    { id: 'bunt',            label: 'BUNT',             pts: 4,  outs: 0, pickable: true  },
    { id: 'walk',            label: 'WALK',             pts: 3,  outs: 0, pickable: true  },
    { id: 'hbp',             label: 'HBP',              pts: 3,  outs: 0, pickable: true  },
    { id: 'single',          label: 'SINGLE',           pts: 2,  outs: 0, pickable: true  },
    { id: 'double',          label: 'DOUBLE',           pts: 5,  outs: 0, pickable: true  },
    { id: 'triple',          label: 'TRIPLE',           pts: 10, outs: 0, pickable: true  },
    { id: 'home_run',        label: 'HOME RUN',         pts: 7,  outs: 0, pickable: true  },
    { id: 'stolen_base',     label: 'STOLEN BASE',      pts: 4,  outs: 0, pickable: true,  midAtBat: true },
    { id: 'caught_stealing', label: 'CAUGHT STEALING',  pts: 0,  outs: 1, pickable: false, midAtBat: true },
    { id: 'other',           label: 'OTHER',            pts: 0,  outs: 0, pickable: false },
  ];
  const BY_ID = Object.fromEntries(OUTCOMES.map(o => [o.id, o]));
  const PICKABLE = OUTCOMES.filter(o => o.pickable).map(o => o.id);

  const CONF_WIN = 5, CONF_LOSS = -2, P3_BONUS = 7;

  const outcome = id => BY_ID[id] || null;
  const halfKey = s => s.inning + (s.bottom ? 'b' : 't');

  // ── Fresh state for a new game ──
  function start(setup) {
    const n = setup.players.length;
    if (n < 2 || n > 3) throw new Error('Guess Ball needs 2 or 3 players');
    return {
      players: setup.players.slice(),
      scores: Array(n).fill(0),
      priority: setup.priority || 0,
      inning: 1, bottom: false, outs: 0,
      ab: 1,                 // at-bat number within this half-inning
      p3: null,              // { picks:[[a,b,c]|null…], alive:[bool…], hits:[n…] } — set by a pick3 event
      needsPick3: true,      // a Pick 3 round is owed at the start of every half-inning
      carried: {},           // manual picks that still stand after a steal: { playerIdx: {pick, conf} }
      sittingOut: [],        // players whose pick already resolved during this at-bat (called the steal)
      mlb: { away: 0, home: 0 },
      ended: false,
      log: [],               // one entry per resolved pick
      plays: [],             // one entry per result entered
    };
  }

  // Is this player playing Pick 3 on the current at-bat?
  function p3Live(s, i) {
    return !!(s.p3 && s.p3.picks[i] && s.p3.alive[i] && s.ab <= 3);
  }
  function p3PickNow(s, i) {
    return p3Live(s, i) ? s.p3.picks[i][s.ab - 1] : null;
  }

  // Players who still need to make a manual pick this at-bat, priority first, then seat order.
  // (Skips Pick 3 players, steal-callers sitting out, and picks carried over after a steal.)
  function pickOrder(s) {
    const order = [s.priority, ...s.players.map((_, i) => i).filter(i => i !== s.priority)];
    return order.filter(i => !p3Live(s, i) && !s.sittingOut.includes(i) && !s.carried[i]);
  }

  // Picks already locked for this at-bat (Pick 3 picks + steal carry-overs).
  function lockedPicks(s) {
    const locked = {};
    s.players.forEach((_, i) => {
      if (s.sittingOut.includes(i)) return;
      const p = p3PickNow(s, i);
      if (p) locked[i] = { pick: p, conf: false, fromP3: true };
      else if (s.carried[i]) locked[i] = { ...s.carried[i], fromP3: false };
    });
    return locked;
  }

  // Outcomes a player may NOT choose, given picks made so far this at-bat.
  function blocked(s, player, manualSoFar = {}) {
    const all = { ...lockedPicks(s), ...manualSoFar };
    return Object.entries(all).filter(([i]) => +i !== player).map(([, v]) => v.pick);
  }

  // Pick 3: only slot 1 must differ between players.
  function blockedP3First(p3SoFar, player) {
    return Object.entries(p3SoFar)
      .filter(([i, picks]) => +i !== player && picks && picks[0])
      .map(([, picks]) => picks[0]);
  }

  // ── Event handlers ──
  function applyPick3(s, ev) {
    if (!s.needsPick3) throw new Error('Pick 3 already made this half-inning');
    const firsts = new Set();
    s.players.forEach((_, i) => {
      const p = ev.picks[i];
      if (p == null) return; // skipped
      if (!Array.isArray(p) || p.length !== 3 || !p.every(x => PICKABLE.includes(x)))
        throw new Error('Pick 3 must be three valid outcomes');
      if (firsts.has(p[0])) throw new Error('Pick 3 first outcomes must all be different');
      firsts.add(p[0]);
    });
    s.p3 = {
      picks: s.players.map((_, i) => ev.picks[i] || null),
      alive: s.players.map((_, i) => !!ev.picks[i]),
      hits: s.players.map(() => 0),
    };
    s.needsPick3 = false;
  }

  function applyPlay(s, ev) {
    if (s.ended) throw new Error('Game is over');
    if (s.needsPick3) throw new Error('Pick 3 comes first this half-inning');
    if (s.outs >= 3) throw new Error('Three outs — start the next half-inning');
    const oc = outcome(ev.outcome);
    if (!oc) throw new Error('Unknown outcome ' + ev.outcome);
    const runs = ev.runs || 0, extraOuts = ev.extraOuts || 0;

    // Gather every pick standing on this at-bat and validate it.
    const picks = lockedPicks(s);
    const manual = ev.picks || {};
    const needed = pickOrder(s);
    needed.forEach(i => {
      if (!manual[i] || !PICKABLE.includes(manual[i].pick)) throw new Error(s.players[i] + ' has no pick');
    });
    Object.keys(manual).forEach(i => {
      if (!needed.includes(+i)) throw new Error(s.players[i] + ' should not be picking now');
      picks[i] = { pick: manual[i].pick, conf: !!manual[i].conf, fromP3: false };
    });
    const seen = new Set();
    Object.values(picks).forEach(p => {
      if (seen.has(p.pick)) throw new Error('Two players picked ' + p.pick);
      seen.add(p.pick);
    });

    const before = { priority: s.priority, scores: s.scores.slice() };
    const resolve = (i, correct) => {
      const p = picks[i];
      const base = correct ? oc.pts + runs : 0;
      const confPts = p.conf ? (correct ? CONF_WIN : CONF_LOSS) : 0;
      let p3Bonus = 0;
      if (p.fromP3) {
        if (correct) {
          s.p3.hits[i]++;
          if (s.ab === 3 && s.p3.hits[i] === 3) p3Bonus = P3_BONUS;
        } else s.p3.alive[i] = false;
      }
      const pts = base + confPts + p3Bonus;
      s.scores[i] += pts;
      s.log.push({ half: halfKey(s), ab: s.ab, player: i, pick: p.pick, conf: p.conf, fromP3: p.fromP3,
                   outcome: oc.id, runs, correct, pts, base, confPts, p3Bonus, hadPriority: before.priority === i });
      if (correct && i !== s.priority) s.priority = i;
    };

    const endsAtBat = !oc.midAtBat;
    const newOuts = s.outs + oc.outs + extraOuts;
    const halfOverMidAtBat = oc.midAtBat && newOuts >= 3; // caught stealing for out #3

    if (oc.id === 'stolen_base') {
      // Only the steal-caller resolves; everyone else's pick stands.
      const caller = Object.keys(picks).find(i => picks[i].pick === 'stolen_base');
      // (Pick 3 picks don't need carrying — they're re-read from the Pick 3 card.)
      Object.keys(picks).forEach(i => {
        if (+i !== +caller && !picks[i].fromP3) s.carried[i] = { pick: picks[i].pick, conf: picks[i].conf };
      });
      if (caller !== undefined) { resolve(+caller, true); s.sittingOut.push(+caller); }
    } else if (oc.id === 'caught_stealing') {
      // Nothing resolves; picks stand unless the inning just ended.
      Object.keys(picks).forEach(i => { if (!picks[i].fromP3) s.carried[i] = { pick: picks[i].pick, conf: picks[i].conf }; });
    } else {
      Object.keys(picks).forEach(i => resolve(+i, picks[i].pick === oc.id));
    }

    // Runs count toward the real MLB score for whichever team is batting (top = away, bottom = home).
    // Runs on a voided at-bat (caught stealing for out #3) still happened in the real game.
    if (runs) s.mlb[s.bottom ? 'home' : 'away'] += runs;

    s.outs = Math.min(3, newOuts);
    if (endsAtBat || halfOverMidAtBat) {
      // At-bat over: Pick 3 players who sat out after a correct steal keep their hit.
      s.carried = {}; s.sittingOut = [];
      if (endsAtBat) s.ab++;
    }
    s.plays.push({ half: halfKey(s), outcome: oc.id, runs, extraOuts,
                   priorityBefore: before.priority, priorityAfter: s.priority,
                   scoresBefore: before.scores, scoresAfter: s.scores.slice(), outsAfter: s.outs,
                   voided: halfOverMidAtBat });
  }

  function applyNextHalf(s) {
    if (s.ended) throw new Error('Game is over');
    if (s.bottom) { s.inning++; s.bottom = false; } else s.bottom = true;
    s.outs = 0; s.ab = 1; s.p3 = null; s.needsPick3 = true; s.carried = {}; s.sittingOut = [];
  }

  function apply(s, ev) {
    switch (ev.type) {
      case 'pick3':    applyPick3(s, ev); break;
      case 'play':     applyPlay(s, ev); break;
      case 'nextHalf': applyNextHalf(s); break;
      case 'mlb':      s.mlb = { away: ev.away | 0, home: ev.home | 0 }; break;
      case 'end':      s.ended = true; break;
      default: throw new Error('Unknown event ' + ev.type);
    }
    return s;
  }

  // Replay the whole scorebook from the start. Undo = drop the last event and replay.
  function replay(setup, events) {
    const s = start(setup);
    events.forEach(ev => apply(s, ev));
    return s;
  }

  // Would the real MLB game be over? (home leads after top 9+ is done, or away leads after bottom 9+)
  function mlbGameOver(s) {
    if (s.inning < 9) return false;
    if (s.bottom && s.mlb.home > s.mlb.away) return true;                 // walk-off / home leads
    if (s.bottom && s.outs >= 3 && s.mlb.away > s.mlb.home) return true;  // away wins
    if (!s.bottom && s.outs >= 3 && s.mlb.home > s.mlb.away) return true; // home leads after top 9+: no bottom half
    return false;
  }

  // Final result, ties handled.
  function result(s) {
    const top = Math.max(...s.scores);
    const leaders = s.scores.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
    return { tie: leaders.length > 1, winner: leaders.length === 1 ? leaders[0] : null, scores: s.scores.slice() };
  }

  return { OUTCOMES, PICKABLE, outcome, start, apply, replay, pickOrder, lockedPicks, blocked,
           blockedP3First, p3Live, p3PickNow, mlbGameOver, result, CONF_WIN, CONF_LOSS, P3_BONUS };
})();



// ════════════════════════════════════════════════════════════════
//  SECTION 3 — THE STATISTICIAN (stats and awards)
//  Pure functions only: no screen, no storage, no internet.
//  Give it a list of games and it works out standings, history,
//  records, head-to-head, game summaries and every award — always
//  from scratch, so a deleted or fixed game can never leave stale
//  numbers behind.
//
//  A game looks like this:
//  { id, date: '2026-09-25', seq: 1790000000000 (sort order within a day),
//    era: 'app' | 'beta' | 'preapp' | 'hand',
//    players: [{ id, name }, …]  (seat order, 2–3 players),
//    scores: [41, 29]            (final scores; app games get them from the events),
//    away, home, park, mlb: { away, home } | null, note, addedBy,
//    setup: { priority }, events: [...]   (app games only — the scorebook),
//    ended: true | false,                  (false = live game in progress)
//    beta: [{ correct, picks, confRight, confWrong }, …]  (beta games only) }
// ════════════════════════════════════════════════════════════════
const Statistician = (() => {
  const U = (typeof Umpire !== 'undefined') ? Umpire : require('./umpire.js');

  // ── Small helpers ──
  const byTime = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));
  const chrono = games => games.slice().sort(byTime);
  const season = g => +g.date.slice(0, 4);
  const hasPlays = g => g.era === 'app';
  const hasPickData = g => g.era === 'app' || g.era === 'beta';
  const CODES = { strikeout: 'K', in_play_out: 'IPO', double_play: 'DP', fielders_choice: 'FC', bunt: 'BU',
    walk: 'BB', hbp: 'HBP', single: '1B', double: '2B', triple: '3B', home_run: 'HR', stolen_base: 'SB',
    caught_stealing: 'CS', other: 'OTH' };
  const WORDS = { strikeout: 'strikeout', in_play_out: 'in-play out', double_play: 'double play',
    fielders_choice: "fielder's choice", bunt: 'bunt', walk: 'walk', hbp: 'hit by pitch', single: 'single',
    double: 'double', triple: 'triple', home_run: 'HR', stolen_base: 'steal' };
  const halfLabel = h => (h.endsWith('t') ? 'Top ' : 'Bot ') + parseInt(h, 10);
  const pct = (a, b) => (b ? a / b : null);

  // ── Who won: the one top score wins; a shared top score is a tie between those players ──
  function result(g) {
    const s = scoresOf(g);
    const top = Math.max(...s);
    const leaders = s.map((v, i) => (v === top ? i : -1)).filter(i => i >= 0);
    const sorted = s.slice().sort((a, b) => b - a);
    return { scores: s, tie: leaders.length > 1, leaders, winner: leaders.length === 1 ? leaders[0] : null,
             margin: sorted[0] - sorted[1] };
  }
  // Each player's outcome in a game: 'W', 'L' or 'T' (tied for the top score).
  function outcomeFor(g, i) {
    const r = result(g);
    if (r.winner === i) return 'W';
    if (r.tie && r.leaders.includes(i)) return 'T';
    return 'L';
  }
  const seatOf = (g, pid) => g.players.findIndex(p => p.id === pid);

  // ════════════════════════════════════════════════════════════
  //  GAME REPLAY — runs an app game's scorebook through the Umpire
  //  once and records everything the stats and awards need.
  // ════════════════════════════════════════════════════════════
  const cache = new WeakMap();
  function replay(g) {
    if (!hasPlays(g)) return null;
    const hit = cache.get(g);
    if (hit && hit.n === g.events.length) return hit.r;
    const n = g.players.length;
    const s = U.start({ players: g.players.map(p => p.name), priority: (g.setup && g.setup.priority) || 0 });
    const plays = [];      // one entry per play event: { ev, index, half, log:[…], scoresBefore, scoresAfter, … }
    const halves = [];     // one entry per half-inning played: { half, pts:[…], picks:[…], right:[…], complete }
    let half = null;
    g.events.forEach((ev, index) => {
      const before = { scores: s.scores.slice(), priority: s.priority, ab: s.ab, half: s.inning + (s.bottom ? 'b' : 't'),
                       logLen: s.log.length };
      U.apply(s, ev);
      if (ev.type === 'pick3' || (ev.type === 'play' && !half)) {
        if (!half || half.half !== before.half) {
          half = { half: before.half, pts: Array(n).fill(0), picks: Array(n).fill(0), right: Array(n).fill(0),
                   complete: false, priorityChanged: false, priorityStart: before.priority };
          halves.push(half);
        }
      }
      if (ev.type !== 'play') return;
      const log = s.log.slice(before.logLen);
      const last = s.plays[s.plays.length - 1];
      log.forEach(e => {
        half.pts[e.player] += e.pts; half.picks[e.player]++; if (e.correct) half.right[e.player]++;
      });
      if (last.priorityAfter !== before.priority) half.priorityChanged = true;
      const endsAtBat = !U.outcome(ev.outcome).midAtBat || last.voided;
      if (s.outs >= 3) half.complete = true;
      plays.push({ ev, index, half: before.half, ab: before.ab, log, outcome: ev.outcome, runs: ev.runs || 0,
                   scoresBefore: before.scores, scoresAfter: s.scores.slice(),
                   priorityBefore: before.priority, priorityAfter: last.priorityAfter,
                   endsAtBat, halfComplete: s.outs >= 3, voided: last.voided });
    });
    const r = { state: s, plays, halves, scores: s.scores.slice(), ended: !!s.ended || g.ended === true };
    cache.set(g, { n: g.events.length, r });
    return r;
  }
  const scoresOf = g => (hasPlays(g) ? replay(g).scores : g.scores);

  // Per-player numbers for one game (accuracy, confidence, Pick 3, best streak, line score…)
  function gameNumbers(g) {
    const n = g.players.length;
    const out = g.players.map(() => ({ picks: 0, right: 0, confRight: 0, confWrong: 0, p3: 0, bestStreak: 0 }));
    if (g.era === 'beta') {
      g.beta.forEach((b, i) => Object.assign(out[i], { picks: b.picks, right: b.correct,
        confRight: b.confRight || 0, confWrong: b.confWrong || 0, bestStreak: null, p3: null }));
      return out;
    }
    if (!hasPlays(g)) return null;
    const cur = Array(n).fill(0);
    replay(g).plays.forEach(p => p.log.forEach(e => {
      const o = out[e.player];
      o.picks++; if (e.correct) o.right++;
      if (e.conf) (e.correct ? o.confRight++ : o.confWrong++);
      if (e.p3Bonus) o.p3++;
      cur[e.player] = e.correct ? cur[e.player] + 1 : 0;
      o.bestStreak = Math.max(o.bestStreak, cur[e.player]);
    }));
    return out;
  }

  // Points per player per inning — the line score. Returns { innings:[1..N], rows:[[…per inning]], totals }
  function lineScore(g) {
    if (!hasPlays(g)) return null;
    const r = replay(g);
    const last = r.halves.length ? parseInt(r.halves[r.halves.length - 1].half, 10) : 1;
    const innings = Array.from({ length: Math.max(9, last) }, (_, i) => i + 1);
    const rows = g.players.map(() => innings.map(() => null));
    r.halves.forEach(h => {
      const inn = parseInt(h.half, 10);
      h.pts.forEach((v, i) => { rows[i][inn - 1] = (rows[i][inn - 1] || 0) + v; });
    });
    return { innings, rows, totals: r.scores.slice() };
  }

  // ════════════════════════════════════════════════════════════
  //  STANDINGS — W / L / T per player, with win %, avg points, accuracy
  //  opts.season: a year (number) or omitted for all time
  // ════════════════════════════════════════════════════════════
  function standings(games, opts = {}) {
    const rows = {};
    chrono(games).filter(g => g.ended !== false && (!opts.season || season(g) === opts.season)).forEach(g => {
      const nums = gameNumbers(g);
      g.players.forEach((p, i) => {
        const r = rows[p.id] || (rows[p.id] = { id: p.id, name: p.name, w: 0, l: 0, t: 0, games: 0, points: 0,
                                                 picks: 0, right: 0, first: g.date });
        r.name = p.name;
        r[outcomeFor(g, i).toLowerCase()]++; r.games++; r.points += scoresOf(g)[i];
        if (nums) { r.picks += nums[i].picks; r.right += nums[i].right; }
      });
    });
    return Object.values(rows).map(r => ({ ...r,
      winPct: pct(r.w, r.games), avgPts: pct(r.points, r.games), accuracy: pct(r.right, r.picks) }))
      .sort((a, b) => b.w - a.w || a.l - b.l || b.games - a.games || a.name.localeCompare(b.name));
  }
  // Seasons that have games, newest first (for the season dropdown)
  const seasons = games => [...new Set(games.map(season))].sort((a, b) => b - a);

  // ════════════════════════════════════════════════════════════
  //  HISTORY — games grouped by season, newest first, with tags
  // ════════════════════════════════════════════════════════════
  function history(games) {
    const list = chrono(games.filter(g => g.ended !== false));
    // Doubleheaders: same day + same matchup → "Game 1", "Game 2"
    const groups = {};
    list.forEach(g => { const k = g.date + '|' + (g.away || '') + '|' + (g.home || '');
                        (groups[k] = groups[k] || []).push(g); });
    const label = new Map();
    Object.values(groups).forEach(gs => { if (gs.length > 1) gs.forEach((g, i) => label.set(g, 'Game ' + (i + 1))); });
    const bySeason = {};
    list.slice().reverse().forEach(g => {
      const r = result(g);
      const order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
      (bySeason[season(g)] = bySeason[season(g)] || []).push({
        id: g.id, date: g.date, era: g.era, tag: { preapp: 'PRE-APP', beta: 'BETA', hand: 'ADDED BY ' + (g.addedBy || '').toUpperCase(), app: '' }[g.era],
        doubleheader: label.get(g) || '', tie: r.tie,
        players: order.map(i => ({ id: g.players[i].id, name: g.players[i].name, score: r.scores[i], outcome: outcomeFor(g, i) })),
        away: g.away || '', home: g.home || '', park: g.park || '', mlb: g.mlb || null,
      });
    });
    return Object.keys(bySeason).sort((a, b) => b - a).map(y => ({ season: +y, games: bySeason[y] }));
  }

  // ════════════════════════════════════════════════════════════
  //  RECORDS — the all-time record cards
  // ════════════════════════════════════════════════════════════
  function records(games) {
    const list = chrono(games.filter(g => g.ended !== false));
    if (!list.length) return [];
    const best = (label, better) => {
      let top = null;
      return { offer(value, who, g, extra) { if (top === null || better(value, top.value)) top = { label, value, who, date: g && g.date, gameId: g && g.id, extra }; },
               get: () => top };
    };
    const hi = best('HIGHEST SCORE', (a, b) => a > b), lo = best('LOWEST SCORE', (a, b) => a < b);
    const win = best('BIGGEST WIN', (a, b) => a > b), acc = best('BEST ACCURACY', (a, b) => a > b);
    const halfRec = best('BEST HALF-INNING', (a, b) => a > b), comeback = best('BIGGEST COMEBACK', (a, b) => a > b);
    const pickStreak = best('LONGEST PICK STREAK', (a, b) => a > b);
    const run = {}, streak = best('WIN STREAK', (a, b) => a > b);
    list.forEach(g => {
      const r = result(g), nums = gameNumbers(g);
      g.players.forEach((p, i) => {
        hi.offer(r.scores[i], p.name, g); lo.offer(r.scores[i], p.name, g);
        const o = outcomeFor(g, i);
        run[p.id] = o === 'W' ? (run[p.id] || 0) + 1 : 0;
        streak.offer(run[p.id], p.name, g);
        if (nums && nums[i].picks >= 10) acc.offer(nums[i].right / nums[i].picks, p.name, g, { picks: nums[i].picks });
        if (nums && nums[i].bestStreak) pickStreak.offer(nums[i].bestStreak, p.name, g);
      });
      if (r.winner !== null) {
        const loser = r.scores.map((v, i) => i).filter(i => i !== r.winner).sort((a, b) => r.scores[b] - r.scores[a])[0];
        win.offer(r.margin, g.players[r.winner].name, g, { score: r.scores[r.winner], loserScore: r.scores[loser], loser: g.players[loser].name });
      }
      if (hasPlays(g)) {
        replay(g).halves.forEach(h => h.pts.forEach((v, i) => halfRec.offer(v, g.players[i].name, g, { half: h.half })));
        const d = deficits(g);
        if (r.winner !== null && d[r.winner] > 0) comeback.offer(d[r.winner], g.players[r.winner].name, g);
      }
    });
    const st = standings(list);
    const mostWins = st.slice().sort((a, b) => b.w - a.w)[0];
    const mostGames = st.slice().sort((a, b) => b.games - a.games)[0];
    const ys = seasons(list);
    const out = [hi.get(), win.get(), streak.get(),
      { label: 'MOST WINS', value: mostWins.w, who: mostWins.name },
      acc.get(), lo.get(),
      { label: 'MOST GAMES', value: mostGames.games, who: mostGames.name, since: season({ date: mostGames.first }) },
      { label: 'SEASONS', value: ys.length, from: ys[ys.length - 1], to: ys[0] }];
    // In-game records appear once there is at least one new-app game
    [halfRec.get(), comeback.get(), pickStreak.get()].forEach(x => { if (x) out.push(x); });
    return out.filter(Boolean);
  }

  // Biggest deficit each player faced (behind the leader) at any point in an app game
  function deficits(g) {
    const r = replay(g);
    const d = g.players.map(() => 0);
    r.plays.forEach(p => p.scoresAfter.forEach((v, i) => {
      const others = p.scoresAfter.filter((_, j) => j !== i);
      d[i] = Math.max(d[i], Math.max(...others) - v);
    }));
    return d;
  }

  // ════════════════════════════════════════════════════════════
  //  HEAD TO HEAD — a vs b
  //  Only the overall winner of a game beats the others; a tie, or a
  //  game a third player won, doesn't count for either side.
  // ════════════════════════════════════════════════════════════
  function h2h(games, a, b) {
    const list = chrono(games.filter(g => g.ended !== false && seatOf(g, a) >= 0 && seatOf(g, b) >= 0));
    const res = [];   // 'a' | 'b' per decided game
    const side = { a: { pts: 0, bestWin: null, longest: 0 }, b: { pts: 0, bestWin: null, longest: 0 } };
    let runA = 0, runB = 0;
    list.forEach(g => {
      const ia = seatOf(g, a), ib = seatOf(g, b), r = result(g);
      side.a.pts += r.scores[ia]; side.b.pts += r.scores[ib];
      let w = null;
      if (r.winner === ia) w = 'a'; else if (r.winner === ib) w = 'b';
      if (!w) return;
      res.push({ w, gameId: g.id, date: g.date });
      const m = w === 'a' ? r.scores[ia] - r.scores[ib] : r.scores[ib] - r.scores[ia];
      if (side[w].bestWin === null || m > side[w].bestWin) side[w].bestWin = m;
      if (w === 'a') { runA++; runB = 0; } else { runB++; runA = 0; }
      side.a.longest = Math.max(side.a.longest, runA); side.b.longest = Math.max(side.b.longest, runB);
    });
    const wa = res.filter(x => x.w === 'a').length, wb = res.length - wa;
    const lastW = res.length ? res[res.length - 1].w : null;
    let cur = 0; for (let i = res.length - 1; i >= 0 && res[i].w === lastW; i--) cur++;
    return {
      a: { wins: wa, avg: pct(side.a.pts, list.length), bestWin: side.a.bestWin, longest: side.a.longest,
           current: lastW === 'a' ? cur : 0 },
      b: { wins: wb, avg: pct(side.b.pts, list.length), bestWin: side.b.bestWin, longest: side.b.longest,
           current: lastW === 'b' ? cur : 0 },
      games: list.length, since: list.length ? season(list[0]) : null,
      leader: wa > wb ? 'a' : wb > wa ? 'b' : null,
      last10: res.slice(-10).map(x => x.w),
    };
  }
  // Everyone a player has faced, with game counts (for the second H2H picker)
  function opponents(games, pid) {
    const c = {};
    games.forEach(g => { if (g.ended === false || seatOf(g, pid) < 0) return;
      g.players.forEach(p => { if (p.id !== pid) c[p.id] = { id: p.id, name: p.name, games: ((c[p.id] || {}).games || 0) + 1 }; }); });
    return Object.values(c).sort((x, y) => y.games - x.games);
  }

  // ════════════════════════════════════════════════════════════
  //  GAME SUMMARY — everything the Final and Past game screens show
  // ════════════════════════════════════════════════════════════
  function summary(g, allGames) {
    const r = result(g), nums = gameNumbers(g);
    const out = { id: g.id, result: r, players: g.players, lineScore: lineScore(g), tiles: null, plays: [], series: null, winNumber: null };
    if (nums) {
      const acc = nums.map(x => pct(x.right, x.picks));
      out.tiles = [
        { label: 'ACCURACY', values: acc, lead: leadOf(acc) },
        { label: 'PICK 3 BONUSES', values: nums.map(x => x.p3), lead: leadOf(nums.map(x => x.p3)) },
        { label: 'CONFIDENCE', values: nums.map(x => [x.confRight, x.confWrong]), lead: leadOf(nums.map(x => x.confRight - x.confWrong)) },
        { label: 'BEST STREAK', values: nums.map(x => x.bestStreak), lead: leadOf(nums.map(x => x.bestStreak)) },
      ].filter(t => t.values.every(v => v !== null && v !== undefined));
    }
    if (hasPlays(g)) out.plays = bigPlays(g);
    if (allGames && g.players.length === 2) {
      const before = allGames.filter(x => byTime(x, g) <= 0 || x === g);
      out.series = h2h(before.includes(g) ? before : before.concat(g), g.players[0].id, g.players[1].id);
    }
    if (allGames && r.winner !== null) {
      const wid = g.players[r.winner].id;
      out.winNumber = chrono(allGames.concat(allGames.includes(g) ? [] : [g])).filter(x => byTime(x, g) <= 0 && x.ended !== false)
        .filter(x => { const i = seatOf(x, wid); return i >= 0 && outcomeFor(x, i) === 'W'; }).length;
    }
    return out;
  }
  const leadOf = vals => { const m = Math.max(...vals.map(v => (v === null ? -Infinity : v)));
    const at = vals.map((v, i) => (v === m ? i : -1)).filter(i => i >= 0); return at.length === 1 ? at[0] : null; };

  // The biggest at-bats of the game, best first. Each: { player, pts, code, text, when, context, half }
  function bigPlays(g) {
    const r = replay(g), list = [];
    // Pick 3 bonuses are one "play" covering the three at-bats
    r.plays.forEach(p => p.log.forEach(e => {
      if (e.p3Bonus) {
        const picks = r.plays.filter(q => q.half === p.half).flatMap(q => q.log).filter(x => x.player === e.player && x.fromP3 && x.correct);
        const pts = picks.reduce((a, x) => a + x.pts, 0);
        list.push(mk(p, e.player, pts, 'P3', `${g.players[e.player].name} hit Pick 3 (${picks.map(x => CODES[x.pick]).join(' · ')})`));
      } else if (e.correct && !e.fromP3 && e.pts >= 4) {
        const runs = e.runs ? `${e.runs}-run ` : '';
        list.push(mk(p, e.player, e.pts, CODES[e.outcome],
          `${g.players[e.player].name} called a ${runs}${WORDS[e.outcome]}${e.conf ? ' with confidence' : ''}`));
      }
    }));
    function mk(p, i, pts, code, text) {
      const bef = p.scoresBefore, aft = p.scoresAfter;
      const lead = (s, k) => s[k] - Math.max(...s.filter((_, j) => j !== k));
      const lb = lead(bef, i), la = lead(aft, i);
      const context = lb <= 0 && la > 0 ? 'took the lead' : lb < 0 && la === 0 ? 'tied it'
        : lb > 0 && la > lb ? 'went up by ' + la : la < 0 ? 'cut it to ' + (-la) : '';
      return { player: i, pts, code, text, when: halfLabel(p.half), context, half: p.half, index: p.index };
    }
    return list.sort((a, b) => b.pts - a.pts || a.index - b.index).slice(0, 5);
  }

  // ════════════════════════════════════════════════════════════
  //  AWARDS — 81 awards in 10 categories
  //  kind: 'count' (tiered or single target, shows a progress bar),
  //        'once'  (earned the first time something happens)
  //  scope: 'all' = every game counts (pre-app, beta, hand-added too)
  //         'app' = only new-app games with a full scorebook
  // ════════════════════════════════════════════════════════════
  const A = (id, name, cat, desc, extra = {}) => ({ id, name, cat, desc, kind: 'once', scope: 'app', ...extra });
  const T = tiers => ({ kind: 'count', tiers });
  const AWARDS = [
    A('wins', 'Wins', 'WINS & GAMES', 'Win games all time', { ...T([1, 5, 10, 25]), scope: 'all' }),
    A('games', 'Games Played', 'WINS & GAMES', 'Play games all time', { ...T([5, 10, 25]), scope: 'all' }),
    A('season_ticket', 'Season Ticket', 'WINS & GAMES', 'Play 20 games', { ...T([20]), scope: 'all' }),
    A('points', 'Points', 'WINS & GAMES', 'Total points all time', { ...T([100, 500, 1000, 2500]), scope: 'all' }),

    A('rivalry', 'Rivalry', 'RIVALRIES', 'Play 25 games vs the same opponent', { ...T([25]), scope: 'all' }),
    A('blood_feud', 'Blood Feud', 'RIVALRIES', 'Play 50 games vs the same opponent', { ...T([50]), scope: 'all' }),
    A('dominant', 'Dominant', 'RIVALRIES', 'Win 70%+ vs one opponent (min 10)', { scope: 'all' }),
    A('dynasty', 'Dynasty', 'RIVALRIES', 'Win 5 straight vs the same opponent', { ...T([5]), scope: 'all' }),
    A('nemesis', 'Nemesis', 'RIVALRIES', 'Lose 5 straight to the same opponent', { ...T([5]), scope: 'all' }),
    A('revenge', 'Revenge', 'RIVALRIES', 'Beat whoever beat you last time', { scope: 'all' }),

    A('bold', 'Bold', 'BIG CALLS', 'Call confidence for the first time'),
    A('called_shot', 'Called Shot', 'BIG CALLS', 'Right on a HR with confidence'),
    A('big_brain', 'Big Brain', 'BIG CALLS', 'Right on a DP with confidence'),
    A('first_to_third', 'First to Third', 'BIG CALLS', 'Right on a triple with confidence'),
    A('hubris', 'Hubris', 'BIG CALLS', 'Wrong on a HR with confidence'),
    A('diamond_hands', 'Diamond Hands', 'BIG CALLS', 'Confidence 5 times in a game, 5 for 5'),
    A('perfect_confidence', 'Perfect Confidence', 'BIG CALLS', 'Every confidence call right (min 3)'),

    A('calls_bb', 'Walks', 'CAREER CALLS', 'Correct BB calls all time', { ...T([10, 25, 50]), outcome: 'walk', code: 'BB' }),
    A('calls_hbp', 'Hit by Pitch', 'CAREER CALLS', 'Correct HBP calls all time', { ...T([5, 15, 30]), outcome: 'hbp', code: 'HBP' }),
    A('calls_sb', 'Steals', 'CAREER CALLS', 'Correct SB calls all time', { ...T([5, 15, 30]), outcome: 'stolen_base', code: 'SB' }),
