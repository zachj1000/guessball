// ── Award popup ──
// Lives outside the normal screen redraws so it can glide smoothly: drops in, stays 4 seconds per award,
// follows your thumb when swiped up, pauses while held (2 more seconds after letting go), tap opens the award.
const Popup = (() => {
  let queue = [], el = null, card = null, timer = null, gone = false;
  const html = (a, more) => `<div style="background:var(--popbg);border:1.5px solid rgba(242,193,78,.7);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.7)">
      <div style="width:50px;height:50px;flex-shrink:0;border-radius:14px;background:rgba(242,193,78,.12);display:flex;align-items:center;justify-content:center">${awardIcon(a.award, 34)}</div>
      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:1px">
        <span class="cond" style="font-size:12px;font-weight:800;letter-spacing:1px;color:var(--gold)">AWARD UNLOCKED · ${esc(a.name.toUpperCase())}</span>
        <span class="cond" style="font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1.05">${esc(a.award.name.toUpperCase())}${a.award.tiers && a.award.tiers.length > 1 ? ' · ' + tierNum(a.award.tiers[a.tier - 1]) : ''}</span>
        <span class="courier" style="font-size:11px;font-weight:700;color:var(--text5)">${esc(a.award.desc)}</span></div>
      ${more ? `<span class="cond" style="align-self:flex-start;font-size:12px;font-weight:800;color:#1A1406;background:var(--goldfill);padding:1px 6px;border-radius:5px;white-space:nowrap">+${more} MORE</span>` : ''}
    </div>`;
  const wait = ms => { clearTimeout(timer); timer = setTimeout(() => hide(0), ms); };
  function next() {
    if (!queue.length) { if (el) { el.remove(); el = null; } return; }
    if (!el) {
      el = document.createElement('div'); el.className = 'gbpop';
      el.style.cssText = 'position:fixed;left:0;right:0;top:calc(var(--safe-top) + 8px);z-index:40;pointer-events:none;display:flex;justify-content:center;padding:0 12px';
      document.body.appendChild(el);
    }
    const a = queue[0]; gone = false;
    card = document.createElement('div');
    card.style.cssText = 'pointer-events:auto;width:100%;max-width:496px;touch-action:none;will-change:transform;transform:translateY(-140%);opacity:0';
    card.innerHTML = html(a, queue.length - 1);
    el.replaceChildren(card);
    card.getBoundingClientRect();                     // start from above the screen, then glide down
    card.style.transition = 'transform .45s cubic-bezier(.2,1.1,.3,1), opacity .25s';
    card.style.transform = 'translateY(0)'; card.style.opacity = '1';
    grab(card, a);
    wait(4000);
  }
  function hide(fromY) {
    if (gone || !card) return; gone = true; clearTimeout(timer);
    const c = card;
    c.style.transition = 'transform .28s cubic-bezier(.4,0,1,1), opacity .28s';
    c.style.transform = `translateY(calc(${Math.min(fromY, 0)}px - 140%))`; c.style.opacity = '0';
    setTimeout(() => { queue.shift(); next(); }, 260);
  }
  function grab(c, a) {
    let y0 = null, dy = 0, t0 = 0, lastY = 0, lastT = 0, v = 0;
    c.addEventListener('pointerdown', e => {
      if (gone) return; clearTimeout(timer);
      const m = new DOMMatrix(getComputedStyle(c).transform);     // catch it mid-glide without a jump
      y0 = e.clientY - m.m42; dy = m.m42; t0 = lastT = Date.now(); lastY = e.clientY; v = 0;
      c.style.transition = 'none'; c.style.transform = `translateY(${dy}px)`; c.style.opacity = '1'; try { c.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
    });
    c.addEventListener('pointermove', e => {
      if (y0 == null || gone) return;
      const now = Date.now(); v = (e.clientY - lastY) / Math.max(1, now - lastT); lastY = e.clientY; lastT = now;
      const raw = e.clientY - y0; dy = raw < 0 ? raw : raw * 0.25;     // up moves freely, down resists
      c.style.transform = `translateY(${dy}px)`; c.style.opacity = String(Math.max(0.35, 1 + Math.min(0, dy) / 160));
    });
    const up = () => {
      if (y0 == null || gone) return; y0 = null;
      if (dy < -30 || (dy < -8 && v < -0.3)) return hide(dy);                     // swiped up: keep going from where the thumb left it
      if (Math.abs(dy) < 8 && Date.now() - t0 < 350) {                // tap: open the award
        queue = [a]; hide(0); S.sheet = { name: 'award', arg: a.award.id + '|' + a.playerId }; render(); return;
      }
      c.style.transition = 'transform .3s cubic-bezier(.2,1.1,.3,1), opacity .2s'; c.style.transform = 'translateY(0)'; c.style.opacity = '1';
      wait(2000);                                                      // held: 2 more seconds after letting go
    };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  return {
    show(list) { const busy = queue.length > 0; queue = queue.concat(list); if (!busy) next(); else if (card && !gone) { card.innerHTML = html(queue[0], queue.length - 1); } },
    clear() { queue = []; clearTimeout(timer); if (el) { el.remove(); el = null; } card = null; },
  };
})();

// ════════════ Sounds, buzz, screen awake ════════════
const Sound = {
  ctx: null,
  play(kind) {
    if (!S.settings.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      const c = this.ctx, t = c.currentTime;
      const notes = kind === 'award' ? [784, 988, 1175, 1568] : kind === 'right' ? [880, 1319] : [220];
      notes.forEach((f, k) => {
        const o = c.createOscillator(), gn = c.createGain();
        o.type = kind === 'miss' ? 'sine' : 'triangle'; o.frequency.value = f;
        gn.gain.setValueAtTime(0.0001, t + k * 0.09); gn.gain.exponentialRampToValueAtTime(0.18, t + k * 0.09 + 0.02);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + (kind === 'award' ? 0.35 : 0.22));
        o.connect(gn).connect(c.destination); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.4);
      });
    } catch (e) { /* no sound available */ }
  },
};
// iPhone only lets a web app start sound during a tap. Sounds play a moment after the tap (once the play is saved),
// so wake the sound system up on the first tap, and again after the app comes back from the background.
const unlockSound = () => { if (!S.settings.sound) return; try {
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  Sound.ctx = Sound.ctx || new C(); if (Sound.ctx.state !== 'running') Sound.ctx.resume().catch(() => {});
  const b = Sound.ctx.createBuffer(1, 1, 22050), src = Sound.ctx.createBufferSource(); src.buffer = b; src.connect(Sound.ctx.destination); src.start(0);
} catch (e) { /* no sound */ } };
['touchend', 'click'].forEach(t => document.addEventListener(t, () => { if (!Sound.ctx || Sound.ctx.state !== 'running') unlockSound(); }, { passive: true, capture: true }));
// Settings → Game options → TEST SOUND: plays the award jingle and reports what the phone's sound system says
ACT.testSound = () => {
  const was = S.settings.sound; S.settings.sound = true; unlockSound(); Sound.play('award'); S.settings.sound = was;
  setTimeout(() => { const st = Sound.ctx ? Sound.ctx.state : 'unavailable';
    S.soundCheck = `Sound system: ${st}${Sound.ctx ? ' · ' + Math.round(Sound.ctx.sampleRate / 100) / 10 + 'kHz' : ''}${navigator.audioSession ? ' · session ' + navigator.audioSession.type : ''}. No sound? Check that silent mode is off and the volume is up.`;
    render(); }, 600);
};
const Awake = {
  lock: null,
  async on() { if (!S.settings.awake || this.lock || !('wakeLock' in navigator)) return; try { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } catch (e) { /* not allowed */ } },
  off() { if (this.lock) { this.lock.release().catch(() => {}); this.lock = null; } },
};

function openGame(game) {

  G.replay();

}
async function loadGameHistory() {
  const g = S.g && S.g.game; if (!g || !FCab) return;
  try { const h = await withTimeout(FCab.historyOf(g.players.map(p => p.id)), 20000); if (S.g && S.g.game === g) S.g.history = h.filter(x => x.id !== g.id); }

// kind: 'save' (someone tapped it) or 'auto' (the phone saved a finished Pick 3 by itself — losing that race is no news)
async function saveEvent(ev, kind = 'save', extra = {}) {
  if (FCab.isStale(S.g.game.id)) { Two.reload(); throw new Error('Catching up with the other phone — try again in a moment'); }
  const probe = { ...S.g.game, events: S.g.game.events.concat([ev]) };
  Umpire.replay({ players: probe.players.map(p => p.name), priority: probe.setup.priority }, probe.events);   // throws if the rules say no
  S.g.undone = null;
  const p = FCab.addEvent(S.g.game, ev, extra);
  G.replay();
  p.catch(e => (e && (e.code === 'PERMISSION_DENIED' || e.code === 'STALE') ? Two.lost(e, kind) : toast('Couldn’t save: ' + e.message, true)));
}
function afterPlayFx() {
  const idx = S.g.game.events.length - 1;
  const { entries } = lastPlayInfo();
  const right = entries.some(e => e.correct);

  showAwardsAt(idx);
}
// Pop up any awards earned on scorebook event `idx` (after a play, or after REDO puts one back)
// (upTo: a joined phone catching up on several plays at once)
function showAwardsAt(idx, upTo = idx) {
  if (!S.g.history) return;
  const cp = G.copy();
  const got = Statistician.awardsInGame(S.g.history.concat([cp]), cp).filter(a => a.at >= idx && a.at <= upTo && Two.awardHere(a.playerId));
  if (got.length) { Popup.show(got); Sound.play('award'); buzz(); }
}
function describeEvent(ev) {
  const g = S.g.game;
  if (ev.type === 'play') {
    const before = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events);
    const after = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events.concat([ev]));
    const diffs = after.scores.map((v, i) => v - before.scores[i]).map((d, i) => (d ? `${g.players[i].name} ${signed(-d)}` : '')).filter(Boolean);
    return { what: 'PLAY', detail: [code(ev.outcome) + (ev.runs ? `, ${ev.runs} run${ev.runs > 1 ? 's' : ''}` : ''), ...diffs, 'back to AB ' + before.ab].join(' · ') };
  }
  if (ev.type === 'pick3') return { what: 'PICK 3', detail: 'Pick 3 is open again' };
  if (ev.type === 'nextHalf') return { what: 'HALF-INNING CHANGE', detail: 'Back to the last play' };
  if (ev.type === 'mlb') return { what: 'SCORE FIX', detail: 'MLB score put back' };
  return { what: 'CHANGE', detail: '' };
}

      if (e.code === 'IN_LIVE_GAME' && !S.g && await recoverLiveGame()) return;   // it was your own game: bring it back

    }
  },
  resume: () => { if (!S.g) return; S.sheet = null; S.stack = []; S.screen = 'game'; render(); Awake.on(); },
  finalShare: () => { const f = S.final; if (f) shareGame(f.game, f.sum, f.awards || []); },
  gLeave: where => { S.sheet = null; Awake.off(); if (where === 'home') { S.stack = []; go('home', {}, false); loadHome(); } else if (where === 'settings') { S.stack = []; go('settings', {}, false); } else ACT.tab(where); },

  // Pick 3
  // The three Pick 3 spots: a pick fills the first empty one; tapping a filled spot empties just that one (to change it)
  p3Pick: o => { const a = (S.g.p3sel || []).slice(0, 3); const k = [0, 1, 2].find(j => !a[j]); if (k === undefined) return; a[k] = o; S.g.p3sel = a; buzz(); render(); },
  p3Unpick: k => { const a = (S.g.p3sel || []).slice(); a[+k] = null; S.g.p3sel = a; render(); },
  p3Skip: () => { const i = G.p3Next(); if (i === undefined) return render(); S.g.pending.p3[i] = null; S.g.p3sel = []; afterP3Choice(); },
  p3Lock: () => { const i = G.p3Next(); if (i === undefined || (S.g.p3sel || []).filter(Boolean).length < 3) return render(); S.g.pending.p3[i] = S.g.p3sel.slice(0, 3); S.g.p3sel = []; buzz(); afterP3Choice(); },

  // Picks
  pickSel: o => { S.g.sel = { pick: o, conf: (S.g.sel || {}).conf || false }; buzz(); render(); },
  pickConf: () => { S.g.sel = { ...(S.g.sel || {}), conf: !(S.g.sel || {}).conf }; render(); },
  pickLock: () => { const i = G.pickNext(); if (i === undefined || !S.g.sel) return render(); S.g.pending.picks[i] = { pick: S.g.sel.pick, conf: !!S.g.sel.conf }; S.g.sel = null; buzz(); render(); },

  // What happened
  resSel: o => { const r = S.g.res, was = r.outcome; r.outcome = o;
    if (o === 'home_run' && r.runs < 1) { r.runs = 1; r.autoRun = true; }                  // the batter scores on a homer
    else if (was === 'home_run' && o !== 'home_run' && r.autoRun && r.runs === 1) r.runs = 0; // changed their mind: take it back
    if (o !== 'home_run') r.autoRun = false;
    buzz(); render(); },
  resStep: arg => { const [k, d] = arg.split('|'), r = S.g.res; r[k] = Math.max(k === 'runs' && r.outcome === 'home_run' ? 1 : 0, r[k] + (+d)); if (k === 'runs') r.autoRun = false; render(); },
  resSave: async () => {
    const r = S.g.res;
    const need = Umpire.pickOrder(S.g.s), picks = {};
    need.forEach(i => { if (S.g.pending.picks[i]) picks[i] = S.g.pending.picks[i]; });
    const ev = { type: 'play', outcome: r.outcome, picks, runs: r.runs, extraOuts: r.extraOuts };
    try { await saveEvent(ev); } catch (e) { return toast(e.message, true); }
    S.g.pending.picks = {}; S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; S.g.view = 'after';
    afterPlayFx(); render(); const p = $app().querySelector('.gscroll') || $app().querySelector('.fixedpage'); if (p) p.scrollTop = 0;
  },
  gNext: async next => {
    Popup.clear();
    if (next === 'END GAME') { S.draft = {}; S.sheet = { name: 'endGame' }; render(); return; }
    if (next === 'NEXT HALF-INNING') { try { await saveEvent({ type: 'nextHalf' }); } catch (e) { return toast(e.message, true); } }
    S.g.view = null; render();
  },
  gBack: () => {
    const g = S.g;
    if (g.view === 'after') return;
    const v = G.view();
    if (v === 'pick3' && (g.p3sel || []).some(Boolean)) { const a = g.p3sel.slice(); a[[2, 1, 0].find(k => a[k])] = null; g.p3sel = a; return render(); }
    // Back steps back through the picks made on this phone (never one someone made on their own phone)
    if (v === 'pick3' || (v === 'wait' && g.s.needsPick3)) { const done = G.order().filter(j => j in g.pending.p3 && Two.mayTakeBack(j));
      if (done.length) { const j = done.pop(), was = g.pending.p3[j]; delete g.pending.p3[j]; g.p3sel = was ? was.slice() : []; return render(); } }   // (their picks come back to edit)
    const order = Umpire.pickOrder(g.s).filter(j => g.pending.picks[j] && Two.mayTakeBack(j));
    if (['pick', 'result', 'wait'].includes(v) && !g.s.needsPick3 && order.length) {
      if (v === 'result' && g.res.outcome) { g.res = { outcome: null, runs: 0, extraOuts: 0 }; }
      const j = order.pop();
      g.sel = g.pending.picks[j]; delete g.pending.picks[j]; return render();
    }
    const last = G.lastEvent();
    if (last && last.type === 'play') { g.view = 'after'; return render(); }
    if (last && last.type === 'nextHalf') { ACT.gUndo().then(() => toast('End of half-inning undone')); return; }     // just ended the half-inning (menu or NEXT HALF-INNING): Back puts it back
    if (last && last.type === 'pick3' && Two.reopenP3()) return;                                                      // right after Pick 3: change your Pick 3
    toast('To leave the game, use ••• → Home');                                                                        // Back never leaves a game
  },
  gUndo: async () => {
    const ev = G.lastEvent(); if (!ev) return;
    if (FCab.isStale(S.g.game.id)) { Two.reload(); return toast('Catching up with the other phone — try again in a moment', true); }
    const sent = FCab.undo(S.g.game);                    // (takes it off this phone's copy right away)
    let desc = null; try { desc = describeAfterUndo(ev); } catch (e) { /* the game changed underneath — no summary */ }
    G.replay();
    Popup.clear();
    S.g.undone = desc ? { ev, ...desc } : null;
    const back = {}; Object.entries(ev.picks || {}).forEach(([j, v]) => { if (v && v.pick) back[j] = { pick: v.pick, conf: !!v.conf }; });
    if (ev.type === 'play') { S.g.pending.picks = back; S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; S.g.view = null; }
    else if (ev.type === 'pick3') { S.g.pending.p3 = {}; S.g.view = null; }
    else if (ev.type === 'nextHalf') { const l = G.lastEvent(); S.g.view = l && l.type === 'play' ? 'after' : null; }   // back to that half: its last play, or the pick if none yet
    else S.g.view = null;
    render();
    await sent.catch(e => { if (e && (e.code === 'PERMISSION_DENIED' || e.code === 'STALE')) { S.g && (S.g.undone = null); Two.lost(e, 'undo'); } else toast(e.message, true); });   // refused: reloads the real game
    clearTimeout(ACT.gUndo.t); ACT.gUndo.t = setTimeout(() => { if (S.g && S.g.undone) { S.g.undone = null; render(); } }, 6000);
  },
  gRedo: async () => {
    const u = S.g.undone; if (!u) return;
    try { await saveEvent(u.ev); } catch (e) { return toast(e.message, true); }
    S.g.pending = { p3: {}, picks: {} }; S.g.res = { outcome: null, runs: 0, extraOuts: 0 };
    S.g.view = u.ev.type === 'play' || u.ev.type === 'nextHalf' ? (u.ev.type === 'play' ? 'after' : null) : null;
    render();
    if (u.ev.type === 'play') showAwardsAt(S.g.game.events.length - 1);
  },

  // Menu actions
  mlbStep: arg => { const [k, d] = arg.split('|'); S.draft[k] = Math.max(0, S.draft[k] + (+d)); render(); },
  mlbSave: async () => { try { await saveEvent({ type: 'mlb', away: S.draft.mlbA, home: S.draft.mlbH }); } catch (e) { return toast(e.message, true); } S.sheet = null; S.draft = {}; S.g.view = S.g.view; render(); toast('MLB score updated'); },
  endHalf: async () => { S.g.pending = { p3: {}, picks: {} }; S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; try { await saveEvent({ type: 'nextHalf' }); } catch (e) { return toast(e.message, true); } S.sheet = null; S.g.view = null; render(); },
  endGame: async () => {
    const g = S.g.game, s = S.g.s, plays = G.plays();
    S.busy = true; render();
    try {
      await FCab.endGame(g, { scores: s.scores.slice(), mlb: { away: s.mlb.away, home: s.mlb.home }, note: (S.draft.note || '').trim() });
      S.busy = false; S.sheet = null; Awake.off(); Two.stop();
      if (!plays) { S.g = null; S.stack = []; go('home', {}, false); toast('Game thrown out — nothing was played'); loadHome(); return; }
      showFinal({ ...g, events: g.events.slice(), ended: true }, S.g.history || []);
    } catch (e) { S.busy = false; render(); toast(e.message, true); }
  },
  discardGame: async () => {
    const g = S.g.game; S.busy = true; render();
    try { await FCab.discardGame(g); } catch (e) { S.busy = false; render(); return toast(e.message, true); }
    Popup.clear(); S.busy = false; S.sheet = null; S.g = null; Awake.off(); Two.stop(); S.stack = []; go('home', {}, false);
    toast('Game thrown out — nothing was saved'); loadHome();
  },
  finalPlays: () => { S.final.open = !S.final.open; render(); },
  finalDone: () => { S.final = null; S.stack = []; go('home', {}, false); loadHome(); },
});
function describeAfterUndo(ev) {
  // score change shown as what got taken back
  const g = S.g.game;
  if (ev.type !== 'play') return describeEvent(ev);
  const before = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events);
  const after = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events.concat([ev]));
  const diffs = after.scores.map((v, i) => v - before.scores[i]).map((d, i) => (d ? `${g.players[i].name} ${signed(-d)}` : '')).filter(Boolean);
  return { what: 'PLAY', detail: [code(ev.outcome) + (ev.runs ? `, ${ev.runs} run${ev.runs > 1 ? 's' : ''}` : ''), ...diffs, 'back to AB ' + before.ab].join(' · ') };
}
// The final page (with the share card) — on the host's phone after End game, and on every phone that joined the game
function showFinal(done, hist) {
  const all = hist.concat([done]);
  const sum = Statistician.summary(done, all);
  const got = Statistician.awardsInGame(all, done);
  const merged = [];
  got.forEach(a => { const m = merged.find(x => x.award.id === a.award.id && x.tier === a.tier); if (m) m.names.push(a.name); else merged.push({ ...a, names: [a.name] }); });
  S.final = { game: done, sum, awards: merged, open: false };
  S.g = null; S.stack = []; S.screen = 'final'; render(); Sound.play('award');
}
function afterP3Choice() {
  if (G.p3Next() === undefined) {                       // everyone's in: save it (in an online game any phone may — first to Firebase wins)
    const picks = S.g.game.players.map((_, i) => S.g.pending.p3[i] || null);
    // Pick 3 comes before the first at-bat's picks: if a changed Pick 3 now clashes with a first-at-bat pick someone already
    // made (possible after Back reopened a Pick 3), that pick is cleared in the same save and its player picks again
    const nextKey = 'e' + (S.g.game.events.length + 1), firsts = picks.filter(Boolean).map(x => x[0]), extra = {};
    Object.entries(Two.slotsFor(nextKey)).forEach(([j, x]) => { if (x && x.pick && firsts.includes(x.pick)) extra['slots/' + nextKey + '/' + j] = null; });
    saveEvent({ type: 'pick3', picks }, 'auto', extra).then(() => { S.g.pending.p3 = {}; render(); }).catch(e => { S.g.pending.p3 = {}; toast(e.message, true); render(); });
    return;
  }
  render();
}

//  SECTION 5c — STATS, PAST GAMES, ADDING GAMES, SHARE CARDS
//  Everything here is worked out by the Statistician from the games
//  of the selected club (or All my games) every time it's shown.
// ════════════════════════════════════════════════════════════════
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const niceDate = (iso, withDay) => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d);
  return (withDay ? dt.toLocaleDateString('en-US', { weekday: 'short' }) + ', ' : '') + `${MON[m - 1]} ${d}, ${y}`; };
const pctText = v => (v == null ? '—' : Math.round(v * 100) + '%');
const H2H_A = '#2F6FE4', H2H_B = '#C9392E';

// ── The games for the selected club (shared by Home and Stats) ──
function scopeGames() { return (S.data && S.data.key === S.scope) ? S.data.games : null; }
async function loadScopeGames(force) {
  const key = S.scope;
  if (!force && S.data && S.data.key === key && S.data.games) return S.data.games;
  // One load at a time per club: anyone asking while it's on its way shares the same answer
  if (loadScopeGames.key === key && loadScopeGames.p) return loadScopeGames.p;
  loadScopeGames.key = key;
  const p = loadScopeGamesNow(key);
  loadScopeGames.p = p;
  try { return await p; } finally { if (loadScopeGames.p === p) loadScopeGames.p = null; }
}
async function loadScopeGamesNow(key) {
  const cacheKey = 'gb_games_' + S.user.uid + '_' + key;
  if (!S.data || S.data.key !== key) S.data = { key, games: Store.json(cacheKey, null), loading: true };
  render();
  try {
    const games = (await withTimeout(FCab.loadGames(key === 'mine' ? { mine: true } : { club: key }), 15000)).filter(g => g.ended !== false);
    if (S.scope !== key) return null;
    S.data = { key, games, loading: false };
    try { Store.put(cacheKey, games); } catch (e) { /* phone storage full: fine, just not saved */ }
  } catch (e) { S.data.loading = false; if (!S.data.games) toast('Couldn’t load games — check your connection', true); }
  render();
  return S.data.games;
}

function statsRecords(games) {
  const recs = Statistician.records(games);
  const fmt = r => {

      case 'BIGGEST WIN': return ['+' + r.value, r.who, `${niceDate(r.date)} · ${r.extra.score} to ${r.extra.loserScore}`];
      case 'WIN STREAK': return [r.value, r.who, 'Games in a row'];
      case 'MOST WINS': return [r.value, r.who, 'All time'];
      case 'BEST ACCURACY': return [pctText(r.value), r.who, `${niceDate(r.date)} · ${r.extra.picks} picks`];
      case 'MOST GAMES': return [r.value, r.who, 'Since ' + r.since];
      case 'SEASONS': return [r.value, 'Club history', r.from === r.to ? String(r.from) : `${r.from} – ${r.to}`];
      case 'BEST HALF-INNING': return ['+' + r.value, r.who, niceDate(r.date)];
      case 'BIGGEST COMEBACK': return [r.value, r.who, niceDate(r.date)];
      case 'LONGEST PICK STREAK': return [r.value, r.who, niceDate(r.date)];
      case 'TOP BALLPARK': return [r.value, r.who, 'Games played there'];
      default: return [String(r.value).replace('-', '−'), r.who, niceDate(r.date)];
    }
  };
  const hasInGame = recs.some(r => r.label === 'BEST HALF-INNING');
  // Top ballpark (moved here from the club card): the park with the most games, couch games not counted
  const parks = {}; games.forEach(g => { if (g.park && !g.tv && g.ended !== false) parks[g.park] = (parks[g.park] || 0) + 1; });
  const topPark = Object.entries(parks).sort((a, b) => b[1] - a[1])[0];
  if (topPark) recs.push({ label: 'TOP BALLPARK', value: topPark[1], who: topPark[0], park: true });
  return `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${recs.map(r => { const [v, who, when] = fmt(r);
    const tap = r.top && r.top.length > 1;
    return `<${tap ? 'button' : 'div'} class="card${tap ? ' press' : ''}" ${tap ? act('openSheet', 'record:' + r.label) : ''} style="border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;min-width:0;text-align:left;width:100%">
      <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--text3);display:flex;justify-content:space-between;gap:4px;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${r.label === 'LONGEST PICK STREAK' ? 'PICK STREAK' : r.label}</span>${tap ? '<span style="color:var(--text4)">›</span>' : ''}</span>
      <span class="shoulders" style="font-size:38px;font-weight:900;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</span>
      <span style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(who)}</span>
      <span class="courier" style="font-size:10px;font-weight:700;color:var(--text2);line-height:1.35">${esc(when)}</span></${tap ? 'button' : 'div'}>`; }).join('')}</div>
  ${hasInGame ? '' : `<span class="courier meta" style="line-height:1.5;padding:0 2px">In-game records (best half-inning, biggest comeback, longest pick streak) start with the first new-app game.</span>`}`;
}

// Top 5 for one record (tap a record card)
function recordSheet() {
  const games = scopeGames() || [], r = Statistician.records(games).find(x => x.label === S.sheet.arg);
  if (!r || !r.top) return '<span>Nothing to show yet.</span>';
  const val = t => { switch (r.label) {
    case 'BIGGEST WIN': case 'BEST HALF-INNING': return '+' + t.value;
    case 'BEST ACCURACY': return pctText(t.value);
    default: return String(t.value).replace('-', '−'); } };
  const sub = t => { switch (r.label) {
    case 'BIGGEST WIN': return `${niceDate(t.date)} · ${t.extra.score} to ${t.extra.loserScore} vs ${t.extra.loser}`;
    case 'BEST ACCURACY': return `${niceDate(t.date)} · ${t.extra.picks} picks`;
    case 'WIN STREAK': return 'Ended ' + niceDate(t.date);
    case 'MOST WINS': return 'Wins, all time';
    case 'MOST GAMES': return 'Games, all time';
    default: return t.date ? niceDate(t.date) : ''; } };
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">${esc(r.label)}</h2>
  <span class="courier meta">Top ${r.top.length} · ${esc(scopeName())}</span>
  <div class="list">${r.top.map((t, i) => `<${t.gameId ? 'button' : 'div'} class="row${t.gameId ? ' press' : ''}" ${t.gameId ? act('recordGame', t.gameId) : ''} style="min-height:56px;gap:12px">
    <span class="shoulders" style="width:18px;font-size:22px;font-weight:900;color:${['var(--gold)', 'var(--silver)', 'var(--bronze)'][i] || 'var(--text3)'}">${i + 1}</span>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:700">${esc(t.who)}</span><span class="courier meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sub(t))}</span></div>
    <span class="shoulders num" style="font-size:26px;font-weight:900">${val(t)}</span>${t.gameId ? ICON.chev : ''}</${t.gameId ? 'button' : 'div'}>`).join('')}</div>`;
}

function statsH2H(games) {
  const people = Statistician.standings(games).sort((a, b) => b.games - a.games);
  if (people.length < 2) return `<div class="card" style="padding:18px;color:var(--text2);font-size:15px">Head to head needs at least two players.</div>`;
  let a = S.h2hA && people.find(p => p.id === S.h2hA) ? S.h2hA : (people.find(p => p.id === S.user.uid) || people[0]).id;
  const opps = Statistician.opponents(games, a);
  let b = S.h2hB && opps.find(o => o.id === S.h2hB) ? S.h2hB : (opps[0] || {}).id;
  S.h2hA = a; S.h2hB = b;
  const nameOf = id => (people.find(p => p.id === id) || {}).name || '?';
  const picker = (side, id, color) => `<button class="press cond" ${act('openSheet', 'h2hPick:' + side)} style="flex:1;min-width:0;height:44px;border-radius:12px;background:var(--card);border-bottom:3px solid ${color};font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;white-space:nowrap">${esc(nameOf(id))} ${ICON.down}</button>`;
  if (!b) return `<div style="display:flex;align-items:center;gap:10px">${picker('a', a, H2H_A)}</div><div class="card" style="padding:18px;color:var(--text2)">${esc(nameOf(a))} hasn't played anyone here yet.</div>`;
  const h = Statistician.h2h(games, a, b);
  const initial = id => esc(nameOf(id)[0].toUpperCase());
  const row = (label, va, vb) => `<div style="display:grid;grid-template-columns:70px 1fr 70px;align-items:center;height:48px;border-top:1px solid var(--line)">
    <span class="shoulders num" style="font-size:24px;font-weight:900">${va}</span><span class="cond" style="text-align:center;font-size:15px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${label}</span><span class="shoulders num" style="text-align:right;font-size:24px;font-weight:900">${vb}</span></div>`;
  const streak = side => (h[side].current ? 'W' + h[side].current : '—');
  return `<div style="display:flex;align-items:center;gap:10px">${picker('a', a, H2H_A)}<span class="cond onphoto" style="align-self:center;font-size:16px;font-weight:800;color:var(--text3)">VS</span>${picker('b', b, H2H_B)}</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0">
    <div style="display:flex;align-items:baseline;gap:16px"><span class="shoulders" style="font-size:80px;font-weight:900;line-height:1;color:${H2H_A}">${h.a.wins}</span><span class="shoulders" style="font-size:36px;font-weight:800;color:var(--text4)">–</span><span class="shoulders" style="font-size:80px;font-weight:900;line-height:1;color:${H2H_B}">${h.b.wins}</span></div>
    <span class="courier onphoto" style="align-self:center;font-size:13px;font-weight:700;color:var(--text2)">${h.games} game${h.games === 1 ? '' : 's'}${h.since ? ' since ' + h.since : ''}</span></div>
  ${h.last10.length ? `<div class="card" style="border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between"><span class="cond" style="font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--text3)">LAST ${h.last10.length}</span><span class="courier meta">oldest → newest</span></div>
    <div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px">${h.last10.map(w => `<span class="cond" style="height:30px;border-radius:7px;background:${w === 'a' ? H2H_A : H2H_B};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800">${initial(w === 'a' ? a : b)}</span>`).join('')}</div></div>` : ''}
  <div class="card" style="border-radius:16px;padding:0 16px">
    ${row('AVG SCORE', h.a.avg == null ? '—' : h.a.avg.toFixed(1), h.b.avg == null ? '—' : h.b.avg.toFixed(1)).replace('border-top:1px solid var(--line)', '')}
    ${row('BIGGEST WIN', h.a.bestWin == null ? '—' : '+' + h.a.bestWin, h.b.bestWin == null ? '—' : '+' + h.b.bestWin)}
    ${row('LONGEST STREAK', h.a.longest, h.b.longest)}
    ${row('CURRENT STREAK', streak('a'), streak('b'))}</div>
  ${info('h2hwhy', '<span class="courier meta">What counts?</span>', 'Only the overall winner of a game beats the others. A tie, or a game a third player won, doesn’t count for either of you.', '')}`;
}
function h2hPickSheet() {
  const side = S.sheet.arg, games = scopeGames() || [];
  const people = Statistician.standings(games);
  let list;
  if (side === 'a') list = people.sort((x, y) => y.games - x.games).map(p => ({ id: p.id, name: p.name, n: p.games, sub: `${p.w}–${p.l}${p.t ? '–' + p.t : ''}` }));
  else list = Statistician.opponents(games, S.h2hA).map(o => { const h = Statistician.h2h(games, S.h2hA, o.id);
    const aName = (people.find(p => p.id === S.h2hA) || {}).name;
    return { id: o.id, name: o.name, n: o.games, sub: h.leader ? `${h.leader === 'a' ? aName : o.name} leads ${Math.max(h.a.wins, h.b.wins)}–${Math.min(h.a.wins, h.b.wins)}` : `Tied ${h.a.wins}–${h.b.wins}` }; });
  const cur = side === 'a' ? S.h2hA : S.h2hB;
  const aName = (people.find(p => p.id === S.h2hA) || {}).name || '';
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">${side === 'a' ? 'PICK A PLAYER' : esc(aName.toUpperCase()) + ' VS…'}</h2>
  ${side === 'b' ? `<span class="courier meta">Only people ${esc(aName)} has played · ${esc(scopeName())}</span>` : ''}
  <div class="list">${list.map(p => `<button class="row press" ${act('h2hPick', side + '|' + p.id)} style="min-height:56px">
    <span style="width:32px;height:32px;border-radius:16px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${esc(p.name[0].toUpperCase())}</span>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:17px;font-weight:600">${esc(p.name)}</span><span class="courier meta">${esc(p.sub)}</span></div>
    <span class="shoulders" style="font-size:20px;font-weight:800;color:var(--text2)">${p.n}</span>${ICON.check(p.id === cur ? 'var(--link)' : 'transparent')}</button>`).join('')}</div>
  <span class="courier meta" style="line-height:1.5">Number = games together. Switch to ALL MY GAMES to include people from other clubs.</span>`;
}

// ════════════ Past game ════════════
// Buttons whose on/off depends on what's typed are re-checked on every keystroke (no redraw needed)
CHECKS.addGame = () => { const d = S.ag; return !!(d && d.players.length >= 2 && d.players.every(p => String(p.score).trim() !== '' && !isNaN(+p.score)) && d.date); };
SCREENS.pastGame = () => {

  const sum = Statistician.summary(g, games), r = sum.result, n = g.players.length;
  const order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
  const nm = i => esc(g.players[i].name.toUpperCase());
  const headline = r.tie ? r.leaders.map(nm).join(' & ') + ' TIE' : nm(r.winner) + ' WINS';
  const mlb = g.mlb ? `${shortTeam(g.away) || 'Away'} ${g.mlb.away} at ${shortTeam(g.home) || 'Home'} ${g.mlb.home}` : (g.away && g.home ? `${shortTeam(g.away)} at ${shortTeam(g.home)}` : '');
  const host = g.era === 'app' ? (g.players.find(p => p.id === g.host) || {}).name : '';
  const meta = [mlb, whereAt(g), host && 'hosted by ' + host, g.era === 'hand' && 'added by ' + g.addedBy].filter(Boolean).join(' · ');
  const mine = S.clubs.filter(c => c.captain).map(c => c.code);
  const canDelete = S.admin || (g.clubList || []).some(c => mine.includes(c)) || (g.era === 'hand' && g.host === S.user.uid);
  const canEdit = g.era === 'hand' && (g.host === S.user.uid || S.admin);
  const aw = S.params.awards;
  return `<div class="page">

    <button class="back press" aria-label="Share card" ${act('shareCard', g.id)}><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2M5 4.5L8 1.5l3 3M3 8v5.5h10V8"/></svg></button></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0">

    ${n === 3 && !r.tie ? `<div style="display:flex;align-items:flex-end;gap:22px">${order.map((i, k) => `<div style="display:flex;flex-direction:column;align-items:center"><span class="shoulders" style="font-size:${k ? 44 : 64}px;font-weight:900;line-height:1;color:${k ? 'var(--text2)' : 'var(--text)'}">${r.scores[i]}</span><span style="font-size:13px;font-weight:600;color:var(--text2)">${esc(g.players[i].name)}</span></div>`).join('')}</div>`
      : `<div style="display:flex;align-items:baseline;gap:14px"><span class="shoulders" style="font-size:68px;font-weight:900;line-height:1">${r.scores[order[0]]}</span><span class="shoulders" style="font-size:32px;color:var(--text4)">–</span><span class="shoulders" style="font-size:68px;font-weight:900;line-height:1;color:${r.tie ? 'var(--text)' : 'var(--text2)'}">${r.scores[order[1]]}</span></div>`}
    ${meta ? `<span class="courier" style="font-size:12px;font-weight:700;color:var(--text2);text-align:center">${esc(meta)}</span>` : ''}
    ${g.era !== 'app' ? `<span class="cond tag" style="margin-top:4px">${g.era === 'beta' ? 'BETA' : g.era === 'hand' ? 'ADDED BY HAND' : 'PRE-APP'}</span>` : ''}</div>
  ${sum.lineScore ? lineScoreCard(false, g) : ''}
  ${sum.tiles ? `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${sum.tiles.map(t => {
    const fmt = v => (t.label === 'ACCURACY' ? pctText(v) : t.label === 'CONFIDENCE' ? v.join('–') : v);

      <div style="display:flex;gap:${n === 3 ? 7 : 10}px;white-space:nowrap">${order.map(i => `<span class="shoulders" style="font-size:${n === 3 ? 20 : 26}px;font-weight:900;color:${sc(t.values[i]) === top ? 'var(--text)' : 'var(--dim)'}">${fmt(t.values[i])}</span>`).join('')}</div></div>`; }).join('')}</div>` : ''}
  ${sum.plays.length ? `<h2 class="cond" style="margin:6px 0 0;font-size:22px;font-weight:800">PLAYS OF THE GAME</h2>
  <div class="card" style="padding:0 16px">${sum.plays.map((m, k) => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${k ? 'border-top:1px solid var(--line)' : ''}"><span class="shoulders" style="width:40px;font-size:22px;font-weight:900">${m.code}</span>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600">${esc(m.text)}</span><span class="courier meta" style="color:var(--text2)">${m.when}${m.context ? ' · ' + m.context : ''}</span></div>
    <span class="shoulders" style="font-size:20px;font-weight:900;color:var(--green)">+${m.pts}</span></div>`).join('')}</div>` : ''}
  ${aw && aw.length ? `<h2 class="cond" style="margin:6px 0 0;font-size:22px;font-weight:800">AWARDS EARNED</h2>
  <div style="display:flex;flex-direction:column;gap:8px">${aw.map(a => `<div class="card" style="border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px">

  ${g.note ? `<div class="card" style="padding:12px 16px"><span class="cond label" style="padding:0">GAME NOTE</span><div style="font-size:15px;line-height:1.45;margin-top:4px">${esc(g.note)}</div></div>` : ''}
  ${canEdit ? `<button class="press cond mid-btn" style="margin-top:8px;font-size:18px" ${act('editGame', g.id)}>EDIT GAME</button>` : ''}
  ${canDelete ? `<button class="press cond mid-btn" style="font-size:18px;color:var(--orange);${canEdit ? '' : 'margin-top:8px'}" ${act('openSheet', 'deleteGame')}>DELETE GAME <span class="cond tag gold" style="font-size:10px;margin-left:4px">${S.admin && !(g.clubList || []).some(c => mine.includes(c)) ? 'ADMIN' : g.era === 'hand' && g.host === S.user.uid ? 'YOURS' : 'CAPTAINS'}</span></button>` : ''}
</div>`;
};

// ════════════ Share card (a picture made on the phone) ════════════
// The share card: laid out like the Final page (FINAL · date, headline, big score, line score, the four tiles),
// with the awards as icons only, and the wordmark + club at the bottom. 1080 wide, as tall as it needs (4:5 or taller).
async function drawShareCard(g, sum, awards) {
  try { await document.fonts.ready; } catch (e) { /* fonts may not be loaded offline: system fonts are fine */ }
  const COND = '"Barlow Condensed", -apple-system, sans-serif', SH = '"Big Shoulders Display", -apple-system, sans-serif', CO = '"Courier Prime", "Courier New", monospace', SYS = '-apple-system, "Helvetica Neue", sans-serif';
  const F = (w, size, fam) => `${w} ${size}px ${fam}`;

  const tiles = sum.tiles || [], ls = sum.lineScore, list = (awards || []).slice(0, 12);
  const W = 540, lsH = ls ? 32 + n * 36 : 0, rows = Math.ceil(tiles.length / 2), iconRows = Math.ceil(list.length / 8);
  const need = 150 + 110 + (ls ? lsH + 16 : 0) + rows * 88 + (list.length ? 30 + iconRows * 58 : 0) + 70;
  const H = Math.max(675, need), K = 2, c = document.createElement('canvas'); c.width = W * K; c.height = H * K;
  const x = c.getContext('2d'); x.scale(K, K);
  x.fillStyle = '#0B0B0D'; x.fillRect(0, 0, W, H);
  // The game's park photo behind everything: blurred more than in the app and darker, so every number stays crisp
  const photo = parkPhotoFor(g, true);
  let PANEL = '#1C1C20';
  if (photo) {
    try {
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = photo; });
      const s = Math.max(W / img.width, H / img.height), iw = img.width * s, ih = img.height * s;
      x.save(); x.filter = 'blur(9px) brightness(0.42) saturate(1.1)'; x.drawImage(img, (W - iw) / 2 - 20, (H - ih) / 2 - 20, iw + 40, ih + 40); x.restore();
      const gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(0.5, 'rgba(0,0,0,.1)'); gr.addColorStop(1, 'rgba(0,0,0,.5)');
      x.fillStyle = gr; x.fillRect(0, 0, W, H); PANEL = 'rgba(22,22,26,.72)';
    } catch (e) { /* no photo: plain dark card */ }
  }
  const rr = (px, py, w, h, rad, fill) => { x.beginPath(); x.roundRect(px, py, w, h, rad); x.fillStyle = fill; x.fill(); };
  const text = (t, px, py, font, color, align = 'left') => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(t, px, py); };
  const fit = (t, max, font) => { x.font = font; let s = t; while (x.measureText(s).width > max && s.length > 2) s = s.slice(0, -2) + '…'; return s; };
  const nm = i => g.players[i].name.toUpperCase();
  // FINAL · date (and where)
  text('FINAL', W / 2, 46, F(800, 18, COND), '#A1A1AA', 'center');
  const meta = [g.away && `${shortTeam(g.away)} ${g.mlb ? g.mlb.away : ''}`.trim(), g.home && `${shortTeam(g.home)} ${g.mlb ? g.mlb.home : ''}`.trim(), whereAt(g), niceDate(g.date)].filter(Boolean).join(' · ');
  text(fit(meta, W - 72, F(700, 13, CO)), W / 2, 66, F(700, 13, CO), '#A1A1AA', 'center');
  // headline, big score, the line under it
  const head = r.tie ? r.leaders.map(nm).join(' & ') + ' TIE' : nm(r.winner) + ' WINS';
  let hs = 46; x.font = F(800, hs, COND); while (x.measureText(head).width > W - 72 && hs > 26) { hs -= 2; x.font = F(800, hs, COND); }
  text(head, W / 2, 122, F(800, hs, COND), '#F5F5F7', 'center');
  let y = 212;
  const big = F(900, 86, SH), dash = F(800, 40, SH);
  if (n === 2 || r.tie) {
    const [a1, b1] = r.tie ? r.leaders : order, sa = String(r.scores[a1]), sb = String(r.scores[b1]);
    x.font = big; const wa = x.measureText(sa).width, wb = x.measureText(sb).width, gap = 44, tot = wa + gap + wb, x0 = (W - tot) / 2;
    text(sa, x0, y, big, '#F5F5F7'); text('–', x0 + wa + gap / 2, y - 14, dash, '#5E5E66', 'center'); text(sb, x0 + wa + gap, y, big, r.tie ? '#F5F5F7' : '#8E8E96');
  } else {
    const cols = order.map(i => String(r.scores[i])), cw = (W - 72) / n;
    order.forEach((i, k) => { const cx = 36 + cw * k + cw / 2;
      text(['1ST', '2ND', '3RD', '4TH'][k], cx, y - 74, F(800, 13, COND), k ? '#8E8E96' : '#F2C14E', 'center');
      text(cols[k], cx, y, F(900, k ? 56 : 86, SH), k ? '#A1A1AA' : '#F5F5F7', 'center');
      text(fit(g.players[i].name, cw - 8, F(600, 13, SYS)), cx, y + 18, F(600, 13, SYS), '#A1A1AA', 'center'); });
  }
  const se = sum.series;
  const sub = r.tie ? 'Dead even' : n === 3 ? (sum.winNumber ? `${g.players[r.winner].name}’s ${ordinal(sum.winNumber)} win` : '')
    : se ? (se.leader ? `${g.players[se.leader === 'a' ? 0 : 1].name} leads the series ${Math.max(se.a.wins, se.b.wins)}–${Math.min(se.a.wins, se.b.wins)}` : `Series tied ${se.a.wins}–${se.b.wins}`) : '';
  if (sub && n !== 3) text(fit(sub, W - 72, F(700, 14, CO)), W / 2, y + 30, F(700, 14, CO), '#A1A1AA', 'center');
  y += n === 3 && !r.tie ? 38 : 50;
  // line score
  if (ls) {
    const inns = ls.innings.slice(-9);
    rr(36, y, W - 72, lsH, 18, PANEL);
    const x0 = 36 + 14 + 66, colW = (W - 72 - 28 - 66 - 40) / inns.length;
    inns.forEach((k, j) => text(String(k), x0 + colW * j + colW / 2, y + 22, F(700, 14, COND), '#8E8E96', 'center'));
    text('R', W - 50, y + 22, F(700, 14, COND), '#F5F5F7', 'right');
    g.players.forEach((p, i) => { const yy = y + 32 + i * 36 + 25; const lead = ls.totals[i] === Math.max(...ls.totals);
      text(fit(p.name, 64, F(700, 15, SYS)), 50, yy, F(lead ? 700 : 600, 15, SYS), lead ? '#F5F5F7' : '#A1A1AA');
      inns.forEach((k, j) => { const v = ls.rows[i][k - 1]; if (v != null) text(String(v), x0 + colW * j + colW / 2, yy, F(800, 19, SH), '#C7C7CC', 'center'); });
      text(String(ls.totals[i]), W - 50, yy + 1, F(900, 26, SH), lead ? '#F5F5F7' : '#A1A1AA', 'right'); });
    y += lsH + 12;
  }
  // the four tiles (accuracy, Pick 3 bonuses, confidence, best streak) — best in white, like the Final page
  const tw = (W - 72 - 10) / 2;
  tiles.forEach((t, k) => {
    const tx = 36 + (k % 2) * (tw + 10), ty = y + Math.floor(k / 2) * 88;
    rr(tx, ty, tw, 78, 16, PANEL);
    const fmt = v => (t.label === 'ACCURACY' ? (v == null ? '—' : Math.round(v * 100) + '%') : t.label === 'CONFIDENCE' ? v.join('–') : String(v));
    const score = v => (t.label === 'CONFIDENCE' ? v[0] - v[1] : v == null ? -1 : v), top = Math.max(...t.values.map(score));
    text(t.label, tx + 14, ty + 22, F(800, 13, COND), '#8E8E96');
    let vx = tx + 14; const vf = F(900, n === 3 ? 20 : 26, SH);
    order.forEach(i => { const s2 = fmt(t.values[i]); text(s2, vx, ty + 50, vf, score(t.values[i]) === top ? '#F5F5F7' : '#6E6E76'); x.font = vf; vx += x.measureText(s2).width + (n === 3 ? 8 : 12); });
    text(fit(order.map(i => g.players[i].name).join(n === 3 ? ' · ' : ' vs '), tw - 28, F(700, 12, CO)), tx + 14, ty + 68, F(700, 12, CO), '#A1A1AA');
  });
  y += rows * 88;
  // awards: just the icons
  if (list.length) {
    text('EARNED TODAY', 36, y + 14, F(800, 14, COND), '#8E8E96'); y += 26;
    const size = 50, gapI = (W - 72 - size * 8) / 7;
    for (let k = 0; k < list.length; k++) {
      const a = list[k], ix = 36 + (k % 8) * (size + gapI), iy = y + Math.floor(k / 8) * 58;
      rr(ix, iy, size, size, 14, 'rgba(242,193,78,.14)');
      const svg = awardIcon(a.award, 34);
      if (svg.startsWith('<svg')) {
        try { const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); });
          x.drawImage(img, ix + (size - 34) / 2, iy + (size - 34) / 2, 34, 34); } catch (e) { /* skip a bad icon */ }
      } else text(a.award.code || '?', ix + size / 2, iy + size / 2 + 8, F(900, 22, SH), '#F4F1E8', 'center');
    }
    y += iconRows * 58;
  }
  // footer: the wordmark, and the club
  text('Guess Ball', 36, H - 30, '28px Norican, cursive', '#F4F1E8');
  x.save(); x.translate(36, H - 24); x.scale(124 / 440, 124 / 440); x.strokeStyle = '#D63A2F'; x.lineCap = 'round'; x.lineJoin = 'round';
  x.lineWidth = 7; x.stroke(new Path2D('M40 26C150 12 290 9 382 18')); x.lineWidth = 4; x.stroke(new Path2D('M406 36L422 20 406 4 390 20z')); x.restore();
  const club = (S.clubs.find(k => (g.clubList || []).includes(k.code)) || {}).name;
  if (club) text(club.toUpperCase(), W - 36, H - 32, F(800, 15, COND), '#8E8E96', 'right');
  return new Promise(res => c.toBlob(res, photo ? 'image/jpeg' : 'image/png', 0.9));
}
async function shareGame(g, sum, awards) {
  try {
    const blob = await drawShareCard(g, sum, awards);
    const jpg = blob.type === "image/jpeg", file = new File([blob], `guess-ball-${g.date}.${jpg ? "jpg" : "png"}`, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
  } catch (e) { if (e && e.name !== 'AbortError') toast('Couldn’t make the share card: ' + e.message, true); }
}

// ════════════ Actions ════════════
Object.assign(ACT, {
  statTab: t => { S.statTab = t; render(); const p = $app().querySelector('.screen [data-scroll]') || $app().querySelector('.page'); if (p) p.scrollTop = 0; },
  standOpen: id => { S.statOpen = S.statOpen === id ? null : id; render(); },
  pickSeason: y => { S.statSeason = y; S.sheet = null; render(); },
  h2hPick: arg => { const [side, id] = arg.split('|'); if (side === 'a') { S.h2hA = id; S.h2hB = null; } else S.h2hB = id; S.sheet = null; render(); },
  openGame: async id => {
    const g = (scopeGames() || []).find(x => x.id === id) || (S.adminGames || []).find(x => x.id === id) || ((S.aw && S.aw.games) || []).find(x => x.id === id);
    go('pastGame', { id, game: g, awards: null });
    if (!g || g.era === 'preapp' || g.era === 'hand') return;
    try {   // awards need everyone's full history — fetch it in the background
      const hist = await withTimeout(FCab.historyOf(g.players.map(p => p.id)), 20000);
      const got = Statistician.awardsInGame(hist.some(x => x.id === g.id) ? hist : hist.concat([g]), g);
      const merged = [];
      got.forEach(a => { const m = merged.find(x => x.award.id === a.award.id && x.tier === a.tier); if (m) m.names.push(a.name); else merged.push({ ...a, names: [a.name] }); });
      if (S.screen === 'pastGame' && S.params.id === id) { S.params.awards = merged; render(); }
    } catch (e) { /* offline: just no awards list */ }
  },
  deleteGame: async () => {
    const g = S.params.game || (scopeGames() || []).find(x => x.id === S.params.id);
    S.busy = true; render();
    try {
      await FCab.deleteGame(g);
      S.busy = false; S.sheet = null;
      if (S.data && S.data.games) S.data.games = S.data.games.filter(x => x.id !== g.id);
      if (S.adminGames) S.adminGames = S.adminGames.filter(x => x.id !== g.id);
      back(); toast('Game deleted — stats recalculated'); loadScopeGames(true); loadHome();
    } catch (e) { fail(e); }
  },
  recordGame: id => { S.sheet = null; ACT.openGame(id); },
  shareApp: async () => {         // Home: send the app's link (texts show the logo + slogan preview)
    const url = 'https://zachj1000.github.io/guessball/' + (location.pathname.includes('/next/') ? 'next/' : '');
    const text = 'Guess Ball — Built for the bleachers.';
    if (navigator.share) { try { await navigator.share({ title: 'Guess Ball', text, url }); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(url); toast('Link copied'); } catch (e) { toast(url); }
  },
  homeShare: async id => {       // Home: share card for the most recent game
    const games = scopeGames() || await loadScopeGames();
    const g = (games || []).find(x => x.id === id);
    if (!g) return toast('Couldn’t find that game — try again in a moment', true);
    await shareGame(g, Statistician.summary(g, games), []);
  },
  shareCard: async id => {
    const g = S.params.game || (scopeGames() || []).find(x => x.id === id);
    await shareGame(g, Statistician.summary(g, scopeGames() || [g]), S.params.awards || []);
  },
  addGame: () => {
    S.ag = { date: new Date().toISOString().slice(0, 10), players: [{ id: S.user.uid, name: S.account.name, score: '' }], away: '', home: '', park: '', note: '' };
    S.ng = S.ag; S.ngRoster = null; go('addGame'); loadRoster();
  },
  editGame: id => {
    const g = S.params.game || (scopeGames() || []).find(x => x.id === id);
    S.ag = { id: g.id, game: g, tv: !!g.tv, date: g.date, players: g.players.map((p, i) => ({ id: p.id, name: p.name, score: String(g.scores[i]) })), away: g.away || '', home: g.home || '', park: g.park || '', note: g.note || '' };
    S.ng = S.ag; go('addGame');
  },
  agWhere: w => { S.ag.tv = w === 'home'; buzz(); render(); },
  agRemove: i => { S.ag.players.splice(+i, 1); render(); },
  agSave: async () => {
    const d = S.ag; S.busy = true; render();
    const scores = d.players.map(p => Math.round(+p.score));
    try {
      if (d.id) await FCab.editHandGame(d.game, { scores, date: d.date, away: d.away, home: d.home, park: d.park || TEAMS[d.home] || '', note: d.note, tv: !!d.tv });
      else await FCab.addHandGame({ players: d.players.map(p => ({ id: p.id, name: p.name })), scores, date: d.date, away: d.away, home: d.home, park: d.park || TEAMS[d.home] || '', note: d.note, tv: !!d.tv });
      S.busy = false; back(); if (d.id) back();
      toast(d.id ? 'Game updated' : 'Game added'); await loadScopeGames(true); loadHome();
    } catch (e) { fail(e); }
  },
  adminDelete: async () => {
    S.adminGames = null; go('adminGames');
    try {
      const all = await FCab.exportAll();
      const games = Object.values((all && all.games) || {}).filter(g => g.ended).map(g => ({ ...g, events: g.events ? Object.values(g.events) : undefined }));
      S.adminGames = games.sort((a, b) => (a.date < b.date ? 1 : -1)); render();
    } catch (e) { fail(e); }
  },
});
async function loadRoster() {
  try {
    const codes = S.scope === 'mine' ? S.clubs.filter(c => c.status === 'member').map(c => c.code) : [S.scope];
    const seen = {}, out = [];
    for (const c of codes) (await withTimeout(FCab.roster(c), 8000)).forEach(m => { if (!seen[m.pid] && m.pid !== S.user.uid) { seen[m.pid] = 1; out.push({ ...m, club: c }); } });
    S.ngRoster = out.sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { S.ngRoster = []; }
  render();
}

const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

// ── Loading: every game any player in the club has played (awards are per person, across clubs) ──
async function loadAwards() {
  const key = S.scope, uid = S.user.uid, cacheKey = 'gb_aw_' + uid + '_' + key;
  if (!S.aw || S.aw.key !== key) S.aw = { key, games: Store.json(cacheKey, null), loading: true, cat: (S.aw && S.aw.cat) || 'ALL', pid: uid };
  S.aw.loading = true; render();
  try {
    const club = await loadScopeGames(true);
    if (S.scope !== key) return;
    const pids = [...new Set([uid].concat((club || []).flatMap(g => g.players.map(p => p.id))))];
    const games = (await withTimeout(FCab.historyOf(pids), 25000)).filter(g => g.ended !== false);
    if (!S.aw || S.aw.key !== key) return;
    S.aw.games = games; S.aw.loading = false;
    try { Store.put(cacheKey, games); } catch (e) { /* phone storage full: fine */ }
  } catch (e) { if (S.aw) { S.aw.loading = false; if (!S.aw.games) toast('Couldn’t load awards — check your connection', true); } }
  render();
}
// All games to work awards out from: the club's players' histories, plus a live game's players and the live game itself
function awardGames() {
  const base = (S.aw && S.aw.key === S.scope && S.aw.games) || [];
  if (!S.g || !S.g.game) return base;
  const key = [base, S.g.history, S.g.game.id, S.g.game.events.length].map(x => (Array.isArray(x) ? x.length : x)).join('|');
  if (awardGames.key === key && awardGames.base === base) return awardGames.val;
  const m = new Map(); base.concat(S.g.history || []).forEach(g => m.set(g.id, g)); m.set(S.g.game.id, G.copy());
  awardGames.key = key; awardGames.base = base; awardGames.val = [...m.values()];
  return awardGames.val;
}
const byTimeAw = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));

// People to pick from: everyone in the selected club (or everyone you've played), most games first
function awardPeople() {
  const club = scopeGames() || [], games = awardGames();
  const rows = Statistician.standings(club).sort((a, b) => b.games - a.games).map(p => ({ id: p.id, name: p.name, games: p.games }));
  if (!rows.some(r => r.id === S.user.uid)) rows.unshift({ id: S.user.uid, name: S.account.name, games: 0 });
  const book = Statistician.awardBook(games);
  rows.forEach(r => { r.earned = Object.keys((book[r.id] || { earned: {} }).earned).length; });
  return rows;
}

  const code = S.scope; if (code === 'mine' || !FCab) return;

  const key = 'gb_club_' + S.user.uid + '_' + code;

  if (!force && S.club.fresh) return;

async function loadClubNow(code, key) {
  render();

    const [roster] = await Promise.all([withTimeout(FCab.roster(code), 12000), loadScopeGames()]);
    if (S.scope !== code) return;

  } catch (e) { if (!S.club.roster) toast('Couldn’t load the club — check your connection', true); }
  render();
}

      <div style="flex-grow:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">${esc(c.name)} · ${c.right} of ${c.n}</span><span class="shoulders num" style="font-size:18px;font-weight:900;color:${color}">${pct(c.pct)}</span></div>
      <div style="height:5px;border-radius:3px;background:var(--card3);overflow:hidden;margin-top:4px"><div style="height:5px;border-radius:3px;background:${color};width:${Math.max(2, Math.round(c.pct * 100))}%"></div></div></div></div>`;
  const line2 = (label, sub, big) => `<div style="background:var(--sheetcard);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="display:flex;flex-direction:column;gap:2px"><span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${label}</span><span class="courier meta" style="font-size:11px">${sub}</span></div><span class="shoulders num" style="font-size:26px;font-weight:900">${big}</span></div>`;
  return head + `
  <div style="background:var(--sheetcard);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 1.5px rgba(242,193,78,.35)"><span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--gold)">THE BOOK ON ${esc(name.toUpperCase())}</span>
    <div style="font-size:17px;font-weight:600;line-height:1.35;margin-top:4px">${esc(r.line)}</div></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
    ${card('GO-TO CALL', r.go.code, pct(r.go.share) + ' of picks')}
    ${card('CONFIDENCE', r.conf.perGame.toFixed(1), 'per game' + (r.conf.pct == null ? '' : ' · ' + pct(r.conf.pct) + ' hit'))}
    ${card('HEATS UP', r.inning ? ord(r.inning.inning) : '—', r.inning ? r.inning.avg.toFixed(1) + ' pts avg' : 'not enough yet')}</div>
  ${r.best.length || r.worst.length ? `<div style="background:var(--sheetcard);border-radius:16px;padding:4px 14px 6px">

// ── Claim your games (Home card) ──
async function loadClaims() {
  if (!FCab || !S.user) return;
  try {
    const [offers, claims] = await Promise.all([withTimeout(FCab.myOffers(), 8000), withTimeout(FCab.myClaims(), 8000)]);
    const link = Store.json('gb_linkclaim', null);            // opened a claim link on this phone
    if (link && !offers.some(o => o.guest === link.guest) && !claims.some(c => c.guest === link.guest)) {
      const [prof, info] = await Promise.all([FCab.profiles([link.guest]), withTimeout(FCab.clubInfo ? FCab.clubInfo(link.code) : Promise.resolve(null), 8000).catch(() => null)]);
      const p = prof[link.guest];
      if (p && p.account === false && !p.claimedBy) offers.unshift({ guest: link.guest, code: link.code, guestName: p.name, club: (info && info.name) || 'a club', byName: null, link: true });
      else Store.removeItem('gb_linkclaim');
    }
    S.claimOffers = offers; S.claimWaiting = claims;
    const o = offers[0];
    if (o && (!S.claimStats || S.claimStats.guest !== o.guest)) {
      S.claimStats = { guest: o.guest, row: null };
      FCab.historyOf([o.guest]).then(h => { const r = Statistician.standings(h).find(x => x.id === o.guest);
        const recent = h.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 2).map(g => { const i = g.players.findIndex(p => p.id === o.guest), sc = Statistician.result(g).scores;
          return `${niceDate(g.date).replace(/, \d{4}$/, '')} vs ${g.players.filter((_, k) => k !== i).map(p => p.name).join(', ')} ${sc[i]}–${Math.max(...sc.filter((_, k) => k !== i))}`; });
        S.claimStats = { guest: o.guest, row: r || { games: 0, w: 0, l: 0, t: 0, accuracy: null }, recent }; render(); }).catch(() => {});
    }
  } catch (e) { /* offline: try next time */ }
  render();
}
function claimCard() {
  const o = (S.claimOffers || [])[0];
  if (o) {
    const st = S.claimStats && S.claimStats.guest === o.guest ? S.claimStats : null, r = st && st.row;
    const tile = (big, label) => `<div style="background:var(--card2);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column"><span class="shoulders num" style="font-size:26px;font-weight:900;line-height:1.1">${big}</span><span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${label}</span></div>`;

      ${r ? `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${tile(r.games, r.games === 1 ? 'GAME' : 'GAMES')}${tile(`${r.w}–${r.l}${r.t ? '–' + r.t : ''}`, 'RECORD')}${tile(r.accuracy == null ? '—' : Math.round(r.accuracy * 100) + '%', 'ACCURACY')}</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="press cond mid-btn" style="background:var(--card2);height:48px" ${act('claimNo', o.guest)}>NOT ME</button>
        <button class="press cond mid-btn" style="background:var(--goldfill);color:#1A1406;height:48px" ${act('claimYes', o.guest)} ${S.busy ? 'disabled' : ''}>THAT’S ME</button></div>
      ${info('claimWhy', '<span class="courier meta">What happens?</span>', 'A captain of the club approves it. Then those games count as yours — your stats, records and awards include them — and you join the club.', '')}</div>`;
  }
  const w = (S.claimWaiting || [])[0];
  if (w) return `<div class="card" style="padding:12px 16px;display:flex;flex-direction:column;gap:4px;border:1.5px solid rgba(242,193,78,.35)">

  return '';

  },

  },

  },

    S.cs = { name: c.name || '', pub: !!c.public, caps: Object.fromEntries((d.roster || []).filter(m => !m.guest).map(m => [m.pid, !!m.captain])), addOpen: false, err: '' };

  csSave: async () => {

async function shrinkPhoto(file) {

    return out;
  } finally { URL.revokeObjectURL(url); }
}

// ════════════ Two-phone play ════════════
// The host still runs the game (results, undo, menu). A player with an account can JOIN the live game on their own
// phone and make their own picks. Each pick goes into a shared slot for that round (first to Firebase wins — see
// the security rules); every phone draws its screen from the shared game. With nobody joined, nothing here changes
// how a one-phone game works (the host's picks still go into the slots, which is how late picks get refused).
const Two = {
  inflight: {}, mine: {}, seen: {},                        // "<round>:<player>": picks this phone is still sending / has put in (an out-of-date copy of the game never takes those away)
  stopWatch: null, stopLive: null,
  isAccount: p => !!(p && p.id && !/^g_/.test(p.id) && !p.id.includes(':')),
  // Could anyone else in this game pick on their own phone?
  multi: () => !!(S.g && (S.g.remote || S.g.game.players.some(p => p.id !== S.user.uid && Two.isAccount(p)))),
  me: () => (S.g.remote ? S.g.me : S.g.game.players.findIndex(p => p.id === S.user.uid)),
  // Can Back on this phone take back player j's pick? Only one made on this phone (yours, a PICK FOR, or a player who isn't on their own phone)
  mayTakeBack(j) {
    if (!S.g || !Two.multi()) return true;
    if (S.g.remote) return +j === S.g.me;
    const k = Two.key() + ':' + j, slot = ((S.g.game.slots || {})[Two.key()] || {})[j];
    return !!(Two.mine[k] || (slot && slot.by === S.user.uid));
  },
  // Is player j picking on this phone? (a joined phone: only its own player; the host's phone: everyone not on their own phone)
  onThisPhone: j => (S.g.remote ? +j === S.g.me : !(+j !== Two.me() && Two.joined(+j))),
  // The picks in a round as Firebase last had them (plus what this phone has sent)
  slotsFor: key => Object.assign({}, ((Two.lastV || {}).slots || {})[key] || {}, ((S.g.game.slots || {})[key]) || {}),
  // Back right after a Pick 3 was saved: take it back out and reopen the Pick 3 of the last player picking on this phone,
  // with their picks filled in to change. Everyone else's Pick 3 stays in (Firebase only lets this land on the real last entry).
  reopenP3() {
    const g = S.g, ev = G.lastEvent(); if (!ev || ev.type !== 'pick3' || !FCab) return false;
    if (FCab.isStale(g.game.id)) { Two.reload(); toast('Catching up with the other phone — try again in a moment', true); return true; }
    const picks = ev.picks || [], mine = G.order().filter(j => Two.onThisPhone(j));
    const j = mine.length ? mine[mine.length - 1] : undefined; if (j === undefined) return false;
    const multi = Two.multi();
    const sent = FCab.undo(g.game, multi ? { only: j } : {});
    G.replay();
    g.pending = { p3: {}, picks: {} };
    picks.forEach((x, k) => { if (k !== j) g.pending.p3[k] = x || null; });   // everyone else's stays in
    g.p3sel = picks[j] ? picks[j].slice() : []; g.view = null; g.undone = null; S.g.pendKey = Two.key();
    if (multi) { delete Two.mine[Two.key() + ':' + j]; delete Two.seen[Two.key() + ':' + j]; }
    Diag.add('app', '2p reopened ' + g.game.players[j].name + '’s Pick 3');
    render();
    sent.catch(e => { if (e && (e.code === 'PERMISSION_DENIED' || e.code === 'STALE')) Two.lost(e, 'undo'); else toast(e.message, true); });
    return true;
  },
  // Which phone shows a player's award popup: the one they pick on
  awardHere(pid) {
    if (!S.g) return false;
    const i = S.g.game.players.findIndex(p => p.id === pid);
    if (S.g.remote) return i === S.g.me;
    return !(i !== Two.me() && Two.joined(i));
  },
  key: () => 'e' + S.g.game.events.length,
  joined: i => !!(S.g.game.joined && S.g.game.joined[i]),
  hostName: () => ((S.g.game.players.find(p => p.id === S.g.game.host) || {}).name || 'The host'),
  // Should the phone in hand wait for player i to pick on their own phone?
  elsewhere(i) {
    if (i === undefined || !S.g) return false;
    if (S.g.remote) return i !== S.g.me;
    return i !== Two.me() && Two.joined(i) && S.g.pickFor !== i;
  },
  // Lock a pick into the shared slot for this round
  send(i, val) {
    if (!Two.multi() || i === undefined) return;
    const g = S.g.game, key = Two.key(), k = key + ':' + i;
    Two.inflight[k] = true; Two.mine[k] = val; S.g.pendKey = key;
    if (!S.g.remote && i !== Two.me() && Two.isAccount(g.players[i])) Diag.add('app', `2p host picking for ${g.players[i].name}: ${S.g.pickFor === i ? 'PICK FOR tapped' : Two.joined(i) ? 'JOINED?!' : 'not joined'}`);
    Diag.add('app', `2p sent ${key}/${i} ${val.pick || (val.p3 ? 'p3 ' + val.p3.join(',') : 'skip')}`);
    FCab.setSlot(g, key, i, val).then(() => { delete Two.inflight[k]; })
      .catch(e => { delete Two.inflight[k]; Two.lost(e, 'pick'); });
  },
  unsend(i) {
    if (!Two.multi() || i === undefined) return;

    FCab.clearSlot(S.g.game, Two.key(), i).catch(e => Two.lost(e));
  },
  // Firebase said no (someone else's pick got there first, or the round was already saved): show what really happened
  // kind: 'pick' (a pick), 'save' (what happened / next half-inning), 'undo', 'auto' (a finished Pick 3 this phone saved by itself)
  async lost(e, kind) {
    if (!S.g || !e || (e.code !== 'PERMISSION_DENIED' && e.code !== 'STALE')) return toast(e && e.message ? e.message : 'Couldn’t save — try again', true);
    const m = String(e.message || '').split('\n')[0];
    if (m && !/^Skipped/.test(m)) Diag.add('app', '2p refused (' + e.code + (kind ? ', ' + kind : '') + '): ' + m.slice(0, 90));   // (the knock-on refusals just add noise to the Problem log)
    if (kind && Two.lossKind !== 'save' && Two.lossKind !== 'undo') Two.lossKind = kind;   // the most telling reason wins the message
    await Two.reload();
  },
  nameOf: uid => ((S.g.game.players.find(p => p.id === uid) || {}).name || 'The other phone'),
  // What to tell the phone that lost a race, once it has the real game
  lossMessage(kind) {
    const l = G.lastEvent(), who = l && l.by && l.by !== S.user.uid ? Two.nameOf(l.by) : 'The other phone';
    if (kind === 'auto') return null;
    if (kind === 'save') return l && l.type === 'play' ? `${who} already entered ${code(l.outcome)}` : l && l.type === 'nextHalf' ? `${who} already started the next half-inning` : 'The other phone got there first';
    if (kind === 'undo') return 'That was already undone — here’s the game as it is now';

  },
  async reload(msg) {
    if (!S.g) return;
    if (Two.reloading) { Two.reloadAgain = true; return; }   // one catch-up at a time — and one more after it if another refusal came in meanwhile
    Two.reloading = true;
    try { await Two.reloadNow(msg); } finally { Two.reloading = false; if (Two.reloadAgain) { Two.reloadAgain = false; setTimeout(() => Two.reload(), 300); } }
  },
  retryReload() { clearTimeout(Two.retryT); Two.retryT = setTimeout(() => { if (S.g && FCab.isStale(S.g.game.id)) Two.reload(); }, 5000); },
  async reloadNow(msg) {
    const id = S.g.game.id, startedWith = S.g.game.events.length;
    Diag.add('app', '2p reloading the real game');
    let fresh = null; try { fresh = await withTimeout(FCab.loadGame(id), 10000); } catch (e) { Diag.add('app', '2p reload failed: ' + (e && e.message)); Two.retryReload(); return toast('Offline — will catch up when you’re back online', true); }
    if (!S.g || S.g.game.id !== id) return;
    if (S.g.game.events.length !== startedWith || FCab.status().pending) { Two.reloadAgain = true; return; }   // saved something while this was loading: that copy is already old
    if (!fresh) return Two.gone('This game was thrown out');
    if (S.g.remote && fresh.ended) return Two.finish(fresh);
    const keep = S.g.game, shownLast = JSON.stringify(G.lastEvent() || null), had = keep.events.length;
    S.g.game = Object.assign(keep, fresh, { events: fresh.events });
    FCab.adoptLive(S.g.game);
    S.g.pending = { p3: {}, picks: {} }; S.g.sel = null; S.g.p3sel = []; S.g.pickFor = null; Two.mine = {}; Two.seen = {};
    const kind = Two.lossKind; Two.lossKind = null;
    S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; S.g.undone = null;
    const l = G.lastEvent();
    // stay on the outcome screen only if it still shows the real last play; a lost save shows the one that won
    S.g.view = l && l.type === 'play' && ((S.g.view === 'after' && JSON.stringify(l) === shownLast) || kind === 'save') ? 'after' : null;
    G.replay(); Two.sync(fresh, true);
    if (S.g && S.g.game.events.length > had) { const l2 = G.lastEvent(); if (l2 && l2.type === 'play') { S.g.view = 'after'; showAwardsAt(had, S.g.game.events.length - 1); render(); } }   // woke up to plays it missed
    const m = msg || (S.g && Two.lossMessage(kind)); if (m) toast(m, true);
  },
  // A new copy of the game arrived from Firebase
  sync(v, quiet) {
    try { Two.syncNow(v, quiet); }
    catch (e) { Diag.add('error', '2p sync: ' + (e && e.message) + ' ' + String((e && e.stack) || '').split('\n').slice(1, 3).join(' ').replace(/\s+/g, ' ').slice(0, 120)); window.__syncErr = (window.__syncErr || 0) + 1; if (!window.__badEv) window.__badEv = JSON.stringify({ v: v && v.events, mine: S.g && S.g.game.events, setup: S.g && S.g.game.setup }); }
  },
  syncNow(v, quiet) {
    if (!S.g) return;
    if (!v) { if (S.g.remote) Two.gone(Two.hostName() + ' threw out this game'); return; }
    if (v.id && v.id !== S.g.game.id) return;
    if (v.ended) return Two.finish(v);                     // ended on another phone: this one shows the final page too
    Two.lastV = v;
    if (!S.g.remote) S.g.game.joined = v.joined || null;
    // The scorebook: any phone in an online game can write it now, so every phone follows Firebase's copy —
    // except while this phone still has changes on their way (those land in a moment and come back in the next update)
    const sv = v.events || [], mine = S.g.game.events, lastId = a => (a.length ? (a[a.length - 1] || {}).id || a.length : 0);
    if ((sv.length !== mine.length || lastId(sv) !== lastId(mine)) && !FCab.status().pending && !Two.reloading) {
      const before = mine.length, lastBefore = G.lastEvent();
      if (S.g.remote) S.g.game = Object.assign(S.g.game, v, { events: sv });
      else { Object.assign(S.g.game, { events: sv, head: v.head || null, closed: v.closed || null, slots: v.slots || null }); FCab.adoptLive(S.g.game); }
      G.replay();
      const now = S.g.game.events.length, l = G.lastEvent();
      Diag.add('app', `2p scorebook now ${now} entries (was ${before})${l && l.by && l.by !== S.user.uid ? ' — ' + Two.nameOf(l.by) : ''}`);
      S.g.pending = { p3: {}, picks: {} }; S.g.sel = null; S.g.p3sel = []; S.g.pendKey = Two.key(); S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; S.g.pickFor = null;
      if (now > before && l && l.type === 'play') { S.g.view = 'after'; S.g.undone = null; if (!quiet) { Sound.play(Two.rightFor(l) ? 'right' : 'miss'); showAwardsAt(before, now - 1); } }   // everyone sees how the play went (and their own awards)
      else if (S.g.view === 'after' && !(l && l.type === 'play')) S.g.view = null;                                     // undone, or the half changed
      if (now < before && lastBefore && v.head && v.head.by && v.head.by !== S.user.uid && !quiet) toast(`${Two.nameOf(v.head.by)} undid ${lastBefore.type === 'play' ? 'the last at-bat' : lastBefore.type === 'pick3' ? 'Pick 3' : lastBefore.type === 'nextHalf' ? 'the half-inning change' : 'the last change'}`);
      if (now < before && lastBefore && lastBefore.type === 'play') { S.g.view = null; }
    } else if (S.g.remote) S.g.game = Object.assign(S.g.game, v, { events: S.g.game.events });
    if (S.g.remote && S.g.pendKey && S.g.pendKey !== Two.key()) { S.g.pending = { p3: {}, picks: {} }; S.g.sel = null; S.g.p3sel = []; S.g.pendKey = Two.key(); }   // last round's picks never carry over
    const s = S.g.s; if (!s || s.ended) return render();
    const key = Two.key(), cur = (v.slots || {})[key] || {};
    const sig = `2p update: my round ${key}, server has ${(v.events || []).length} entries, slots ${Object.entries(cur).filter(([, x]) => x).map(([i, x]) => i + ':' + (x.pick || (x.skip ? 'skip' : 'p3'))).join(' ') || 'none'}${v.joined ? ', joined ' + Object.keys(v.joined).filter(i => v.joined[i]).join(',') : ''}`;
    if (sig !== Two.lastSig) { Two.lastSig = sig; Diag.add('app', sig); }
    const settled = !FCab.status().pending;          // don't take away picks this phone hasn't finished sending
    const wasP3 = s.needsPick3 ? G.p3Next() : null;
    // A pick this phone put in stays until Firebase has confirmed it at least once (so an out-of-date copy can't take it away);
    // after that, if it's gone, someone really took it back (e.g. the host undid Pick 3)
    Object.keys(cur).forEach(i => { if (cur[i] && Two.mine[key + ':' + i]) Two.seen[key + ':' + i] = true; });
    const own = i => Two.inflight[key + ':' + i] || (Two.mine[key + ':' + i] && !Two.seen[key + ':' + i]);
    if (s.needsPick3) {
      const n = S.g.game.players.length, ok = i => /^\d+$/.test(i) && +i < n;   // only real player numbers
      const got = {}; Object.entries(cur).forEach(([i, x]) => { if (x && ok(i)) got[i] = x.skip ? null : (x.p3 ? Object.values(x.p3) : null); });
      if (settled) Object.keys(S.g.pending.p3).forEach(i => { if (!(i in got) && !own(i)) delete S.g.pending.p3[i]; });
      Object.assign(S.g.pending.p3, got);
    } else {
      const n = S.g.game.players.length, ok = i => /^\d+$/.test(i) && +i < n;
      const got = {}; Object.entries(cur).forEach(([i, x]) => { if (x && x.pick && ok(i)) got[i] = { pick: x.pick, conf: !!x.conf }; });
      // A pick made here that Firebase had — and now doesn't: someone cleared it (a changed Pick 3 took it). Pick again.
      if (settled) Object.keys(Two.seen).forEach(k => { const [kk, i] = k.split(':'); if (kk !== key || got[i] || Two.inflight[k]) return;
        const was = (S.g.pending.picks[i] || Two.mine[k] || {}).pick, lk = Umpire.lockedPicks(s), by = Object.keys(lk).find(o => lk[o] && lk[o].pick === was);
        delete Two.seen[k]; delete Two.mine[k];
        Diag.add('app', `2p ${S.g.game.players[i].name}’s pick was cleared by the other phone`);
        toast(was && by !== undefined ? `${S.g.game.players[by].name} took ${code(was)} in their Pick 3 — pick again` : 'Your pick was cleared — pick again', true); });
      if (settled) Object.keys(S.g.pending.picks).forEach(i => { if (!got[i] && !own(i)) delete S.g.pending.picks[i]; });
      Object.assign(S.g.pending.picks, got);
    }
    const pf = S.g.pickFor;
    if (pf != null && (s.needsPick3 ? pf in S.g.pending.p3 : S.g.pending.picks[pf])) S.g.pickFor = null;
    // Host: the last Pick 3 just arrived from another phone → save the round
    if (!S.g.remote && s.needsPick3 && wasP3 !== undefined && G.p3Next() === undefined) { afterP3Choice(); return; }
    render();
  },
  // The host's phone is about to ask you to pick for another player with an account. Their phone may have joined a
  // moment ago and the live update hasn't arrived yet (iPhones can lag after waking up) — so check the real game once.
  checkTurn(i) {
    if (S.g && !S.g.remote && FCab && !Two.stopWatch && Two.multi()) Two.watch();   // always listening in a two-phone game
    if (i === undefined || !S.g || S.g.remote || !FCab || i === Two.me() || S.g.pickFor === i) return;
    const p = S.g.game.players[i]; if (!Two.isAccount(p)) return;
    const k = S.g.game.id + ':' + Two.key() + ':' + i; if (Two.checked === k) return; Two.checked = k;
    withTimeout(FCab.peekGame(S.g.game.id), 6000).then(v => {
      if (!v || !S.g || S.g.game.id !== v.id) return;
      Diag.add('app', `2p check before picking for ${p.name}: joined ${!!(v.joined && v.joined[i])}`);
      Two.sync(v, true);
    }).catch(() => {});
  },
  rightFor(ev) { const i = Two.me(); return ev.picks && ev.picks[i] && ev.picks[i].pick === ev.outcome; },
  watch() {
    Two.stop();
    if (!S.g || !FCab || !S.user || !Two.multi()) return;   // (the app can open a saved live game before Firebase is ready — afterSignIn starts it then)
    const id = S.g.game.id;
    if (Two.mineFor !== id) { Two.mine = {}; Two.seen = {}; Two.mineFor = id; }   // (round names start over in every game)
    // Firebase hands news over instantly — even in the middle of this phone saving its own pick, or inside this very call.
    // So news is handled a moment later, once whatever the phone was doing has finished (only the latest copy counts).
    let latest, due = false;
    Two.stopWatch = () => {};                        // (watching already — news arriving during the call below mustn't start a second watch)
    const stop = FCab.watchGame(id, v => { latest = v; if (due) return; due = true;
      setTimeout(() => { due = false; if (S.g && S.g.game.id === id && Two.stopWatch === stopper) Two.sync(latest); }, 0); });

  stop() { if (Two.stopWatch) { Two.stopWatch(); Two.stopWatch = null; } },
  // The host ended the game: this phone gets the same final page (and share card)
  finish(v) {
