    bar = `<div style="height:4px;border-radius:2px;background:var(--card3);overflow:hidden;margin-top:2px"><div style="height:4px;border-radius:2px;background:var(--gold);width:${Math.min(100, Math.round(p.value / p.target * 100))}%"></div></div>`;
  } else right = `<span class="courier" style="font-size:11px;font-weight:700;color:${on ? 'var(--gold)' : 'var(--text3)'}">${on ? niceDate(last.date) : 'Not yet'}</span>`;
  const tiers = a.tiers && a.tiers.length > 1 ? `<span style="display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle">${a.tiers.map((_, i) => `<span style="width:6px;height:6px;border-radius:3px;background:${i < a.tier ? 'var(--gold)' : 'var(--card3)'}"></span>`).join('')}</span>` : '';
  return `<button class="row press" ${act('openSheet', 'award:' + a.id)} style="gap:12px;padding:9px 0;align-items:center">
    <span style="width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:${on ? 1 : 0.75}">${awardIcon(a, 32, on)}</span>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-size:15px;font-weight:700;color:${on ? 'var(--text)' : 'var(--text2)'}">${esc(a.name)}${tiers}</span>${right}</div>
      <span class="courier" style="font-size:11px;font-weight:700;color:var(--text3)">${esc(a.desc)}</span>${bar}</div></button>`;
}

// ── Award detail sheet ──
function awardSheet() {
  const [aid, forPid] = String(S.sheet.arg).split('|');
  const a0 = Statistician.AWARDS.find(x => x.id === aid);
  if (!a0) return '<span>Award not found.</span>';
  const games = awardGames();
  const pid = forPid || (S.aw && S.aw.pid) || S.user.uid;
  const a = Statistician.awardsFor(games, pid).find(x => x.id === a0.id);
  const on = a.tier > 0, who = awardPlayerName(pid);
  const counts = { all: 'Every game counts — pre-app, beta and added games too', app: 'Only games played in the app count', margin: 'Only games played in the app count' }[a.scope];
  let prog;
  if (a.kind === 'count') {
    const p = a.progress, n = a.tiers.length;
    const reached = a.earnedAt[a.earnedAt.length - 1];
    const fill = n > 1 ? Math.max(0, Math.min(1, (a.tier - 1 + (p.done ? 0 : Math.min(1, (p.value - (a.tier ? a.tiers[a.tier - 1] : 0)) / (p.target - (a.tier ? a.tiers[a.tier - 1] : 0))))) / (n - 1))) : Math.min(1, p.value / p.target);
    const note = [reached && `Reached ${tierNum(a.tiers[a.tier - 1])} on ${niceDate(reached.date)}`, p.done ? 'All tiers done' : `${Math.max(0, p.target - p.value)} more for ${tierNum(p.target)}`].filter(Boolean).join(' · ');
    prog = `<div style="display:flex;align-items:baseline;justify-content:space-between"><span class="cond" style="font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${pid === S.user.uid ? 'YOUR PROGRESS' : 'PROGRESS'} · ${esc(who.toUpperCase())}</span>
      <span class="shoulders num" style="font-size:22px;font-weight:900"><span style="color:${on ? 'var(--gold)' : 'var(--text)'}">${p.value}</span> <span style="color:var(--text4)">/ ${tierNum(p.done ? a.tiers[n - 1] : p.target)}</span></span></div>
    ${n > 1 ? `<div style="position:relative;height:34px">
      <div style="position:absolute;left:11px;right:11px;top:9px;height:4px;border-radius:2px;background:var(--card3)"><div style="height:4px;border-radius:2px;background:var(--gold);width:${Math.round(fill * 100)}%"></div></div>
      <div style="position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between">${a.tiers.map((t, i) => `<span style="width:22px;height:22px;border-radius:11px;border:2px solid ${i < a.tier ? 'var(--gold)' : '#4A4A52'};background:${i < a.tier ? 'var(--gold)' : 'var(--sheet)'};display:flex;align-items:center;justify-content:center">${i < a.tier ? '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#1A1406" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.3 2.3 4.7-5.3"/></svg>' : ''}</span>`).join('')}</div></div>
    <div style="display:flex;justify-content:space-between;margin-top:-8px">${a.tiers.map((t, i) => `<span class="shoulders" style="width:22px;text-align:center;font-size:16px;font-weight:900;color:${i < a.tier ? 'var(--gold)' : 'var(--text4)'};white-space:nowrap;display:flex;justify-content:center">${tierNum(t)}</span>`).join('')}</div>`
    : `<div style="height:6px;border-radius:3px;background:var(--card3);overflow:hidden"><div style="height:6px;background:var(--gold);width:${Math.round(fill * 100)}%"></div></div>`}
    <span class="courier" style="font-size:11px;font-weight:700;color:var(--text2)">${note}</span>`;
  } else {
    const e = a.earnedAt[0];
    prog = `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="cond" style="font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${esc(who.toUpperCase())}</span>
      ${on ? `<span class="cond" style="font-size:16px;font-weight:800;letter-spacing:.6px;color:var(--gold)">EARNED</span>` : `<span class="cond" style="font-size:16px;font-weight:800;letter-spacing:.6px;color:var(--text3)">NOT YET</span>`}</div>
    ${on && S.g && S.g.game && e.gameId === S.g.game.id ? `<span class="courier" style="font-size:12px;font-weight:700;color:var(--text2)">Earned in this live game</span>` : ''}${on && !(S.g && S.g.game && e.gameId === S.g.game.id) ? `<button class="press" ${act('awGame', e.gameId)} style="display:flex;align-items:center;justify-content:space-between;text-align:left"><span class="courier" style="font-size:12px;font-weight:700;color:var(--text2)">First earned ${niceDate(e.date)}</span><span class="cond" style="font-size:15px;font-weight:800;color:var(--link)">SEE GAME ›</span></button>` : ''}`;
  }
  // Who has it: people in the selected club (or everyone you've played)
  const people = awardPeople();
  const book = Statistician.awardBook(games);
  const has = people.map(p => { const e = ((book[p.id] || {}).earned || {})[a.id]; if (!e) return null;
    const tier = Math.max(...e.map(x => x.tier)), first = e.slice().sort((x, y) => (x.date < y.date ? -1 : 1))[0];
    return { ...p, tier, first, value: ((book[p.id] || {}).counts || {})[a.id] }; }).filter(Boolean)
    .sort((x, y) => y.tier - x.tier || (y.value || 0) - (x.value || 0) || (x.first.date < y.first.date ? -1 : 1));
  const whoList = has.length ? `<div class="list">${has.map(p => `<div class="row" style="min-height:44px">
      <span style="flex-grow:1;font-size:15px;font-weight:600">${esc(p.name)}</span>
      <span class="courier meta">${a.kind === 'count' ? p.value + ' so far' : niceDate(p.first.date)}</span>
      ${a.kind === 'count' ? `<span class="shoulders" style="min-width:44px;text-align:right;font-size:18px;font-weight:900;color:var(--gold)">${tierNum(a.tiers[p.tier - 1])}</span>` : ''}</div>`).join('')}</div>`
    : `<div class="card" style="background:var(--sheetcard);padding:14px 16px;font-size:15px;color:var(--text2)">Nobody here has it yet.</div>`;
  return `<div style="display:flex;align-items:center;gap:14px">
    <div style="width:68px;height:68px;border-radius:20px;background:${on ? 'rgba(242,193,78,.12)' : 'var(--sheetcard)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">${awardIcon(a, 44, on)}</div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:3px">
      <span class="cond" style="font-size:30px;font-weight:800;letter-spacing:.4px;line-height:1">${esc(a.name.toUpperCase())}</span>
      <span class="courier" style="font-size:12px;font-weight:700;color:var(--text2)">${esc(a.desc)} · ${esc(titleCase(a.cat))}</span>
      <span class="courier" style="font-size:11px;font-weight:700;color:var(--text4)">${counts}</span></div></div>
  <div style="background:var(--sheetcard);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">${prog}</div>
  <span class="cond" style="margin-top:2px;font-size:16px;font-weight:800;letter-spacing:.8px;color:var(--text3)">WHO HAS IT · ${esc(scopeName())}</span>
  ${whoList}`;
}

// ── Player picker ──
function awPlayerSheet() {
  const cur = (S.aw && S.aw.pid) || S.user.uid;
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">WHOSE AWARDS?</h2>
  <span class="courier meta">${esc(scopeName())} · most games first</span>
  <div class="list">${awardPeople().map(p => `<button class="row press" ${act('awPick', p.id)} style="min-height:56px">
    <span style="width:32px;height:32px;border-radius:16px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${esc(p.name[0].toUpperCase())}</span>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:17px;font-weight:600">${esc(p.name)}${p.id === S.user.uid ? ' <span class="courier meta">(you)</span>' : ''}</span><span class="courier meta">${p.earned} award${p.earned === 1 ? '' : 's'}</span></div>
    ${ICON.check(p.id === cur ? 'var(--link)' : 'transparent')}</button>`).join('')}</div>
  <span class="courier meta" style="line-height:1.5">Awards count every game a player has played, in any club. Switch clubs on Home or Stats to see other people.</span>`;
}

Object.assign(SHEETS, { award: awardSheet, awPlayer: awPlayerSheet });
Object.assign(ACT, {
  awCat: c => { if (S.aw) S.aw.cat = c; render(); },
  awPick: id => { if (S.aw) S.aw.pid = id; S.sheet = null; buzz(); render(); },
  awGame: id => { S.sheet = null; ACT.openGame(id); },
});

// ════════════ Start-up ════════════
// Show the loading line immediately. If someone was signed in on this phone, open straight to
// their saved Home — no waiting on Firebase or the internet.
// When the keyboard opens, lift sheets so their lists stay above it
if (window.visualViewport) {
  const kb = () => {
    const v = visualViewport, gap = Math.max(0, innerHeight - v.height - v.offsetTop);
    document.documentElement.style.setProperty('--kb', gap + 'px');
    document.documentElement.style.setProperty('--vh', v.height + 'px');
  };
  visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb); kb();
}
wire();
(() => {
  const u = Store.json('gb_last_user', null), acct = u && Store.json('gb_acct_' + u.uid, null);
  if (u && acct) {
    S.user = u; S.account = acct; S.clubs = Store.json('gb_clubs_' + u.uid, []);
    S.scope = Store.getItem('gb_scope_' + u.uid) || 'mine'; S.admin = Store.getItem('gb_admin') === '1';
    S.home = Store.json('gb_home_' + u.uid + '_' + S.scope, S.home); S.home.loading = false; S.screen = 'home';
    const lg = Store.json('gb_live', null);                // a live game saved on this phone
    if (lg && !lg.ended && lg.host === u.uid) openGame(lg);
  }
  render();
})();

</script>

  const app = initializeApp({

    databaseURL: "https://guessball-888cd-default-rtdb.firebaseio.com", projectId: "guessball-888cd",
    storageBucket: "guessball-888cd.firebasestorage.app", messagingSenderId: "485572357359",

  // The Google popup helper must be loaded before the sign-in button is tapped, or iPhone blocks the
