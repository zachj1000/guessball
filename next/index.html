    A('calls_ipo', 'In Play Outs', 'CAREER CALLS', 'Correct IPO calls all time', { ...T([10, 50, 100]), outcome: 'in_play_out', code: 'IPO' }),
    A('calls_1b', 'Singles', 'CAREER CALLS', 'Correct 1B calls all time', { ...T([10, 50, 100]), outcome: 'single', code: '1B' }),
    A('calls_2b', 'Doubles', 'CAREER CALLS', 'Correct 2B calls all time', { ...T([5, 25, 50]), outcome: 'double', code: '2B' }),
    A('calls_3b', 'Triples', 'CAREER CALLS', 'Correct 3B calls all time', { ...T([3, 10, 25]), outcome: 'triple', code: '3B' }),
    A('calls_hr', 'Home Runs', 'CAREER CALLS', 'Correct HR calls all time', { ...T([5, 25, 50]), outcome: 'home_run', code: 'HR' }),
    A('calls_bb', 'Walks', 'CAREER CALLS', 'Correct BB calls all time', { ...T([10, 25, 50]), outcome: 'walk', code: 'BB' }),
    A('calls_hbp', 'Hit by Pitch', 'CAREER CALLS', 'Correct HBP calls all time', { ...T([5, 15, 30]), outcome: 'hbp', code: 'HBP' }),
    A('calls_sb', 'Steals', 'CAREER CALLS', 'Correct SB calls all time', { ...T([5, 15, 30]), outcome: 'stolen_base', code: 'SB' }),
    A('calls_dp', 'Double Plays', 'CAREER CALLS', 'Correct DP calls all time', { ...T([5, 15, 30]), outcome: 'double_play', code: 'DP' }),
    A('calls_bu', 'Bunts', 'CAREER CALLS', 'Correct BU calls all time', { ...T([5, 15, 30]), outcome: 'bunt', code: 'BU' }),

    A('road_trip', 'Road Trip', 'TRAVEL', 'Play at different ballparks', { ...T([3, 5, 10]), scope: 'all' }),
    A('home_cooking', 'Home Cooking', 'TRAVEL', 'Play 10 games at one ballpark', { ...T([10]), scope: 'all' }),
    A('lifer', 'Lifer', 'TRAVEL', 'Play in different seasons', { ...T([5, 10]), scope: 'all' }),
  ];
  const AWARD = Object.fromEntries(AWARDS.map(a => [a.id, a]));

  // Works through every game in order and records when each player earned each award.
  // Returns { [playerId]: { earned: { [awardId]: [{ tier, gameId, date, at }] }, counts: { [awardId]: n } } }
  //   at = index of the scorebook event that earned it (null = at the end of the game / final score)
  // Give it ALL of a player's games (across clubs) — awards are per person.
  const bookCache = new WeakMap();           // the Awards tab asks many questions of the same games
  function awardBook(games) {
    if (bookCache.has(games)) return bookCache.get(games);
    const book = {};
    const P = id => book[id] || (book[id] = {
      earned: {}, counts: {}, games: 0, wins: 0, points: 0, parks: {}, seasons: new Set(),
      vs: {}, lastLossTo: null, confRun: 0, p3Run: 0, confUsed: false,
    });
    const give = (pid, g, id, tier = 1, at = null) => {
      const e = P(pid).earned[id] || (P(pid).earned[id] = []);
      if (e.some(x => x.tier === tier)) return;
      e.push({ tier, gameId: g.id, date: g.date, at });
    };
    const count = (pid, g, id, value, at = null) => {
      const p = P(pid); p.counts[id] = value;
      AWARD[id].tiers.forEach((t, k) => { if (value >= t) give(pid, g, id, k + 1, at); });
    };

    chrono(games).forEach(g => {
      const ended = g.ended !== false;
      const r = hasPlays(g) ? replay(g) : null;
      const inGame = hasPlays(g);

      // ── In-game awards, checked play by play so each lands on the play that earned it ──
      if (inGame) inGameAwards(g, r, give, count, P);
      if (!ended) return;

      // ── Final-score awards (every era) ──
      const res = result(g);
      g.players.forEach((pl, i) => {
        const p = P(pl.id), o = outcomeFor(g, i);
        p.games++; p.points += res.scores[i]; if (o === 'W') p.wins++;
        count(pl.id, g, 'wins', p.wins); count(pl.id, g, 'games', p.games);
        count(pl.id, g, 'season_ticket', p.games); count(pl.id, g, 'points', p.points);
        if (g.park) { p.parks[g.park] = (p.parks[g.park] || 0) + 1;
          count(pl.id, g, 'road_trip', Object.keys(p.parks).length);
          count(pl.id, g, 'home_cooking', Math.max(...Object.values(p.parks))); }
        p.seasons.add(season(g)); count(pl.id, g, 'lifer', p.seasons.size);
        if (o === 'T') give(pl.id, g, 'dead_even');
        if (res.scores[i] < 0) give(pl.id, g, 'below_zero');
        if (o === 'W' && g.players.length === 3) give(pl.id, g, 'last_one_standing');
        // Margin awards: only games played in the app (pre-app / beta / hand-added excluded)
        if (inGame) {
          if (o === 'W' && res.margin === 1) give(pl.id, g, 'sweating');
          if (o === 'W' && res.margin >= 20) give(pl.id, g, 'comfortable');
          if (o === 'W' && res.margin >= 30) give(pl.id, g, 'blowout');
          if (o === 'L' && res.winner !== null && res.scores[res.winner] - res.scores[i] >= 20) give(pl.id, g, 'good_sport');
        }
        // Rivalries
        g.players.forEach((op, j) => {
          if (j === i) return;
          const v = p.vs[op.id] || (p.vs[op.id] = { games: 0, w: 0, l: 0, run: 0, lossRun: 0 });
          v.games++;
          count(pl.id, g, 'rivalry', Math.max(...Object.values(p.vs).map(x => x.games)));
          count(pl.id, g, 'blood_feud', Math.max(...Object.values(p.vs).map(x => x.games)));
          if (res.winner === i) { v.w++; v.run++; v.lossRun = 0; }
          else if (res.winner === j) { v.l++; v.lossRun++; v.run = 0; }
          count(pl.id, g, 'dynasty', Math.max(...Object.values(p.vs).map(x => x.run)));
          count(pl.id, g, 'nemesis', Math.max(...Object.values(p.vs).map(x => x.lossRun)));
          if (v.w + v.l >= 10 && v.w / (v.w + v.l) >= 0.7) give(pl.id, g, 'dominant');
        });
        // Revenge: whoever won your previous game played in this one, and you beat them
        if (o === 'W' && p.lastLossTo && g.players.some(x => x.id === p.lastLossTo)) give(pl.id, g, 'revenge');
      });
      g.players.forEach((pl, i) => {
        const o = outcomeFor(g, i);
        P(pl.id).lastLossTo = o === 'L' && res.winner !== null ? g.players[res.winner].id : null;
      });

      // Pick 3 run across games (Clairvoyant) — app games only
      if (inGame) g.players.forEach((pl, i) => {
        const p = P(pl.id);
        const hit = r.plays.some(q => q.log.some(e => e.player === i && e.p3Bonus));
        p.p3Run = hit ? p.p3Run + 1 : 0;
        if (p.p3Run >= 3) give(pl.id, g, 'clairvoyant');
      });
    });
    bookCache.set(games, book);
    return book;
  }

  function inGameAwards(g, r, give, count, P) {
    const n = g.players.length, ids = g.players.map(p => p.id);
    const streak = Array(n).fill(0), miss = Array(n).fill(0), scoreRun = Array(n).fill(0);
    const confWrongRun = Array(n).fill(0);
    const conf = g.players.map(() => ({ right: 0, wrong: 0 }));
    const inGameCalls = g.players.map(() => ({}));
    const p3 = Array(n).fill(0);
    const halfPts = {}, halfPicks = {}, halfRight = {};
    let abPts = Array(n).fill(0);
    let abStartPriority = null, prioRun = 0, prioHolder = null, halfPrioRun = 0, halfPrioHolder = null;
    let halfStartPriority = null, halfChanged = false, curHalf = null, priorityEverChanged = false;
    let firstAtBat = true;
    const ended = r.ended;

    r.plays.forEach((p, k) => {
      const at = p.index;
      if (curHalf !== p.half) { curHalf = p.half; halfStartPriority = p.priorityBefore; halfChanged = false;
        halfPts[p.half] = Array(n).fill(0); halfPicks[p.half] = Array(n).fill(0); halfRight[p.half] = Array(n).fill(0); }
      if (abStartPriority === null) abStartPriority = p.priorityBefore;
      if (p.priorityAfter !== p.priorityBefore) { halfChanged = true; priorityEverChanged = true; }

      p.log.forEach(e => {
        const i = e.player, pid = ids[i], P0 = P(pid);
        abPts[i] += e.pts; halfPts[p.half][i] += e.pts; halfPicks[p.half][i]++; if (e.correct) halfRight[p.half][i]++;
        // streaks
        if (e.correct) { streak[i]++; miss[i] = 0; } else { streak[i] = 0; miss[i]++; }
        [[5, 'on_fire'], [7, 'wave'], [10, 'unstoppable'], [20, 'twenty_straight']].forEach(([t, id]) => { if (streak[i] >= t) give(pid, g, id, 1, at); });
        if (miss[i] >= 6) give(pid, g, 'ice_cold', 1, at);
        // career counts
        if (e.correct) {
          P0.counts._right = (P0.counts._right || 0) + 1; count(pid, g, 'correct_picks', P0.counts._right, at);
          const c = AWARDS.find(a => a.outcome === e.outcome);
          if (c) { P0.counts['_' + c.id] = (P0.counts['_' + c.id] || 0) + 1; count(pid, g, c.id, P0.counts['_' + c.id], at); }
          inGameCalls[i][e.outcome] = (inGameCalls[i][e.outcome] || 0) + 1;
          if (e.outcome === 'triple') give(pid, g, 'unicorn', 1, at);
          if (e.outcome === 'hbp') give(pid, g, 'take_your_base', 1, at);
          if (e.outcome === 'bunt') give(pid, g, 'small_ball', 1, at);
          if (e.outcome === 'home_run' && e.runs >= 4) give(pid, g, 'cleanup_hitter', 1, at);
          [['stolen_base', 'speed_demon'], ['walk', 'patient'], ['hbp', 'lightning_rod'], ['bunt', 'small_ball_specialist'], ['home_run', 'hr_hat_trick']]
            .forEach(([o, id]) => { if (inGameCalls[i][o] >= 3) give(pid, g, id, 1, at); });
        }
        // confidence
        if (e.conf) {
          give(pid, g, 'bold', 1, at);
          if (e.correct) {
            conf[i].right++; confWrongRun[i] = 0;
            P0.counts._conf = (P0.counts._conf || 0) + 1; count(pid, g, 'confidence_correct', P0.counts._conf, at);
            if (e.outcome === 'home_run') give(pid, g, 'called_shot', 1, at);
            if (e.outcome === 'double_play') give(pid, g, 'big_brain', 1, at);
            if (e.outcome === 'triple') give(pid, g, 'first_to_third', 1, at);
            if (!e.hadPriority) give(pid, g, 'assassin', 1, at);
          } else {
            conf[i].wrong++; confWrongRun[i]++;
            if (e.pick === 'home_run') give(pid, g, 'hubris', 1, at);
            if (confWrongRun[i] >= 3) give(pid, g, 'rough_patch', 1, at);
            if (conf[i].wrong >= 3) give(pid, g, 'reckless', 1, at);
          }
          if (conf[i].right >= 5 && conf[i].wrong === 0) give(pid, g, 'diamond_hands', 1, at);
        }
        // Pick 3
        if (e.p3Bonus) {
          p3[i]++;
          P0.counts._p3 = (P0.counts._p3 || 0) + 1; count(pid, g, 'p3_bonuses', P0.counts._p3, at);
          give(pid, g, 'first_p3', 1, at);
          if (p.half === '1t') give(pid, g, 'prophet', 1, at);
          if (p3[i] >= 3) give(pid, g, 'hat_trick', 1, at);
        }
        // points moments
        if (halfPts[p.half][i] >= 10) give(pid, g, 'rocket', 1, at);
        if (p.scoresAfter[i] >= 20) give(pid, g, 'payday', 1, at);
      });

      // ── End of an at-bat ──
      if (p.endsAtBat) {
        g.players.forEach((_, i) => {
          if (abPts[i] >= 5) give(ids[i], g, 'big_winner', 1, at);
          scoreRun[i] = abPts[i] > 0 ? scoreRun[i] + 1 : 0;
          if (scoreRun[i] >= 10) give(ids[i], g, 'hot_streak', 1, at);
          if (firstAtBat && abPts[i] > 0 && i !== abStartPriority) give(ids[i], g, 'stolen_thunder', 1, at);
        });
        // priority held through this at-bat
        const holder = p.priorityAfter;
        if (holder === abStartPriority) { prioRun = prioHolder === holder ? prioRun + 1 : 1; }
        else prioRun = 0;
        prioHolder = holder;
        if (prioRun >= 5) give(ids[holder], g, 'oracle', 1, at);
        if (prioRun >= 10) give(ids[holder], g, 'priority_hog', 1, at);
        abPts = Array(n).fill(0); abStartPriority = null; firstAtBat = false;
      }

      // ── End of a half-inning ──
      if (p.halfComplete) {
        const hp = halfPts[p.half];
        g.players.forEach((_, i) => {
          if (halfPicks[p.half][i] >= 3 && halfRight[p.half][i] === halfPicks[p.half][i]) give(ids[i], g, 'perfect_half', 1, at);
          if (hp[i] >= 7 && hp.every((v, j) => j === i || v <= 0)) give(ids[i], g, 'ghost', 1, at);
        });
        // King of the Hill: same player held priority through 6 straight whole half-innings (3 innings)
        const kept = !halfChanged && p.priorityAfter === halfStartPriority;
        halfPrioRun = kept ? (halfPrioHolder === halfStartPriority ? halfPrioRun + 1 : 1) : 0;
        halfPrioHolder = kept ? halfStartPriority : null;
        if (halfPrioRun >= 6) give(ids[halfStartPriority], g, 'king_of_the_hill', 1, at);
        // Dead Heat: everyone tied at the end of the 5th inning or later
        if (p.half.endsWith('b') && parseInt(p.half, 10) >= 5 && p.scoresAfter.every(v => v === p.scoresAfter[0]))
          g.players.forEach((_, i) => give(ids[i], g, 'dead_heat', 1, at));
      }
    });

    if (!ended || !r.plays.length) return;
    // ── End-of-game awards that need the final result ──
    const res = result(g), nums = gameNumbers(g), last = r.plays[r.plays.length - 1];
    const lastAB = r.plays.filter(p => p.endsAtBat).pop();
    const d = deficits(g);
    g.players.forEach((pl, i) => {
      const pid = pl.id, won = res.winner === i;
      const a = pct(nums[i].right, nums[i].picks);
      if (nums[i].picks >= 10 && a >= 0.55) give(pid, g, 'dead_eye');
      if (nums[i].picks >= 10 && a >= 0.70) give(pid, g, 'sniper');
      if (conf[i].right + conf[i].wrong >= 3 && conf[i].wrong === 0) give(pid, g, 'perfect_confidence');
      if (won && conf[i].wrong >= 3) give(pid, g, 'reckless_win');
      if (won && d[i] >= 10) give(pid, g, 'comeback_kid');
      if (lastAB && lastAB.log.some(e => e.player === i && e.correct)) give(pid, g, 'last_laugh');
      if (won) {
        const firstInning = r.halves.filter(h => parseInt(h.half, 10) === 1).reduce((s, h) => s + h.pts[i], 0);
        if (firstInning === 0) give(pid, g, 'cold_start');
        const b = last.scoresBefore;
        const trailing = b[i] < Math.max(...b.filter((_, j) => j !== i));
        if (trailing && last.log.some(e => e.player === i && e.correct)) give(pid, g, 'walk_off');
        if (!priorityEverChanged && (g.setup && g.setup.priority || 0) === i) give(pid, g, 'perfect_game');
      }
    });
  }

  // One player's award list for the Awards screen:
  // [{ ...award, tier (0 = not yet), earnedAt: [{tier, date, gameId}], progress: {value, target} | null }]
  function awardsFor(games, pid) {
    const p = awardBook(games)[pid] || { earned: {}, counts: {} };
    return AWARDS.map(a => {
      const e = (p.earned[a.id] || []).slice().sort((x, y) => x.tier - y.tier);
      const tier = e.length ? Math.max(...e.map(x => x.tier)) : 0;
      let progress = null;
      if (a.kind === 'count') {
        const value = p.counts[a.id] || 0;
        const target = a.tiers[Math.min(tier, a.tiers.length - 1)];
        progress = { value, target, done: tier === a.tiers.length };
      }
      return { ...a, tier, earnedAt: e, progress };
    });
  }

  // Awards earned during one game (for the popup after a play, and the Final screen).
  // `games` = the players' games INCLUDING this one. Returns [{ award, playerId, name, tier, at }]
  function awardsInGame(games, g) {
    const book = awardBook(games), out = [];
    g.players.forEach(pl => {
      const e = (book[pl.id] || { earned: {} }).earned;
      Object.keys(e).forEach(id => e[id].forEach(x => {
        if (x.gameId === g.id) out.push({ award: AWARD[id], playerId: pl.id, name: pl.name, tier: x.tier, at: x.at });
      }));
    });
    return out.sort((a, b) => (a.at === null) - (b.at === null) || (a.at || 0) - (b.at || 0));
  }

  // Who has an award (Award detail "Who has it"), for the players in `games`
  function whoHas(games, awardId) {
    const book = awardBook(games);
    return Object.entries(book).filter(([, p]) => p.earned[awardId])
      .map(([id, p]) => ({ id, tier: Math.max(...p.earned[awardId].map(x => x.tier)), first: p.earned[awardId][0].date }));
  }

  return { AWARDS, CODES, result, outcomeFor, replay, gameNumbers, lineScore, standings, seasons, history,
           records, h2h, opponents, summary, awardBook, awardsFor, awardsInGame, whoHas };
})();



// ════════════════════════════════════════════════════════════════
//  SECTION 4 — THE FILING CABINET (saving and loading)
//  The ONLY code that touches Firebase or the phone's storage.
//  Screens ask it for things ("load the Dodgers' games", "save this
//  play") and never talk to Firebase themselves.
//
//  Offline: every change goes into an outbox kept on the phone first,
//  then gets sent when there's signal — so a play entered with no
//  bars survives even if the app is closed before it syncs.
//
//  Where things live in Firebase (all under /v2):
//    users/<uid>            your private info: name, team, clubs you joined or asked to join, guest claims
//    profiles/<pid>         every player's public name (accounts: pid = uid; guests: random id)
//    clubs/<code>/info      name, public/private      clubs/<code>/members   the roster (+ captains, guests)
//    clubs/<code>/requests  join requests             clubs/<code>/claims    "that's me" guest claims
//    clubs/<code>/games     which games count for the club
//    clubNames/<name>       makes club names unique   clubList/<code>        Find a club list
//    games/<id>             one game, with its scorebook      playerGames/<pid>   each player's "All my games"
//    live/<pid>             who is in a live game right now
// ════════════════════════════════════════════════════════════════
const FilingCabinet = (() => {

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I mix-ups
  const nameKey = s => s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.#$\[\]\/]/g, '_');
  const clean = o => JSON.parse(JSON.stringify(o)); // drops undefined (Firebase rejects it)

  function create({ db, storage, deviceId, now = () => Date.now(), random = Math.random }) {
    let uid = null;
    const listeners = new Set();
    let online = false;
    const R = p => 'v2/' + p;

    // ── Outbox (kept on the phone) ──
    const load = (k, d) => { try { const v = storage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
    const save = (k, v) => { try { storage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } };
    let outbox = load('gb_outbox', []);
    let flushing = null;
    const status = () => ({ online, pending: outbox.length });
    const emit = () => listeners.forEach(f => f(status()));

    const denied = new Map();                 // outbox item id → Firebase's refusal
    function queue(changes) {                 // changes: { 'path': value | null, … } — sent together, all or nothing
      const full = {};
      Object.entries(changes).forEach(([p, v]) => { full[R(p)] = v === undefined ? null : v; });
      const id = now() + '-' + Math.floor(random() * 1e9);
      outbox.push({ id, changes: clean(full) }); save('gb_outbox', outbox); emit();
      // Online: wait for it to land (and report a refusal). Offline: it's safely queued on the phone.
      return flush().then(() => {
        if (denied.has(id)) { const e = denied.get(id); denied.delete(id); throw e; }
      });
    }
    function flush() {
      if (flushing) return flushing;
      flushing = (async () => {
        while (online && outbox.length) {
          const item = outbox[0];
          try { await db.update(item.changes); }
          catch (e) {
            if (e && e.code === 'PERMISSION_DENIED') { denied.set(item.id, e); console.warn('Firebase refused a change', item.changes); }
            else break;                          // network trouble — try again later
          }
          outbox.shift(); save('gb_outbox', outbox); emit();
        }
      })().finally(() => { flushing = null; });
      return flushing;
    }
    db.onConnected(c => { online = c; emit(); if (c) flush(); });

    const get = async p => { await flush(); return db.get(R(p)); };
    const need = () => { if (!uid) throw new Error('Not signed in'); };
    const newCode = () => Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(random() * CODE_CHARS.length)]).join('');

    // ════════════ Account & profile ════════════
    function setUser(u) { uid = u; }
    async function myAccount() {
      need();
      const u = (await get('users/' + uid)) || null;
      return u;
    }
    async function saveProfile({ name, team = null }) {
      need();
      name = name.trim();
      if (!name || name.length > 16) throw new Error('Names are 1–16 characters');
      const first = !(await get('users/' + uid));
      const ch = { ['users/' + uid + '/name']: name, ['users/' + uid + '/team']: team,
        ['profiles/' + uid + '/name']: name, ['profiles/' + uid + '/account']: true };
      if (first) { ch['users/' + uid + '/createdAt'] = now(); ch['profiles/' + uid + '/createdAt'] = now(); }
      await queue(ch);
    }
    // "Delete account": unlinks Google only. The profile turns back into a guest that can be claimed again.
    async function unlinkAccount() {
      need();
      const clubs = Object.keys((await get('users/' + uid + '/clubs')) || {});
      await queue({ ['profiles/' + uid + '/account']: false, ['profiles/' + uid + '/createdBy']: uid,
        ['profiles/' + uid + '/club']: clubs[0] || null, ['users/' + uid]: null });
    }
    async function profiles(ids) {
      const out = {};
      await Promise.all([...new Set(ids)].map(async id => { out[id] = (await get('profiles/' + id)) || { name: '?' }; }));
      return out;
    }

    // ════════════ Clubs ════════════
    async function createClub(name, isPublic) {
      need();
      name = name.trim();
      if (!name || name.length > 30) throw new Error('Club names are 1–30 characters');
      const key = nameKey(name);
      if (await get('clubNames/' + key)) throw new Error(`There's already a club called "${name}"`);
      let code = newCode();
      while (await get('clubs/' + code + '/info')) code = newCode();
      const me = await get('profiles/' + uid);
      try {
        await queue({ ['clubs/' + code + '/info']: { name, public: !!isPublic, createdAt: now(), createdBy: uid },
          ['clubNames/' + key]: code, ['clubList/' + code]: { name, public: !!isPublic } });
      } catch (e) {                                  // Firebase is the final judge of unique names
        if (e.code === 'PERMISSION_DENIED') throw new Error(`There's already a club called "${name}"`);
        throw e;
      }
      await queue({ ['clubs/' + code + '/members/' + uid]: { name: me.name, captain: true, guest: false, joinedAt: now() },
        ['users/' + uid + '/clubs/' + code]: true });
      return code;
    }
    async function findClubs(text = '') {
      const all = (await get('clubList')) || {};
      const q = text.trim().toLowerCase();
      return Object.entries(all).map(([code, c]) => ({ code, ...c }))
        .filter(c => !q || c.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    }
    // Your clubs, checked against the real rosters (a captain may have approved or removed you meanwhile)
    async function myClubs() {
      need();
      const listed = Object.keys((await get('users/' + uid + '/clubs')) || {});
      const out = [];
      for (const code of listed) {
        const info = await get('clubs/' + code + '/info');
        if (!info) { await queue({ ['users/' + uid + '/clubs/' + code]: null }); continue; }
        let me = null; try { me = await get('clubs/' + code + '/members/' + uid); } catch (e) { /* private, not a member */ }
        const req = await get('clubs/' + code + '/requests/' + uid);
        if (me) out.push({ code, ...info, status: 'member', captain: !!me.captain });
        else if (req) out.push({ code, ...info, status: 'pending' });
        else await queue({ ['users/' + uid + '/clubs/' + code]: null });
      }
      return out;
    }
    async function roster(code) {
      const m = (await get('clubs/' + code + '/members')) || {};
      return Object.entries(m).map(([pid, x]) => ({ pid, ...x })).sort((a, b) => a.joinedAt - b.joinedAt);
    }
    async function nameTaken(code, name, exceptPid) {
      const m = (await get('clubs/' + code + '/members')) || {};
      return Object.entries(m).some(([pid, x]) => pid !== exceptPid && nameKey(x.name) === nameKey(name));
    }
    // Join: public → in right away; private → a request a captain answers. `nickname` if your name is taken there.
    async function joinClub(code, { note = '', nickname = null } = {}) {
      need();
      const info = await get('clubs/' + code + '/info');
      if (!info) throw new Error('That club no longer exists');
      const me = await get('profiles/' + uid);
      const name = nickname || me.name;
      if (info.public) {
        if (await nameTaken(code, name)) throw Object.assign(new Error(`Someone in ${info.name} is already called ${name}. Pick a nickname for this club.`), { code: 'NAME_TAKEN' });
        await queue({ ['clubs/' + code + '/members/' + uid]: { name, captain: false, guest: false, joinedAt: now() },
          ['users/' + uid + '/clubs/' + code]: true });
        return 'joined';
      }
      await queue({ ['clubs/' + code + '/requests/' + uid]: { name, note: note.slice(0, 140), at: now() },
        ['users/' + uid + '/clubs/' + code]: true });
      return 'requested';
    }
    async function requests(code) {
      const r = (await get('clubs/' + code + '/requests')) || {};
      const c = (await get('clubs/' + code + '/claims')) || {};
      return { joins: Object.entries(r).map(([u, x]) => ({ uid: u, ...x })),
               claims: Object.entries(c).map(([g, x]) => ({ guest: g, ...x })) };
    }
    async function answerRequest(code, who, accept) {
      const r = await get('clubs/' + code + '/requests/' + who);
      if (!r) return;
      if (accept && await nameTaken(code, r.name)) throw new Error(`Someone is already called ${r.name} — ask them to request again with a nickname`);
      const ch = { ['clubs/' + code + '/requests/' + who]: null };
      if (accept) ch['clubs/' + code + '/members/' + who] = { name: r.name, captain: false, guest: false, joinedAt: now() };
      await queue(ch);
    }
    async function leaveClub(code) {
      need();
      const list = await roster(code);
      const people = list.filter(m => !m.guest);
      const me = list.find(m => m.pid === uid);
      if (!me) return;
      if (people.length === 1) {                           // last member: the club is deleted
        const info = await get('clubs/' + code + '/info');
        return queue({ ['clubs/' + code]: null, ['clubNames/' + nameKey(info.name)]: null, ['clubList/' + code]: null,
          ['users/' + uid + '/clubs/' + code]: null });
      }
      if (me.captain && !people.some(m => m.pid !== uid && m.captain))
        throw Object.assign(new Error('Name another captain before you leave'), { code: 'LAST_CAPTAIN' });
      await queue({ ['clubs/' + code + '/members/' + uid]: null, ['users/' + uid + '/clubs/' + code]: null });
    }
    const setCaptain = (code, pid, on) => queue({ ['clubs/' + code + '/members/' + pid + '/captain']: !!on });
    const removeMember = (code, pid) => queue({ ['clubs/' + code + '/members/' + pid]: null });
    async function updateClub(code, { name, public: pub }) {
      const info = await get('clubs/' + code + '/info');
      const ch = {};
      if (name !== undefined && name.trim() !== info.name) {
        const key = nameKey(name);
        if (await get('clubNames/' + key)) throw new Error(`There's already a club called "${name.trim()}"`);
        ch['clubs/' + code + '/info/name'] = name.trim(); ch['clubList/' + code + '/name'] = name.trim();
        ch['clubNames/' + key] = code; ch['clubNames/' + nameKey(info.name)] = null;
      }
      if (pub !== undefined) { ch['clubs/' + code + '/info/public'] = !!pub; ch['clubList/' + code + '/public'] = !!pub; }
      await queue(ch);
    }

    // ════════════ Guests ════════════
    // A guest joins the club you have selected (code), or is personal to you (code = null).
    async function addGuest(name, code = null) {
      need();
      name = name.trim();
      if (!name || name.length > 16) throw new Error('Names are 1–16 characters');
      if (code && await nameTaken(code, name)) throw Object.assign(new Error(`${name} is already in this club`), { code: 'NAME_TAKEN' });
      const pid = 'g_' + db.newId();
      const ch = { ['profiles/' + pid]: { name, account: false, createdBy: uid, club: code, createdAt: now() } };
      await queue(ch);
      if (code) await queue({ ['clubs/' + code + '/members/' + pid]: { name, captain: false, guest: true, joinedAt: now() } });
      return pid;
    }
    async function renameGuest(code, pid, name) {
      if (await nameTaken(code, name, pid)) throw new Error(`${name} is already in this club`);
      await queue({ ['clubs/' + code + '/members/' + pid + '/name']: name.trim(), ['profiles/' + pid + '/name']: name.trim() });
    }
    // "That's me": ask to take over a guest's games
    async function claimGuest(code, guestPid) {
      need();
      const me = await get('profiles/' + uid);
      await queue({ ['clubs/' + code + '/claims/' + guestPid]: { uid, name: me.name, at: now() },
        ['users/' + uid + '/claims/' + guestPid]: code });
    }
    // Captain approves: the guest's games now count as the claimer's, and they join the club.
    async function answerClaim(code, guestPid, accept) {
      const c = await get('clubs/' + code + '/claims/' + guestPid);
      if (!c) return;
      const ch = { ['clubs/' + code + '/claims/' + guestPid]: null };
      if (accept) {
        ch['profiles/' + guestPid + '/claimedBy'] = c.uid;
        ch['clubs/' + code + '/members/' + guestPid] = null;
        const guest = await get('clubs/' + code + '/members/' + guestPid);
        const already = await get('clubs/' + code + '/members/' + c.uid);
        if (!already) ch['clubs/' + code + '/members/' + c.uid] = { name: (guest && guest.name) || c.name, captain: false, guest: false, joinedAt: (guest && guest.joinedAt) || now() };
      }
      await queue(ch);
    }
    // Guests you've claimed and had approved — their games are yours
    async function myAliases() {
      need();
      const claims = Object.keys((await get('users/' + uid + '/claims')) || {});
      const out = [];
      for (const g of claims) { const p = await get('profiles/' + g); if (p && p.claimedBy === uid) out.push(g); }
      // Publish them on your profile so other people's phones count those games for you too (awards, H2H)
      const listed = Object.keys((await get('profiles/' + uid + '/aliases')) || {});
      const add = {}; out.filter(g => !listed.includes(g)).forEach(g => { add['profiles/' + uid + '/aliases/' + g] = true; });
      if (Object.keys(add).length) await queue(add);
      return out;
    }

    // ════════════ Games ════════════
    // Which of the host's clubs this game counts for: every club that ALL the players belong to.
    async function clubsFor(pids) {
      const mine = Object.keys((await get('users/' + uid + '/clubs')) || {});
      const out = [];
      for (const code of mine) {
        let m = null; try { m = await get('clubs/' + code + '/members'); } catch (e) { continue; }
        if (m && pids.every(p => m[p])) out.push(code);
      }
      return out;
    }
    const indexChanges = (g, value) => {
      const ch = {};
      g.players.forEach(p => { ch['playerGames/' + p.id + '/' + g.id] = value; });
      (g.clubList || []).forEach(c => { ch['clubs/' + c + '/games/' + g.id] = value; });
      return ch;
    };
    const localDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    // Start a live game. players: [{ id, name }] in seat order.
    async function startGame({ players, priority = 0, away = '', home = '', park = '' }) {
      need();
      for (const p of players) {                           // one live game per player
        const l = await get('live/' + p.id);
        if (l && l.gameId) {
          const g = await get('games/' + l.gameId);
          if (g && !g.ended) {
            const host = (await get('profiles/' + g.host)) || { name: 'someone' };
            throw Object.assign(new Error(`${p.name} is already in a live game hosted by ${host.name}.`), { code: 'IN_LIVE_GAME' });
          }
        }
      }
      const t = now();
      const clubList = await clubsFor(players.map(p => p.id));
      const g = { id: db.newId(), host: uid, device: deviceId, era: 'app', date: localDate(t), seq: t, startedAt: t,
        players: players.map(p => ({ id: p.id, name: p.name })), setup: { priority }, events: [],
        away, home, park, clubList, ended: false };
      const ch = { ['games/' + g.id]: g, ...indexChanges(g, { date: g.date, seq: g.seq }) };
      players.forEach(p => { ch['live/' + p.id] = { gameId: g.id, host: uid, at: t }; });
      save('gb_live', g);
      await queue(ch);
      return g;
    }
    const liveGame = () => load('gb_live', null);      // resume after closing the app, even offline
    function addEvent(g, ev) {
      g.events.push(ev); save('gb_live', g);
      return queue({ ['games/' + g.id + '/events/' + (g.events.length - 1)]: ev, ['games/' + g.id + '/updatedAt']: now() });
    }
    function undo(g) {
      if (!g.events.length) return Promise.resolve();
      g.events.pop(); save('gb_live', g);
      return queue({ ['games/' + g.id + '/events/' + g.events.length]: null, ['games/' + g.id + '/updatedAt']: now() });
    }
    // Fix the matchup mid-game (teams / ballpark)
    function updateGameInfo(g, fields) {
      const ch = {};
      ['away', 'home', 'park'].forEach(k => { if (k in fields) { g[k] = fields[k]; ch['games/' + g.id + '/' + k] = fields[k]; } });
      save('gb_live', g);
      return queue(ch);
    }
    // Another device of the same account takes over a live game
    function takeOver(g) { g.device = deviceId; save('gb_live', g); return queue({ ['games/' + g.id + '/device']: deviceId }); }
    // End the game. A game with no plays is thrown away instead of saved.
    async function endGame(g, { scores, mlb = null, note = '' } = {}) {
      const liveOff = {}; g.players.forEach(p => { liveOff['live/' + p.id] = null; });
      const plays = g.events.filter(e => e.type === 'play').length;
      storage.removeItem('gb_live');
      if (!plays) {
        await queue({ ...liveOff, ['games/' + g.id]: null });
        return queue(indexChanges(g, null));
      }
      g.events.push({ type: 'end' });
      Object.assign(g, { ended: true, endedAt: now(), scores, mlb, note: note.slice(0, 280) });
      return queue({ ['games/' + g.id + '/events/' + (g.events.length - 1)]: { type: 'end' },
        ['games/' + g.id + '/ended']: true, ['games/' + g.id + '/endedAt']: g.endedAt,
        ['games/' + g.id + '/scores']: scores, ['games/' + g.id + '/mlb']: mlb, ['games/' + g.id + '/note']: g.note, ...liveOff });
    }
    // Add a game by hand (final scores only). Anyone can; it counts like a pre-app game.
    async function addHandGame({ players, scores, date, away = '', home = '', park = '', mlb = null, note = '' }) {
      need();
      const me = await get('profiles/' + uid);
      const clubList = await clubsFor(players.map(p => p.id));
      const g = { id: db.newId(), host: uid, addedBy: me.name, era: 'hand', date, seq: now(), players, scores,
        away, home, park, mlb, note, clubList, ended: true };
      await queue({ ['games/' + g.id]: g, ...indexChanges(g, { date, seq: g.seq }) });
      return g;
    }
    async function editHandGame(g, fields) {
      const allowed = ['scores', 'date', 'away', 'home', 'park', 'mlb', 'note'];
      const ch = {};
      allowed.forEach(k => { if (k in fields) { g[k] = fields[k]; ch['games/' + g.id + '/' + k] = fields[k]; } });
      if ('date' in fields) Object.assign(ch, indexChanges(g, { date: g.date, seq: g.seq }));
      gameCache.delete(g.id);                          // don't serve the old copy
      await queue(ch);
    }
    // Delete a game (captains of its clubs, whoever hand-added it, or Xaq). Stats and awards recalculate.
    async function deleteGame(g) {
      gameCache.delete(g.id);
      await queue({ ['games/' + g.id]: null });
      await queue(indexChanges(g, null));
    }

    // Load games for a scope. scope: { club: code } or { mine: true }.
    // Returns games ready for the Statistician, with claimed guests folded into their accounts.
    async function loadGames(scope) {
      need();
      let ids = [];
      if (scope.club) ids = Object.keys((await get('clubs/' + scope.club + '/games')) || {});
      else {
        const pids = [uid, ...(await myAliases())];
        for (const p of pids) ids.push(...Object.keys((await get('playerGames/' + p)) || {}));
      }
      return prepare(await fetchGames([...new Set(ids)]), scope.club);
    }
    // Every game a set of players has played (awards need each person's full history)
    async function historyOf(pids) {
      const ids = new Set(), all = new Set(pids);
      for (const p of pids) {                        // only guests a captain actually approved for this person
        for (const a of Object.keys(((await get('profiles/' + p)) || {}).aliases || {})) {
          if (((await get('profiles/' + a)) || {}).claimedBy === p) all.add(a);
        }
      }
      for (const p of all) Object.keys((await get('playerGames/' + p)) || {}).forEach(id => ids.add(id));
      return prepare(await fetchGames([...ids]));
    }
    const gameCache = new Map();                     // finished games never change, so keep them
    async function fetchGames(ids) {
      const out = await Promise.all(ids.map(async id => {
        if (gameCache.has(id)) return gameCache.get(id);
        const g = await get('games/' + id);
        if (g && g.ended) gameCache.set(id, g);
        return g;
      }));
      return out.filter(Boolean);
    }
    // Fold claimed guests into the account that claimed them, and use current names.
    async function prepare(games, club) {
      const ids = [...new Set(games.flatMap(g => g.players.map(p => p.id)))];
      const prof = await profiles(ids);
      let nick = {};
      if (club) { try { nick = (await get('clubs/' + club + '/members')) || {}; } catch (e) { /* not visible */ } }
      const canon = id => (prof[id] && prof[id].claimedBy) || id;
      const acct = await profiles([...new Set(ids.map(canon))]);
      // Firebase drops empty values (e.g. a skipped Pick 3 is null) — put them back so the Umpire can replay.
      const fix = (ev, n) => ev.type !== 'pick3' ? ev
        : { ...ev, picks: Array.from({ length: n }, (_, i) => (ev.picks && ev.picks[i] ? Object.values(ev.picks[i]) : null)) };
      return games.map(g => ({ ...g, events: g.events ? Object.values(g.events).map(ev => fix(ev, g.players.length)) : undefined,
        players: g.players.map(p => { const c = canon(p.id);
          return { id: c, name: (nick[c] && nick[c].name) || (acct[c] && acct[c].name) || p.name }; }) }));
    }

    // ════════════ Admin (Xaq only) ════════════
    const exportAll = () => get('');
    const isAdmin = async () => { need(); return (await get('admins/' + uid)) === true; };

    return { setUser, onStatus: f => { listeners.add(f); f(status()); return () => listeners.delete(f); }, status, flush,
      myAccount, saveProfile, unlinkAccount, profiles,
      createClub, findClubs, myClubs, roster, joinClub, requests, answerRequest, leaveClub, setCaptain, removeMember, updateClub,
      addGuest, renameGuest, claimGuest, answerClaim, myAliases,
      startGame, liveGame, addEvent, undo, takeOver, updateGameInfo, endGame, addHandGame, editHandGame, deleteGame,
      loadGames, historyOf, exportAll, isAdmin };
  }

  // ── Firebase adapter (used in the app). Pass in the Firebase database module + db instance. ──
  function firebaseAdapter(F, database) {
    return {
      get: async p => (await F.get(F.ref(database, p))).val(),
      update: changes => F.update(F.ref(database), changes),
      onConnected: cb => F.onValue(F.ref(database, '.info/connected'), s => cb(s.val() === true)),
      newId: () => F.push(F.ref(database, 'v2/games')).key,
    };
  }

  return { create, firebaseAdapter, nameKey };
})();



// ════════════════════════════════════════════════════════════════
//  SECTION 5 — THE SCREENS
//  Everything you see. Screens ask the Filing Cabinet for data and

      ${noClubs ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px"><button class="press cond small-btn" style="height:42px;border-radius:21px" ${act('go', 'findClub')}>FIND A CLUB</button><button class="press cond small-btn" style="height:42px;border-radius:21px" ${act('go', 'createClub')}>CREATE A CLUB</button></div>` : ''}

  else body = `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:8px"><h2 class="cond h2">STANDINGS</h2><a ${act('tab', 'stats')}>See all</a></div>
    <div class="card" style="padding:0 16px">${h.rows.slice(0, 3).map((r, i) => `<div style="display:flex;align-items:center;gap:12px;height:46px;${i ? 'border-top:1px solid var(--line)' : ''}">
      <span class="shoulders num" style="width:16px;font-size:20px;font-weight:800;color:var(--text3)">${i + 1}</span>

        <div style="width:40px;display:flex;flex-direction:column;align-items:center"><span class="cond" style="font-size:14px;font-weight:800;color:var(--text3);letter-spacing:.6px">${MONTHS[+d[1] - 1]}</span><span class="shoulders num" style="font-size:26px;font-weight:900;line-height:1">${+d[2]}</span></div>
        <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
          <div style="display:flex;justify-content:space-between;align-items:center;height:26px"><span style="font-size:16px;font-weight:700">${esc(w.name)}</span><span class="shoulders num" style="font-size:22px;font-weight:900">${w.score}</span></div>
          <div style="display:flex;justify-content:space-between;align-items:center;height:26px;color:var(--text2)"><span style="font-size:16px;font-weight:500">${esc(l.name)}${g.players.length > 2 ? ' +' + (g.players.length - 2) : ''}</span><span class="shoulders num" style="font-size:22px;font-weight:800">${l.score}</span></div>

    </div>

// ── Find a club ──
SCREENS.findClub = () => {
  const q = S.q.trim().toLowerCase();
  const mine = Object.fromEntries(S.clubs.map(c => [c.code, c.status]));
  const list = S.found.filter(c => !q || c.name.toLowerCase().includes(q));
  return `<div class="page">
  <div class="topbar">${backBtn()}<h1 class="cond h1">FIND A CLUB</h1></div>
  <label class="field search">${ICON.search}<input data-model="q" data-region="list" value="${attr(S.q)}" placeholder="Search clubs by name" aria-label="Search clubs"></label>
  ${S.foundLoading ? `<div class="card" style="padding:24px;display:flex;justify-content:center">${ICON.spinner}</div>` :
  `<div class="list" data-region="list">${list.map(c => {
    const st = mine[c.code];
    const cta = st === 'member' ? 'OPEN' : st === 'pending' ? 'PENDING' : c.public ? 'JOIN' : 'REQUEST';
    const primary = cta === 'JOIN';
    return `<div class="row" style="min-height:64px"><div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:6px"><span class="cond" style="font-size:20px;font-weight:800;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name.toUpperCase())}</span>${c.public ? '' : ICON.lock}</div>
      <span class="courier meta">${st === 'member' ? 'Your club' : st === 'pending' ? 'Request pending' : c.public ? 'Public' : 'Private'}</span></div>
      <button class="press cond small-btn" ${cta === 'PENDING' ? 'disabled' : act('clubCta', c.code)} style="${primary ? 'background:var(--accent);color:var(--onaccent)' : ''}">${cta}</button></div>`;
  }).join('') || `<div class="row"><span class="courier meta">${q ? 'No club by that name yet.' : 'No clubs yet — be the first.'}</span></div>`}</div>`}
  <button class="press cond mid-btn" ${act('go', 'createClub')} style="font-size:19px">${ICON.plus} CREATE A CLUB</button>
</div>`;
};
function requestSheet() {

SCREENS.createClub = () => {

// ════════════ Drawing ════════════
const $app = () => document.getElementById('app');
// The loading line always gets its moment (2.5s from opening), even when the app is ready sooner
const SPLASH_UNTIL = Date.now() + 2500;
function render() {
  const el = $app();
  if (Date.now() < SPLASH_UNTIL) {
    if (el.dataset.screen !== 'loading') { el.dataset.screen = 'loading'; el.innerHTML = `<div class="screen">${SCREENS.loading()}</div>`; }
    clearTimeout(render.t); render.t = setTimeout(render, SPLASH_UNTIL - Date.now() + 10); return;
  }
  const page = el.querySelector('.page, .fixedpage');
  const keep = page && el.dataset.screen === S.screen ? page.scrollTop : 0;
  const focus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.model;
  const caret = focus ? document.activeElement.selectionStart : null;
  document.body.classList.toggle('bigtext', !!S.settings.big);
  el.dataset.screen = S.screen;
  el.innerHTML = `<div class="screen">${(SCREENS[S.screen] || SCREENS.home)()}</div>`
    + (S.sheet ? `<div class="scrim" ${act('closeSheet')}></div><div class="sheet up"><div class="sheet-top"><span class="grab"></span></div>${SHEETS[S.sheet.name]()}</div>` : '')
    + (S.toast ? `<div class="toast fade ${S.toast.bad ? 'bad' : ''}">${esc(S.toast.text)}</div>` : '');
  const p2 = el.querySelector('.page, .fixedpage'); if (p2 && keep) p2.scrollTop = keep;
  if (focus) { const i = el.querySelector(`[data-model="${focus}"]`); if (i) { i.focus(); try { i.setSelectionRange(caret, caret); } catch (e) { /* ok */ } } }
  syncEnables();
}
// Redraw one marked part of the screen (a search's result list) without touching the text box you're typing in
function renderRegion(name) {
  const tmp = document.createElement('div');
  tmp.innerHTML = `<div class="screen">${(SCREENS[S.screen] || SCREENS.home)()}</div>` + (S.sheet ? `<div class="sheet">${SHEETS[S.sheet.name]()}</div>` : '');
  const fresh = tmp.querySelector(`[data-region="${name}"]:not(input)`), live = $app().querySelector(`[data-region="${name}"]:not(input)`);
  if (fresh && live) live.innerHTML = fresh.innerHTML; else render();
  syncEnables();
}
const getPath = p => p.split('.').reduce((o, k) => (o ? o[k] : undefined), S);
const setPath = (p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k] = o[k] || {}, S)[last] = v; };
function syncEnables() {
  $app().querySelectorAll('[data-enable]').forEach(b => { const v = getPath(b.dataset.enable); b.disabled = S.busy || !(v && String(v).trim()); });
}
function toast(text, bad = false) {
  S.toast = { text, bad }; render();
  clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 3200);
}
function go(screen, params = {}, push = true) {
  if (push && S.screen !== screen) S.stack.push({ screen: S.screen, params: S.params });
  S.screen = screen; S.params = params; S.sheet = null; S.info = null; S.q = '';
  if (screen === 'findClub') loadFound();
  render();
  const p = $app().querySelector('.page, .fixedpage'); if (p) p.scrollTop = 0;
}
function back() {
  const prev = S.stack.pop() || { screen: 'home', params: {} };
  S.screen = prev.screen; S.params = prev.params; S.sheet = null; S.info = null; S.draft = {}; S.q = '';
  render();
}
const buzz = () => { if (S.settings.haptic && navigator.vibrate) navigator.vibrate(8); };
const fail = e => { console.error(e); S.busy = false; toast(e && e.message ? e.message : 'Something went wrong — try again', true); };

// ════════════ Data ════════════
const withTimeout = (p, ms = 9000) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('offline')), ms))]);
async function loadClubs() {
  try { S.clubs = await withTimeout(FCab.myClubs()); Store.put('gb_clubs_' + S.user.uid, S.clubs); }
  catch (e) { S.clubs = Store.json('gb_clubs_' + S.user.uid, S.clubs || []); }
  if (S.online) for (const c of S.clubs) if (c.captain) { try { const r = await withTimeout(FCab.requests(c.code), 5000); c.requests = r.joins.length + r.claims.length; } catch (e) { /* ignore */ } }
  const saved = Store.getItem('gb_scope_' + S.user.uid);
  const ok = k => k === 'mine' || S.clubs.some(c => c.code === k && c.status === 'member');
  S.scope = ok(saved) ? saved : ((S.clubs.find(c => c.status === 'member') || {}).code || 'mine');
}
async function loadHome() {
  const key = 'gb_home_' + S.user.uid + '_' + S.scope;
  const cached = Store.json(key, null);
  S.home = cached ? { ...cached, loading: true } : { loading: true, rows: [], recent: [], games: 0 };
  render();
  try {
    const done = await loadScopeGames(true);
    if (!done) throw new Error('offline');
    const hist = Statistician.history(done);
    const recent = hist.length ? hist[0].games.concat(hist[1] ? hist[1].games : []).slice(0, 2) : [];
    S.home = { loading: false, rows: Statistician.standings(done).slice(0, 3), recent, games: done.length };
    Store.put(key, S.home);
  } catch (e) { S.home.loading = false; if (!cached) toast('Couldn’t load games — check your connection', true); }
  render();
}
async function loadFound() {
  S.foundLoading = !S.found.length; render();
  try { S.found = await FCab.findClubs(''); } catch (e) { toast('Couldn’t load clubs', true); }
  S.foundLoading = false; render();
}
async function afterSignIn(user) {
  Store.put('gb_last_user', { uid: user.uid, email: user.email, displayName: user.displayName });
  const sameAsCached = S.user && S.user.uid === user.uid && S.screen === 'home';
  S.user = user;
  FCab.setUser(user.uid);
  let acct = Store.json('gb_acct_' + user.uid, null);
  if (acct && !sameAsCached) {                 // known phone: open straight to Home from the saved copy
    S.account = acct; S.clubs = Store.json('gb_clubs_' + user.uid, []);
    S.scope = Store.getItem('gb_scope_' + user.uid) || 'mine';
    S.stack = []; S.screen = 'home'; S.home = Store.json('gb_home_' + user.uid + '_' + S.scope, S.home); render();
  }
  try { const fresh = await withTimeout(FCab.myAccount()); if (fresh) { acct = fresh; Store.put('gb_acct_' + user.uid, acct); } }
  catch (e) { /* offline: keep the copy on the phone */ }
  if (!acct) {
    S.setup = { name: (user.displayName || '').split(' ')[0].slice(0, 16), team: null, played: null };
    S.stack = []; S.screen = 'setupName'; render(); return;
  }
  S.account = acct;
  FCab.isAdmin().then(a => { S.admin = a; Store.setItem('gb_admin', a ? '1' : ''); }).catch(() => { S.admin = Store.getItem('gb_admin') === '1'; });
  if (S.screen !== 'home') { S.stack = []; S.screen = 'home'; render(); }
  await loadClubs();
  if (!S.g) { const lg = FCab.liveGame(); if (lg && !lg.ended && lg.host === user.uid) openGame(lg); }
  else if (!S.g.history) loadGameHistory();
  render();
  loadHome();
}

// ════════════ Taps ════════════
const ACT = {
  info: id => { S.info = S.info === id ? null : id; render(); },
  back, go: s => { S.draft = {}; go(s); },
  toast: t => toast(t),
  closeSheet: () => { S.sheet = null; render(); },
  openSheet: (name, arg) => { const [n, a] = name.split(':'); S.sheet = { name: n, arg: a !== undefined ? a : arg }; S.q = ''; render(); },
  tab: t => { S.stack = []; go(t === 'games' ? 'home' : t, {}, false); if (t === 'stats' && FCab) loadScopeGames(true); if (t === 'awards' && FCab && S.aw && S.aw.key === S.scope) loadAwards(); },
  signIn: async () => {
    if (!navigator.onLine) { S.offlineFirst = true; render(); return; }
    S.busy = true; render();
    // If the Google window never opens, don't leave the button stuck
    const unstick = setTimeout(() => { if (S.busy && S.screen === 'signin') { S.busy = false; render(); toast('Nothing opened? Tap Continue with Google again.'); } }, 12000);
    try { await FB.signIn(); }
    catch (e) {
      if (e.code === 'auth/popup-blocked') toast('The Google window was blocked — tap again', true);
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('Sign-in didn’t finish (' + (e.code || e.message) + ')', true);
    }
    clearTimeout(unstick); S.busy = false; render();
  },
  signOut: async () => {
    try { await FB.signOut(); } catch (e) { return toast('Sign out didn’t work: ' + (e.code || e.message), true); }
    S.user = null; S.account = null; S.admin = false; S.clubs = []; S.scope = null; S.stack = []; S.sheet = null; S.screen = 'signin'; render();
  },

  // setup
  setupNext: () => {
    if (S.screen === 'setupName') { if (!S.setup.name.trim()) return; S.q = ''; go('setupTeam'); }
    else if (S.screen === 'setupTeam') { S.q = ''; go('setupPlayed'); }
  },
  setupBack: () => back(),
  setupPickTeam: t => { S.setup.team = S.setup.team === t ? null : t; buzz(); render(); },
  setupSkipTeam: () => { S.setup.team = null; go('setupPlayed'); },
  setupPlayed: v => { S.setup.played = v; render(); },
  shareName: async () => {
    const text = `I'm on Guess Ball as ${S.setup.name.trim()} — you can link my guest games to my account.`;
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); toast('Copied — paste it in a text'); } } catch (e) { /* cancelled */ }
  },
  setupFinish: async () => {
    S.busy = true; render();
    try {
      await FCab.saveProfile({ name: S.setup.name.trim(), team: S.setup.team });
      S.account = { name: S.setup.name.trim(), team: S.setup.team };
      Store.put('gb_acct_' + S.user.uid, S.account);
      S.busy = false;
      const played = S.setup.played;
      S.stack = [];
      if (played === 'no') { S.screen = 'tutorial'; S.params = { card: 0, after: 'home' }; render(); }
      else { S.screen = 'home'; render(); }
      await loadClubs().catch(() => { S.scope = 'mine'; }); loadHome();
    } catch (e) { fail(e); }
  },

  // walkthrough
  tutNext: () => { S.params.card = Math.min(TUTORIAL.length - 1, (S.params.card || 0) + 1); render(); },
  tutPrev: () => { S.params.card = Math.max(0, (S.params.card || 0) - 1); render(); },
  tutDone: () => { if (S.params.from === 'settings') back(); else { S.stack = []; S.screen = 'home'; S.params = {}; render(); if (S.scope) loadHome(); } },
  howToPlay: () => go('tutorial', { card: 0, from: 'settings' }),

  // home + clubs
  newGame: () => toast('The live game arrives in test build 2.'),
  openSwitcher: async () => { S.sheet = { name: 'switcher' }; render(); if (FCab) loadClubs().then(render).catch(() => {}); },
  pickScope: k => { S.scope = k; Store.setItem('gb_scope_' + S.user.uid, k); S.sheet = null; buzz(); render(); if (FCab) loadHome(); else { S.home = Store.json('gb_home_' + S.user.uid + '_' + k, { rows: [], recent: [], games: 0 }); render(); } },
  clubCta: async code => {
    const c = S.found.find(x => x.code === code);
    const mine = S.clubs.find(x => x.code === code);
    if (mine && mine.status === 'member') return ACT.pickScope(code);
    if (!c.public) { S.draft = {}; S.sheet = { name: 'request', arg: code }; render(); return; }
    S.busy = true; render();
    try { await FCab.joinClub(code); await afterJoin(code, `You joined ${c.name}`); }
    catch (e) { S.busy = false; if (e.code === 'NAME_TAKEN') { S.draft = {}; S.sheet = { name: 'nickname', arg: code }; render(); } else fail(e); }
  },
  joinWithNick: async code => {
    S.busy = true; render();
    try { await FCab.joinClub(code, { nickname: S.draft.nick.trim() }); await afterJoin(code, 'You’re in!'); }
    catch (e) { S.busy = false; if (e.code === 'NAME_TAKEN') toast('That nickname is taken too', true); else fail(e); }
  },
  sendRequest: async code => {
    S.busy = true; render();
    try { await FCab.joinClub(code, { note: S.draft.note || '' }); S.busy = false; S.sheet = null; await loadClubs(); toast('Request sent — a captain will answer it'); }
    catch (e) { fail(e); }
  },
  setPriv: v => { S.draft.priv = v === 'private'; render(); },
  createClub: async () => {
    const name = (S.draft.club || '').trim(); if (!name) return;
    S.busy = true; S.draft.clubErr = ''; render();
    try { const code = await FCab.createClub(name, S.draft.priv === false); await afterJoin(code, `${name} is ready — you're the captain`); }
    catch (e) { S.busy = false; S.draft.clubErr = e.message; render(); }

// ── Wire up taps and typing once ──
function wire() {
  const el = $app();
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || !el.contains(b)) return;
    const fn = ACT[b.dataset.act];
    if (!fn) return;
    e.preventDefault();
    if (!FCab && !['info', 'back', 'go', 'toast', 'closeSheet', 'openSheet', 'tab', 'setting', 'howToPlay', 'tutNext', 'tutPrev', 'tutDone', 'openSwitcher', 'pickScope'].includes(b.dataset.act))
      return toast('Still connecting — try again in a moment');
    fn(b.dataset.arg, b);
  });
  el.addEventListener('input', e => {
    const i = e.target; if (!i.dataset || !i.dataset.model) return;
    setPath(i.dataset.model, i.value);
    const c = el.querySelector(`[data-count="${i.dataset.model}"]`); if (c) c.textContent = `${i.value.length}/16`;
    if (i.dataset.region) { clearTimeout(wire.t); wire.t = setTimeout(() => renderRegion(i.dataset.region), 90); }
    else if (i.dataset.rerender) render();
    else syncEnables();
  });
  let drag = null;
  el.addEventListener('touchstart', e => {
    const sh = e.target.closest('.sheet'); if (!sh || e.target.closest('input,textarea')) return;
    sh.style.animation = 'none';   // the slide-in animation would otherwise pin the sheet in place
    drag = { sh, y: e.touches[0].clientY, top: sh.scrollTop <= 0, dy: 0 };
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!drag) return;
    const y = e.touches[0].clientY; drag.v = y - (drag.last == null ? drag.y : drag.last); drag.last = y;
    drag.dy = y - drag.y;
    if (drag.top && drag.dy > 0 && drag.sh.scrollTop <= 0) { drag.sh.style.transform = `translateY(${drag.dy}px)`; drag.sh.style.transition = 'none'; }
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.top && d.dy > 90 && (d.v || 0) >= 0) { d.sh.style.transition = 'transform .18s ease-in'; d.sh.style.transform = 'translateY(100%)'; setTimeout(() => { S.sheet = null; render(); }, 170); }
    else { d.sh.style.transition = 'transform .2s'; d.sh.style.transform = ''; }
  });
  window.addEventListener('online', () => { S.offlineFirst = false; if (S.screen === 'signin') render(); });
}

  replay() { S.g.s = Umpire.replay({ players: S.g.game.players.map(p => p.name), priority: S.g.game.setup.priority }, S.g.game.events); },
  order: () => { const s = S.g.s; return [s.priority, ...s.players.map((_, i) => i).filter(i => i !== s.priority)]; },
  p3Next: () => G.order().find(i => !(i in S.g.pending.p3)),
  pickNext: () => Umpire.pickOrder(S.g.s).find(i => !S.g.pending.picks[i]),
  plays: () => S.g.game.events.filter(e => e.type === 'play').length,

  const firsts = Object.values(S.g.pending.p3).filter(Boolean).map(x => x[0]);

  const slot = mine.length;   // which at-bat is being chosen (0..2)

  ${done.map(j => { const x = S.g.pending.p3[j]; return `<div class="card" style="border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px">
    <span style="font-size:16px;font-weight:700">${esc(g.players[j].name)}</span><span class="shoulders" style="flex-grow:1;font-size:20px;font-weight:900">${x ? x.map(code).join(' · ') : '<span style="font-family:inherit;font-size:14px;font-weight:600;color:var(--text3)">Skipped</span>'}</span>
    <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:${x ? 'var(--green)' : 'var(--text4)'}">${x ? 'LOCKED' : 'SKIP'}</span></div>`; }).join('')}
  <h1 class="cond" style="margin:4px 0 0;font-size:36px;font-weight:800;line-height:1">${esc(p.name.toUpperCase())}, PICK 3</h1>
  ${info('p3why', '<span class="courier" style="font-size:13px;font-weight:700;color:var(--text2)">First three at-bats, in order</span>', 'Call the first three at-bats in order. All three right = +7 bonus. Miss one and you pick one at a time for the rest of the half-inning. Only your first call has to be different from everyone else’s.', '')}
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[0, 1, 2].map(k => `<button class="press" ${k < mine.length ? act('p3Unpick', k) : ''} style="height:76px;border-radius:16px;background:var(--card);border:2px solid ${k === slot ? 'var(--accent)' : 'transparent'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">AT-BAT ${k + 1}</span>
    <span class="shoulders" style="font-size:26px;font-weight:900;line-height:1;color:${mine[k] ? 'var(--text)' : 'var(--text4)'}">${mine[k] ? code(mine[k]) : '—'}</span></button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">${PICK_GRID.map(o => {

    return `<button class="press" ${blocked || slot > 2 ? 'disabled' : act('p3Pick', o)} style="height:56px;border-radius:12px;background:var(--card);padding:6px 9px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;${blocked ? 'opacity:.3' : ''}">
      <span class="shoulders" style="font-size:22px;font-weight:900;line-height:1">${code(o)}</span><span class="courier" style="font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap;overflow:hidden;max-width:100%">${blocked ? esc(owner) + '’s AB 1' : ptsOf(o) + (ptsOf(o) === 1 ? ' pt' : ' pts')}</span></button>`;
  }).join('')}</div>
  <div class="grow"></div>
  <div style="display:grid;grid-template-columns:120px 1fr;gap:10px">
    <button class="press cond mid-btn" style="height:56px;border-radius:28px" ${act('p3Skip')}>SKIP</button>
    <button class="big-btn cond press" style="height:56px" ${act('p3Lock')} ${mine.length === 3 ? '' : 'disabled'}>${mine.length === 3 ? 'LOCK IT IN' : 'CHOOSE AT-BAT ' + (slot + 1)}</button></div>
</div>`;
};

// ════════════ Make a pick ════════════
SCREENS.pick = () => {

// ════════════ What happened ════════════
