<style>
/* ── Theme: every color lives here, so light mode and accents are a swap, not a rewrite ── */
:root {
  --bg: #000000; --card: #1C1C1F; --card2: #2A2A2F; --card3: #3A3A40; --inner: #242428;
  --sheet: #161618; --sheetcard: #1F1F22; --grab: #48484E;
  --text: #F5F5F7; --text2: #A1A1AA; --text3: #8E8E96; --text4: #6E6E76; --text5: #C7C7CC;
  --line: #2A2A2F; --line2: #34343A;
  --accent: #2F6FE4; --onaccent: #FFFFFF; --link: #7AABFF;
  --gold: #F2C14E; --goldfill: #F2C14E; --green: #5BD27A; --orange: #FF8A65; --live: #FF5A4E; --livetext: #FF7B70;
  --cream: #F4F1E8; --swoosh: #D63A2F; --toggle: #34C759;

  --glass: rgba(22,22,26,0.7); --wash: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.4) 40%, rgba(0,0,0,.72) 100%);
}
/* Light mode (Settings → Appearance). Colors darkened so they read on white; gold fills stay bright. */
html[data-theme="light"] {
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #E6E6EB; --card3: #D5D5DC; --inner: #EDEDF1;
  --sheet: #F2F2F7; --sheetcard: #FFFFFF; --grab: #C7C7CC;
  --text: #111114; --text2: #55555D; --text3: #6A6A72; --text4: #8E8E96; --text5: #3A3A40;
  --line: #E4E4E9; --line2: #D8D8DE;
  --link: #1F5FD0;
  --gold: #A66F00; --goldfill: #EDB63D; --green: #17893D; --orange: #C8431A; --live: #C8331F; --livetext: #C8331F;
  --cream: #0E1F3D; --nav: rgba(255,255,255,0.86); --navpill: rgba(0,0,0,0.06); --scrim: rgba(0,0,0,0.3);
  --silver: #7E828C; --bronze: #A8642C;
  --popbg: #FFF7E2; --goldtint: #FFF3D6; --toastbg: #FFFFFF; --livebar: #FFFFFF; --tagline: #C7C7CC; --dim: #A1A1A8;
  --glass: rgba(255,255,255,0.88); --wash: linear-gradient(180deg, rgba(242,242,247,.24) 0%, rgba(242,242,247,.06) 45%, rgba(242,242,247,.3) 100%);
}
html[data-theme="light"] .tabbar { border-color: rgba(0,0,0,.06); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
html[data-theme="light"] .toast, html[data-theme="light"] .bubble { box-shadow: 0 10px 30px rgba(0,0,0,.14); }
/* Stadium photo behind the screen: cards turn to frosted glass so the park shows through */
#bg { position: fixed; top: 0; left: 0; right: 0; height: var(--apph, 100%); z-index: 0; background: var(--bg); background-size: cover; background-position: center; transition: opacity .35s; }
#bg::after { content: ""; position: absolute; inset: 0; background: var(--wash); display: none; }
#bg.on::after { display: block; }
#app { z-index: 1; }
/* Light mode: the clock stays white on iPhone, so a soft shade behind it keeps it readable */
html[data-theme="light"] body::after { content: ""; position: fixed; top: 0; left: 0; right: 0; height: calc(var(--safe-top) + 8px); z-index: 45; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,0)); }
#app.photo { --card: var(--glass); --inner: rgba(128,128,136,.14); }
/* Frosted cards (Appearance → Frosted cards). Only the big cards blur — not every button — to keep iPhones light. */
#app.photo.frost:not(.intro) .screen .card, #app.photo.frost:not(.intro) .screen .list { -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); }
#app.photo .screen .card, #app.photo .screen .list { box-shadow: none; }
/* Light mode on a photo: headings get their own little frosted pill so dark text reads on dark parks */
html[data-theme="light"] #app.photo .screen .page h2, html[data-theme="light"] #app.photo .screen .page .sechead, html[data-theme="light"] #app.photo .screen .onphoto, html[data-theme="light"] #app.photo .screen .fixedpage h2, html[data-theme="light"] #app.photo .screen .page > div > a {
  align-self: flex-start; width: fit-content; padding: 2px 12px; border-radius: 14px; background: var(--glass);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
/* On a photo, text that sits straight on the picture (not on a card) gets a soft shadow and a brighter grey, so it reads on bright parks */
#app.photo .screen .page, #app.photo .screen .fixedpage { text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.55); }
html[data-theme="light"] #app.photo .screen .page, html[data-theme="light"] #app.photo .screen .fixedpage { text-shadow: 0 0 1px rgba(255,255,255,.9), 0 0 4px rgba(255,255,255,.6); }
/* Light mode on a photo: no blurry glow on things that have their own pill; page titles get a pill too (build 14) */
html[data-theme="light"] #app.photo .screen :is(.onphoto, h1, .sechead, .page h2, .fixedpage h2) { text-shadow: none; }
html[data-theme="light"] #app.photo .screen :is(.page, .fixedpage, .topbar) h1:not(:is(.card, .list, .sheet) *) {
  width: fit-content; padding: 0 14px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
html[data-theme="light"] #app.photo .screen .onphoto { color: var(--text) !important; }
/* Light mode on a photo (build 18): the Final page's top block sits on one frosted card; buttons that aren't ready yet are solid, not see-through blue */
html[data-theme="light"] #app.photo .screen .finalhead { background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-radius: 24px; padding: 6px 14px 8px; text-shadow: none; }
html[data-theme="light"] #app.photo .screen .finalhead span { text-shadow: none; }
html[data-theme="light"] #app.photo .screen .big-btn:disabled { opacity: 1; background: var(--glass) !important; color: var(--text4) !important; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
#app.photo .screen :is(.card, .list, .chips, .seg, .field, .tabbar, .livebar, .dock, .swipe-ghost .card, button:not(.info-btn)) { text-shadow: none; }
#app.photo .screen :is(.meta, .info-btn):not(:is(.card, .list, .chips, .seg, .tabbar, .dock, .sheet, .swipe-ghost, button:not(.info-btn), .info-btn) *) {
  align-self: flex-start; width: fit-content; padding: 3px 10px !important; border-radius: 10px; background: var(--glass); color: var(--text2); text-shadow: none; line-height: 1.5;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
html[data-theme="light"] #app.photo .screen :is(.meta, .info-btn):not(:is(.card, .list, .chips, .seg, .tabbar, .dock, .sheet, .swipe-ghost, button:not(.info-btn), .info-btn) *) { color: var(--text); }

       -webkit-text-size-adjust: 100%; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }

@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

@keyframes rise { from { transform: translate3d(0,14px,0); opacity: 0 } to { transform: translate3d(0,0,0); opacity: 1 } }

.slide { animation: slide .3s cubic-bezier(.2,.8,.2,1) both; }
/* Loading line: the three dots light up one after another */

.dots i { font-style: normal; animation: dot 1.2s ease-in-out infinite; } .dots i:nth-child(2) { animation-delay: .2s } .dots i:nth-child(3) { animation-delay: .4s }

/* ── Layout ── */
#app { position: fixed; top: 0; left: 0; right: 0; height: var(--apph, 100%); max-width: 520px; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.page { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
        padding: calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 24px); display: flex; flex-direction: column; gap: 14px; }

  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - var(--bar) - 94px - var(--dock, 0px)), transparent calc(100% - var(--bar) - 66px - var(--dock, 0px)));
          mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - var(--bar) - 94px - var(--dock, 0px)), transparent calc(100% - var(--bar) - 66px - var(--dock, 0px))); }
/* Leave room for the LIVE bar so it never covers the bottom of a page */
.screen:has(.livebar) .page.tabbed { --dock: 56px; }
/* Split pages (Stats, Awards): the header stays put and only the data area scrolls, so its scroll bar starts at the data */
.page.split { overflow-y: hidden; padding-bottom: 0; -webkit-mask-image: none; mask-image: none; }
.page.split > [data-scroll] { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; position: relative;
  margin: 0 -20px; padding: 2px 20px calc(var(--bar) + 110px + var(--dock, 0px)); display: flex; flex-direction: column; gap: 14px;
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - var(--bar) - 94px - var(--dock, 0px)), transparent calc(100% - var(--bar) - 66px - var(--dock, 0px)));
          mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - var(--bar) - 94px - var(--dock, 0px)), transparent calc(100% - var(--bar) - 66px - var(--dock, 0px))); }
.page.split > [data-scroll] > * { flex-shrink: 0; min-width: 0; }

html[data-theme="light"] .picked { box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.35); }

.fixedpage { overscroll-behavior: contain; position: absolute; inset: 0; padding: calc(var(--safe-top) + 14px) 20px calc(var(--safe-bot) + 20px); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }

  -webkit-mask-image: linear-gradient(#000 calc(100% - 12px), transparent); mask-image: linear-gradient(#000 calc(100% - 12px), transparent); }

.grow { flex-grow: 1 !important; flex-shrink: 1 !important; }

.card { background: var(--card); border-radius: 18px; }

<script>
// Register the offline helper first thing, so the app can open with no signal
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

<script>
// ════════════════════════════════════════════════════════════════
//  GUESS BALL — one file, five sections:
//  1 Scorebook (the list of events in a game — lives inside each game)
//  2 Umpire (rules)  3 Statistician (stats + awards)
//  4 Filing Cabinet (saving/loading)  5 Screens
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
//  SECTION 2 — THE UMPIRE (game rules)
//  Pure functions only: no screen, no storage, no internet.
//  Give it the game setup + the scorebook (list of events) and it
//  works out everything about the game at that moment.
// ════════════════════════════════════════════════════════════════
const Umpire = (() => {

  // ── Outcome table (borrowed from v1.9) ──
  // pickable: players can choose it · outs: outs it adds · midAtBat: at-bat continues after it
  const OUTCOMES = [
    { id: 'strikeout',       label: 'STRIKEOUT',        pts: 1,  outs: 1, pickable: true  },
    { id: 'in_play_out',     label: 'IN PLAY OUT',      pts: 1,  outs: 1, pickable: true  },
    { id: 'double_play',     label: 'DOUBLE PLAY',      pts: 3,  outs: 2, pickable: true  },
    { id: 'fielders_choice', label: "FIELDER'S CHOICE", pts: 2,  outs: 1, pickable: true  },
    { id: 'bunt',            label: 'BUNT',             pts: 4,  outs: 0, pickable: true  },
    { id: 'walk',            label: 'WALK',             pts: 3,  outs: 0, pickable: true  },
    { id: 'hbp',             label: 'HBP',              pts: 3,  outs: 0, pickable: true  },
    { id: 'single',          label: 'SINGLE',           pts: 2,  outs: 0, pickable: true  },
    { id: 'double',          label: 'DOUBLE',           pts: 5,  outs: 0, pickable: true  },
    { id: 'triple',          label: 'TRIPLE',           pts: 10, outs: 0, pickable: true  },
    { id: 'home_run',        label: 'HOME RUN',         pts: 7,  outs: 0, pickable: true  },
    { id: 'stolen_base',     label: 'STOLEN BASE',      pts: 4,  outs: 0, pickable: true,  midAtBat: true },
    { id: 'caught_stealing', label: 'CAUGHT STEALING',  pts: 0,  outs: 1, pickable: false, midAtBat: true },
    { id: 'other',           label: 'OTHER',            pts: 0,  outs: 0, pickable: false },
  ];
  const BY_ID = Object.fromEntries(OUTCOMES.map(o => [o.id, o]));
  const PICKABLE = OUTCOMES.filter(o => o.pickable).map(o => o.id);

  const CONF_WIN = 5, CONF_LOSS = -2, P3_BONUS = 7;

  const outcome = id => BY_ID[id] || null;
  const halfKey = s => s.inning + (s.bottom ? 'b' : 't');

  // ── Fresh state for a new game ──
  function start(setup) {
    const n = setup.players.length;
    if (n < 2 || n > 3) throw new Error('Guess Ball needs 2 or 3 players');
    return {
      players: setup.players.slice(),
      scores: Array(n).fill(0),
      priority: setup.priority || 0,
      inning: 1, bottom: false, outs: 0,
      ab: 1,                 // at-bat number within this half-inning
      p3: null,              // { picks:[[a,b,c]|null…], alive:[bool…], hits:[n…] } — set by a pick3 event
      needsPick3: true,      // a Pick 3 round is owed at the start of every half-inning
      carried: {},           // manual picks that still stand after a steal: { playerIdx: {pick, conf} }
      sittingOut: [],        // players whose pick already resolved during this at-bat (called the steal)
      mlb: { away: 0, home: 0 },
      ended: false,
      log: [],               // one entry per resolved pick
      plays: [],             // one entry per result entered
    };
  }

  // Is this player playing Pick 3 on the current at-bat?
  function p3Live(s, i) {
    return !!(s.p3 && s.p3.picks[i] && s.p3.alive[i] && s.ab <= 3);
  }
  function p3PickNow(s, i) {
    return p3Live(s, i) ? s.p3.picks[i][s.ab - 1] : null;
  }

  // Players who still need to make a manual pick this at-bat, priority first, then seat order.
  // (Skips Pick 3 players, steal-callers sitting out, and picks carried over after a steal.)
  function pickOrder(s) {
    const order = [s.priority, ...s.players.map((_, i) => i).filter(i => i !== s.priority)];
    return order.filter(i => !p3Live(s, i) && !s.sittingOut.includes(i) && !s.carried[i]);
  }

  // Picks already locked for this at-bat (Pick 3 picks + steal carry-overs).
  function lockedPicks(s) {
    const locked = {};
    s.players.forEach((_, i) => {
      if (s.sittingOut.includes(i)) return;
      const p = p3PickNow(s, i);
      if (p) locked[i] = { pick: p, conf: false, fromP3: true };
      else if (s.carried[i]) locked[i] = { ...s.carried[i], fromP3: false };
    });
    return locked;
  }

  // Outcomes a player may NOT choose, given picks made so far this at-bat.
  function blocked(s, player, manualSoFar = {}) {
    const all = { ...lockedPicks(s), ...manualSoFar };
    return Object.entries(all).filter(([i]) => +i !== player).map(([, v]) => v.pick);
  }

  // Pick 3: only slot 1 must differ between players.
  function blockedP3First(p3SoFar, player) {
    return Object.entries(p3SoFar)
      .filter(([i, picks]) => +i !== player && picks && picks[0])
      .map(([, picks]) => picks[0]);
  }

  // ── Event handlers ──
  function applyPick3(s, ev) {
    if (!s.needsPick3) throw new Error('Pick 3 already made this half-inning');
    const firsts = new Set();
    const picks = ev.picks || [];      // everyone skipped: Firebase doesn't keep an empty list
    s.players.forEach((_, i) => {
      const p = picks[i];
      if (p == null) return; // skipped
      if (!Array.isArray(p) || p.length !== 3 || !p.every(x => PICKABLE.includes(x)))
        throw new Error('Pick 3 must be three valid outcomes');
      if (firsts.has(p[0])) throw new Error('Pick 3 first outcomes must all be different');
      firsts.add(p[0]);
    });
    s.p3 = {
      picks: s.players.map((_, i) => picks[i] || null),
      alive: s.players.map((_, i) => !!picks[i]),
      hits: s.players.map(() => 0),
    };
    s.needsPick3 = false;
  }

  function applyPlay(s, ev) {
    if (s.ended) throw new Error('Game is over');
    if (s.needsPick3) throw new Error('Pick 3 comes first this half-inning');
    if (s.outs >= 3) throw new Error('Three outs — start the next half-inning');
    const oc = outcome(ev.outcome);
    if (!oc) throw new Error('Unknown outcome ' + ev.outcome);
    const runs = ev.runs || 0, extraOuts = ev.extraOuts || 0;

    // Gather every pick standing on this at-bat and validate it.
    const picks = lockedPicks(s);
    const manual = ev.picks || {};
    const needed = pickOrder(s);
    needed.forEach(i => {
      if (!manual[i] || !PICKABLE.includes(manual[i].pick)) throw new Error(s.players[i] + ' has no pick');
    });
    Object.keys(manual).filter(i => manual[i] != null).forEach(i => {   // (a list from Firebase can have empty spots for players who didn't pick)
      if (!needed.includes(+i)) throw new Error(s.players[i] + ' should not be picking now');
      picks[i] = { pick: manual[i].pick, conf: !!manual[i].conf, fromP3: false };
    });
    const seen = new Set();
    Object.values(picks).forEach(p => {
      if (seen.has(p.pick)) throw new Error('Two players picked ' + p.pick);
      seen.add(p.pick);
    });

    const before = { priority: s.priority, scores: s.scores.slice() };
    const resolve = (i, correct) => {
      const p = picks[i];
      const base = correct ? oc.pts + runs : 0;
      const confPts = p.conf ? (correct ? CONF_WIN : CONF_LOSS) : 0;
      let p3Bonus = 0;
      if (p.fromP3) {
        if (correct) {
          s.p3.hits[i]++;
          if (s.ab === 3 && s.p3.hits[i] === 3) p3Bonus = P3_BONUS;
        } else s.p3.alive[i] = false;
      }
      const pts = base + confPts + p3Bonus;
      s.scores[i] += pts;
      s.log.push({ half: halfKey(s), ab: s.ab, player: i, pick: p.pick, conf: p.conf, fromP3: p.fromP3,
                   outcome: oc.id, runs, correct, pts, base, confPts, p3Bonus, hadPriority: before.priority === i });
      if (correct && i !== s.priority) s.priority = i;
    };

    const endsAtBat = !oc.midAtBat;
    const newOuts = s.outs + oc.outs + extraOuts;
    const halfOverMidAtBat = oc.midAtBat && newOuts >= 3; // caught stealing for out #3

    if (oc.id === 'stolen_base') {
      // Only the steal-caller resolves; everyone else's pick stands.
      const caller = Object.keys(picks).find(i => picks[i].pick === 'stolen_base');
      // (Pick 3 picks don't need carrying — they're re-read from the Pick 3 card.)
      Object.keys(picks).forEach(i => {
        if (+i !== +caller && !picks[i].fromP3) s.carried[i] = { pick: picks[i].pick, conf: picks[i].conf };
      });
      if (caller !== undefined) { resolve(+caller, true); s.sittingOut.push(+caller); }
    } else if (oc.id === 'caught_stealing') {
      // Nothing resolves; picks stand unless the inning just ended.
      Object.keys(picks).forEach(i => { if (!picks[i].fromP3) s.carried[i] = { pick: picks[i].pick, conf: picks[i].conf }; });
    } else {
      Object.keys(picks).forEach(i => resolve(+i, picks[i].pick === oc.id));
    }

    // Runs count toward the real MLB score for whichever team is batting (top = away, bottom = home).
    // Runs on a voided at-bat (caught stealing for out #3) still happened in the real game.
    if (runs) s.mlb[s.bottom ? 'home' : 'away'] += runs;

    s.outs = Math.min(3, newOuts);
    if (endsAtBat || halfOverMidAtBat) {
      // At-bat over: Pick 3 players who sat out after a correct steal keep their hit.
      s.carried = {}; s.sittingOut = [];
      if (endsAtBat) s.ab++;
    }
    s.plays.push({ half: halfKey(s), outcome: oc.id, runs, extraOuts,
                   priorityBefore: before.priority, priorityAfter: s.priority,
                   scoresBefore: before.scores, scoresAfter: s.scores.slice(), outsAfter: s.outs,
                   voided: halfOverMidAtBat });
  }

  function applyNextHalf(s) {
    if (s.ended) throw new Error('Game is over');
    if (s.bottom) { s.inning++; s.bottom = false; } else s.bottom = true;
    s.outs = 0; s.ab = 1; s.p3 = null; s.needsPick3 = true; s.carried = {}; s.sittingOut = [];
  }

  function apply(s, ev) {
    switch (ev.type) {
      case 'pick3':    applyPick3(s, ev); break;
      case 'play':     applyPlay(s, ev); break;
      case 'nextHalf': applyNextHalf(s); break;
      case 'mlb':      s.mlb = { away: ev.away | 0, home: ev.home | 0 }; break;
      case 'end':      s.ended = true; break;
      default: throw new Error('Unknown event ' + ev.type);
    }
    return s;
  }

  // Replay the whole scorebook from the start. Undo = drop the last event and replay.
  function replay(setup, events) {
    const s = start(setup);
    events.forEach(ev => apply(s, ev));
    return s;
  }

  // Would the real MLB game be over? (home leads after top 9+ is done, or away leads after bottom 9+)
  function mlbGameOver(s) {
    if (s.inning < 9) return false;
    if (s.bottom && s.mlb.home > s.mlb.away) return true;                 // walk-off / home leads
    if (s.bottom && s.outs >= 3 && s.mlb.away > s.mlb.home) return true;  // away wins
    if (!s.bottom && s.outs >= 3 && s.mlb.home > s.mlb.away) return true; // home leads after top 9+: no bottom half
    return false;
  }

  // Final result, ties handled.
  function result(s) {
    const top = Math.max(...s.scores);
    const leaders = s.scores.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
    return { tie: leaders.length > 1, winner: leaders.length === 1 ? leaders[0] : null, scores: s.scores.slice() };
  }

  return { OUTCOMES, PICKABLE, outcome, start, apply, replay, pickOrder, lockedPicks, blocked,
           blockedP3First, p3Live, p3PickNow, mlbGameOver, result, CONF_WIN, CONF_LOSS, P3_BONUS };
})();



// ════════════════════════════════════════════════════════════════
//  SECTION 3 — THE STATISTICIAN (stats and awards)
//  Pure functions only: no screen, no storage, no internet.
//  Give it a list of games and it works out standings, history,
//  records, head-to-head, game summaries and every award — always
//  from scratch, so a deleted or fixed game can never leave stale
//  numbers behind.
//
//  A game looks like this:
//  { id, date: '2026-09-25', seq: 1790000000000 (sort order within a day),
//    era: 'app' | 'beta' | 'preapp' | 'hand',
//    players: [{ id, name }, …]  (seat order, 2–3 players),
//    scores: [41, 29]            (final scores; app games get them from the events),
//    away, home, park, mlb: { away, home } | null, note, addedBy,
//    setup: { priority }, events: [...]   (app games only — the scorebook),
//    ended: true | false,                  (false = live game in progress)
//    beta: [{ correct, picks, confRight, confWrong }, …]  (beta games only) }
// ════════════════════════════════════════════════════════════════
const Statistician = (() => {
  const U = (typeof Umpire !== 'undefined') ? Umpire : require('./umpire.js');

  // ── Small helpers ──
  const byTime = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));
  const chrono = games => games.slice().sort(byTime);
  const season = g => +g.date.slice(0, 4);
  const hasPlays = g => g.era === 'app';
  const hasPickData = g => g.era === 'app' || g.era === 'beta';
  const CODES = { strikeout: 'K', in_play_out: 'IPO', double_play: 'DP', fielders_choice: 'FC', bunt: 'BU',
    walk: 'BB', hbp: 'HBP', single: '1B', double: '2B', triple: '3B', home_run: 'HR', stolen_base: 'SB',
    caught_stealing: 'CS', other: 'OTH' };
  const WORDS = { strikeout: 'strikeout', in_play_out: 'in-play out', double_play: 'double play',
    fielders_choice: "fielder's choice", bunt: 'bunt', walk: 'walk', hbp: 'hit by pitch', single: 'single',
    double: 'double', triple: 'triple', home_run: 'HR', stolen_base: 'steal' };
  const halfLabel = h => (h.endsWith('t') ? 'Top ' : 'Bot ') + parseInt(h, 10);
  const pct = (a, b) => (b ? a / b : null);

  // ── Who won: the one top score wins; a shared top score is a tie between those players ──
  function result(g) {
    const s = scoresOf(g);
    const top = Math.max(...s);
    const leaders = s.map((v, i) => (v === top ? i : -1)).filter(i => i >= 0);
    const sorted = s.slice().sort((a, b) => b - a);
    return { scores: s, tie: leaders.length > 1, leaders, winner: leaders.length === 1 ? leaders[0] : null,
             margin: sorted[0] - sorted[1] };
  }
  // Each player's outcome in a game: 'W', 'L' or 'T' (tied for the top score).
  function outcomeFor(g, i) {
    const r = result(g);
    if (r.winner === i) return 'W';
    if (r.tie && r.leaders.includes(i)) return 'T';
    return 'L';
  }
  const seatOf = (g, pid) => g.players.findIndex(p => p.id === pid);

  // ════════════════════════════════════════════════════════════
  //  GAME REPLAY — runs an app game's scorebook through the Umpire
  //  once and records everything the stats and awards need.
  // ════════════════════════════════════════════════════════════
  const cache = new WeakMap();
  function replay(g) {
    if (!hasPlays(g)) return null;
    const hit = cache.get(g);
    if (hit && hit.n === g.events.length) return hit.r;
    const n = g.players.length;
    const s = U.start({ players: g.players.map(p => p.name), priority: (g.setup && g.setup.priority) || 0 });
    const plays = [];      // one entry per play event: { ev, index, half, log:[…], scoresBefore, scoresAfter, … }
    const halves = [];     // one entry per half-inning played: { half, pts:[…], picks:[…], right:[…], complete }
    let half = null;
    g.events.forEach((ev, index) => {
      const before = { scores: s.scores.slice(), priority: s.priority, ab: s.ab, half: s.inning + (s.bottom ? 'b' : 't'),
                       logLen: s.log.length };
      U.apply(s, ev);
      if (ev.type === 'pick3' || (ev.type === 'play' && !half)) {
        if (!half || half.half !== before.half) {
          half = { half: before.half, pts: Array(n).fill(0), picks: Array(n).fill(0), right: Array(n).fill(0),
                   complete: false, priorityChanged: false, priorityStart: before.priority };
          halves.push(half);
        }
      }
      if (ev.type !== 'play') return;
      const log = s.log.slice(before.logLen);
      const last = s.plays[s.plays.length - 1];
      log.forEach(e => {
        half.pts[e.player] += e.pts; half.picks[e.player]++; if (e.correct) half.right[e.player]++;
      });
      if (last.priorityAfter !== before.priority) half.priorityChanged = true;
      const endsAtBat = !U.outcome(ev.outcome).midAtBat || last.voided;
      if (s.outs >= 3) half.complete = true;
      plays.push({ ev, index, half: before.half, ab: before.ab, log, outcome: ev.outcome, runs: ev.runs || 0,
                   scoresBefore: before.scores, scoresAfter: s.scores.slice(),
                   priorityBefore: before.priority, priorityAfter: last.priorityAfter,
                   endsAtBat, halfComplete: s.outs >= 3, voided: last.voided });
    });
    const r = { state: s, plays, halves, scores: s.scores.slice(), ended: !!s.ended || g.ended === true };
    cache.set(g, { n: g.events.length, r });
    return r;
  }
  const scoresOf = g => (hasPlays(g) ? replay(g).scores : g.scores);

  // Per-player numbers for one game (accuracy, confidence, Pick 3, best streak, line score…)
  function gameNumbers(g) {
    const n = g.players.length;
    const out = g.players.map(() => ({ picks: 0, right: 0, confRight: 0, confWrong: 0, p3: 0, bestStreak: 0 }));
    if (g.era === 'beta') {
      g.beta.forEach((b, i) => Object.assign(out[i], { picks: b.picks, right: b.correct,
        confRight: b.confRight || 0, confWrong: b.confWrong || 0, bestStreak: null, p3: null }));
      return out;
    }
    if (!hasPlays(g)) return null;
    const cur = Array(n).fill(0);
    replay(g).plays.forEach(p => p.log.forEach(e => {
      const o = out[e.player];
      o.picks++; if (e.correct) o.right++;
      if (e.conf) (e.correct ? o.confRight++ : o.confWrong++);
      if (e.p3Bonus) o.p3++;
      cur[e.player] = e.correct ? cur[e.player] + 1 : 0;
      o.bestStreak = Math.max(o.bestStreak, cur[e.player]);
    }));
    return out;
  }

  // Points per player per inning — the line score. Returns { innings:[1..N], rows:[[…per inning]], totals }
  function lineScore(g) {
    if (!hasPlays(g)) return null;
    const r = replay(g);
    const last = r.halves.length ? parseInt(r.halves[r.halves.length - 1].half, 10) : 1;
    const innings = Array.from({ length: Math.max(9, last) }, (_, i) => i + 1);
    const rows = g.players.map(() => innings.map(() => null));
    r.halves.forEach(h => {
      const inn = parseInt(h.half, 10);
      h.pts.forEach((v, i) => { rows[i][inn - 1] = (rows[i][inn - 1] || 0) + v; });
    });
    return { innings, rows, totals: r.scores.slice() };
  }

  // ════════════════════════════════════════════════════════════
  //  STANDINGS — W / L / T per player, with win %, avg points, accuracy
  //  opts.season: a year (number) or omitted for all time
  // ════════════════════════════════════════════════════════════
  function standings(games, opts = {}) {
    const rows = {};
    chrono(games).filter(g => g.ended !== false && (!opts.season || season(g) === opts.season)).forEach(g => {
      const nums = gameNumbers(g);
      g.players.forEach((p, i) => {
        const r = rows[p.id] || (rows[p.id] = { id: p.id, name: p.name, w: 0, l: 0, t: 0, games: 0, points: 0,
                                                 picks: 0, right: 0, first: g.date });
        r.name = p.name;
        r[outcomeFor(g, i).toLowerCase()]++; r.games++; r.points += scoresOf(g)[i];
        if (nums) { r.picks += nums[i].picks; r.right += nums[i].right; }
      });
    });
    return Object.values(rows).map(r => ({ ...r,
      winPct: pct(r.w, r.games), avgPts: pct(r.points, r.games), accuracy: pct(r.right, r.picks) }))
      .sort((a, b) => b.w - a.w || a.l - b.l || b.games - a.games || a.name.localeCompare(b.name));
  }
  // Seasons that have games, newest first (for the season dropdown)
  const seasons = games => [...new Set(games.map(season))].sort((a, b) => b - a);

  // ════════════════════════════════════════════════════════════
  //  HISTORY — games grouped by season, newest first, with tags
  // ════════════════════════════════════════════════════════════
  function history(games) {
    const list = chrono(games.filter(g => g.ended !== false));
    // Doubleheaders: same day + same matchup → "Game 1", "Game 2"
    const groups = {};
    list.forEach(g => { const k = g.date + '|' + (g.away || '') + '|' + (g.home || '');
                        (groups[k] = groups[k] || []).push(g); });
    const label = new Map();
    Object.values(groups).forEach(gs => { if (gs.length > 1) gs.forEach((g, i) => label.set(g, 'Game ' + (i + 1))); });
    const bySeason = {};
    list.slice().reverse().forEach(g => {
      const r = result(g);
      const order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
      (bySeason[season(g)] = bySeason[season(g)] || []).push({
        id: g.id, date: g.date, era: g.era, tag: g.tv ? 'COUCH GAME' : { preapp: 'PRE-APP', beta: 'BETA', hand: 'ADDED BY ' + (g.addedBy || '').toUpperCase(), app: '' }[g.era],
        doubleheader: label.get(g) || '', tie: r.tie,
        players: order.map(i => ({ id: g.players[i].id, name: g.players[i].name, score: r.scores[i], outcome: outcomeFor(g, i) })),
        away: g.away || '', home: g.home || '', park: g.tv ? 'Couch game' : (g.park || ''), mlb: g.mlb || null,
      });
    });
    return Object.keys(bySeason).sort((a, b) => b - a).map(y => ({ season: +y, games: bySeason[y] }));
  }

  // ════════════════════════════════════════════════════════════
  //  RECORDS — the all-time record cards
  // ════════════════════════════════════════════════════════════
  function records(games) {
    const list = chrono(games.filter(g => g.ended !== false));
    if (!list.length) return [];
    // Each record keeps every offer so it can show a top 5; `key` merges offers that are the same feat
    // (a win streak grows game by game — it's one entry, at its longest).
    const best = (label, better) => {
      const all = [], byKey = {};
      return { offer(value, who, g, extra, key) {
                 const e = { label, value, who, date: g && g.date, gameId: g && g.id, extra };
                 if (key) { const k = byKey[key]; if (k) { if (better(value, k.value)) Object.assign(k, e); return; } byKey[key] = e; }
                 all.push(e); },
               get: () => { if (!all.length) return null;
                 const sorted = all.map((e, i) => [e, i]).sort((x, y) => (better(x[0].value, y[0].value) ? -1 : better(y[0].value, x[0].value) ? 1 : x[1] - y[1])).map(x => x[0]);
                 return { ...sorted[0], top: sorted.slice(0, 5).map(({ value, who, date, gameId, extra }) => ({ value, who, date, gameId, extra })) }; } };
    };
    const hi = best('HIGHEST SCORE', (a, b) => a > b), lo = best('LOWEST SCORE', (a, b) => a < b);
    const win = best('BIGGEST WIN', (a, b) => a > b), acc = best('BEST ACCURACY', (a, b) => a > b);
    const halfRec = best('BEST HALF-INNING', (a, b) => a > b), comeback = best('BIGGEST COMEBACK', (a, b) => a > b);
    const pickStreak = best('LONGEST PICK STREAK', (a, b) => a > b);
    const run = {}, runStart = {}, streak = best('WIN STREAK', (a, b) => a > b);
    list.forEach(g => {
      const r = result(g), nums = gameNumbers(g);
      g.players.forEach((p, i) => {
        hi.offer(r.scores[i], p.name, g); lo.offer(r.scores[i], p.name, g);
        const o = outcomeFor(g, i);
        run[p.id] = o === 'W' ? (run[p.id] || 0) + 1 : 0;
        if (run[p.id] === 1) runStart[p.id] = g.id;
        if (run[p.id]) streak.offer(run[p.id], p.name, g, undefined, p.id + ':' + runStart[p.id]);
        if (nums && nums[i].picks >= 10) acc.offer(nums[i].right / nums[i].picks, p.name, g, { picks: nums[i].picks });
        if (nums && nums[i].bestStreak) pickStreak.offer(nums[i].bestStreak, p.name, g);
      });
      if (r.winner !== null) {
        const loser = r.scores.map((v, i) => i).filter(i => i !== r.winner).sort((a, b) => r.scores[b] - r.scores[a])[0];
        win.offer(r.margin, g.players[r.winner].name, g, { score: r.scores[r.winner], loserScore: r.scores[loser], loser: g.players[loser].name });
      }
      if (hasPlays(g)) {
        replay(g).halves.forEach(h => h.pts.forEach((v, i) => halfRec.offer(v, g.players[i].name, g, { half: h.half })));
        const d = deficits(g);
        if (r.winner !== null && d[r.winner] > 0) comeback.offer(d[r.winner], g.players[r.winner].name, g);
      }
    });
    const st = standings(list);
    const mostWins = st.slice().sort((a, b) => b.w - a.w)[0];
    const mostGames = st.slice().sort((a, b) => b.games - a.games)[0];
    const ys = seasons(list);
    const topOf = (rows, f) => rows.slice().sort((a, b) => f(b) - f(a)).slice(0, 5).map(r => ({ value: f(r), who: r.name }));
    const out = [hi.get(), win.get(), streak.get() || { label: 'WIN STREAK', value: 0, who: '—', top: [] },
      { label: 'MOST WINS', value: mostWins.w, who: mostWins.name, top: topOf(st, r => r.w) },
      acc.get(), lo.get(),
      { label: 'MOST GAMES', value: mostGames.games, who: mostGames.name, since: season({ date: mostGames.first }), top: topOf(st, r => r.games) },
      { label: 'SEASONS', value: ys.length, from: ys[ys.length - 1], to: ys[0] }];
    // In-game records appear once there is at least one new-app game
    [halfRec.get(), comeback.get(), pickStreak.get()].forEach(x => { if (x) out.push(x); });
    return out.filter(Boolean);
  }

  // Biggest deficit each player faced (behind the leader) at any point in an app game
  function deficits(g) {
    const r = replay(g);
    const d = g.players.map(() => 0);
    r.plays.forEach(p => p.scoresAfter.forEach((v, i) => {
      const others = p.scoresAfter.filter((_, j) => j !== i);
      d[i] = Math.max(d[i], Math.max(...others) - v);
    }));
    return d;
  }

  // ════════════════════════════════════════════════════════════
  //  HEAD TO HEAD — a vs b
  //  Only the overall winner of a game beats the others; a tie, or a
  //  game a third player won, doesn't count for either side.
  // ════════════════════════════════════════════════════════════
  function h2h(games, a, b) {
    const list = chrono(games.filter(g => g.ended !== false && seatOf(g, a) >= 0 && seatOf(g, b) >= 0));
    const res = [];   // 'a' | 'b' per decided game
    const side = { a: { pts: 0, bestWin: null, longest: 0 }, b: { pts: 0, bestWin: null, longest: 0 } };
    let runA = 0, runB = 0;
    list.forEach(g => {
      const ia = seatOf(g, a), ib = seatOf(g, b), r = result(g);
      side.a.pts += r.scores[ia]; side.b.pts += r.scores[ib];
      let w = null;
      if (r.winner === ia) w = 'a'; else if (r.winner === ib) w = 'b';
      if (!w) return;
      res.push({ w, gameId: g.id, date: g.date });
      const m = w === 'a' ? r.scores[ia] - r.scores[ib] : r.scores[ib] - r.scores[ia];
      if (side[w].bestWin === null || m > side[w].bestWin) side[w].bestWin = m;
      if (w === 'a') { runA++; runB = 0; } else { runB++; runA = 0; }
      side.a.longest = Math.max(side.a.longest, runA); side.b.longest = Math.max(side.b.longest, runB);
    });
    const wa = res.filter(x => x.w === 'a').length, wb = res.length - wa;
    const lastW = res.length ? res[res.length - 1].w : null;
    let cur = 0; for (let i = res.length - 1; i >= 0 && res[i].w === lastW; i--) cur++;
    return {
      a: { wins: wa, avg: pct(side.a.pts, list.length), bestWin: side.a.bestWin, longest: side.a.longest,
           current: lastW === 'a' ? cur : 0 },
      b: { wins: wb, avg: pct(side.b.pts, list.length), bestWin: side.b.bestWin, longest: side.b.longest,
           current: lastW === 'b' ? cur : 0 },
      games: list.length, since: list.length ? season(list[0]) : null,
      leader: wa > wb ? 'a' : wb > wa ? 'b' : null,
      last10: res.slice(-10).map(x => x.w),
    };
  }
  // Everyone a player has faced, with game counts (for the second H2H picker)
  function opponents(games, pid) {
    const c = {};
    games.forEach(g => { if (g.ended === false || seatOf(g, pid) < 0) return;
      g.players.forEach(p => { if (p.id !== pid) c[p.id] = { id: p.id, name: p.name, games: ((c[p.id] || {}).games || 0) + 1 }; }); });
    return Object.values(c).sort((x, y) => y.games - x.games);
  }

  // ════════════════════════════════════════════════════════════
  //  GAME SUMMARY — everything the Final and Past game screens show
  // ════════════════════════════════════════════════════════════
  function summary(g, allGames) {
    const r = result(g), nums = gameNumbers(g);
    const out = { id: g.id, result: r, players: g.players, lineScore: lineScore(g), tiles: null, plays: [], series: null, winNumber: null };
    if (nums) {
      const acc = nums.map(x => pct(x.right, x.picks));
      out.tiles = [
        { label: 'ACCURACY', values: acc, lead: leadOf(acc) },
        { label: 'PICK 3 BONUSES', values: nums.map(x => x.p3), lead: leadOf(nums.map(x => x.p3)) },
        { label: 'CONFIDENCE', values: nums.map(x => [x.confRight, x.confWrong]), lead: leadOf(nums.map(x => x.confRight - x.confWrong)) },
        { label: 'BEST STREAK', values: nums.map(x => x.bestStreak), lead: leadOf(nums.map(x => x.bestStreak)) },
      ].filter(t => t.values.every(v => v !== null && v !== undefined));
    }
    if (hasPlays(g)) out.plays = bigPlays(g);
    if (allGames && g.players.length === 2) {
      const before = allGames.filter(x => byTime(x, g) <= 0 || x === g);
      out.series = h2h(before.includes(g) ? before : before.concat(g), g.players[0].id, g.players[1].id);
    }
    if (allGames && r.winner !== null) {
      const wid = g.players[r.winner].id;
      out.winNumber = chrono(allGames.concat(allGames.includes(g) ? [] : [g])).filter(x => byTime(x, g) <= 0 && x.ended !== false)
        .filter(x => { const i = seatOf(x, wid); return i >= 0 && outcomeFor(x, i) === 'W'; }).length;
    }
    return out;
  }
  const leadOf = vals => { const m = Math.max(...vals.map(v => (v === null ? -Infinity : v)));
    const at = vals.map((v, i) => (v === m ? i : -1)).filter(i => i >= 0); return at.length === 1 ? at[0] : null; };

  // The biggest at-bats of the game, best first. Each: { player, pts, code, text, when, context, half }
  function bigPlays(g) {
    const r = replay(g), list = [];
    // Pick 3 bonuses are one "play" covering the three at-bats
    r.plays.forEach(p => p.log.forEach(e => {
      if (e.p3Bonus) {
        const picks = r.plays.filter(q => q.half === p.half).flatMap(q => q.log).filter(x => x.player === e.player && x.fromP3 && x.correct);
        const pts = picks.reduce((a, x) => a + x.pts, 0);
        list.push(mk(p, e.player, pts, 'P3', `${g.players[e.player].name} hit Pick 3 (${picks.map(x => CODES[x.pick]).join(' · ')})`));
      } else if (e.correct && !e.fromP3 && e.pts >= 4) {
        const runs = e.runs ? `${e.runs}-run ` : '';
        list.push(mk(p, e.player, e.pts, CODES[e.outcome],
          `${g.players[e.player].name} called a ${runs}${WORDS[e.outcome]}${e.conf ? ' with confidence' : ''}`));
      }
    }));
    function mk(p, i, pts, code, text) {
      const bef = p.scoresBefore, aft = p.scoresAfter;
      const lead = (s, k) => s[k] - Math.max(...s.filter((_, j) => j !== k));
      const lb = lead(bef, i), la = lead(aft, i);
      const context = lb <= 0 && la > 0 ? 'took the lead' : lb < 0 && la === 0 ? 'tied it'
        : lb > 0 && la > lb ? 'went up by ' + la : la < 0 ? 'cut it to ' + (-la) : '';
      return { player: i, pts, code, text, when: halfLabel(p.half), context, half: p.half, index: p.index };
    }
    return list.sort((a, b) => b.pts - a.pts || a.index - b.index).slice(0, 5);
  }

  // Works through every game in order and records when each player earned each award.
  // Returns { [playerId]: { earned: { [awardId]: [{ tier, gameId, date, at }] }, counts: { [awardId]: n } } }
  //   at = index of the scorebook event that earned it (null = at the end of the game / final score)
  // Give it ALL of a player's games (across clubs) — awards are per person.
  const bookCache = new WeakMap();           // the Awards tab asks many questions of the same games
  function awardBook(games) {
    if (bookCache.has(games)) return bookCache.get(games);
    const book = {};
    const P = id => book[id] || (book[id] = {
      earned: {}, counts: {}, games: 0, wins: 0, points: 0, parks: {}, seasons: new Set(),
      vs: {}, lastLossTo: null, confRun: 0, p3Run: 0, confUsed: false, dates: {}, seasonGames: {},
    });
    const give = (pid, g, id, tier = 1, at = null) => {
      const e = P(pid).earned[id] || (P(pid).earned[id] = []);
      if (e.some(x => x.tier === tier)) return;
      e.push({ tier, gameId: g.id, date: g.date, at });

//  SECTION 4 — THE FILING CABINET (saving and loading)
//  The ONLY code that touches Firebase or the phone's storage.
//  Screens ask it for things ("load the Dodgers' games", "save this
//  play") and never talk to Firebase themselves.
//
//  Offline: every change goes into an outbox kept on the phone first,
//  then gets sent when there's signal — so a play entered with no
//  bars survives even if the app is closed before it syncs.
//
//  Where things live in Firebase (all under /v2):
//    users/<uid>            your private info: name, team, clubs you joined or asked to join, guest claims
//    profiles/<pid>         every player's public name (accounts: pid = uid; guests: random id)
//    clubs/<code>/info      name, public/private      clubs/<code>/members   the roster (+ captains, guests)
//    clubs/<code>/requests  join requests             clubs/<code>/claims    "that's me" guest claims
//    clubs/<code>/games     which games count for the club
//    clubNames/<name>       makes club names unique   clubList/<code>        Find a club list
//    games/<id>             one game, with its scorebook      playerGames/<pid>   each player's "All my games"
//    live/<pid>             who is in a live game right now

const FilingCabinet = (() => {

            }

    // "That's me": ask to take over a guest's games
    async function claimGuest(code, guestPid) {

    async function myOffers() {
      need();

// ── Phone storage (never crashes if Safari blocks it). QA keeps its own keys so it never touches the real app's. ──
const sk = k => (k.startsWith('gb_') ? ENV.store + k.slice(3) : k);
const Store = {
  getItem: k => { try { return localStorage.getItem(sk(k)); } catch (e) { return null; } },
  setItem: (k, v) => { try { localStorage.setItem(sk(k), v); } catch (e) { /* full or blocked */ } },
  removeItem: k => { try { localStorage.removeItem(sk(k)); } catch (e) { /* blocked */ } },
  json(k, d) { try { const v = this.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  put(k, v) { this.setItem(k, JSON.stringify(v)); },
};
// Launch day (build 7): the test builds used these same phone-storage names with test data (test clubs, a half-played
// test game, unsent test changes). Clear that once so the real app starts clean — keep only appearance, My photo and the device id.
if (ENV.name === 'live' && !Store.getItem('gb_launch7')) {
  try { Object.keys(localStorage).filter(k => k.startsWith('gb_') && !['gb_settings', 'gb_myphoto', 'gb_device'].includes(k)).forEach(k => localStorage.removeItem(k)); } catch (e) { /* storage blocked */ }
  Store.setItem('gb_launch7', '1');
}

const Diag = (() => {

    const d = String(detail == null ? '' : detail).slice(0, 160), prev = log[log.length - 1];
    if (prev && prev.k === kind && prev.d.replace(/ ×\d+$/, '') === d && prev.s === sc && kind === 'touch') {   // a run of touches on the same layer: one line
      prev.n = (prev.n || 1) + 1; prev.d = d + ' ×' + prev.n; prev.t = Date.now();
    } else log.push({ t: Date.now(), k: kind, s: sc, sh, d });
    if (log.length > 400) log = log.slice(-400);
    try { LiveLog.poke(); } catch (e) { /* not set up yet */ }
    clearTimeout(save); save = setTimeout(() => Store.put('gb_diag', log), 400);
  };
  addEventListener('error', e => add('error', (e.message || 'error') + (e.lineno ? ' @' + e.lineno : '')));
  addEventListener('unhandledrejection', e => add('error', 'promise: ' + ((e.reason && (e.reason.message || e.reason.code)) || e.reason)));
  let last = Date.now(), vis = true;
  setInterval(() => { const now = Date.now(); if (vis && now - last > 2500) add('stall', 'phone busy ' + ((now - last) / 1000).toFixed(1) + 's'); last = now; }, 500);
  document.addEventListener('visibilitychange', () => { vis = document.visibilityState === 'visible'; last = Date.now(); add('app', vis ? 'opened' : 'went to background'); });

  addEventListener('touchstart', e => add('touch', layer(e.target)), { capture: true, passive: true });
  return { add, get: () => log.slice().reverse(), clear: () => { log = []; Store.put('gb_diag', log); } };
})();

// Profile photos: kept on the phone once seen (so they show offline), checked against Firebase once per app session
const Photos = { mem: {}, asked: {},
  of(pid) {
    if (!pid || /^g_|:/.test(pid)) return null;                                  // guests have no photo
    if (!(pid in this.mem)) { try { this.mem[pid] = Store.getItem('gb_pfp_' + pid) || null; } catch (e) { this.mem[pid] = null; } }
    if (!this.asked[pid] && typeof FCab !== 'undefined' && FCab && S.user && FCab.photoOf) {
      this.asked[pid] = true;
      FCab.photoOf(pid).then(p => { p = p || null; if (p === this.mem[pid]) return; this.set(pid, p); render(); }).catch(() => { this.asked[pid] = false; });
    }
    return this.mem[pid];
  },
  set(pid, p) { this.mem[pid] = p; try { if (p) Store.setItem('gb_pfp_' + pid, p); else Store.removeItem('gb_pfp_' + pid); } catch (e) { /* phone storage full: it still shows this session */ } },
};

// ── Tab bar ──
function tabbar(on) {
  const waiting = (S.clubs || []).reduce((n, c) => n + (c.captain && c.requests ? c.requests : 0), 0);   // requests for captains
  const badge = id => (id === 'club' && waiting ? `<span class="cond" style="position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--goldfill);color:#1A1406;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">${waiting}</span>` : '');
  const t = (id, label) => `<button class="cond ${on === id ? 'on' : ''}" style="position:relative" ${act('tab', id)}>${ICON.tabs[id]}${label}${badge(id)}</button>`;
  return `<nav class="tabbar">${t('games', 'GAMES')}${t('stats', 'STATS')}${t('awards', 'AWARDS')}${t('club', 'CLUB')}</nav>`;
}
const scopeName = () => (S.scope === 'mine' ? 'ALL MY GAMES' : ((S.clubs.find(c => c.code === S.scope) || {}).name || 'ALL MY GAMES').toUpperCase());
const scopeChip = () => `<button class="press cond" ${act('openSwitcher')} style="align-self:flex-start;display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:18px;font-weight:700;letter-spacing:.6px">${esc(scopeName())} ${ICON.down}</button>`;

// ── Home ──

      <span style="font-size:15px;line-height:1.45;color:var(--text2)">${noClubs ? 'Join your crew’s club to see its standings, or start your own. Every game you play also shows up under All my games.' : 'Games you play with this club show up here.'}</span>
      ${noClubs ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px"><button class="press cond small-btn" style="height:42px;border-radius:21px" ${act('go', 'findClub')}>FIND A CLUB</button><button class="press cond small-btn" style="height:42px;border-radius:21px" ${act('go', 'createClub')}>CREATE A CLUB</button></div>` : ''}
    </div>`;
  else body = `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:8px"><h2 class="cond h2">STANDINGS</h2><a class="cond" ${act('tab', 'stats')} style="font-size:16px;font-weight:800;letter-spacing:.6px">SEE ALL ›</a></div>
    <div class="card" style="padding:0 16px">${h.rows.slice(0, 3).map((r, i) => `<div style="display:flex;align-items:center;gap:12px;height:46px;${i ? 'border-top:1px solid var(--line)' : ''}">
      <span class="shoulders num" style="width:16px;font-size:20px;font-weight:800;color:var(--text3)">${i + 1}</span>
      <span style="flex-grow:1;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span>
      <span class="shoulders num" style="font-size:21px;font-weight:800;color:var(--text2)">${r.w}–${r.l}${r.t ? '–' + r.t : ''}</span>
      <span class="shoulders num" style="width:50px;text-align:right;font-size:21px;font-weight:900">${pct3(r.winPct)}</span></div>`).join('')}</div>

          <div style="display:flex;justify-content:space-between;align-items:center;height:26px;color:var(--text2)"><span style="font-size:16px;font-weight:500">${esc(l.name)}${g.players.length > 2 ? ' +' + (g.players.length - 2) : ''}</span><span class="shoulders num" style="font-size:22px;font-weight:800">${l.score}</span></div>
        </div></button>`;

  return `<div class="page tabbed">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div data-brand style="display:flex;flex-direction:column;align-items:center"><span class="script" style="font-size:40px;line-height:1.05;color:var(--cream)">Guess Ball</span>${ICON.swoosh(200)}</div>
      <button class="press" aria-label="Settings" ${act('go', 'settings')} style="width:38px;height:38px;border-radius:19px;background:var(--card2);display:flex;align-items:center;justify-content:center">${ICON.gear}</button>
    </div>
    ${scopeChip()}
    ${claimCard()}
    ${S.clubs.filter(c => c.status === 'pending').map(c => `<div class="card" style="border-radius:16px;padding:12px 14px;background:rgba(242,193,78,.14);border:1px solid rgba(242,193,78,.45);display:flex;flex-direction:column;gap:3px"><span class="cond" style="font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--gold)">WAITING ON A CAPTAIN</span><span style="font-size:14px;line-height:1.4">Your request to join ${esc(c.name || 'the club')} is in. You’ll get in as soon as a captain approves it.</span></div>`).join('')}
    ${typeof inviteCard === 'function' ? inviteCard() : ''}

// Tabs that come in later test builds
const later = (tab, title, what) => () => `<div class="page tabbed">

// ── Find a club ──
SCREENS.findClub = () => {
  const q = S.q.trim().toLowerCase();
  const mine = Object.fromEntries(S.clubs.map(c => [c.code, c.status]));
  const list = S.found.filter(c => !q || c.name.toLowerCase().includes(q));
  return `<div class="page">
  <div class="topbar">${backBtn()}<h1 class="cond h1">FIND A CLUB</h1></div>
  <label class="field search">${ICON.search}<input data-model="q" data-region="list" value="${attr(S.q)}" placeholder="Search clubs by name" aria-label="Search clubs"></label>
  ${S.foundLoading ? `<div class="card" style="padding:24px;display:flex;justify-content:center">${ICON.spinner}</div>` :
  `<div class="list" data-region="list">${list.map(c => {
    const st = mine[c.code];
    const cta = st === 'member' ? 'OPEN' : st === 'pending' ? 'PENDING' : c.public ? 'JOIN' : 'REQUEST';
    const primary = cta === 'JOIN';
    return `<div class="row" style="min-height:64px"><div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:6px"><span class="cond" style="font-size:20px;font-weight:800;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name.toUpperCase())}</span>${c.public ? '' : ICON.lock}</div>
      <span class="courier meta">${st === 'member' ? 'Your club' : st === 'pending' ? 'Request pending' : c.public ? 'Public' : 'Private'}</span></div>
      <button class="press cond small-btn" ${cta === 'PENDING' ? 'disabled' : act('clubCta', c.code)} style="${primary ? 'background:var(--accent);color:var(--onaccent)' : ''}">${cta}</button></div>`;
  }).join('') || `<div class="row"><span class="courier meta">${q ? 'No club by that name yet.' : 'No clubs yet — be the first.'}</span></div>`}</div>`}
  <button class="press cond mid-btn" ${act('go', 'createClub')} style="font-size:19px">${ICON.plus} CREATE A CLUB</button>
</div>`;
};
function requestSheet() {
  const c = S.found.find(x => x.code === S.sheet.arg) || {};
  return `<div style="display:flex;align-items:center;gap:8px"><span class="cond" style="font-size:28px;font-weight:800;letter-spacing:.4px">${esc((c.name || '').toUpperCase())}</span>${ICON.lock}</div>

// Update a screen in place: the scrolling page element itself is kept (so a scroll or swipe in
// progress on iPhone isn't cut off), and only the pieces whose content changed are replaced.
// Keep an element, swap only its changed children. A scroll area inside ([data-scroll]) is kept too and patched the same way,
// so its scroll position survives data loading in (never rebuilt under the thumb).

  const list = TEAM_NAMES.filter(t => !q || t.toLowerCase().includes(q) || TEAMS[t].toLowerCase().includes(q));
  return `<div style="display:flex;align-items:center;justify-content:space-between"><h2 class="cond" style="margin:0;font-size:28px;font-weight:800">${side === 'home' ? 'HOME' : 'AWAY'} TEAM</h2>
    <button class="press cond" ${act('closeSheet')} style="color:var(--link);font-size:17px;font-weight:800">DONE</button></div>
  <label class="field search" style="background:var(--sheetcard)">${ICON.search}<input data-model="q" data-region="teams" value="${attr(S.q)}" placeholder="Search MLB teams"></label>
  <div class="list">
    <button class="row press" ${act('ngCustom', side)} style="min-height:56px">${ICON.plus}<div style="display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">Type a team name</span><span class="courier meta">Minor league, college, high school, overseas</span></div></button>
    ${S.draft.custom === side ? `<div class="fade" style="display:flex;flex-direction:column;gap:8px;padding:4px 0 12px">
      <label class="field" style="background:var(--inner);height:46px"><input data-model="draft.cTeam" value="${attr(S.draft.cTeam || '')}" placeholder="Team name" maxlength="40"></label>
      ${side === 'home' ? `<label class="field" style="background:var(--inner);height:46px"><input data-model="draft.cPark" value="${attr(S.draft.cPark || '')}" placeholder="Ballpark" maxlength="40"></label>` : ''}
      <button class="press cond small-btn" style="height:40px;background:var(--accent);color:#fff" ${act('ngCustomSave', side)} data-enable="draft.cTeam">USE THIS TEAM</button></div>` : ''}
  </div>
  <span class="cond label">MLB</span>
  <div class="list" data-region="teams">${list.map(t => `<button class="row press" ${act('ngTeam', side + '|' + t)} style="min-height:54px"><div style="flex-grow:1;display:flex;flex-direction:column">
    <span style="font-size:16px;font-weight:${t === cur ? 700 : 500}">${esc(t)}</span><span class="courier meta">${esc(TEAMS[t])}</span></div>${ICON.check(t === cur ? 'var(--accent)' : 'transparent')}</button>`).join('')}</div>`;
}
function parkSheet() {
  const T = S.screen === 'game' ? S.g.game : S.ng;
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">BALLPARK</h2>
  <span style="font-size:15px;line-height:1.45;color:var(--text2)">Playing somewhere other than the home team's park (spring training, a neutral site)? Type it here.</span>
  <label class="field" style="background:var(--inner)"><input data-model="draft.park" value="${attr(S.draft.park != null ? S.draft.park : (T.park || ''))}" placeholder="${attr(TEAMS[T.home] || 'Ballpark')}" maxlength="40"></label>
  <button class="big-btn cond press" ${act('ngPark')}>SAVE</button>
  ${S.screen !== 'game' && S.ng.park ? `<button class="press cond mid-btn" ${act('ngParkReset')}>USE THE HOME TEAM'S PARK</button>` : ''}`;
}
function addPlayerSheet() {
  const q = S.q.trim(), ql = q.toLowerCase();
  const taken = new Set(S.ng.players.map(p => p.id));
  const members = (S.ngRoster || []).filter(m => !m.guest && !taken.has(m.pid) && (!ql || m.name.toLowerCase().includes(ql)));
  const guests = (S.ngRoster || []).filter(m => m.guest && !taken.has(m.pid) && (!ql || m.name.toLowerCase().includes(ql)));
  const exact = (S.ngRoster || []).some(m => m.name.toLowerCase() === ql);
  const row = (m, isGuest) => `<button class="row press" ${act('ngAdd', m.pid)} style="min-height:54px">
    ${isGuest ? `<span style="width:32px;height:32px;border-radius:16px;border:1.5px solid var(--text4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">${esc(m.name[0].toUpperCase())}</span>` : avatar(m.pid, m.name, 32)}
    <span style="flex-grow:1;font-size:17px;font-weight:600">${esc(m.name)}</span>${isGuest ? '<span class="cond tag">GUEST</span>' : ''}</button>`;
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">ADD A PLAYER</h2>
  <label class="field search" style="background:var(--sheetcard)">${ICON.search}<input data-model="q" data-region="people" value="${attr(S.q)}" placeholder="Search or type a guest name" maxlength="16"></label>
  <div data-region="people" style="display:flex;flex-direction:column;gap:12px">
  ${S.ngRoster == null ? `<div style="display:flex;justify-content:center;padding:12px">${ICON.spinner}</div>` : ''}
  ${members.length ? `<span class="cond label">${esc(S.scope === 'mine' ? 'YOUR CLUBS' : scopeName() + ' ROSTER')}</span><div class="list">${members.map(m => row(m, false)).join('')}</div>` : ''}
  ${guests.length ? `<span class="cond label">GUESTS</span><div class="list">${guests.map(m => row(m, true)).join('')}</div>` : ''}
  ${q && !exact ? `<button class="press mid-btn" style="background:var(--sheetcard);color:var(--link);font-family:inherit;font-size:17px;font-weight:600;letter-spacing:0" ${act('ngNewGuest')}>${ICON.plus} Add “${esc(q)}” as a guest</button>` :
    (!q ? `<span class="courier meta" style="padding:0 4px;line-height:1.5">Type a name above to add a new guest. Guests keep all their games and can claim them when they make an account.</span>` : '')}</div>`;
}

// ════════════ Pick 3 ════════════
SCREENS.pick3 = () => {
  const s = S.g.s, g = S.g.game, i = G.p3Next(), p = g.players[i];
  S.g.shownP3 = i;                                   // whose Pick 3 is on screen (a lock can't land on someone else)
  const mine = S.g.p3sel || [];
  const firsts = Object.values(S.g.pending.p3).filter(Boolean).map(x => x[0]);
  const done = G.order().filter(j => j in S.g.pending.p3);
  const slot = [0, 1, 2].find(k => !mine[k]) ?? 3;   // which at-bat is being chosen (0..2; 3 = all chosen)
  return `<div class="fixedpage" style="gap:12px">
  ${gameTop(backBtn('gBack'), halfName(s) + ' · PICK 3')}
  ${done.map(j => { const x = S.g.pending.p3[j]; return `<div class="card" style="border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px">
    <span style="font-size:16px;font-weight:700">${esc(g.players[j].name)}</span><span class="shoulders" style="flex-grow:1;font-size:20px;font-weight:900">${x ? x.map(code).join(' · ') : '<span style="font-family:inherit;font-size:14px;font-weight:600;color:var(--text3)">Skipped</span>'}</span>
    <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:${x ? 'var(--green)' : 'var(--text4)'}">${x ? 'LOCKED' : 'SKIP'}</span></div>`; }).join('')}
  ${info('p3why', `<span class="cond onphoto" style="font-size:36px;font-weight:800;line-height:1;color:var(--text)">${esc(p.name.toUpperCase())}, PICK 3</span>`, 'Call the first three at-bats in order. All three right = +7 bonus. Miss one and you pick one at a time for the rest of the half-inning. Only your first call has to be different from everyone else’s.', '')}
  ${tipCard('p3')}
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${[0, 1, 2].map(k => `<button class="press" ${mine[k] ? act('p3Unpick', k) : ''} style="height:76px;border-radius:16px;background:${mine[k] ? tint(pcol(i), .3) : 'var(--card)'};border:2px solid ${k === slot ? pcol(i) : mine[k] ? tint(pcol(i), .8) : 'transparent'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">AT-BAT ${k + 1}</span>
    <span class="shoulders" style="font-size:26px;font-weight:900;line-height:1;color:${mine[k] ? 'var(--text)' : 'var(--text4)'}">${mine[k] ? code(mine[k]) : '—'}</span></button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">${PICK_GRID.map(o => {
    const blocked = slot === 0 && firsts.includes(o);
    const oj = blocked ? done.find(j => S.g.pending.p3[j] && S.g.pending.p3[j][0] === o) : null, owner = blocked ? g.players[oj].name : '';
    return `<button class="press" ${blocked || slot > 2 ? 'disabled' : act('p3Pick', o)} style="height:56px;border-radius:12px;background:${blocked ? tint(pcol(oj), .22) : 'var(--card)'};padding:6px 9px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;${blocked ? `box-shadow:inset 0 0 0 2px ${tint(pcol(oj), .9)};opacity:.75` : ''}">
      <span class="shoulders" style="font-size:22px;font-weight:900;line-height:1">${code(o)}</span><span class="courier" style="font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap;overflow:hidden;max-width:100%">${blocked ? esc(owner) + '’s AB 1' : ptsOf(o) + (ptsOf(o) === 1 ? ' pt' : ' pts')}</span></button>`;
  }).join('')}</div>
  <div class="grow"></div>
  <div style="display:grid;grid-template-columns:120px 1fr;gap:10px">
    <button class="press cond mid-btn" style="height:56px;border-radius:28px" ${act('p3Skip')}>SKIP</button>
    <button class="big-btn cond press" style="height:56px;background:${pcol(i)};color:${onColor(pcol(i))}" ${act('p3Lock')} ${slot === 3 ? '' : 'disabled'}>${slot === 3 ? 'LOCK IT IN' : 'CHOOSE AT-BAT ' + (slot + 1)}</button></div>
</div>`;
};

// ════════════ Make a pick ════════════
SCREENS.pick = () => {
  const s = S.g.s, g = S.g.game, i = G.pickNext(), p = g.players[i];
  S.g.shownFor = i;
  const taken = {}, viaP3 = {};
  const owner = {};
  Object.entries(Umpire.lockedPicks(s)).forEach(([j, v]) => { taken[v.pick] = g.players[j].name; owner[v.pick] = +j; if (v.fromP3) viaP3[v.pick] = true; });
  Object.entries(S.g.pending.picks).forEach(([j, v]) => { taken[v.pick] = g.players[j].name; owner[v.pick] = +j; });
  const mine = pcol(i), mineText = onColor(mine);
  const sel = S.g.sel || {};
  const holders = Object.entries(taken).map(([o, who]) => `${esc(who)} has ${code(o)}${viaP3[o] ? ' (Pick 3)' : ''}`).join(' · ');
  return `<div class="fixedpage" style="gap:12px">
  ${gameTop(backBtn('gBack'), halfName(s))}
  ${scoreCard()}
  <span class="courier onphoto" style="font-size:13px;font-weight:700;color:var(--text2)">At-bat ${s.ab}${holders ? ' · ' + holders : ''}</span>
  <h1 class="cond onphoto" style="margin:-6px 0 0;font-size:36px;font-weight:800;line-height:1">${S.g.pickFor === i ? 'PICKING FOR ' + esc(p.name.toUpperCase()) : esc(p.name.toUpperCase()) + ', YOUR PICK'}</h1>
  ${firstTip(['pick', 'conf'].concat(S.g.s.priority !== (S.g.game.setup || {}).priority ? ['priority'] : []), { name: (S.g.game.players[S.g.s.priority] || {}).name })}
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${PICK_GRID.map(o => {
    const who = taken[o], on = sel.pick === o;
    const oc = who ? pcol(owner[o]) : null;          // a taken pick shows whose it is in their color
    return `<button class="press" ${who ? 'disabled' : act('pickSel', o)} style="height:70px;border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;background:${on ? mine : who ? tint(oc, .22) : 'var(--card)'};${who ? `box-shadow:inset 0 0 0 2px ${tint(oc, .9)};opacity:.75` : ''}">
      <span class="shoulders" style="font-size:28px;font-weight:900;line-height:1;color:${on ? mineText : 'var(--text)'}">${code(o)}</span>
      <span class="shoulders" style="position:absolute;top:8px;right:10px;font-size:16px;font-weight:800;color:${on ? mineText : 'var(--text2)'};${on ? 'opacity:.85' : ''}">${ptsOf(o)}</span>
      <span class="courier" style="font-size:10px;font-weight:700;color:${on ? mineText : who ? 'var(--text)' : 'var(--text2)'};${on ? 'opacity:.85;' : ''}white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${who ? (viaP3[o] ? 'Pick 3 · ' : '') + esc(who) : OC[o][1]}</span></button>`;
  }).join('')}</div>
  <div class="card" style="border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px">
    <div style="flex-grow:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">Confidence</span><span class="courier meta">+5 if right · −2 if wrong</span></div>${toggle(!!sel.conf, 'pickConf')}</div>
  <div class="grow"></div>
  <button class="big-btn cond press" style="background:${mine};color:${mineText}" ${act('pickLock')} ${sel.pick ? '' : 'disabled'}>${sel.pick ? 'LOCK IN ' + code(sel.pick) + (sel.conf ? ' · CONFIDENT' : '') : 'CHOOSE AN OUTCOME'}</button>
</div>`;
};

// ════════════ What happened ════════════
SCREENS.result = () => {
  const s = S.g.s, g = S.g.game, r = S.g.res;
  const locked = Umpire.lockedPicks(s);
  const all = {};
  Object.entries(locked).forEach(([j, v]) => { all[j] = v; });
  Object.entries(S.g.pending.picks).forEach(([j, v]) => { all[j] = { ...v, fromP3: false }; });
  const chips = g.players.map((p, j) => {
    const v = all[j];
    if (!v) return `<div class="card" style="border-radius:14px;padding:8px 10px;opacity:.5;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:700">${esc(p.name)}</span><span class="courier meta">Called the steal · sitting out</span></div>`;
    const pri = s.priority === +j;
    return `<div class="card" style="border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:6px;min-width:0">
      <div style="flex-grow:1;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>
        <div style="display:flex;gap:3px;flex-wrap:wrap">${pri ? PRI() : ''}${v.conf ? CONFB(!pri && g.players.length < 3) : ''}${v.fromP3 ? P3B() : ''}</div></div>
      <span class="shoulders" style="font-size:${g.players.length > 2 ? 22 : 26}px;font-weight:900;flex-shrink:0">${code(v.pick)}</span></div>`;
  }).join('');
  const hr = r.outcome === 'home_run';                 // a home run always scores the batter: runs start at 1 and can't go below
  const stepper = (label, key, max) => `<div class="card" style="border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
    <span class="cond" style="font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--text2);white-space:nowrap">${label}</span>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="press" ${act('resStep', key + '|-1')} style="width:40px;height:40px;border-radius:20px;background:var(--card2);font-size:22px;font-weight:700" ${r[key] > (key === 'runs' && hr ? 1 : 0) ? '' : 'disabled'}>−</button>
      <span class="shoulders num" style="font-size:36px;font-weight:900">${r[key]}</span>
      <button class="press" ${act('resStep', key + '|1')} style="width:40px;height:40px;border-radius:20px;background:var(--card2);font-size:22px;font-weight:700" ${r[key] < max ? '' : 'disabled'}>+</button></div></div>`;
  const label = r.outcome ? `SAVE · ${OC[r.outcome][1].toUpperCase()}${r.runs ? ` · ${r.runs} RUN${r.runs > 1 ? 'S' : ''}` : ''}` : 'SELECT WHAT HAPPENED';
  return `<div class="fixedpage" style="gap:12px">
  ${gameTop(backBtn('gBack'), halfName(s) + ' · AB ' + s.ab)}
  <div style="display:grid;grid-template-columns:repeat(${g.players.length},minmax(0,1fr));gap:8px">${chips}</div>
  <h1 class="cond onphoto" style="margin:2px 0 0;font-size:36px;font-weight:800;line-height:1">WHAT HAPPENED?</h1>
  ${tipCard('result')}
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${RESULT_GRID.map(o => {
    const on = r.outcome === o;
    return `<button class="press ${on ? 'picked' : ''}" ${act('resSel', o)} style="height:56px;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;text-align:left;background:${on ? 'var(--card3)' : 'var(--card)'}">
      <span class="shoulders" style="font-size:24px;font-weight:900;line-height:1;color:var(--text)">${code(o)}</span>
      <span class="courier" style="font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap;overflow:hidden">${OC[o][1]}</span></button>`;
  }).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${stepper('RUNS SCORED', 'runs', 4)}${stepper('EXTRA OUTS', 'extraOuts', 2)}</div>
  <div class="grow"></div>
  <button class="big-btn cond press" ${act('resSave')} ${r.outcome && !S.busy ? '' : 'disabled'} style="font-size:${r.outcome ? 20 : 22}px">${label}</button>
</div>`;
};

// ════════════ After the play ════════════
function lastPlayInfo() {
  const g = S.g.game, s = S.g.s;
  const last = s.plays[s.plays.length - 1];
  const log = s.log.filter(e => e.half === last.half);
  // entries from this play = the tail of the log added by the last play
  const before = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events.slice(0, g.events.lastIndexOf(g.events.filter(e => e.type === 'play').pop())));
  const entries = s.log.slice(before.log.length);
  return { last, entries, log };
}
SCREENS.after = () => {
  const s = S.g.s, g = S.g.game;
  const { last, entries } = lastPlayInfo();
  if (!last) { S.g.view = null; setTimeout(render); return '<div class="page"></div>'; }   // the play was undone on another phone
  const o = last.outcome, runs = last.runs;
  const winner = entries.find(e => e.correct);
  let title = OC[o][1].toUpperCase() + (runs ? ` · ${runs} RUN${runs > 1 ? 'S' : ''}` : '');
  let line;
  if (last.voided) line = 'Third out on the bases — this at-bat doesn’t count';
  else if (o === 'caught_stealing') line = 'Nobody scores · picks stand';
  else if (winner) line = `${esc(g.players[winner.player].name)} called it`;
  else line = 'Nobody called it';
  const misses = entries.filter(e => e.conf && !e.correct);
  // This half-inning, newest first
  const half = s.plays.filter(p => p.half === last.half).map((p, k, arr) => {
    const idx = s.plays.indexOf(p);
    const prev = idx ? s.plays[idx - 1].scoresAfter : Array(g.players.length).fill(0);
    const gain = p.scoresAfter.map((v, j) => v - (idx ? prev[j] : 0));
    const best = gain.reduce((b, v, j) => (v > gain[b] ? j : b), 0);
    return { code: code(p.outcome), gain: gain[best], who: gain[best] > 0 ? g.players[best].name : null, n: k + 1 };
  }).reverse();
  const over = Umpire.mlbGameOver(s);
  const midAtBat = Umpire.outcome(o).midAtBat && !last.voided && s.outs < 3;
  const next = over ? 'END GAME' : s.outs >= 3 ? 'NEXT HALF-INNING' : midAtBat ? 'BACK TO THE AT-BAT' : 'NEXT AT-BAT';
  const mlb = s.mlb, gm = g;
  const finalLine = over ? `${esc(mlb.home > mlb.away ? shortTeam(gm.home) || 'Home' : shortTeam(gm.away) || 'Away')} win ${Math.max(mlb.home, mlb.away)}–${Math.min(mlb.home, mlb.away)}. That’s the ballgame.` : '';
  return `<div class="fixedpage" style="gap:14px">
  ${gameTop(`<button class="press" ${act('gUndo')} style="height:36px;padding:0 14px;border-radius:18px;background:var(--card);font-size:15px;font-weight:600">Undo</button>`, halfName(s))}
  ${lineScoreCard()}
  <div class="card rise" style="padding:14px 16px;display:flex;align-items:center;gap:14px">
    ${diamond(code(o), winner ? 'var(--green)' : 'var(--text4)')}
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:4px;min-width:0">
      <span class="cond" style="font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1.05">${title}</span>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600"><span>${line}</span>${winner ? `<span class="shoulders num" style="font-size:22px;font-weight:900;color:var(--green)">+${winner.base - (winner.runs || 0)}</span>` : ''}</div>
      ${winner ? [                                               // everything on top of the result's own points, one line each
        winner.runs ? [`${winner.runs} run${winner.runs > 1 ? 's' : ''} scored`, winner.runs, 'var(--gold)'] : null,
        winner.confPts ? ['Confidence', winner.confPts, 'var(--gold)'] : null,
        winner.p3Bonus ? ['Pick 3 bonus', winner.p3Bonus, 'var(--green)'] : null,
      ].filter(Boolean).map(([t, v, c]) => `<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="courier" style="font-size:12px;font-weight:700;color:${c}">${t}</span><span class="shoulders num" style="font-size:18px;font-weight:900;color:${c}">+${v}</span></div>`).join('') : ''}
    </div></div>
  ${misses.map(e => `<div class="card rise" style="padding:12px 16px;display:flex;align-items:center;gap:14px;margin-top:-4px;animation-delay:.3s">
    <div style="width:58px;display:flex;justify-content:center"><span class="shoulders" style="font-size:20px;font-weight:900;color:var(--text4);text-decoration:line-through;text-decoration-thickness:2px">${code(e.pick)}</span></div>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span class="cond" style="font-size:17px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.players[e.player].name.toUpperCase())}</span>
      <span class="courier" style="font-size:12px;font-weight:700;color:var(--orange)">Confidence · picked ${code(e.pick)}</span></div>
