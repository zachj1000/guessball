// ════════════ After the play ════════════
function lastPlayInfo() {
  const g = S.g.game, s = S.g.s;
  const last = s.plays[s.plays.length - 1];
  const log = s.log.filter(e => e.half === last.half);
  // entries from this play = the tail of the log added by the last play
  const before = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events.slice(0, g.events.lastIndexOf(g.events.filter(e => e.type === 'play').pop())));
  const entries = s.log.slice(before.log.length);
  return { last, entries, log };
}
SCREENS.after = () => {
  const s = S.g.s, g = S.g.game;
  const { last, entries } = lastPlayInfo();
  const o = last.outcome, runs = last.runs;
  const winner = entries.find(e => e.correct);
  let title = OC[o][1].toUpperCase() + (runs ? ` · ${runs} RUN${runs > 1 ? 'S' : ''}` : '');
  let line;
  if (last.voided) line = 'Third out on the bases — this at-bat doesn’t count';
  else if (o === 'caught_stealing') line = 'Nobody scores · picks stand';
  else if (winner) line = `${esc(g.players[winner.player].name)} called it`;
  else line = 'Nobody called it';
  const misses = entries.filter(e => e.conf && !e.correct);
  // This half-inning, newest first
  const half = s.plays.filter(p => p.half === last.half).map((p, k, arr) => {
    const idx = s.plays.indexOf(p);
    const prev = idx ? s.plays[idx - 1].scoresAfter : Array(g.players.length).fill(0);
    const gain = p.scoresAfter.map((v, j) => v - (idx ? prev[j] : 0));
    const best = gain.reduce((b, v, j) => (v > gain[b] ? j : b), 0);
    return { code: code(p.outcome), gain: gain[best], who: gain[best] > 0 ? g.players[best].name : null, n: k + 1 };
  }).reverse();
  const over = Umpire.mlbGameOver(s);
  const midAtBat = Umpire.outcome(o).midAtBat && !last.voided && s.outs < 3;
  const next = over ? 'END GAME' : s.outs >= 3 ? 'NEXT HALF-INNING' : midAtBat ? 'BACK TO THE AT-BAT' : 'NEXT AT-BAT';
  const mlb = s.mlb, gm = g;
  const finalLine = over ? `${esc(mlb.home > mlb.away ? shortTeam(gm.home) || 'Home' : shortTeam(gm.away) || 'Away')} win ${Math.max(mlb.home, mlb.away)}–${Math.min(mlb.home, mlb.away)}. That’s the ballgame.` : '';
  return `<div class="fixedpage" style="gap:14px">
  ${gameTop(`<button class="press" ${act('gUndo')} style="height:36px;padding:0 14px;border-radius:18px;background:var(--card);font-size:15px;font-weight:600">Undo</button>`, halfName(s))}
  ${lineScoreCard()}
  <div class="card rise" style="padding:14px 16px;display:flex;align-items:center;gap:14px">
    ${diamond(code(o), winner ? 'var(--green)' : 'var(--text4)')}
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:4px;min-width:0">
      <span class="cond" style="font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1.05">${title}</span>
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600"><span>${line}</span>${winner ? `<span class="shoulders num" style="font-size:22px;font-weight:900;color:var(--green)">+${winner.pts}</span>` : ''}</div>
      ${winner && winner.p3Bonus ? `<span class="courier" style="font-size:12px;font-weight:700;color:var(--green)">Pick 3 complete · +7 bonus included</span>` : ''}
    </div></div>
  ${misses.map(e => `<div class="card rise" style="padding:12px 16px;display:flex;align-items:center;gap:14px;margin-top:-4px;animation-delay:.3s">
    <div style="width:58px;display:flex;justify-content:center"><span class="shoulders" style="font-size:20px;font-weight:900;color:var(--text4);text-decoration:line-through;text-decoration-thickness:2px">${code(e.pick)}</span></div>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span class="cond" style="font-size:17px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.players[e.player].name.toUpperCase())} · CONFIDENCE MISS</span>
      <span class="courier" style="font-size:12px;font-weight:700;color:var(--text2)">Picked ${code(e.pick)} · wrong</span></div>
    <span class="shoulders num" style="font-size:22px;font-weight:900;color:var(--orange)">−2</span></div>`).join('')}
  <h2 class="cond" style="margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:.5px">THIS HALF-INNING</h2>
  <div class="card" style="padding:0 16px">${half.map((p, k) => `<div style="display:flex;align-items:center;gap:12px;height:50px;${k ? 'border-top:1px solid var(--line)' : ''}">
    <span class="shoulders" style="width:44px;font-size:24px;font-weight:900">${p.code}</span><span class="courier" style="flex-grow:1;font-size:14px;font-weight:700;color:var(--text2)">Play ${p.n}</span>
    <span style="font-size:15px;font-weight:600;color:${p.who ? 'var(--green)' : 'var(--text3)'}">${p.who ? esc(p.who) + ' +' + p.gain : 'Nobody'}</span></div>`).join('')}</div>
  <div class="grow"></div>
  ${finalLine ? `<span class="courier" style="text-align:center;font-size:13px;font-weight:700;color:var(--text2)">${finalLine}</span>` : ''}
  <button class="big-btn cond press" style="height:56px" ${act('gNext', next)}>${next}</button>
</div>`;
};
// ── Award popup ──
// Lives outside the normal screen redraws so it can glide smoothly: drops in, stays 4 seconds per award,
// follows your thumb when swiped up, pauses while held (2 more seconds after letting go), tap opens the award.
const Popup = (() => {
  let queue = [], el = null, card = null, timer = null, gone = false;
  const html = (a, more) => `<div style="background:#1F1C14;border:1.5px solid rgba(242,193,78,.7);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 40px rgba(0,0,0,.7)">
      <div style="width:50px;height:50px;flex-shrink:0;border-radius:14px;background:rgba(242,193,78,.12);display:flex;align-items:center;justify-content:center">${awardIcon(a.award, 34)}</div>
      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:1px">
        <span class="cond" style="font-size:12px;font-weight:800;letter-spacing:1px;color:var(--gold)">AWARD UNLOCKED · ${esc(a.name.toUpperCase())}</span>
        <span class="cond" style="font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1.05">${esc(a.award.name.toUpperCase())}${a.award.tiers && a.award.tiers.length > 1 ? ' · ' + tierNum(a.award.tiers[a.tier - 1]) : ''}</span>
        <span class="courier" style="font-size:11px;font-weight:700;color:var(--text5)">${esc(a.award.desc)}</span></div>
      ${more ? `<span class="cond" style="align-self:flex-start;font-size:12px;font-weight:800;color:#1A1406;background:var(--goldfill);padding:1px 6px;border-radius:5px;white-space:nowrap">+${more} MORE</span>` : ''}
    </div>`;
  const wait = ms => { clearTimeout(timer); timer = setTimeout(() => hide(0), ms); };
  function next() {
    if (!queue.length) { if (el) { el.remove(); el = null; } return; }
    if (!el) {
      el = document.createElement('div'); el.className = 'gbpop';
      el.style.cssText = 'position:fixed;left:0;right:0;top:calc(var(--safe-top) + 8px);z-index:40;pointer-events:none;display:flex;justify-content:center;padding:0 12px';
      document.body.appendChild(el);
    }
    const a = queue[0]; gone = false;
    card = document.createElement('div');
    card.style.cssText = 'pointer-events:auto;width:100%;max-width:496px;touch-action:none;will-change:transform;transform:translateY(-140%);opacity:0';
    card.innerHTML = html(a, queue.length - 1);
    el.replaceChildren(card);
    card.getBoundingClientRect();                     // start from above the screen, then glide down
    card.style.transition = 'transform .45s cubic-bezier(.2,1.1,.3,1), opacity .25s';
    card.style.transform = 'translateY(0)'; card.style.opacity = '1';
    grab(card, a);
    wait(4000);
  }
  function hide(fromY) {
    if (gone || !card) return; gone = true; clearTimeout(timer);
    const c = card;
    c.style.transition = 'transform .28s cubic-bezier(.4,0,1,1), opacity .28s';
    c.style.transform = `translateY(calc(${Math.min(fromY, 0)}px - 140%))`; c.style.opacity = '0';
    setTimeout(() => { queue.shift(); next(); }, 260);
  }
  function grab(c, a) {
    let y0 = null, dy = 0, t0 = 0, lastY = 0, lastT = 0, v = 0;
    c.addEventListener('pointerdown', e => {
      if (gone) return; clearTimeout(timer);
      y0 = e.clientY; dy = 0; t0 = lastT = Date.now(); lastY = e.clientY; v = 0;
      c.style.transition = 'none'; try { c.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
    });
    c.addEventListener('pointermove', e => {
      if (y0 == null || gone) return;
      const now = Date.now(); v = (e.clientY - lastY) / Math.max(1, now - lastT); lastY = e.clientY; lastT = now;
      const raw = e.clientY - y0; dy = raw < 0 ? raw : raw * 0.25;     // up moves freely, down resists
      c.style.transform = `translateY(${dy}px)`;
    });
    const up = () => {
      if (y0 == null || gone) return; y0 = null;
      if (dy < -30 || v < -0.4) return hide(dy);                     // swiped up: keep going from where the thumb left it
      if (Math.abs(dy) < 8 && Date.now() - t0 < 350) {                // tap: open the award
        queue = [a]; hide(0); S.sheet = { name: 'award', arg: a.award.id + '|' + a.playerId }; render(); return;
      }
      c.style.transition = 'transform .3s cubic-bezier(.2,1.1,.3,1)'; c.style.transform = 'translateY(0)';
      wait(2000);                                                      // held: 2 more seconds after letting go
    };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  }
  return {
    show(list) { const busy = queue.length > 0; queue = queue.concat(list); if (!busy) next(); else if (card && !gone) { card.innerHTML = html(queue[0], queue.length - 1); } },
    clear() { queue = []; clearTimeout(timer); if (el) { el.remove(); el = null; } card = null; },
  };
})();

// ════════════ Final ════════════
SCREENS.final = () => {
  const f = S.final, g = f.game, sum = f.sum, r = sum.result, n = g.players.length;
  const order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
  const names = i => esc(g.players[i].name.toUpperCase());
  const meta = [g.away && `${shortTeam(g.away)} ${g.mlb ? g.mlb.away : ''}`.trim(), g.home && `${shortTeam(g.home)} ${g.mlb ? g.mlb.home : ''}`.trim(), g.park,
    new Date(g.startedAt || Date.now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })].filter(Boolean).join(' · ');
  let headline, scoreRow, sub;
  if (r.tie) {
    const tied = r.leaders;
    headline = tied.map(names).join(' & ') + ' TIE';
    scoreRow = `<div style="display:flex;align-items:baseline;gap:14px"><span class="shoulders" style="font-size:76px;font-weight:900;line-height:1">${r.scores[tied[0]]}</span><span class="shoulders" style="font-size:36px;font-weight:800;color:var(--text4)">–</span><span class="shoulders" style="font-size:76px;font-weight:900;line-height:1">${r.scores[tied[1]]}</span></div>`;
    sub = 'Dead even' + (sum.series && (sum.series.a.wins || sum.series.b.wins) ? ` · series stays ${Math.max(sum.series.a.wins, sum.series.b.wins)}–${Math.min(sum.series.a.wins, sum.series.b.wins)}` : '');
  } else if (n === 3) {
    headline = names(r.winner) + ' WINS';
    scoreRow = `<div style="display:flex;align-items:flex-end;gap:22px">${order.map((i, k) => `<div style="display:flex;flex-direction:column;align-items:center;gap:2px">
      <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:1px;color:${k ? 'var(--text3)' : 'var(--gold)'}">${['1ST', '2ND', '3RD'][k]}</span>
      <span class="shoulders" style="font-size:${k ? 48 : 72}px;font-weight:900;line-height:1;color:${k ? 'var(--text2)' : 'var(--text)'}">${r.scores[i]}</span>
      <span style="font-size:14px;font-weight:600;color:var(--text2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.players[i].name)}</span></div>`).join('')}</div>`;
    sub = sum.winNumber ? `${esc(g.players[r.winner].name)}’s ${ordinal(sum.winNumber)} win` : '';
  } else {
    const [w, l] = order;
    headline = names(w) + ' WINS';
    scoreRow = `<div style="display:flex;align-items:baseline;gap:14px"><span class="shoulders" style="font-size:76px;font-weight:900;line-height:1">${r.scores[w]}</span><span class="shoulders" style="font-size:36px;font-weight:800;color:var(--text4)">–</span><span class="shoulders" style="font-size:76px;font-weight:900;line-height:1;color:var(--text2)">${r.scores[l]}</span></div>`;
    const se = sum.series;
    sub = se ? (se.leader ? `${esc(g.players[se.leader === 'a' ? 0 : 1].name)} leads the series ${Math.max(se.a.wins, se.b.wins)}–${Math.min(se.a.wins, se.b.wins)}` : `Series tied ${se.a.wins}–${se.b.wins}`) : '';
  }
  const tiles = (sum.tiles || []).map(t => {
    const fmt = v => (t.label === 'ACCURACY' ? (v == null ? '—' : Math.round(v * 100) + '%') : t.label === 'CONFIDENCE' ? v.join('–') : v);
    const score = v => (t.label === 'CONFIDENCE' ? v[0] - v[1] : v == null ? -1 : v);
    const top = Math.max(...t.values.map(score));
    return `<div class="card" style="border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px">
      <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${t.label}</span>
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">${order.map(i => `<span class="shoulders" style="font-size:${n === 3 ? 22 : 28}px;font-weight:900;color:${score(t.values[i]) === top ? 'var(--text)' : '#5E5E66'}">${fmt(t.values[i])}</span>`).join('')}</div>
      <span class="courier meta" style="color:var(--text2)">${order.map(i => esc(g.players[i].name)).join(n === 3 ? ' · ' : ' vs ')}</span></div>`;
  }).join('');
  const plays = sum.plays || [], top = plays[0];
  const awards = f.awards || [];
  return `<div class="page" style="padding-bottom:calc(var(--safe-bot) + 110px)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px">
    <span class="cond" style="font-size:18px;font-weight:800;letter-spacing:2px;color:var(--text2)">FINAL</span>
    <span class="courier" style="font-size:13px;font-weight:700;color:var(--text2);text-align:center">${esc(meta)}</span></div>
  <div class="rise" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 6px">
    <span class="cond" style="font-size:${headline.length > 22 ? 30 : headline.length > 16 ? 36 : 44}px;font-weight:800;letter-spacing:.6px;line-height:1.05;text-align:center;max-width:100%;overflow-wrap:anywhere">${headline}</span>${scoreRow}
    ${sub ? `<span class="courier" style="font-size:13px;font-weight:700;color:var(--text2);text-align:center">${sub}</span>` : ''}</div>
  <div class="rise2">${lineScoreCard(false, g)}</div>
  ${tiles ? `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${tiles}</div>` : ''}
  ${top ? `<div class="card" style="overflow:hidden"><button class="press" ${act('finalPlays')} style="width:100%;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left">
      ${diamond(top.code)}<div style="flex-grow:1;display:flex;flex-direction:column;gap:2px"><span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">PLAY OF THE GAME</span>
      <span style="font-size:16px;font-weight:700">${esc(top.text)}</span><span class="courier meta" style="font-size:12px;color:var(--text2)">${top.when} · +${top.pts} pts${top.context ? ' · ' + top.context : ''}</span></div>
      ${plays.length > 1 ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--text3)" stroke-width="2" stroke-linecap="round" style="transform:rotate(${f.open ? 180 : 0}deg);transition:transform .25s"><path d="M3 5l4 4 4-4"/></svg>` : ''}</button>
    ${f.open ? `<div style="padding:0 16px 8px;border-top:1px solid var(--line)"><span class="cond" style="display:block;padding:12px 0 4px;font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">PLAYS OF THE GAME</span>
      ${plays.slice(1).map((m, k) => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${k ? 'border-top:1px solid var(--line)' : ''}"><span class="shoulders" style="width:40px;font-size:22px;font-weight:900">${m.code}</span>
        <div style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600">${esc(m.text)}</span><span class="courier meta" style="color:var(--text2)">${m.when}${m.context ? ' · ' + m.context : ''}</span></div>
        <span class="shoulders" style="font-size:20px;font-weight:900;color:var(--green)">+${m.pts}</span></div>`).join('')}</div>` : ''}</div>` : ''}
  ${awards.length ? `<h2 class="cond" style="margin:6px 0 0;font-size:22px;font-weight:800;letter-spacing:.6px">EARNED TODAY</h2>
  <div style="display:flex;flex-direction:column;gap:8px">${awards.map(a => `<div class="card" style="border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;border-radius:12px;background:#2A2418;display:flex;align-items:center;justify-content:center;>${awardIcon(a.award, 28)}</div>
    <div style="flex-grow:1;display:flex;flex-direction:column;min-width:0"><span style="font-size:16px;font-weight:700">${esc(a.award.name)}${a.award.tiers && a.award.tiers.length > 1 ? ' · ' + ['', 'Bronze', 'Silver', 'Gold', 'Gold'][a.tier] : ''}</span><span class="courier meta" style="font-size:12px;color:var(--text2)">${esc(a.award.desc)}</span></div>
    <span style="font-size:14px;font-weight:600;color:var(--text2)">${esc(a.names.join(', '))}</span></div>`).join('')}</div>` : ''}
  ${g.note ? `<div class="card" style="padding:12px 16px"><span class="cond label" style="padding:0">GAME NOTE</span><div style="font-size:15px;line-height:1.45;margin-top:4px">${esc(g.note)}</div></div>` : ''}
</div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:28px 20px calc(var(--safe-bot) + 16px);display:flex;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 38%)">
  <button class="press cond mid-btn" style="height:56px;border-radius:28px" ${act('toast', 'Share cards arrive in test build 3.')}>SHARE CARD</button>
  <button class="big-btn cond press" style="height:56px;border-radius:28px" ${act('finalDone')}>DONE</button></div>`;
};

// ════════════ Game sheets ════════════
function gameMenuSheet() {
  const s = S.g.s, g = S.g.game;
  const dot = S.pending ? `<span style="width:8px;height:8px;border-radius:4px;background:var(--gold)"></span><span class="courier meta">Offline · ${S.pending} play${S.pending > 1 ? 's' : ''} will sync</span>`
    : `<span style="width:8px;height:8px;border-radius:4px;background:var(--green)"></span><span class="courier meta">All saved</span>`;
  const row = (a, arg, label, right = '', color = 'var(--text)') => `<button class="row press" ${act(a, arg)} style="min-height:52px"><span style="flex-grow:1;font-size:17px;font-weight:600;color:${color}">${label}</span>${right ? `<span class="courier meta">${right}</span>` : ICON.chev}</button>`;
  return `<div style="display:flex;align-items:center;justify-content:space-between"><h2 class="cond" style="margin:0;font-size:28px;font-weight:800">GAME MENU</h2><div style="display:flex;align-items:center;gap:6px">${dot}</div></div>
  <div class="list">${row('gLeave', 'stats', 'Stats')}${row('gLeave', 'awards', 'Awards')}${row('gLeave', 'settings', 'Settings')}${row('openSheet', 'rules', 'Rules')}</div>
  ${info('liveWhy', '<span class="courier meta">Does leaving end the game?</span>', 'No — your game stays live. Tap the LIVE bar at the bottom of any screen, or Resume on Home, to jump back.', '')}
  <div class="list">
    ${row('openSheet', 'fixMlb', 'Fix MLB score', esc(G.mlbLine(g).split(' · ').slice(0, 2).join(' · ') || `${s.mlb.away}–${s.mlb.home}`))}
    ${row('openSheet', 'matchup', 'Edit matchup', esc(shortTeam(g.home) || 'Teams'))}
    ${s.needsPick3 && !G.plays() ? '' : row('openSheet', 'endHalf', 'End half-inning', `${halfName(s).toLowerCase().replace(/^\w/, c => c.toUpperCase())} · ${s.outs} out`)}
    ${row('openSheet', 'endGame', 'End game', 'Asks to confirm', 'var(--orange)')}
    ${row('gLeave', 'home', 'Back to Home', 'Game stays live')}
  </div>`;
}
function rulesSheet() {
  const pts = [['K', 'Strikeout', 1], ['IPO', 'In play out', 1], ['1B', 'Single', 2], ['FC', "Fielder's choice", 2], ['BB', 'Walk', 3], ['HBP', 'Hit by pitch', 3], ['DP', 'Double play', 3], ['BU', 'Bunt', 4], ['SB', 'Stolen base', 4], ['2B', 'Double', 5], ['HR', 'Home run', 7], ['3B', 'Triple', 10]];
  const extras = [['+1', 'var(--gold)', 'Per run', 'Each run that scores on your correct call'], ['+7', 'var(--green)', 'Pick 3 bonus', 'Call the first 3 at-bats of a half-inning, in order'],
    ['+5', 'var(--green)', 'Confidence right', 'Turn confidence on for a pick and nail it'], ['−2', 'var(--orange)', 'Confidence wrong', 'Confidence on and missed']];
  const how = ['Priority picks first, then everyone else in order.', 'No two players can hold the same pick on an at-bat.', 'Score on an at-bat and you steal priority.',
    'Pick 3: only the first call has to differ from everyone else’s.', 'Miss a Pick 3 call and you pick one at a time for the rest of the half-inning.'];
  const mid = [['SB', 'Only the player who called the steal scores and sits out the rest of the at-bat. Everyone else’s pick still counts for the batter — calling a steal only takes SB, not the batter’s result.'],
    ['CS', 'An out, but nobody scores or loses points. Picks carry on. If it’s the third out, the at-bat doesn’t count.'], ['OTH', 'Intentional walk and anything else odd: the at-bat ends and nobody scores.']];
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">RULES</h2>
  <span class="cond label">POINTS</span>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">${pts.map(([c, n, p]) => `<div style="background:var(--sheetcard);border-radius:12px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;flex-direction:column"><span class="shoulders" style="font-size:20px;font-weight:900;line-height:1">${c}</span><span class="courier" style="font-size:9px;font-weight:700;color:var(--text2)">${n}</span></div><span class="shoulders" style="font-size:20px;font-weight:900;color:var(--gold)">${p}</span></div>`).join('')}</div>
  <div class="list">${extras.map(([v, c, t, d]) => `<div class="row" style="min-height:52px"><span class="shoulders" style="width:40px;font-size:22px;font-weight:900;color:${c}">${v}</span><div style="display:flex;flex-direction:column;padding:6px 0"><span style="font-size:15px;font-weight:700">${t}</span><span class="courier meta">${d}</span></div></div>`).join('')}</div>
  <span class="cond label">HOW PICKS WORK</span>
  <div class="list">${how.map((t, i) => `<div class="row" style="min-height:44px"><span class="cond" style="width:20px;font-size:18px;font-weight:800;color:var(--text4)">${i + 1}</span><span style="font-size:14px;line-height:1.4;padding:8px 0">${t}</span></div>`).join('')}</div>
  <span class="cond label">MID AT-BAT PLAYS</span>
  <div class="list">${mid.map(([c, t]) => `<div class="row" style="min-height:44px;align-items:flex-start"><span class="shoulders" style="width:40px;font-size:20px;font-weight:900;padding-top:8px">${c}</span><span style="font-size:14px;line-height:1.4;padding:8px 0">${t}</span></div>`).join('')}</div>`;
}
function fixMlbSheet() {
  const d = S.draft, g = S.g.game;
  if (d.mlbA == null) { d.mlbA = S.g.s.mlb.away; d.mlbH = S.g.s.mlb.home; }
  const st = (label, key) => `<div style="display:flex;align-items:center;justify-content:space-between;background:var(--sheetcard);border-radius:16px;padding:10px 14px">
    <span style="font-size:17px;font-weight:600">${esc(label)}</span><div style="display:flex;align-items:center;gap:16px">
    <button class="press" ${act('mlbStep', key + '|-1')} style="width:40px;height:40px;border-radius:20px;background:var(--card2);font-size:22px">−</button>
    <span class="shoulders num" style="width:36px;text-align:center;font-size:34px;font-weight:900">${d[key]}</span>
    <button class="press" ${act('mlbStep', key + '|1')} style="width:40px;height:40px;border-radius:20px;background:var(--card2);font-size:22px">+</button></div></div>`;
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">FIX MLB SCORE</h2>
  <span style="font-size:14px;line-height:1.45;color:var(--text2)">The app adds each play's runs for you. Fix it here if a run got missed.</span>
  ${st(shortTeam(g.away) || 'Away', 'mlbA')}${st(shortTeam(g.home) || 'Home', 'mlbH')}
  <button class="big-btn cond press" ${act('mlbSave')}>SAVE SCORE</button>`;
}
function matchupSheet() {
  const g = S.g.game;
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">EDIT MATCHUP</h2>
  <div class="list">
    <button class="row press" ${act('openSheet', 'pickTeam:away')}><span class="cond" style="width:48px;font-size:15px;font-weight:800;color:var(--text3)">AWAY</span><span style="flex-grow:1;font-size:17px;font-weight:600">${esc(g.away || 'Choose team')}</span>${ICON.chev}</button>
    <button class="row press" ${act('openSheet', 'pickTeam:home')}><span class="cond" style="width:48px;font-size:15px;font-weight:800;color:var(--text3)">HOME</span><span style="flex-grow:1;font-size:17px;font-weight:600">${esc(g.home || 'Choose team')}</span>${ICON.chev}</button>
    <button class="row press" ${act('openSheet', 'park')}><span class="cond" style="width:48px;font-size:15px;font-weight:800;color:var(--text3)">PARK</span><span style="flex-grow:1;font-size:17px;font-weight:600">${esc(g.park || 'Choose park')}</span>${ICON.chev}</button>
  </div>`;
}
function endHalfSheet() {
  const s = S.g.s;
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">END THE ${esc(halfName(s))}?</h2>
  <span style="font-size:15px;line-height:1.45;color:var(--text2)">Use this if the half-inning ended and you missed an out. Picks not yet scored are dropped, and Pick 3 starts fresh next half.</span>
  <button class="big-btn cond press" ${act('endHalf')}>END HALF-INNING</button><button class="press cond mid-btn" ${act('closeSheet')}>KEEP PLAYING</button>`;
}
function endGameSheet() {
  const s = S.g.s, g = S.g.game, plays = G.plays(), over = Umpire.mlbGameOver(s);
  const sub = !plays ? 'Nothing’s been played yet, so this game won’t be saved.' : over ? 'That’s the ballgame. Results save as they stand.' : `It’s only the ${halfWords(s)}. Results save as they stand.`;
  return `<h2 class="cond" style="margin:0;font-size:30px;font-weight:800">${over ? 'FINAL' : 'END THE GAME?'}</h2>
  <span class="courier" style="font-size:13px;font-weight:700;color:var(--text2);line-height:1.45">${sub}</span>
  ${plays ? `<div class="list">${g.players.map((p, i) => `<div class="row" style="min-height:48px"><span style="flex-grow:1;font-size:17px;font-weight:600">${esc(p.name)}</span><span class="shoulders num" style="font-size:30px;font-weight:900">${s.scores[i]}</span></div>`).join('')}</div>
  <span class="cond label">GAME NOTE · OPTIONAL</span>
  <label class="field" style="background:var(--sheetcard);height:auto;padding:12px 14px"><textarea data-model="draft.note" rows="2" maxlength="280" placeholder="Rain delay, left after the 7th stretch…" style="flex-grow:1;background:none;border:0;outline:none;color:var(--text);font:500 16px -apple-system,system-ui;resize:none">${esc(S.draft.note || '')}</textarea></label>` : ''}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="press cond mid-btn" style="height:54px;border-radius:27px" ${act('closeSheet')}>KEEP PLAYING</button>
    <button class="press cond big-btn" style="height:54px;background:#E0502F" ${act('endGame')} ${S.busy ? 'disabled' : ''}>END GAME</button></div>`;
}
function undoToast() {
  const u = S.g.undone;
  return `<div class="fade" style="position:absolute;left:14px;right:14px;bottom:calc(var(--safe-bot) + 96px);z-index:24;background:#2C2C31;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 010 10h-2"/></svg>
    <div style="flex-grow:1;display:flex;flex-direction:column;min-width:0"><span class="cond" style="font-size:18px;font-weight:800;letter-spacing:.4px">UNDID LAST ${u.what}</span><span class="courier meta" style="color:var(--text2)">${esc(u.detail)}</span></div>
    <button class="press cond" ${act('gRedo')} style="height:34px;padding:0 14px;border-radius:17px;background:#F5F5F7;color:#000;font-size:16px;font-weight:800">REDO</button></div>`;
}
Object.assign(SHEETS, { gameMenu: gameMenuSheet, rules: rulesSheet, fixMlb: fixMlbSheet, matchup: matchupSheet, endHalf: endHalfSheet,
  endGame: endGameSheet, addPlayer: addPlayerSheet, park: parkSheet, pickTeam: pickTeamSheet });

// The one "game" screen shows whichever step the scorebook is on
SCREENS.game = () => {
  if (!S.g) return SCREENS.home();
  const v = G.view();
  return (SCREENS[v] || SCREENS.pick)() + (S.g.undone && v !== 'after' ? undoToast() : '');
};

// ── Live bar (above the tab bar while a game is live) + Home's resume card ──
function liveBar() {
  if (!S.g || S.g.s.ended) return '';
  const s = S.g.s, g = S.g.game;
  return `<button class="press" ${act('resume')} style="position:absolute;z-index:11;left:16px;right:16px;bottom:calc(max(12px, calc(var(--safe-bot) - 11px)) + 72px);height:48px;border-radius:24px;background:#26262A;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 8px 24px rgba(0,0,0,.5)">
    <span class="live" style="width:8px;height:8px;border-radius:4px;background:var(--live)"></span><span class="cond" style="font-size:15px;font-weight:800;letter-spacing:.8px;color:var(--livetext)">LIVE</span>
    <span class="cond" style="font-size:15px;font-weight:700;color:var(--text2)">${halfName(s)}</span>
    <span style="flex-grow:1;text-align:left;font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${g.players.map((p, i) => esc(p.name) + ' ' + s.scores[i]).join(' · ')}</span>
    <span class="cond" style="font-size:15px;font-weight:800;color:var(--link)">RETURN ›</span></button>`;
}
function resumeCard() {
  if (!S.g || S.g.s.ended) return '';
  const s = S.g.s, g = S.g.game;
  const hrs = (Date.now() - (g.startedAt || Date.now())) / 36e5;
  const lead = Math.max(...s.scores);
  return `<div class="card" style="border-radius:22px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:7px"><span class="live" style="width:8px;height:8px;border-radius:4px;background:var(--live)"></span><span class="cond" style="font-size:16px;font-weight:800;letter-spacing:.8px;color:var(--livetext)">LIVE</span></div>
      <span class="cond" style="font-size:16px;font-weight:700;letter-spacing:.6px;color:var(--text2)">${halfName(s)} · ${s.outs} OUT</span></div>
    ${g.players.map((p, i) => `<div style="display:flex;align-items:center;justify-content:space-between;height:44px"><span style="font-size:21px;font-weight:${s.scores[i] === lead ? 700 : 600};color:${s.scores[i] === lead ? 'var(--text)' : 'var(--text2)'}">${esc(p.name)}</span><span class="shoulders num" style="font-size:44px;font-weight:900;color:${s.scores[i] === lead ? 'var(--text)' : 'var(--text2)'}">${s.scores[i]}</span></div>`).join('')}
    ${G.mlbLine(g) ? `<span class="courier" style="font-size:13px;font-weight:700;color:var(--text2)">${esc(G.mlbLine(g))}</span>` : ''}
    ${hrs >= 12 ? `<span class="courier" style="font-size:12px;font-weight:700;color:var(--gold)">Still going? Started ${Math.floor(hrs)} hours ago — end it from the game menu if it's over.</span>` : ''}
    <button class="press cond big-btn" style="margin-top:4px;height:50px;font-size:21px" ${act('resume')}>RESUME GAME</button></div>`;
}

// ════════════ Sounds, buzz, screen awake ════════════
const Sound = {
  ctx: null,
  play(kind) {
    if (!S.settings.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, t = c.currentTime;
      const notes = kind === 'award' ? [784, 988, 1175, 1568] : kind === 'right' ? [880, 1319] : [220];
      notes.forEach((f, k) => {
        const o = c.createOscillator(), gn = c.createGain();
        o.type = kind === 'miss' ? 'sine' : 'triangle'; o.frequency.value = f;
        gn.gain.setValueAtTime(0.0001, t + k * 0.09); gn.gain.exponentialRampToValueAtTime(0.18, t + k * 0.09 + 0.02);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.09 + (kind === 'award' ? 0.35 : 0.22));
        o.connect(gn).connect(c.destination); o.start(t + k * 0.09); o.stop(t + k * 0.09 + 0.4);
      });
    } catch (e) { /* no sound available */ }
  },
};
const Awake = {
  lock: null,
  async on() { if (!S.settings.awake || this.lock || !('wakeLock' in navigator)) return; try { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } catch (e) { /* not allowed */ } },
  off() { if (this.lock) { this.lock.release().catch(() => {}); this.lock = null; } },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.screen === 'game') Awake.on(); });

// ════════════ Game actions ════════════
function openGame(game) {
  S.g = { game, s: null, pending: { p3: {}, picks: {} }, sel: null, p3sel: [], res: { outcome: null, runs: 0, extraOuts: 0 }, view: null, history: null, popup: null };
  G.replay();
  const last = G.lastEvent();
  if (last && last.type === 'play') S.g.view = 'after';
  loadGameHistory();
}
async function loadGameHistory() {
  const g = S.g && S.g.game; if (!g || !FCab) return;
  try { const h = await withTimeout(FCab.historyOf(g.players.map(p => p.id)), 20000); if (S.g && S.g.game === g) S.g.history = h.filter(x => x.id !== g.id); }
  catch (e) { if (S.g) S.g.history = []; }
}
async function saveEvent(ev) {
  const probe = { ...S.g.game, events: S.g.game.events.concat([ev]) };
  Umpire.replay({ players: probe.players.map(p => p.name), priority: probe.setup.priority }, probe.events);   // throws if the rules say no
  S.g.undone = null;
  const p = FCab.addEvent(S.g.game, ev);
  G.replay();
  p.catch(e => toast('Couldn’t save: ' + e.message, true));
}
function afterPlayFx() {
  const idx = S.g.game.events.length - 1;
  const { entries } = lastPlayInfo();
  const right = entries.some(e => e.correct);
  Sound.play(right ? 'right' : 'miss'); if (right) buzz();
  if (S.g.history) {
    const cp = G.copy();
    const got = Statistician.awardsInGame(S.g.history.concat([cp]), cp).filter(a => a.at === idx);
    if (got.length) {
      Popup.show(got); Sound.play('award'); buzz();
    }
  }
}
function describeEvent(ev) {
  const g = S.g.game;
  if (ev.type === 'play') {
    const before = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events);
    const after = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events.concat([ev]));
    const diffs = after.scores.map((v, i) => v - before.scores[i]).map((d, i) => (d ? `${g.players[i].name} ${signed(-d)}` : '')).filter(Boolean);
    return { what: 'PLAY', detail: [code(ev.outcome) + (ev.runs ? `, ${ev.runs} run${ev.runs > 1 ? 's' : ''}` : ''), ...diffs, 'back to AB ' + before.ab].join(' · ') };
  }
  if (ev.type === 'pick3') return { what: 'PICK 3', detail: 'Pick 3 is open again' };
  if (ev.type === 'nextHalf') return { what: 'HALF-INNING CHANGE', detail: 'Back to the last play' };
  if (ev.type === 'mlb') return { what: 'SCORE FIX', detail: 'MLB score put back' };
  return { what: 'CHANGE', detail: '' };
}

Object.assign(ACT, {
  newGame: async () => {

  },
  ngCustom: side => { S.draft.custom = S.draft.custom === side ? null : side; render(); },
  ngCustomSave: side => {

    else { const f = { [side]: t }; if (side === 'home' && park) f.park = park; FCab.updateGameInfo(S.g.game, f); }
    S.draft = {}; S.sheet = S.screen !== 'game' ? null : { name: 'matchup' }; render();
  },
  ngPark: () => {

    S.draft = {}; render();
  },
  ngParkReset: () => { S.ng.park = ''; S.sheet = null; render(); },
  startGame: async () => {
    const n = S.ng; S.busy = true; render();
    try {
      const game = await FCab.startGame({ players: n.players.map(p => ({ id: p.id, name: p.name })), priority: n.priority,
        away: n.away, home: n.home, park: n.park || TEAMS[n.home] || '' });
      S.busy = false; openGame(game); S.stack = []; S.screen = 'game'; render(); Awake.on();
    } catch (e) { S.busy = false; render(); toast(e.message, true); }
  },
  resume: () => { if (!S.g) return; S.sheet = null; S.stack = []; S.screen = 'game'; render(); Awake.on(); },
  gLeave: where => { S.sheet = null; Awake.off(); if (where === 'home') { S.stack = []; go('home', {}, false); loadHome(); } else if (where === 'settings') { S.stack = []; go('settings', {}, false); } else ACT.tab(where); },

  // Pick 3
  p3Pick: o => { S.g.p3sel = (S.g.p3sel || []).concat([o]).slice(0, 3); buzz(); render(); },
  p3Unpick: k => { S.g.p3sel = S.g.p3sel.slice(0, +k); render(); },
  p3Skip: () => { S.g.pending.p3[G.p3Next()] = null; S.g.p3sel = []; afterP3Choice(); },
  p3Lock: () => { S.g.pending.p3[G.p3Next()] = S.g.p3sel; S.g.p3sel = []; buzz(); afterP3Choice(); },

  // Picks
  pickSel: o => { S.g.sel = { pick: o, conf: (S.g.sel || {}).conf || false }; buzz(); render(); },
  pickConf: () => { S.g.sel = { ...(S.g.sel || {}), conf: !(S.g.sel || {}).conf }; render(); },
  pickLock: () => { S.g.pending.picks[G.pickNext()] = { pick: S.g.sel.pick, conf: !!S.g.sel.conf }; S.g.sel = null; buzz(); render(); },

  // What happened
  resSel: o => { S.g.res.outcome = o; buzz(); render(); },
  resStep: arg => { const [k, d] = arg.split('|'); S.g.res[k] = Math.max(0, S.g.res[k] + (+d)); render(); },
  resSave: async () => {
    const r = S.g.res;
    const ev = { type: 'play', outcome: r.outcome, picks: S.g.pending.picks, runs: r.runs, extraOuts: r.extraOuts };
    try { await saveEvent(ev); } catch (e) { return toast(e.message, true); }
    S.g.pending.picks = {}; S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; S.g.view = 'after';
    afterPlayFx(); render(); const p = $app().querySelector('.fixedpage'); if (p) p.scrollTop = 0;
  },
  gNext: async next => {
    Popup.clear();
    if (next === 'END GAME') { S.draft = {}; S.sheet = { name: 'endGame' }; render(); return; }
    if (next === 'NEXT HALF-INNING') await saveEvent({ type: 'nextHalf' });
    S.g.view = null; render();
  },
  gBack: () => {
    const g = S.g;
    if (g.view === 'after') return;
    const v = G.view();
    if (v === 'pick3' && g.p3sel.length) { g.p3sel = g.p3sel.slice(0, -1); return render(); }
    if (v === 'pick3') { const done = G.order().filter(j => j in g.pending.p3); if (done.length) { delete g.pending.p3[done.pop()]; return render(); } }
    if ((v === 'pick' || v === 'result') && Object.keys(g.pending.picks).length) {
      if (v === 'result' && g.res.outcome) { g.res = { outcome: null, runs: 0, extraOuts: 0 }; }
      const order = Umpire.pickOrder(g.s).filter(j => g.pending.picks[j]); const j = order.pop();
      g.sel = g.pending.picks[j]; delete g.pending.picks[j]; return render();
    }
    const last = G.lastEvent();
    if (last && last.type === 'play') { g.view = 'after'; return render(); }
    ACT.gLeave('home');
  },
  gUndo: async () => {
    const ev = G.lastEvent(); if (!ev) return;
    await FCab.undo(S.g.game).catch(e => toast(e.message, true));
    G.replay();
    Popup.clear();
    S.g.undone = { ev, ...describeAfterUndo(ev) };
    if (ev.type === 'play') { S.g.pending.picks = { ...(ev.picks || {}) }; S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; S.g.view = null; }
    else if (ev.type === 'pick3') { S.g.pending.p3 = {}; S.g.view = null; }
    else if (ev.type === 'nextHalf') { S.g.view = 'after'; }
    else S.g.view = null;
    render();
    clearTimeout(ACT.gUndo.t); ACT.gUndo.t = setTimeout(() => { if (S.g && S.g.undone) { S.g.undone = null; render(); } }, 6000);
  },
  gRedo: async () => {
    const u = S.g.undone; if (!u) return;
    try { await saveEvent(u.ev); } catch (e) { return toast(e.message, true); }
    S.g.pending = { p3: {}, picks: {} }; S.g.res = { outcome: null, runs: 0, extraOuts: 0 };
    S.g.view = u.ev.type === 'play' || u.ev.type === 'nextHalf' ? (u.ev.type === 'play' ? 'after' : null) : null;
    render();
  },

  // Menu actions
  mlbStep: arg => { const [k, d] = arg.split('|'); S.draft[k] = Math.max(0, S.draft[k] + (+d)); render(); },
  mlbSave: async () => { try { await saveEvent({ type: 'mlb', away: S.draft.mlbA, home: S.draft.mlbH }); } catch (e) { return toast(e.message, true); } S.sheet = null; S.draft = {}; S.g.view = S.g.view; render(); toast('MLB score updated'); },
  endHalf: async () => { S.g.pending = { p3: {}, picks: {} }; S.g.res = { outcome: null, runs: 0, extraOuts: 0 }; try { await saveEvent({ type: 'nextHalf' }); } catch (e) { return toast(e.message, true); } S.sheet = null; S.g.view = null; render(); },
  endGame: async () => {
    const g = S.g.game, s = S.g.s, plays = G.plays();
    S.busy = true; render();
    try {
      await FCab.endGame(g, { scores: s.scores.slice(), mlb: { away: s.mlb.away, home: s.mlb.home }, note: (S.draft.note || '').trim() });
      S.busy = false; S.sheet = null; Awake.off();
      if (!plays) { S.g = null; S.stack = []; go('home', {}, false); toast('Game thrown out — nothing was played'); loadHome(); return; }
      const done = { ...g, events: g.events.slice(), ended: true };
      const hist = S.g.history || [];
      const all = hist.concat([done]);
      const sum = Statistician.summary(done, all);
      const got = Statistician.awardsInGame(all, done);
      const merged = [];
      got.forEach(a => { const m = merged.find(x => x.award.id === a.award.id && x.tier === a.tier); if (m) m.names.push(a.name); else merged.push({ ...a, names: [a.name] }); });
      S.final = { game: done, sum, awards: merged, open: false };
      S.g = null; S.stack = []; S.screen = 'final'; render(); Sound.play('award');
    } catch (e) { S.busy = false; render(); toast(e.message, true); }
  },
  finalPlays: () => { S.final.open = !S.final.open; render(); },
  finalDone: () => { S.final = null; S.stack = []; go('home', {}, false); loadHome(); },
});
function describeAfterUndo(ev) {
  // score change shown as what got taken back
  const g = S.g.game;
  if (ev.type !== 'play') return describeEvent(ev);
  const before = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events);
  const after = Umpire.replay({ players: g.players.map(p => p.name), priority: g.setup.priority }, g.events.concat([ev]));
  const diffs = after.scores.map((v, i) => v - before.scores[i]).map((d, i) => (d ? `${g.players[i].name} ${signed(-d)}` : '')).filter(Boolean);
  return { what: 'PLAY', detail: [code(ev.outcome) + (ev.runs ? `, ${ev.runs} run${ev.runs > 1 ? 's' : ''}` : ''), ...diffs, 'back to AB ' + before.ab].join(' · ') };
}
function afterP3Choice() {
  if (G.p3Next() === undefined) {
    const picks = S.g.game.players.map((_, i) => S.g.pending.p3[i] || null);
    saveEvent({ type: 'pick3', picks }).then(() => { S.g.pending.p3 = {}; render(); }).catch(e => { S.g.pending.p3 = {}; toast(e.message, true); render(); });
    return;
  }
  render();
}

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const niceDate = (iso, withDay) => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d);
  return (withDay ? dt.toLocaleDateString('en-US', { weekday: 'short' }) + ', ' : '') + `${MON[m - 1]} ${d}, ${y}`; };
const pctText = v => (v == null ? '—' : Math.round(v * 100) + '%');
const H2H_A = '#2F6FE4', H2H_B = '#C9392E';

// ── The games for the selected club (shared by Home and Stats) ──
function scopeGames() { return (S.data && S.data.key === S.scope) ? S.data.games : null; }
async function loadScopeGames(force) {
  const key = S.scope, cacheKey = 'gb_games_' + S.user.uid + '_' + key;
  if (!force && S.data && S.data.key === key && S.data.games) return S.data.games;
  if (!S.data || S.data.key !== key) S.data = { key, games: Store.json(cacheKey, null), loading: true };
  render();
  try {
    const games = (await withTimeout(FCab.loadGames(key === 'mine' ? { mine: true } : { club: key }), 15000)).filter(g => g.ended !== false);
    if (S.scope !== key) return null;

  } catch (e) { S.data.loading = false; if (!S.data.games) toast('Couldn’t load games — check your connection', true); }
  render();
  return S.data.games;
}

function seasonSheet() {
  const games = scopeGames() || [];
  const list = ['ALL TIME', ...Statistician.seasons(games).map(String)];
  const cur = S.statSeason || 'ALL TIME';
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">SEASON</h2>
  <div class="list">${list.map(y => `<button class="row press" ${act('pickSeason', y)}><span class="cond" style="flex-grow:1;font-size:20px;font-weight:800;letter-spacing:.4px">${y}</span>${ICON.check(y === cur ? 'var(--link)' : 'transparent')}</button>`).join('')}</div>`;
}

function statsHistory(games) {

  const total = games.length;

    const meta = [g.doubleheader, g.away && g.home ? `${shortTeam(g.away)} at ${shortTeam(g.home)}` : '', g.park].filter(Boolean).join(' · ');
    return `<button class="card press" ${act('openGame', g.id)} style="width:100%;border-radius:18px;padding:10px 16px;display:flex;align-items:center;gap:14px;text-align:left">
      <div style="width:40px;display:flex;flex-direction:column;align-items:center;flex-shrink:0"><span class="cond" style="font-size:14px;font-weight:800;color:var(--text3);letter-spacing:.6px">${MONTHS[+d[1] - 1]}</span><span class="shoulders num" style="font-size:26px;font-weight:900;line-height:1">${+d[2]}</span></div>
      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:1px">
        ${g.players.map((p, i) => `<div style="display:flex;justify-content:space-between;align-items:center;height:24px;color:${i === 0 && !g.tie ? 'var(--text)' : (g.tie && p.outcome === 'T' ? 'var(--text)' : 'var(--text2)')}">
          <span style="font-size:16px;font-weight:${i === 0 ? 700 : 500};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="shoulders num" style="font-size:21px;font-weight:900">${p.score}</span></div>`).join('')}
        ${tag || meta ? `<div style="display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0">${tag}<span class="courier meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(meta)}</span></div>` : ''}
      </div></button>`;
  };
  return `<button class="press cond mid-btn" style="height:44px;font-size:17px" ${act('addGame')}>${ICON.plus} ADD A PAST GAME</button>
  ${hist.map((s, k) => `<div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:${k ? 8 : 0}px"><h2 class="cond" style="margin:0;font-size:30px;font-weight:800">${s.season}</h2>
    <span class="courier meta">${s.games.length} game${s.games.length > 1 ? 's' : ''}${k === 0 ? ' · ' + total + ' all time' : ''}</span></div>
    <div style="display:flex;flex-direction:column;gap:10px">${s.games.map(card).join('')}</div>`).join('')}`;
}

function statsRecords(games) {
  const recs = Statistician.records(games);
  const fmt = r => {
    switch (r.label) {
      case 'BIGGEST WIN': return ['+' + r.value, r.who, `${niceDate(r.date)} · ${r.extra.score} to ${r.extra.loserScore}`];
      case 'WIN STREAK': return [r.value, r.who, 'Games in a row'];
      case 'MOST WINS': return [r.value, r.who, 'All time'];
      case 'BEST ACCURACY': return [pctText(r.value), r.who, `${niceDate(r.date)} · ${r.extra.picks} picks`];
      case 'MOST GAMES': return [r.value, r.who, 'Since ' + r.since];
      case 'SEASONS': return [r.value, 'Club history', r.from === r.to ? String(r.from) : `${r.from} – ${r.to}`];
      case 'BEST HALF-INNING': return ['+' + r.value, r.who, niceDate(r.date)];
      case 'BIGGEST COMEBACK': return [r.value, r.who, 'Down by this much, still won'];
      case 'LONGEST PICK STREAK': return [r.value, r.who, 'Right in a row · ' + niceDate(r.date)];
      default: return [String(r.value).replace('-', '−'), r.who, niceDate(r.date)];
    }
  };
  const hasInGame = recs.some(r => r.label === 'BEST HALF-INNING');
  return `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${recs.map(r => { const [v, who, when] = fmt(r);
    return `<div class="card" style="border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;min-width:0">
      <span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${r.label}</span>
      <span class="shoulders" style="font-size:38px;font-weight:900;line-height:1.05">${v}</span>
      <span style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(who)}</span>
      <span class="courier" style="font-size:10px;font-weight:700;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(when)}</span></div>`; }).join('')}</div>
  ${hasInGame ? '' : `<span class="courier meta" style="line-height:1.5;padding:0 2px">In-game records (best half-inning, biggest comeback, longest pick streak) start with the first new-app game.</span>`}`;
}

function statsH2H(games) {
  const people = Statistician.standings(games).sort((a, b) => b.games - a.games);
  if (people.length < 2) return `<div class="card" style="padding:18px;color:var(--text2);font-size:15px">Head to head needs at least two players.</div>`;
  let a = S.h2hA && people.find(p => p.id === S.h2hA) ? S.h2hA : (people.find(p => p.id === S.user.uid) || people[0]).id;
  const opps = Statistician.opponents(games, a);
  let b = S.h2hB && opps.find(o => o.id === S.h2hB) ? S.h2hB : (opps[0] || {}).id;
  S.h2hA = a; S.h2hB = b;
  const nameOf = id => (people.find(p => p.id === id) || {}).name || '?';
  const picker = (side, id, color) => `<button class="press cond" ${act('openSheet', 'h2hPick:' + side)} style="flex:1;min-width:0;height:44px;border-radius:12px;background:var(--card);border-bottom:3px solid ${color};font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;white-space:nowrap">${esc(nameOf(id))} ${ICON.down}</button>`;
  if (!b) return `<div style="display:flex;align-items:center;gap:10px">${picker('a', a, H2H_A)}</div><div class="card" style="padding:18px;color:var(--text2)">${esc(nameOf(a))} hasn't played anyone here yet.</div>`;
  const h = Statistician.h2h(games, a, b);
  const lead = h.leader ? nameOf(h.leader === 'a' ? a : b) + ' leads' : 'All square';
  const initial = id => esc(nameOf(id)[0].toUpperCase());
  const row = (label, va, vb) => `<div style="display:grid;grid-template-columns:70px 1fr 70px;align-items:center;height:48px;border-top:1px solid var(--line)">
    <span class="shoulders num" style="font-size:24px;font-weight:900">${va}</span><span class="cond" style="text-align:center;font-size:15px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${label}</span><span class="shoulders num" style="text-align:right;font-size:24px;font-weight:900">${vb}</span></div>`;
  const streak = side => (h[side].current ? 'W' + h[side].current : '—');
  return `<div style="display:flex;align-items:center;gap:10px">${picker('a', a, H2H_A)}<span class="cond" style="font-size:16px;font-weight:800;color:var(--text3)">VS</span>${picker('b', b, H2H_B)}</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0">
    <div style="display:flex;align-items:baseline;gap:16px"><span class="shoulders" style="font-size:80px;font-weight:900;line-height:1;color:${H2H_A}">${h.a.wins}</span><span class="shoulders" style="font-size:36px;font-weight:800;color:var(--text4)">–</span><span class="shoulders" style="font-size:80px;font-weight:900;line-height:1;color:${H2H_B}">${h.b.wins}</span></div>
    <span class="courier" style="font-size:13px;font-weight:700;color:var(--text2)">${h.games} game${h.games === 1 ? '' : 's'}${h.since ? ' since ' + h.since : ''} · ${esc(lead)}</span></div>
  ${h.last10.length ? `<div class="card" style="border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between"><span class="cond" style="font-size:14px;font-weight:800;letter-spacing:.8px;color:var(--text3)">LAST ${h.last10.length}</span><span class="courier meta">oldest → newest</span></div>
    <div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px">${h.last10.map(w => `<span class="cond" style="height:30px;border-radius:7px;background:${w === 'a' ? H2H_A : H2H_B};color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800">${initial(w === 'a' ? a : b)}</span>`).join('')}</div></div>` : ''}
  <div class="card" style="border-radius:16px;padding:0 16px">
    ${row('AVG SCORE', h.a.avg == null ? '—' : h.a.avg.toFixed(1), h.b.avg == null ? '—' : h.b.avg.toFixed(1)).replace('border-top:1px solid var(--line)', '')}
    ${row('BIGGEST WIN', h.a.bestWin == null ? '—' : '+' + h.a.bestWin, h.b.bestWin == null ? '—' : '+' + h.b.bestWin)}
    ${row('LONGEST STREAK', h.a.longest, h.b.longest)}
    ${row('CURRENT STREAK', streak('a'), streak('b'))}</div>
  ${info('h2hwhy', '<span class="courier meta">What counts?</span>', 'Only the overall winner of a game beats the others. A tie, or a game a third player won, doesn’t count for either of you.', '')}`;
}
function h2hPickSheet() {
  const side = S.sheet.arg, games = scopeGames() || [];
  const people = Statistician.standings(games);
  let list;
  if (side === 'a') list = people.sort((x, y) => y.games - x.games).map(p => ({ id: p.id, name: p.name, n: p.games, sub: `${p.w}–${p.l}${p.t ? '–' + p.t : ''}` }));
  else list = Statistician.opponents(games, S.h2hA).map(o => { const h = Statistician.h2h(games, S.h2hA, o.id);
    const aName = (people.find(p => p.id === S.h2hA) || {}).name;
    return { id: o.id, name: o.name, n: o.games, sub: h.leader ? `${h.leader === 'a' ? aName : o.name} leads ${Math.max(h.a.wins, h.b.wins)}–${Math.min(h.a.wins, h.b.wins)}` : `Tied ${h.a.wins}–${h.b.wins}` }; });
  const cur = side === 'a' ? S.h2hA : S.h2hB;
  const aName = (people.find(p => p.id === S.h2hA) || {}).name || '';
  return `<h2 class="cond" style="margin:0;font-size:28px;font-weight:800">${side === 'a' ? 'PICK A PLAYER' : esc(aName.toUpperCase()) + ' VS…'}</h2>
  ${side === 'b' ? `<span class="courier meta">Only people ${esc(aName)} has played · ${esc(scopeName())}</span>` : ''}
  <div class="list">${list.map(p => `<button class="row press" ${act('h2hPick', side + '|' + p.id)} style="min-height:56px">
    <span style="width:32px;height:32px;border-radius:16px;background:var(--card3);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${esc(p.name[0].toUpperCase())}</span>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:17px;font-weight:600">${esc(p.name)}</span><span class="courier meta">${esc(p.sub)}</span></div>
    <span class="shoulders" style="font-size:20px;font-weight:800;color:var(--text2)">${p.n}</span>${ICON.check(p.id === cur ? 'var(--link)' : 'transparent')}</button>`).join('')}</div>
  <span class="courier meta" style="line-height:1.5">Number = games together. Switch to ALL MY GAMES to include people from other clubs.</span>`;
}

// ════════════ Past game ════════════
SCREENS.pastGame = () => {
  const games = scopeGames() || [];
  const g = games.find(x => x.id === S.params.id) || (S.params.game);
  if (!g) return `<div class="page"><div class="topbar">${backBtn()}</div><div class="card" style="padding:18px">This game isn't here anymore.</div></div>`;
  const sum = Statistician.summary(g, games), r = sum.result, n = g.players.length;
  const order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
  const nm = i => esc(g.players[i].name.toUpperCase());
  const headline = r.tie ? r.leaders.map(nm).join(' & ') + ' TIE' : nm(r.winner) + ' WINS';
  const mlb = g.mlb ? `${shortTeam(g.away) || 'Away'} ${g.mlb.away} at ${shortTeam(g.home) || 'Home'} ${g.mlb.home}` : (g.away && g.home ? `${shortTeam(g.away)} at ${shortTeam(g.home)}` : '');
  const host = g.era === 'app' ? (g.players.find(p => p.id === g.host) || {}).name : '';
  const meta = [mlb, g.park, host && 'hosted by ' + host, g.era === 'hand' && 'added by ' + g.addedBy].filter(Boolean).join(' · ');
  const mine = S.clubs.filter(c => c.captain).map(c => c.code);
  const canDelete = S.admin || (g.clubList || []).some(c => mine.includes(c)) || (g.era === 'hand' && g.host === S.user.uid);
  const canEdit = g.era === 'hand' && (g.host === S.user.uid || S.admin);
  const aw = S.params.awards;
  return `<div class="page">
  <div class="topbar" style="justify-content:space-between">${backBtn()}<span class="cond" style="font-size:18px;font-weight:800;letter-spacing:1px;color:var(--text2)">${niceDate(g.date, true).toUpperCase()}</span>
    <button class="back press" aria-label="Share card" ${act('shareCard', g.id)}><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2M5 4.5L8 1.5l3 3M3 8v5.5h10V8"/></svg></button></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0">
    <span class="cond" style="font-size:${headline.length > 22 ? 30 : headline.length > 16 ? 36 : 44}px;font-weight:800;line-height:1.05;text-align:center;overflow-wrap:anywhere">${headline}</span>
    ${n === 3 && !r.tie ? `<div style="display:flex;align-items:flex-end;gap:22px">${order.map((i, k) => `<div style="display:flex;flex-direction:column;align-items:center"><span class="shoulders" style="font-size:${k ? 44 : 64}px;font-weight:900;line-height:1;color:${k ? 'var(--text2)' : 'var(--text)'}">${r.scores[i]}</span><span style="font-size:13px;font-weight:600;color:var(--text2)">${esc(g.players[i].name)}</span></div>`).join('')}</div>`
      : `<div style="display:flex;align-items:baseline;gap:14px"><span class="shoulders" style="font-size:68px;font-weight:900;line-height:1">${r.scores[order[0]]}</span><span class="shoulders" style="font-size:32px;color:var(--text4)">–</span><span class="shoulders" style="font-size:68px;font-weight:900;line-height:1;color:${r.tie ? 'var(--text)' : 'var(--text2)'}">${r.scores[order[1]]}</span></div>`}
    ${meta ? `<span class="courier" style="font-size:12px;font-weight:700;color:var(--text2);text-align:center">${esc(meta)}</span>` : ''}
    ${g.era !== 'app' ? `<span class="cond tag" style="margin-top:4px">${g.era === 'beta' ? 'BETA' : g.era === 'hand' ? 'ADDED BY HAND' : 'PRE-APP'}</span>` : ''}</div>
  ${sum.lineScore ? lineScoreCard(false, g) : ''}
  ${sum.tiles ? `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${sum.tiles.map(t => {
    const fmt = v => (t.label === 'ACCURACY' ? pctText(v) : t.label === 'CONFIDENCE' ? v.join('–') : v);
    const sc = v => (t.label === 'CONFIDENCE' ? v[0] - v[1] : v == null ? -1 : v); const top = Math.max(...t.values.map(sc));
    return `<div class="card" style="border-radius:16px;padding:10px 14px"><span class="cond" style="font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--text3)">${t.label}</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${order.map(i => `<span class="shoulders" style="font-size:${n === 3 ? 22 : 26}px;font-weight:900;color:${sc(t.values[i]) === top ? 'var(--text)' : '#5E5E66'}">${fmt(t.values[i])}</span>`).join('')}</div></div>`; }).join('')}</div>` : ''}
  ${sum.plays.length ? `<h2 class="cond" style="margin:6px 0 0;font-size:22px;font-weight:800">PLAYS OF THE GAME</h2>
  <div class="card" style="padding:0 16px">${sum.plays.map((m, k) => `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;${k ? 'border-top:1px solid var(--line)' : ''}"><span class="shoulders" style="width:40px;font-size:22px;font-weight:900">${m.code}</span>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600">${esc(m.text)}</span><span class="courier meta" style="color:var(--text2)">${m.when}${m.context ? ' · ' + m.context : ''}</span></div>
    <span class="shoulders" style="font-size:20px;font-weight:900;color:var(--green)">+${m.pts}</span></div>`).join('')}</div>` : ''}
  ${aw && aw.length ? `<h2 class="cond" style="margin:6px 0 0;font-size:22px;font-weight:800">AWARDS EARNED</h2>
  <div style="display:flex;flex-direction:column;gap:8px">${aw.map(a => `<div class="card" style="border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px">
    <div style="width:36px;height:36px;border-radius:10px;background:#2A2418;display:flex;align-items:center;justify-content:center">${awardIcon(a.award, 26)}</div>
    <span style="flex-grow:1;font-size:16px;font-weight:700">${esc(a.award.name)}</span><span style="font-size:14px;font-weight:600;color:var(--text2)">${esc(a.names.join(', '))}</span></div>`).join('')}</div>` : ''}
  ${g.note ? `<div class="card" style="padding:12px 16px"><span class="cond label" style="padding:0">GAME NOTE</span><div style="font-size:15px;line-height:1.45;margin-top:4px">${esc(g.note)}</div></div>` : ''}
  ${canEdit ? `<button class="press cond mid-btn" style="margin-top:8px;font-size:18px" ${act('editGame', g.id)}>EDIT GAME</button>` : ''}
  ${canDelete ? `<button class="press cond mid-btn" style="font-size:18px;color:var(--orange);${canEdit ? '' : 'margin-top:8px'}" ${act('openSheet', 'deleteGame')}>DELETE GAME <span class="cond tag gold" style="font-size:10px;margin-left:4px">${S.admin && !(g.clubList || []).some(c => mine.includes(c)) ? 'ADMIN' : g.era === 'hand' && g.host === S.user.uid ? 'YOURS' : 'CAPTAINS'}</span></button>` : ''}
</div>`;
};

    <button class="row press" ${act('openSheet', 'pickTeam:home')}><span class="cond" style="width:48px;font-size:15px;font-weight:800;color:var(--text3)">HOME</span><span style="flex-grow:1;font-size:16px;color:${d.home ? 'var(--text)' : 'var(--text4)'}">${esc(d.home || 'Choose team')}</span>${ICON.chev}</button>
    <button class="row press" ${act('openSheet', 'park')}><span class="cond" style="width:48px;font-size:15px;font-weight:800;color:var(--text3)">PARK</span><span style="flex-grow:1;font-size:16px;color:${d.park || TEAMS[d.home] ? 'var(--text)' : 'var(--text4)'}">${esc(d.park || TEAMS[d.home] || 'Ballpark')}</span>${ICON.chev}</button></div>
  <span class="cond label">NOTE · OPTIONAL</span>
  <label class="field"><input data-model="ag.note" value="${attr(d.note)}" maxlength="280" placeholder="Anything worth remembering"></label>
  <button class="big-btn cond press" style="margin-top:6px" ${act('agSave')} data-ok="${ok ? 1 : 0}" ${ok && !S.busy ? '' : 'disabled'}>${editing ? 'SAVE CHANGES' : 'ADD GAME'}</button>
</div>`;
};

// ════════════ Share card (a picture made on the phone) ════════════
async function drawShareCard(g, sum, awards) {
  try { await document.fonts.ready; } catch (e) { /* fonts may not be loaded offline: system fonts are fine */ }
  const W = 540, H = 675, K = 2, c = document.createElement('canvas'); c.width = W * K; c.height = H * K;
  const x = c.getContext('2d'); x.scale(K, K);
  const F = (w, size, fam) => `${w} ${size}px ${fam}`;
  const COND = '"Barlow Condensed", -apple-system, sans-serif', SH = '"Big Shoulders Display", -apple-system, sans-serif', CO = '"Courier Prime", "Courier New", monospace', SYS = '-apple-system, "Helvetica Neue", sans-serif';
  x.fillStyle = '#0B0B0D'; x.fillRect(0, 0, W, H);
  // faint scorebook diamond watermark (the red double tapers into the outline at home plate)
  x.save(); x.globalAlpha = 0.06; x.translate(W + 120 - 420, -110); x.scale(3.5, 3.5);
  x.strokeStyle = '#F4F1E8'; x.lineWidth = 3; x.stroke(new Path2D('M60 5L115 60 60 115 5 60z'));
  x.fillStyle = '#D63A2F'; x.fill(new Path2D('M60 117.12L119.95 60 60 0.05 60 9.95 110.05 60 60 112.88z')); x.restore();
  const rr = (px, py, w, h, r, fill) => { x.beginPath(); x.roundRect(px, py, w, h, r); x.fillStyle = fill; x.fill(); };
  const text = (t, px, py, font, color, align = 'left') => { x.font = font; x.fillStyle = color; x.textAlign = align; x.fillText(t, px, py); };
  const fit = (t, max, font) => { x.font = font; let s = t; while (x.measureText(s).width > max && s.length > 2) s = s.slice(0, -2) + '…'; return s; };
  // wordmark
  text('Guess Ball', 36, 70, '36px Norican, cursive', '#F4F1E8');
  x.strokeStyle = '#D63A2F'; x.lineWidth = 1.5; x.save(); x.translate(36, 76); x.scale(.85, .85); x.stroke(new Path2D('M14 12C70 4 140 3 188 8')); x.setLineDash([1.4, 5.5]); x.lineWidth = 7; x.stroke(new Path2D('M14 12C70 4 140 3 188 8')); x.restore();
  const r = sum.result, n = g.players.length, order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
  text('FINAL', W - 36, 52, F(800, 16, COND), '#A1A1AA', 'right');
  text([niceDate(g.date), g.park].filter(Boolean).join(' · '), W - 36, 72, F(700, 13, CO), '#A1A1AA', 'right');
  if (g.mlb && (g.away || g.home)) text(`${shortTeam(g.away) || 'Away'} ${g.mlb.away} · ${shortTeam(g.home) || 'Home'} ${g.mlb.home}`, W - 36, 90, F(700, 13, CO), '#C7C7CC', 'right');
  // headline + score
  const nm = i => g.players[i].name.toUpperCase();
  const head = r.tie ? r.leaders.map(nm).join(' & ') + ' TIE' : nm(r.winner) + ' WINS';
  let hs = 54; x.font = F(800, hs, COND); while (x.measureText(head).width > W - 72 && hs > 30) { hs -= 2; x.font = F(800, hs, COND); }
  text(head, 36, 160, F(800, hs, COND), '#F5F5F7');
  let y = 250;
  if (r.tie) { text(`${r.scores[r.leaders[0]]}`, 36, y, F(900, 96, SH), '#F5F5F7'); x.font = F(900, 96, SH); let w = x.measureText(String(r.scores[r.leaders[0]])).width;
    text('–', 36 + w + 14, y - 10, F(800, 44, SH), '#5E5E66'); text(`${r.scores[r.leaders[1]]}`, 36 + w + 50, y, F(900, 96, SH), '#F5F5F7'); w += 50 + x.measureText(String(r.scores[r.leaders[1]])).width;
    text('DEAD EVEN', 36 + w + 20, y - 8, F(800, 22, COND), '#8E8E96');
  } else {
    const top = String(r.scores[order[0]]); text(top, 36, y, F(900, 96, SH), '#F5F5F7'); x.font = F(900, 96, SH); const w = x.measureText(top).width;
    if (n === 2) { text('–', 36 + w + 14, y - 10, F(800, 44, SH), '#5E5E66'); text(String(r.scores[order[1]]), 36 + w + 50, y, F(900, 96, SH), '#8E8E96');
      x.font = F(900, 96, SH); const w2 = x.measureText(String(r.scores[order[1]])).width; text('OVER ' + nm(order[1]), 36 + w + 50 + w2 + 16, y - 8, F(800, 22, COND), '#8E8E96'); }
    else order.slice(1).forEach((i, k) => { const yy = y - 52 + k * 40; text(fit(`${k ? '3RD' : '2ND'} · ${nm(i)}`, 250, F(800, 20, COND)), 36 + w + 24, yy, F(800, 20, COND), '#A1A1AA'); text(String(r.scores[i]), W - 36, yy + 4, F(900, 30, SH), '#A1A1AA', 'right'); });
  }
  y += 22;
  // line score (app games)
  if (sum.lineScore) {
    const ls = sum.lineScore, inns = ls.innings.slice(-9), h = 32 + n * 36;
    rr(36, y, W - 72, h, 16, '#17171A');
    const x0 = 36 + 14 + 58, colW = (W - 72 - 28 - 58 - 40) / inns.length;
    inns.forEach((k, j) => text(String(k), x0 + colW * j + colW / 2, y + 22, F(700, 14, COND), '#8E8E96', 'center'));
    text('R', W - 50, y + 22, F(700, 14, COND), '#F5F5F7', 'right');
    g.players.forEach((p, i) => { const yy = y + 32 + i * 36 + 25; const lead = ls.totals[i] === Math.max(...ls.totals);
      text(fit(p.name, 56, F(700, 15, SYS)), 50, yy, F(lead ? 700 : 600, 15, SYS), lead ? '#F5F5F7' : '#A1A1AA');
      inns.forEach((k, j) => { const v = ls.rows[i][k - 1]; if (v != null) text(String(v), x0 + colW * j + colW / 2, yy, F(800, 19, SH), '#C7C7CC', 'center'); });
      text(String(ls.totals[i]), W - 50, yy + 1, F(900, 26, SH), lead ? '#F5F5F7' : '#A1A1AA', 'right'); });
    y += h + 16;
  }
  // play of the game
  const top = sum.plays[0];
  if (top) {
    rr(36, y, W - 72, 68, 16, '#17171A');
    x.save(); x.translate(50, y + 12); x.scale(44 / 58, 44 / 58); x.strokeStyle = '#5BD27A'; x.lineWidth = 5; x.lineJoin = 'round'; x.stroke(new Path2D('M29 53L53 29 29 5 5 29z')); x.restore();
    text(top.code, 72, y + 40, F(900, top.code.length > 2 ? 14 : 17, SH), '#F5F5F7', 'center');
    text('PLAY OF THE GAME', 108, y + 28, F(800, 13, COND), '#8E8E96');
    text(fit(`${top.text} · +${top.pts}`, W - 72 - 90, F(700, 16, SYS)), 108, y + 50, F(700, 16, SYS), '#F5F5F7');
    y += 84;
  }
  // awards
  if (awards && awards.length) {
    text('AWARDS', 36, y + 20, F(800, 13, COND), '#8E8E96');
    let cx = 100, cy = y;
    awards.slice(0, 6).forEach(a => {
      const label = `${a.award.name} · ${a.names.join(', ')}`; x.font = F(600, 13, SYS); const w = Math.min(x.measureText(label).width + 24, W - 72);
      if (cx + w > W - 36) { cx = 36; cy += 38; }
      rr(cx, cy, w, 30, 15, '#17171A'); text(fit(label, w - 24, F(600, 13, SYS)), cx + 12, cy + 20, F(600, 13, SYS), '#F5F5F7'); cx += w + 8;
    });
  }
  // footer: the club name only
  const club = (S.clubs.find(k => (g.clubList || []).includes(k.code)) || {}).name;
  if (club) text(club.toUpperCase(), W / 2, H - 26, F(800, 14, COND), '#5E5E66', 'center');
  return new Promise(res => c.toBlob(res, 'image/png'));
}
async function shareGame(g, sum, awards) {
  try {
    const blob = await drawShareCard(g, sum, awards);
    const file = new File([blob], `guess-ball-${g.date}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
  } catch (e) { if (e && e.name !== 'AbortError') toast('Couldn’t make the share card: ' + e.message, true); }
}

// ════════════ Actions ════════════
Object.assign(ACT, {
  statTab: t => { S.statTab = t; render(); const p = $app().querySelector('.page'); if (p) p.scrollTop = 0; },
  standOpen: id => { S.statOpen = S.statOpen === id ? null : id; render(); },
  pickSeason: y => { S.statSeason = y; S.sheet = null; render(); },
  h2hPick: arg => { const [side, id] = arg.split('|'); if (side === 'a') { S.h2hA = id; S.h2hB = null; } else S.h2hB = id; S.sheet = null; render(); },
  openGame: async id => {
    const g = (scopeGames() || []).find(x => x.id === id) || (S.adminGames || []).find(x => x.id === id) || ((S.aw && S.aw.games) || []).find(x => x.id === id);
    go('pastGame', { id, game: g, awards: null });
    if (!g || g.era === 'preapp' || g.era === 'hand') return;
    try {   // awards need everyone's full history — fetch it in the background
      const hist = await withTimeout(FCab.historyOf(g.players.map(p => p.id)), 20000);
      const got = Statistician.awardsInGame(hist.some(x => x.id === g.id) ? hist : hist.concat([g]), g);
      const merged = [];
      got.forEach(a => { const m = merged.find(x => x.award.id === a.award.id && x.tier === a.tier); if (m) m.names.push(a.name); else merged.push({ ...a, names: [a.name] }); });
      if (S.screen === 'pastGame' && S.params.id === id) { S.params.awards = merged; render(); }
    } catch (e) { /* offline: just no awards list */ }
  },
  deleteGame: async () => {
    const g = S.params.game || (scopeGames() || []).find(x => x.id === S.params.id);
    S.busy = true; render();
    try {
      await FCab.deleteGame(g);
      S.busy = false; S.sheet = null;
      if (S.data && S.data.games) S.data.games = S.data.games.filter(x => x.id !== g.id);
      if (S.adminGames) S.adminGames = S.adminGames.filter(x => x.id !== g.id);
      back(); toast('Game deleted — stats recalculated'); loadScopeGames(true); loadHome();
    } catch (e) { fail(e); }
  },
  shareCard: async id => {
    const g = S.params.game || (scopeGames() || []).find(x => x.id === id);
    await shareGame(g, Statistician.summary(g, scopeGames() || [g]), S.params.awards || []);
  },
  addGame: () => {
    S.ag = { date: new Date().toISOString().slice(0, 10), players: [{ id: S.user.uid, name: S.account.name, score: '' }], away: '', home: '', park: '', note: '' };
    S.ng = S.ag; S.ngRoster = null; go('addGame'); loadRoster();
  },
  editGame: id => {
    const g = S.params.game || (scopeGames() || []).find(x => x.id === id);
    S.ag = { id: g.id, game: g, date: g.date, players: g.players.map((p, i) => ({ id: p.id, name: p.name, score: String(g.scores[i]) })), away: g.away || '', home: g.home || '', park: g.park || '', note: g.note || '' };
    S.ng = S.ag; go('addGame');
  },
  agRemove: i => { S.ag.players.splice(+i, 1); render(); },
  agSave: async () => {
    const d = S.ag; S.busy = true; render();
    const scores = d.players.map(p => Math.round(+p.score));
    try {
      if (d.id) await FCab.editHandGame(d.game, { scores, date: d.date, away: d.away, home: d.home, park: d.park || TEAMS[d.home] || '', note: d.note });
      else await FCab.addHandGame({ players: d.players.map(p => ({ id: p.id, name: p.name })), scores, date: d.date, away: d.away, home: d.home, park: d.park || TEAMS[d.home] || '', note: d.note });
      S.busy = false; back(); if (d.id) back();
      toast(d.id ? 'Game updated' : 'Game added'); await loadScopeGames(true); loadHome();
    } catch (e) { fail(e); }
  },
  adminDelete: async () => {
    S.adminGames = null; go('adminGames');
    try {
      const all = await FCab.exportAll();
      const games = Object.values((all && all.games) || {}).filter(g => g.ended).map(g => ({ ...g, events: g.events ? Object.values(g.events) : undefined }));
      S.adminGames = games.sort((a, b) => (a.date < b.date ? 1 : -1)); render();
    } catch (e) { fail(e); }
  },
});
async function loadRoster() {
  try {
    const codes = S.scope === 'mine' ? S.clubs.filter(c => c.status === 'member').map(c => c.code) : [S.scope];
    const seen = {}, out = [];
    for (const c of codes) (await withTimeout(FCab.roster(c), 8000)).forEach(m => { if (!seen[m.pid] && m.pid !== S.user.uid) { seen[m.pid] = 1; out.push({ ...m, club: c }); } });
    S.ngRoster = out.sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { S.ngRoster = []; }
  render();
}

function awardIcon(a, px = 32, on = true) {

const tierNum = n => (n >= 1000 ? (n / 1000) + 'K' : String(n));
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

// ── Loading: every game any player in the club has played (awards are per person, across clubs) ──
async function loadAwards() {
  const key = S.scope, uid = S.user.uid, cacheKey = 'gb_aw_' + uid + '_' + key;
  if (!S.aw || S.aw.key !== key) S.aw = { key, games: Store.json(cacheKey, null), loading: true, cat: (S.aw && S.aw.cat) || 'ALL', pid: uid };
  S.aw.loading = true; render();
  try {
    const club = await loadScopeGames(true);
    if (S.scope !== key) return;
    const pids = [...new Set([uid].concat((club || []).flatMap(g => g.players.map(p => p.id))))];
    const games = (await withTimeout(FCab.historyOf(pids), 25000)).filter(g => g.ended !== false);
    if (!S.aw || S.aw.key !== key) return;
    S.aw.games = games; S.aw.loading = false;
    try { Store.put(cacheKey, games); } catch (e) { /* phone storage full: fine */ }
  } catch (e) { if (S.aw) { S.aw.loading = false; if (!S.aw.games) toast('Couldn’t load awards — check your connection', true); } }
  render();
}
// All games to work awards out from: the club's players' histories, plus a live game's players and the live game itself
function awardGames() {
  const base = (S.aw && S.aw.key === S.scope && S.aw.games) || [];
  if (!S.g || !S.g.game) return base;
  const key = [base, S.g.history, S.g.game.id, S.g.game.events.length].map(x => (Array.isArray(x) ? x.length : x)).join('|');
  if (awardGames.key === key && awardGames.base === base) return awardGames.val;
  const m = new Map(); base.concat(S.g.history || []).forEach(g => m.set(g.id, g)); m.set(S.g.game.id, G.copy());
  awardGames.key = key; awardGames.base = base; awardGames.val = [...m.values()];
  return awardGames.val;
}
const byTimeAw = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));

// People to pick from: everyone in the selected club (or everyone you've played), most games first
function awardPeople() {
  const club = scopeGames() || [], games = awardGames();
  const rows = Statistician.standings(club).sort((a, b) => b.games - a.games).map(p => ({ id: p.id, name: p.name, games: p.games }));
  if (!rows.some(r => r.id === S.user.uid)) rows.unshift({ id: S.user.uid, name: S.account.name, games: 0 });
  const book = Statistician.awardBook(games);
  rows.forEach(r => { r.earned = Object.keys((book[r.id] || { earned: {} }).earned).length; });
  return rows;
}
const awardPlayerName = id => ((awardPeople().find(p => p.id === id) || {}).name || (id === S.user.uid ? S.account.name : '')
  || ((awardGames().flatMap(g => g.players).find(p => p.id === id)) || {}).name || 'Player');

SCREENS.awards = () => {
  if (FCab && S.user && (!S.aw || S.aw.key !== S.scope)) setTimeout(loadAwards, 0);
  const aw = S.aw && S.aw.key === S.scope ? S.aw : null;
  const pid = (aw && aw.pid) || S.user.uid, cat = (aw && aw.cat) || 'ALL';
  let body;
  if (!aw || !aw.games) body = `<div class="card" style="padding:28px;display:flex;justify-content:center">${ICON.spinner}</div>`;
  else {
    const games = awardGames();
    const list = Statistician.awardsFor(games, pid);
    const got = list.filter(a => a.tier > 0).length;
    // Most recent game this player played, and what they won in it
    const last = games.filter(g => g.players.some(p => p.id === pid)).sort(byTimeAw).pop();
    const fresh = last ? list.filter(a => a.earnedAt.some(e => e.gameId === last.id)) : [];

  return `<div class="page tabbed">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h1 class="cond" style="margin:0;font-size:34px;font-weight:800;letter-spacing:.4px">AWARDS</h1>
    <button class="press" ${act('openSheet', 'awPlayer')} style="height:34px;padding:0 14px;border-radius:17px;background:var(--card);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;max-width:60%;overflow:hidden;white-space:nowrap">${esc(awardPlayerName(pid))} ${ICON.down}</button></div>
  <div class="chips" style="display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none">${chips}</div>
  ${body}
</div>${tabbar('awards')}${liveBar()}`;
