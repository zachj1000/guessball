<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Guess Ball data test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #F5F5F7; font: 16px -apple-system, system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size: 26px; margin: 0 0 4px; } .sub { color: #A1A1AA; font-size: 14px; margin: 0 0 20px; line-height: 1.4; }
  .card { background: #1C1C1F; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 15px; }
  .row span:first-child { color: #A1A1AA; } .row span:last-child { text-align: right; word-break: break-all; }
  button { display: block; width: 100%; height: 52px; border: 0; border-radius: 26px; margin-bottom: 10px;
           font: 700 17px -apple-system, system-ui, sans-serif; color: #fff; background: #2F6FE4; }
  button.alt { background: #2A2A2F; } button:disabled { opacity: .4; }
  #log { font: 13px ui-monospace, Menlo, monospace; white-space: pre-wrap; margin: 0; line-height: 1.5; }
  .ok { color: #5BD27A; } .bad { color: #FF6B5E; } .dim { color: #8E8E96; }
</style>
</head>
<body>
<h1>Data test</h1>
<p class="sub">Runs the new save-and-load code against the real Firebase using a throwaway test club, then deletes it. Your real games aren't touched.</p>
<div class="card">
  <div class="row"><span>Account</span><span id="who">—</span></div>
  <div class="row"><span>Account ID</span><span id="uid">—</span></div>
  <div class="row"><span>Connection</span><span id="conn">—</span></div>
</div>
<button id="signin" disabled>Sign in with Google</button>
<button id="run" disabled>Run the test</button>
<button id="copyuid" class="alt" disabled>Copy my account ID</button>
<button id="copyrules" class="alt">Copy the security rules</button>
<div class="card"><pre id="log"></pre></div>
<script>
// ════════════════════════════════════════════════════════════════
//  SECTION 2 — THE UMPIRE (game rules)
//  Pure functions only: no screen, no storage, no internet.
//  Give it the game setup + the scorebook (list of events) and it
//  works out everything about the game at that moment.
// ════════════════════════════════════════════════════════════════
const Umpire = (() => {

  // ── Outcome table (borrowed from v1.9) ──
  // pickable: players can choose it · outs: outs it adds · midAtBat: at-bat continues after it
  const OUTCOMES = [
    { id: 'strikeout',       label: 'STRIKEOUT',        pts: 1,  outs: 1, pickable: true  },
    { id: 'in_play_out',     label: 'IN PLAY OUT',      pts: 1,  outs: 1, pickable: true  },
    { id: 'double_play',     label: 'DOUBLE PLAY',      pts: 3,  outs: 2, pickable: true  },
    { id: 'fielders_choice', label: "FIELDER'S CHOICE", pts: 2,  outs: 1, pickable: true  },
    { id: 'bunt',            label: 'BUNT',             pts: 4,  outs: 0, pickable: true  },
    { id: 'walk',            label: 'WALK',             pts: 3,  outs: 0, pickable: true  },
    { id: 'hbp',             label: 'HBP',              pts: 3,  outs: 0, pickable: true  },
    { id: 'single',          label: 'SINGLE',           pts: 2,  outs: 0, pickable: true  },
    { id: 'double',          label: 'DOUBLE',           pts: 5,  outs: 0, pickable: true  },
    { id: 'triple',          label: 'TRIPLE',           pts: 10, outs: 0, pickable: true  },
    { id: 'home_run',        label: 'HOME RUN',         pts: 7,  outs: 0, pickable: true  },
    { id: 'stolen_base',     label: 'STOLEN BASE',      pts: 4,  outs: 0, pickable: true,  midAtBat: true },
    { id: 'caught_stealing', label: 'CAUGHT STEALING',  pts: 0,  outs: 1, pickable: false, midAtBat: true },
    { id: 'other',           label: 'OTHER',            pts: 0,  outs: 0, pickable: false },
  ];
  const BY_ID = Object.fromEntries(OUTCOMES.map(o => [o.id, o]));
  const PICKABLE = OUTCOMES.filter(o => o.pickable).map(o => o.id);

  const CONF_WIN = 5, CONF_LOSS = -2, P3_BONUS = 7;

  const outcome = id => BY_ID[id] || null;
  const halfKey = s => s.inning + (s.bottom ? 'b' : 't');

  // ── Fresh state for a new game ──
  function start(setup) {
    const n = setup.players.length;
    if (n < 2 || n > 3) throw new Error('Guess Ball needs 2 or 3 players');
    return {
      players: setup.players.slice(),
      scores: Array(n).fill(0),
      priority: setup.priority || 0,
      inning: 1, bottom: false, outs: 0,
      ab: 1,                 // at-bat number within this half-inning
      p3: null,              // { picks:[[a,b,c]|null…], alive:[bool…], hits:[n…] } — set by a pick3 event
      needsPick3: true,      // a Pick 3 round is owed at the start of every half-inning
      carried: {},           // manual picks that still stand after a steal: { playerIdx: {pick, conf} }
      sittingOut: [],        // players whose pick already resolved during this at-bat (called the steal)
      mlb: { away: 0, home: 0 },
      ended: false,
      log: [],               // one entry per resolved pick
      plays: [],             // one entry per result entered
    };
  }

  // Is this player playing Pick 3 on the current at-bat?
  function p3Live(s, i) {
    return !!(s.p3 && s.p3.picks[i] && s.p3.alive[i] && s.ab <= 3);
  }
  function p3PickNow(s, i) {
    return p3Live(s, i) ? s.p3.picks[i][s.ab - 1] : null;
  }

  // Players who still need to make a manual pick this at-bat, priority first, then seat order.
  // (Skips Pick 3 players, steal-callers sitting out, and picks carried over after a steal.)
  function pickOrder(s) {
    const order = [s.priority, ...s.players.map((_, i) => i).filter(i => i !== s.priority)];
    return order.filter(i => !p3Live(s, i) && !s.sittingOut.includes(i) && !s.carried[i]);
  }

  // Picks already locked for this at-bat (Pick 3 picks + steal carry-overs).
  function lockedPicks(s) {
    const locked = {};
    s.players.forEach((_, i) => {
      if (s.sittingOut.includes(i)) return;
      const p = p3PickNow(s, i);
      if (p) locked[i] = { pick: p, conf: false, fromP3: true };
      else if (s.carried[i]) locked[i] = { ...s.carried[i], fromP3: false };
    });
    return locked;
  }

  // Outcomes a player may NOT choose, given picks made so far this at-bat.
  function blocked(s, player, manualSoFar = {}) {
    const all = { ...lockedPicks(s), ...manualSoFar };
    return Object.entries(all).filter(([i]) => +i !== player).map(([, v]) => v.pick);
  }

  // Pick 3: only slot 1 must differ between players.
  function blockedP3First(p3SoFar, player) {
    return Object.entries(p3SoFar)
      .filter(([i, picks]) => +i !== player && picks && picks[0])
      .map(([, picks]) => picks[0]);
  }

  // ── Event handlers ──
  function applyPick3(s, ev) {
    if (!s.needsPick3) throw new Error('Pick 3 already made this half-inning');
    const firsts = new Set();
    s.players.forEach((_, i) => {
      const p = ev.picks[i];
      if (p == null) return; // skipped
      if (!Array.isArray(p) || p.length !== 3 || !p.every(x => PICKABLE.includes(x)))
        throw new Error('Pick 3 must be three valid outcomes');
      if (firsts.has(p[0])) throw new Error('Pick 3 first outcomes must all be different');
      firsts.add(p[0]);
    });
    s.p3 = {
      picks: s.players.map((_, i) => ev.picks[i] || null),
      alive: s.players.map((_, i) => !!ev.picks[i]),
      hits: s.players.map(() => 0),
    };
    s.needsPick3 = false;
  }

  function applyPlay(s, ev) {
    if (s.ended) throw new Error('Game is over');
    if (s.needsPick3) throw new Error('Pick 3 comes first this half-inning');
    if (s.outs >= 3) throw new Error('Three outs — start the next half-inning');
    const oc = outcome(ev.outcome);
    if (!oc) throw new Error('Unknown outcome ' + ev.outcome);
    const runs = ev.runs || 0, extraOuts = ev.extraOuts || 0;

    // Gather every pick standing on this at-bat and validate it.
    const picks = lockedPicks(s);
    const manual = ev.picks || {};
    const needed = pickOrder(s);
    needed.forEach(i => {
      if (!manual[i] || !PICKABLE.includes(manual[i].pick)) throw new Error(s.players[i] + ' has no pick');
    });
    Object.keys(manual).forEach(i => {
      if (!needed.includes(+i)) throw new Error(s.players[i] + ' should not be picking now');
      picks[i] = { pick: manual[i].pick, conf: !!manual[i].conf, fromP3: false };
    });
    const seen = new Set();
    Object.values(picks).forEach(p => {
      if (seen.has(p.pick)) throw new Error('Two players picked ' + p.pick);
      seen.add(p.pick);
    });

    const before = { priority: s.priority, scores: s.scores.slice() };
    const resolve = (i, correct) => {
      const p = picks[i];
      const base = correct ? oc.pts + runs : 0;
      const confPts = p.conf ? (correct ? CONF_WIN : CONF_LOSS) : 0;
      let p3Bonus = 0;
      if (p.fromP3) {
        if (correct) {
          s.p3.hits[i]++;
          if (s.ab === 3 && s.p3.hits[i] === 3) p3Bonus = P3_BONUS;
        } else s.p3.alive[i] = false;
      }
      const pts = base + confPts + p3Bonus;
      s.scores[i] += pts;
      s.log.push({ half: halfKey(s), ab: s.ab, player: i, pick: p.pick, conf: p.conf, fromP3: p.fromP3,
                   outcome: oc.id, runs, correct, pts, base, confPts, p3Bonus, hadPriority: before.priority === i });
      if (correct && i !== s.priority) s.priority = i;
    };

    const endsAtBat = !oc.midAtBat;
    const newOuts = s.outs + oc.outs + extraOuts;
    const halfOverMidAtBat = oc.midAtBat && newOuts >= 3; // caught stealing for out #3

    if (oc.id === 'stolen_base') {
      // Only the steal-caller resolves; everyone else's pick stands.
      const caller = Object.keys(picks).find(i => picks[i].pick === 'stolen_base');
      // (Pick 3 picks don't need carrying — they're re-read from the Pick 3 card.)
      Object.keys(picks).forEach(i => {
        if (+i !== +caller && !picks[i].fromP3) s.carried[i] = { pick: picks[i].pick, conf: picks[i].conf };
      });
      if (caller !== undefined) { resolve(+caller, true); s.sittingOut.push(+caller); }
    } else if (oc.id === 'caught_stealing') {
      // Nothing resolves; picks stand unless the inning just ended.
      Object.keys(picks).forEach(i => { if (!picks[i].fromP3) s.carried[i] = { pick: picks[i].pick, conf: picks[i].conf }; });
    } else {
      Object.keys(picks).forEach(i => resolve(+i, picks[i].pick === oc.id));
    }

    // Runs count toward the real MLB score for whichever team is batting (top = away, bottom = home).
    // Runs on a voided at-bat (caught stealing for out #3) still happened in the real game.
    if (runs) s.mlb[s.bottom ? 'home' : 'away'] += runs;

    s.outs = Math.min(3, newOuts);
    if (endsAtBat || halfOverMidAtBat) {
      // At-bat over: Pick 3 players who sat out after a correct steal keep their hit.
      s.carried = {}; s.sittingOut = [];
      if (endsAtBat) s.ab++;
    }
    s.plays.push({ half: halfKey(s), outcome: oc.id, runs, extraOuts,
                   priorityBefore: before.priority, priorityAfter: s.priority,
                   scoresBefore: before.scores, scoresAfter: s.scores.slice(), outsAfter: s.outs,
                   voided: halfOverMidAtBat });
  }

  function applyNextHalf(s) {
    if (s.ended) throw new Error('Game is over');
    if (s.bottom) { s.inning++; s.bottom = false; } else s.bottom = true;
    s.outs = 0; s.ab = 1; s.p3 = null; s.needsPick3 = true; s.carried = {}; s.sittingOut = [];
  }

  function apply(s, ev) {
    switch (ev.type) {
      case 'pick3':    applyPick3(s, ev); break;
      case 'play':     applyPlay(s, ev); break;
      case 'nextHalf': applyNextHalf(s); break;
      case 'mlb':      s.mlb = { away: ev.away | 0, home: ev.home | 0 }; break;
      case 'end':      s.ended = true; break;
      default: throw new Error('Unknown event ' + ev.type);
    }
    return s;
  }

  // Replay the whole scorebook from the start. Undo = drop the last event and replay.
  function replay(setup, events) {
    const s = start(setup);
    events.forEach(ev => apply(s, ev));
    return s;
  }

  // Would the real MLB game be over? (home leads after top 9+ is done, or away leads after bottom 9+)
  function mlbGameOver(s) {
    if (s.inning < 9) return false;
    if (s.bottom && s.mlb.home > s.mlb.away) return true;                 // walk-off / home leads
    if (s.bottom && s.outs >= 3 && s.mlb.away > s.mlb.home) return true;  // away wins
    if (!s.bottom && s.outs >= 3 && s.mlb.home > s.mlb.away) return true; // home leads after top 9+: no bottom half
    return false;
  }

  // Final result, ties handled.
  function result(s) {
    const top = Math.max(...s.scores);
    const leaders = s.scores.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
    return { tie: leaders.length > 1, winner: leaders.length === 1 ? leaders[0] : null, scores: s.scores.slice() };
  }

  return { OUTCOMES, PICKABLE, outcome, start, apply, replay, pickOrder, lockedPicks, blocked,
           blockedP3First, p3Live, p3PickNow, mlbGameOver, result, CONF_WIN, CONF_LOSS, P3_BONUS };
})();



// ════════════════════════════════════════════════════════════════
//  SECTION 3 — THE STATISTICIAN (stats and awards)
//  Pure functions only: no screen, no storage, no internet.
//  Give it a list of games and it works out standings, history,
//  records, head-to-head, game summaries and every award — always
//  from scratch, so a deleted or fixed game can never leave stale
//  numbers behind.
//
//  A game looks like this:
//  { id, date: '2026-09-25', seq: 1790000000000 (sort order within a day),
//    era: 'app' | 'beta' | 'preapp' | 'hand',
//    players: [{ id, name }, …]  (seat order, 2–3 players),
//    scores: [41, 29]            (final scores; app games get them from the events),
//    away, home, park, mlb: { away, home } | null, note, addedBy,
//    setup: { priority }, events: [...]   (app games only — the scorebook),
//    ended: true | false,                  (false = live game in progress)
//    beta: [{ correct, picks, confRight, confWrong }, …]  (beta games only) }
// ════════════════════════════════════════════════════════════════
const Statistician = (() => {
  const U = (typeof Umpire !== 'undefined') ? Umpire : require('./umpire.js');

  // ── Small helpers ──
  const byTime = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.seq || 0) - (b.seq || 0));
  const chrono = games => games.slice().sort(byTime);
  const season = g => +g.date.slice(0, 4);
  const hasPlays = g => g.era === 'app';
  const hasPickData = g => g.era === 'app' || g.era === 'beta';
  const CODES = { strikeout: 'K', in_play_out: 'IPO', double_play: 'DP', fielders_choice: 'FC', bunt: 'BU',
    walk: 'BB', hbp: 'HBP', single: '1B', double: '2B', triple: '3B', home_run: 'HR', stolen_base: 'SB',
    caught_stealing: 'CS', other: 'OTH' };
  const WORDS = { strikeout: 'strikeout', in_play_out: 'in-play out', double_play: 'double play',
    fielders_choice: "fielder's choice", bunt: 'bunt', walk: 'walk', hbp: 'hit by pitch', single: 'single',
    double: 'double', triple: 'triple', home_run: 'HR', stolen_base: 'steal' };
  const halfLabel = h => (h.endsWith('t') ? 'Top ' : 'Bot ') + parseInt(h, 10);
  const pct = (a, b) => (b ? a / b : null);

  // ── Who won: the one top score wins; a shared top score is a tie between those players ──
  function result(g) {
    const s = scoresOf(g);
    const top = Math.max(...s);
    const leaders = s.map((v, i) => (v === top ? i : -1)).filter(i => i >= 0);
    const sorted = s.slice().sort((a, b) => b - a);
    return { scores: s, tie: leaders.length > 1, leaders, winner: leaders.length === 1 ? leaders[0] : null,
             margin: sorted[0] - sorted[1] };
  }
  // Each player's outcome in a game: 'W', 'L' or 'T' (tied for the top score).
  function outcomeFor(g, i) {
    const r = result(g);
    if (r.winner === i) return 'W';
    if (r.tie && r.leaders.includes(i)) return 'T';
    return 'L';
  }
  const seatOf = (g, pid) => g.players.findIndex(p => p.id === pid);

  // ════════════════════════════════════════════════════════════
  //  GAME REPLAY — runs an app game's scorebook through the Umpire
  //  once and records everything the stats and awards need.
  // ════════════════════════════════════════════════════════════
  const cache = new WeakMap();
  function replay(g) {
    if (!hasPlays(g)) return null;
    const hit = cache.get(g);
    if (hit && hit.n === g.events.length) return hit.r;
    const n = g.players.length;
    const s = U.start({ players: g.players.map(p => p.name), priority: (g.setup && g.setup.priority) || 0 });
    const plays = [];      // one entry per play event: { ev, index, half, log:[…], scoresBefore, scoresAfter, … }
    const halves = [];     // one entry per half-inning played: { half, pts:[…], picks:[…], right:[…], complete }
    let half = null;
    g.events.forEach((ev, index) => {
      const before = { scores: s.scores.slice(), priority: s.priority, ab: s.ab, half: s.inning + (s.bottom ? 'b' : 't'),
                       logLen: s.log.length };
      U.apply(s, ev);
      if (ev.type === 'pick3' || (ev.type === 'play' && !half)) {
        if (!half || half.half !== before.half) {
          half = { half: before.half, pts: Array(n).fill(0), picks: Array(n).fill(0), right: Array(n).fill(0),
                   complete: false, priorityChanged: false, priorityStart: before.priority };
          halves.push(half);
        }
      }
      if (ev.type !== 'play') return;
      const log = s.log.slice(before.logLen);
      const last = s.plays[s.plays.length - 1];
      log.forEach(e => {
        half.pts[e.player] += e.pts; half.picks[e.player]++; if (e.correct) half.right[e.player]++;
      });
      if (last.priorityAfter !== before.priority) half.priorityChanged = true;
      const endsAtBat = !U.outcome(ev.outcome).midAtBat || last.voided;
      if (s.outs >= 3) half.complete = true;
      plays.push({ ev, index, half: before.half, ab: before.ab, log, outcome: ev.outcome, runs: ev.runs || 0,
                   scoresBefore: before.scores, scoresAfter: s.scores.slice(),
                   priorityBefore: before.priority, priorityAfter: last.priorityAfter,
                   endsAtBat, halfComplete: s.outs >= 3, voided: last.voided });
    });
    const r = { state: s, plays, halves, scores: s.scores.slice(), ended: !!s.ended || g.ended === true };
    cache.set(g, { n: g.events.length, r });
    return r;
  }
  const scoresOf = g => (hasPlays(g) ? replay(g).scores : g.scores);

  // Per-player numbers for one game (accuracy, confidence, Pick 3, best streak, line score…)
  function gameNumbers(g) {
    const n = g.players.length;
    const out = g.players.map(() => ({ picks: 0, right: 0, confRight: 0, confWrong: 0, p3: 0, bestStreak: 0 }));
    if (g.era === 'beta') {
      g.beta.forEach((b, i) => Object.assign(out[i], { picks: b.picks, right: b.correct,
        confRight: b.confRight || 0, confWrong: b.confWrong || 0, bestStreak: null, p3: null }));
      return out;
    }
    if (!hasPlays(g)) return null;
    const cur = Array(n).fill(0);
    replay(g).plays.forEach(p => p.log.forEach(e => {
      const o = out[e.player];
      o.picks++; if (e.correct) o.right++;
      if (e.conf) (e.correct ? o.confRight++ : o.confWrong++);
      if (e.p3Bonus) o.p3++;
      cur[e.player] = e.correct ? cur[e.player] + 1 : 0;
      o.bestStreak = Math.max(o.bestStreak, cur[e.player]);
    }));
    return out;
  }

  // Points per player per inning — the line score. Returns { innings:[1..N], rows:[[…per inning]], totals }
  function lineScore(g) {
    if (!hasPlays(g)) return null;
    const r = replay(g);
    const last = r.halves.length ? parseInt(r.halves[r.halves.length - 1].half, 10) : 1;
    const innings = Array.from({ length: Math.max(9, last) }, (_, i) => i + 1);
    const rows = g.players.map(() => innings.map(() => null));
    r.halves.forEach(h => {
      const inn = parseInt(h.half, 10);
      h.pts.forEach((v, i) => { rows[i][inn - 1] = (rows[i][inn - 1] || 0) + v; });
    });
    return { innings, rows, totals: r.scores.slice() };
  }

  // ════════════════════════════════════════════════════════════
  //  STANDINGS — W / L / T per player, with win %, avg points, accuracy
  //  opts.season: a year (number) or omitted for all time
  // ════════════════════════════════════════════════════════════
  function standings(games, opts = {}) {
    const rows = {};
    chrono(games).filter(g => g.ended !== false && (!opts.season || season(g) === opts.season)).forEach(g => {
      const nums = gameNumbers(g);
      g.players.forEach((p, i) => {
        const r = rows[p.id] || (rows[p.id] = { id: p.id, name: p.name, w: 0, l: 0, t: 0, games: 0, points: 0,
                                                 picks: 0, right: 0, first: g.date });
        r.name = p.name;
        r[outcomeFor(g, i).toLowerCase()]++; r.games++; r.points += scoresOf(g)[i];
        if (nums) { r.picks += nums[i].picks; r.right += nums[i].right; }
      });
    });
    return Object.values(rows).map(r => ({ ...r,
      winPct: pct(r.w, r.games), avgPts: pct(r.points, r.games), accuracy: pct(r.right, r.picks) }))
      .sort((a, b) => b.w - a.w || a.l - b.l || b.games - a.games || a.name.localeCompare(b.name));
  }
  // Seasons that have games, newest first (for the season dropdown)
  const seasons = games => [...new Set(games.map(season))].sort((a, b) => b - a);

  // ════════════════════════════════════════════════════════════
  //  HISTORY — games grouped by season, newest first, with tags
  // ════════════════════════════════════════════════════════════
  function history(games) {
    const list = chrono(games.filter(g => g.ended !== false));
    // Doubleheaders: same day + same matchup → "Game 1", "Game 2"
    const groups = {};
    list.forEach(g => { const k = g.date + '|' + (g.away || '') + '|' + (g.home || '');
                        (groups[k] = groups[k] || []).push(g); });
    const label = new Map();
    Object.values(groups).forEach(gs => { if (gs.length > 1) gs.forEach((g, i) => label.set(g, 'Game ' + (i + 1))); });
    const bySeason = {};
    list.slice().reverse().forEach(g => {
      const r = result(g);
      const order = g.players.map((_, i) => i).sort((a, b) => r.scores[b] - r.scores[a]);
      (bySeason[season(g)] = bySeason[season(g)] || []).push({
        id: g.id, date: g.date, era: g.era, tag: { preapp: 'PRE-APP', beta: 'BETA', hand: 'ADDED BY ' + (g.addedBy || '').toUpperCase(), app: '' }[g.era],
        doubleheader: label.get(g) || '', tie: r.tie,
        players: order.map(i => ({ id: g.players[i].id, name: g.players[i].name, score: r.scores[i], outcome: outcomeFor(g, i) })),
        away: g.away || '', home: g.home || '', park: g.park || '', mlb: g.mlb || null,
      });
    });
    return Object.keys(bySeason).sort((a, b) => b - a).map(y => ({ season: +y, games: bySeason[y] }));
  }

  // ════════════════════════════════════════════════════════════
  //  RECORDS — the all-time record cards
  // ════════════════════════════════════════════════════════════
  function records(games) {
    const list = chrono(games.filter(g => g.ended !== false));
    if (!list.length) return [];
    const best = (label, better) => {
      let top = null;
      return { offer(value, who, g, extra) { if (top === null || better(value, top.value)) top = { label, value, who, date: g && g.date, gameId: g && g.id, extra }; },
               get: () => top };
    };
    const hi = best('HIGHEST SCORE', (a, b) => a > b), lo = best('LOWEST SCORE', (a, b) => a < b);
    const win = best('BIGGEST WIN', (a, b) => a > b), acc = best('BEST ACCURACY', (a, b) => a > b);
    const halfRec = best('BEST HALF-INNING', (a, b) => a > b), comeback = best('BIGGEST COMEBACK', (a, b) => a > b);
    const pickStreak = best('LONGEST PICK STREAK', (a, b) => a > b);
    const run = {}, streak = best('WIN STREAK', (a, b) => a > b);
    list.forEach(g => {
      const r = result(g), nums = gameNumbers(g);
      g.players.forEach((p, i) => {
        hi.offer(r.scores[i], p.name, g); lo.offer(r.scores[i], p.name, g);
        const o = outcomeFor(g, i);
        run[p.id] = o === 'W' ? (run[p.id] || 0) + 1 : 0;
        streak.offer(run[p.id], p.name, g);
        if (nums && nums[i].picks >= 10) acc.offer(nums[i].right / nums[i].picks, p.name, g, { picks: nums[i].picks });
        if (nums && nums[i].bestStreak) pickStreak.offer(nums[i].bestStreak, p.name, g);
      });
      if (r.winner !== null) {
        const loser = r.scores.map((v, i) => i).filter(i => i !== r.winner).sort((a, b) => r.scores[b] - r.scores[a])[0];
        win.offer(r.margin, g.players[r.winner].name, g, { score: r.scores[r.winner], loserScore: r.scores[loser], loser: g.players[loser].name });
      }
      if (hasPlays(g)) {
        replay(g).halves.forEach(h => h.pts.forEach((v, i) => halfRec.offer(v, g.players[i].name, g, { half: h.half })));
        const d = deficits(g);
        if (r.winner !== null && d[r.winner] > 0) comeback.offer(d[r.winner], g.players[r.winner].name, g);
      }
    });
    const st = standings(list);
    const mostWins = st.slice().sort((a, b) => b.w - a.w)[0];
    const mostGames = st.slice().sort((a, b) => b.games - a.games)[0];
    const ys = seasons(list);
    const out = [hi.get(), win.get(), streak.get(),
      { label: 'MOST WINS', value: mostWins.w, who: mostWins.name },
      acc.get(), lo.get(),
      { label: 'MOST GAMES', value: mostGames.games, who: mostGames.name, since: season({ date: mostGames.first }) },
      { label: 'SEASONS', value: ys.length, from: ys[ys.length - 1], to: ys[0] }];
    // In-game records appear once there is at least one new-app game
    [halfRec.get(), comeback.get(), pickStreak.get()].forEach(x => { if (x) out.push(x); });
    return out.filter(Boolean);
  }

  // Biggest deficit each player faced (behind the leader) at any point in an app game
  function deficits(g) {
    const r = replay(g);
    const d = g.players.map(() => 0);
    r.plays.forEach(p => p.scoresAfter.forEach((v, i) => {
      const others = p.scoresAfter.filter((_, j) => j !== i);
      d[i] = Math.max(d[i], Math.max(...others) - v);
    }));
    return d;
  }

  // ════════════════════════════════════════════════════════════
  //  HEAD TO HEAD — a vs b
  //  Only the overall winner of a game beats the others; a tie, or a
  //  game a third player won, doesn't count for either side.
  // ════════════════════════════════════════════════════════════
  function h2h(games, a, b) {
    const list = chrono(games.filter(g => g.ended !== false && seatOf(g, a) >= 0 && seatOf(g, b) >= 0));
    const res = [];   // 'a' | 'b' per decided game
    const side = { a: { pts: 0, bestWin: null, longest: 0 }, b: { pts: 0, bestWin: null, longest: 0 } };
    let runA = 0, runB = 0;
    list.forEach(g => {
      const ia = seatOf(g, a), ib = seatOf(g, b), r = result(g);
      side.a.pts += r.scores[ia]; side.b.pts += r.scores[ib];
      let w = null;
      if (r.winner === ia) w = 'a'; else if (r.winner === ib) w = 'b';
      if (!w) return;
      res.push({ w, gameId: g.id, date: g.date });
      const m = w === 'a' ? r.scores[ia] - r.scores[ib] : r.scores[ib] - r.scores[ia];
      if (side[w].bestWin === null || m > side[w].bestWin) side[w].bestWin = m;
      if (w === 'a') { runA++; runB = 0; } else { runB++; runA = 0; }
      side.a.longest = Math.max(side.a.longest, runA); side.b.longest = Math.max(side.b.longest, runB);
    });
    const wa = res.filter(x => x.w === 'a').length, wb = res.length - wa;
    const lastW = res.length ? res[res.length - 1].w : null;
    let cur = 0; for (let i = res.length - 1; i >= 0 && res[i].w === lastW; i--) cur++;
    return {
      a: { wins: wa, avg: pct(side.a.pts, list.length), bestWin: side.a.bestWin, longest: side.a.longest,
           current: lastW === 'a' ? cur : 0 },
      b: { wins: wb, avg: pct(side.b.pts, list.length), bestWin: side.b.bestWin, longest: side.b.longest,
           current: lastW === 'b' ? cur : 0 },
      games: list.length, since: list.length ? season(list[0]) : null,
      leader: wa > wb ? 'a' : wb > wa ? 'b' : null,
      last10: res.slice(-10).map(x => x.w),
    };
  }
  // Everyone a player has faced, with game counts (for the second H2H picker)
  function opponents(games, pid) {
    const c = {};
    games.forEach(g => { if (g.ended === false || seatOf(g, pid) < 0) return;
      g.players.forEach(p => { if (p.id !== pid) c[p.id] = { id: p.id, name: p.name, games: ((c[p.id] || {}).games || 0) + 1 }; }); });
    return Object.values(c).sort((x, y) => y.games - x.games);
  }

  // ════════════════════════════════════════════════════════════
  //  GAME SUMMARY — everything the Final and Past game screens show
  // ════════════════════════════════════════════════════════════
  function summary(g, allGames) {
    const r = result(g), nums = gameNumbers(g);
    const out = { id: g.id, result: r, players: g.players, lineScore: lineScore(g), tiles: null, plays: [], series: null, winNumber: null };
    if (nums) {
      const acc = nums.map(x => pct(x.right, x.picks));
      out.tiles = [
        { label: 'ACCURACY', values: acc, lead: leadOf(acc) },
        { label: 'PICK 3 BONUSES', values: nums.map(x => x.p3), lead: leadOf(nums.map(x => x.p3)) },
        { label: 'CONFIDENCE', values: nums.map(x => [x.confRight, x.confWrong]), lead: leadOf(nums.map(x => x.confRight - x.confWrong)) },
        { label: 'BEST STREAK', values: nums.map(x => x.bestStreak), lead: leadOf(nums.map(x => x.bestStreak)) },
      ].filter(t => t.values.every(v => v !== null && v !== undefined));
    }
    if (hasPlays(g)) out.plays = bigPlays(g);
    if (allGames && g.players.length === 2) {
      const before = allGames.filter(x => byTime(x, g) <= 0 || x === g);
      out.series = h2h(before.includes(g) ? before : before.concat(g), g.players[0].id, g.players[1].id);
    }
    if (allGames && r.winner !== null) {
      const wid = g.players[r.winner].id;
      out.winNumber = chrono(allGames.concat(allGames.includes(g) ? [] : [g])).filter(x => byTime(x, g) <= 0 && x.ended !== false)
        .filter(x => { const i = seatOf(x, wid); return i >= 0 && outcomeFor(x, i) === 'W'; }).length;
    }
    return out;
  }
  const leadOf = vals => { const m = Math.max(...vals.map(v => (v === null ? -Infinity : v)));
    const at = vals.map((v, i) => (v === m ? i : -1)).filter(i => i >= 0); return at.length === 1 ? at[0] : null; };

  // The biggest at-bats of the game, best first. Each: { player, pts, code, text, when, context, half }
  function bigPlays(g) {
    const r = replay(g), list = [];
    // Pick 3 bonuses are one "play" covering the three at-bats
    r.plays.forEach(p => p.log.forEach(e => {
      if (e.p3Bonus) {
        const picks = r.plays.filter(q => q.half === p.half).flatMap(q => q.log).filter(x => x.player === e.player && x.fromP3 && x.correct);
        const pts = picks.reduce((a, x) => a + x.pts, 0);
        list.push(mk(p, e.player, pts, 'P3', `${g.players[e.player].name} hit Pick 3 (${picks.map(x => CODES[x.pick]).join(' · ')})`));
      } else if (e.correct && !e.fromP3 && e.pts >= 4) {
        const runs = e.runs ? `${e.runs}-run ` : '';
        list.push(mk(p, e.player, e.pts, CODES[e.outcome],
          `${g.players[e.player].name} called a ${runs}${WORDS[e.outcome]}${e.conf ? ' with confidence' : ''}`));
      }
    }));
    function mk(p, i, pts, code, text) {
      const bef = p.scoresBefore, aft = p.scoresAfter;
      const lead = (s, k) => s[k] - Math.max(...s.filter((_, j) => j !== k));
      const lb = lead(bef, i), la = lead(aft, i);
      const context = lb <= 0 && la > 0 ? 'took the lead' : lb < 0 && la === 0 ? 'tied it'
        : lb > 0 && la > lb ? 'went up by ' + la : la < 0 ? 'cut it to ' + (-la) : '';
      return { player: i, pts, code, text, when: halfLabel(p.half), context, half: p.half, index: p.index };
    }
    return list.sort((a, b) => b.pts - a.pts || a.index - b.index).slice(0, 5);
  }

  const AWARD = Object.fromEntries(AWARDS.map(a => [a.id, a]));

  // Works through every game in order and records when each player earned each award.
  // Returns { [playerId]: { earned: { [awardId]: [{ tier, gameId, date, at }] }, counts: { [awardId]: n } } }
  //   at = index of the scorebook event that earned it (null = at the end of the game / final score)
  // Give it ALL of a player's games (across clubs) — awards are per person.
  function awardBook(games) {
    const book = {};
    const P = id => book[id] || (book[id] = {
      earned: {}, counts: {}, games: 0, wins: 0, points: 0, parks: {}, seasons: new Set(),
      vs: {}, lastLossTo: null, confRun: 0, p3Run: 0, confUsed: false,
    });
    const give = (pid, g, id, tier = 1, at = null) => {
      const e = P(pid).earned[id] || (P(pid).earned[id] = []);
      if (e.some(x => x.tier === tier)) return;
      e.push({ tier, gameId: g.id, date: g.date, at });
    };
    const count = (pid, g, id, value, at = null) => {
      const p = P(pid); p.counts[id] = value;
      AWARD[id].tiers.forEach((t, k) => { if (value >= t) give(pid, g, id, k + 1, at); });
    };

    chrono(games).forEach(g => {
      const ended = g.ended !== false;
      const r = hasPlays(g) ? replay(g) : null;
      const inGame = hasPlays(g);

      // ── In-game awards, checked play by play so each lands on the play that earned it ──
      if (inGame) inGameAwards(g, r, give, count, P);
      if (!ended) return;

      // ── Final-score awards (every era) ──
      const res = result(g);
      g.players.forEach((pl, i) => {
        const p = P(pl.id), o = outcomeFor(g, i);
        p.games++; p.points += res.scores[i]; if (o === 'W') p.wins++;
        count(pl.id, g, 'wins', p.wins); count(pl.id, g, 'games', p.games);
        count(pl.id, g, 'season_ticket', p.games); count(pl.id, g, 'points', p.points);
        if (g.park) { p.parks[g.park] = (p.parks[g.park] || 0) + 1;
          count(pl.id, g, 'road_trip', Object.keys(p.parks).length);
          count(pl.id, g, 'home_cooking', Math.max(...Object.values(p.parks))); }
        p.seasons.add(season(g)); count(pl.id, g, 'lifer', p.seasons.size);
        if (o === 'T') give(pl.id, g, 'dead_even');
        if (res.scores[i] < 0) give(pl.id, g, 'below_zero');
        if (o === 'W' && g.players.length === 3) give(pl.id, g, 'last_one_standing');
        // Margin awards: only games played in the app (pre-app / beta / hand-added excluded)
        if (inGame) {
          if (o === 'W' && res.margin === 1) give(pl.id, g, 'sweating');
          if (o === 'W' && res.margin >= 20) give(pl.id, g, 'comfortable');
          if (o === 'W' && res.margin >= 30) give(pl.id, g, 'blowout');
          if (o === 'L' && res.winner !== null && res.scores[res.winner] - res.scores[i] >= 20) give(pl.id, g, 'good_sport');
        }
        // Rivalries
        g.players.forEach((op, j) => {
          if (j === i) return;
          const v = p.vs[op.id] || (p.vs[op.id] = { games: 0, w: 0, l: 0, run: 0, lossRun: 0 });
          v.games++;
          count(pl.id, g, 'rivalry', Math.max(...Object.values(p.vs).map(x => x.games)));
          count(pl.id, g, 'blood_feud', Math.max(...Object.values(p.vs).map(x => x.games)));
          if (res.winner === i) { v.w++; v.run++; v.lossRun = 0; }
          else if (res.winner === j) { v.l++; v.lossRun++; v.run = 0; }
          count(pl.id, g, 'dynasty', Math.max(...Object.values(p.vs).map(x => x.run)));
          count(pl.id, g, 'nemesis', Math.max(...Object.values(p.vs).map(x => x.lossRun)));
          if (v.w + v.l >= 10 && v.w / (v.w + v.l) >= 0.7) give(pl.id, g, 'dominant');

        if (o === 'W' && p.lastLossTo && g.players.some(x => x.id === p.lastLossTo)) give(pl.id, g, 'revenge');
      });
      g.players.forEach((pl, i) => {
        const o = outcomeFor(g, i);
        P(pl.id).lastLossTo = o === 'L' && res.winner !== null ? g.players[res.winner].id : null;
      });

      // Pick 3 run across games (Clairvoyant) — app games only
      if (inGame) g.players.forEach((pl, i) => {
        const p = P(pl.id);
        const hit = r.plays.some(q => q.log.some(e => e.player === i && e.p3Bonus));
        p.p3Run = hit ? p.p3Run + 1 : 0;
        if (p.p3Run >= 3) give(pl.id, g, 'clairvoyant');

  function inGameAwards(g, r, give, count, P) {
    const n = g.players.length, ids = g.players.map(p => p.id);
    const streak = Array(n).fill(0), miss = Array(n).fill(0), scoreRun = Array(n).fill(0);
    const confWrongRun = Array(n).fill(0);
    const conf = g.players.map(() => ({ right: 0, wrong: 0 }));
    const inGameCalls = g.players.map(() => ({}));
    const p3 = Array(n).fill(0);
    const halfPts = {}, halfPicks = {}, halfRight = {};
    let abPts = Array(n).fill(0);
    let abStartPriority = null, prioRun = 0, prioHolder = null, halfPrioRun = 0, halfPrioHolder = null;
    let halfStartPriority = null, halfChanged = false, curHalf = null, priorityEverChanged = false;
    let firstAtBat = true;
    const ended = r.ended;

    r.plays.forEach((p, k) => {
      const at = p.index;
      if (curHalf !== p.half) { curHalf = p.half; halfStartPriority = p.priorityBefore; halfChanged = false;
        halfPts[p.half] = Array(n).fill(0); halfPicks[p.half] = Array(n).fill(0); halfRight[p.half] = Array(n).fill(0); }
      if (abStartPriority === null) abStartPriority = p.priorityBefore;

        [[5, 'on_fire'], [7, 'wave'], [10, 'unstoppable'], [20, 'twenty_straight']].forEach(([t, id]) => { if (streak[i] >= t) give(pid, g, id, 1, at); });
        if (miss[i] >= 6) give(pid, g, 'ice_cold', 1, at);

          P0.counts._right = (P0.counts._right || 0) + 1; count(pid, g, 'correct_picks', P0.counts._right, at);
          const c = AWARDS.find(a => a.outcome === e.outcome);
          if (c) { P0.counts['_' + c.id] = (P0.counts['_' + c.id] || 0) + 1; count(pid, g, c.id, P0.counts['_' + c.id], at); }
          inGameCalls[i][e.outcome] = (inGameCalls[i][e.outcome] || 0) + 1;
          if (e.outcome === 'triple') give(pid, g, 'unicorn', 1, at);
          if (e.outcome === 'hbp') give(pid, g, 'take_your_base', 1, at);
          if (e.outcome === 'bunt') give(pid, g, 'small_ball', 1, at);
          if (e.outcome === 'home_run' && e.runs >= 4) give(pid, g, 'cleanup_hitter', 1, at);
          [['stolen_base', 'speed_demon'], ['walk', 'patient'], ['hbp', 'lightning_rod'], ['bunt', 'small_ball_specialist'], ['home_run', 'hr_hat_trick']]
            .forEach(([o, id]) => { if (inGameCalls[i][o] >= 3) give(pid, g, id, 1, at); });
        }
        // confidence
        if (e.conf) {
          give(pid, g, 'bold', 1, at);
          if (e.correct) {
            conf[i].right++; confWrongRun[i] = 0;
            P0.counts._conf = (P0.counts._conf || 0) + 1; count(pid, g, 'confidence_correct', P0.counts._conf, at);
            if (e.outcome === 'home_run') give(pid, g, 'called_shot', 1, at);
            if (e.outcome === 'double_play') give(pid, g, 'big_brain', 1, at);
            if (e.outcome === 'triple') give(pid, g, 'first_to_third', 1, at);
            if (!e.hadPriority) give(pid, g, 'assassin', 1, at);
          } else {
            conf[i].wrong++; confWrongRun[i]++;
            if (e.pick === 'home_run') give(pid, g, 'hubris', 1, at);
            if (confWrongRun[i] >= 3) give(pid, g, 'rough_patch', 1, at);
            if (conf[i].wrong >= 3) give(pid, g, 'reckless', 1, at);
          }
          if (conf[i].right >= 5 && conf[i].wrong === 0) give(pid, g, 'diamond_hands', 1, at);
        }
        // Pick 3
        if (e.p3Bonus) {
          p3[i]++;
          P0.counts._p3 = (P0.counts._p3 || 0) + 1; count(pid, g, 'p3_bonuses', P0.counts._p3, at);
          give(pid, g, 'first_p3', 1, at);
          if (p.half === '1t') give(pid, g, 'prophet', 1, at);
          if (p3[i] >= 3) give(pid, g, 'hat_trick', 1, at);
        }
        // points moments
        if (halfPts[p.half][i] >= 10) give(pid, g, 'rocket', 1, at);
        if (p.scoresAfter[i] >= 20) give(pid, g, 'payday', 1, at);
      });

      // ── End of an at-bat ──
      if (p.endsAtBat) {
        g.players.forEach((_, i) => {
          if (abPts[i] >= 5) give(ids[i], g, 'big_winner', 1, at);
          scoreRun[i] = abPts[i] > 0 ? scoreRun[i] + 1 : 0;
          if (scoreRun[i] >= 10) give(ids[i], g, 'hot_streak', 1, at);
          if (firstAtBat && abPts[i] > 0 && i !== abStartPriority) give(ids[i], g, 'stolen_thunder', 1, at);
        });
        // priority held through this at-bat
        const holder = p.priorityAfter;
        if (holder === abStartPriority) { prioRun = prioHolder === holder ? prioRun + 1 : 1; }
        else prioRun = 0;
        prioHolder = holder;
        if (prioRun >= 5) give(ids[holder], g, 'oracle', 1, at);
        if (prioRun >= 10) give(ids[holder], g, 'priority_hog', 1, at);
        abPts = Array(n).fill(0); abStartPriority = null; firstAtBat = false;
      }

      // ── End of a half-inning ──

        g.players.forEach((_, i) => {
          if (halfPicks[p.half][i] >= 3 && halfRight[p.half][i] === halfPicks[p.half][i]) give(ids[i], g, 'perfect_half', 1, at);
          if (hp[i] >= 7 && hp.every((v, j) => j === i || v <= 0)) give(ids[i], g, 'ghost', 1, at);

        halfPrioHolder = kept ? halfStartPriority : null;
        if (halfPrioRun >= 6) give(ids[halfStartPriority], g, 'king_of_the_hill', 1, at);

    if (!ended || !r.plays.length) return;

    const res = result(g), nums = gameNumbers(g), last = r.plays[r.plays.length - 1];
    const lastAB = r.plays.filter(p => p.endsAtBat).pop();
    const d = deficits(g);
    g.players.forEach((pl, i) => {
      const pid = pl.id, won = res.winner === i;
      const a = pct(nums[i].right, nums[i].picks);
      if (nums[i].picks >= 10 && a >= 0.55) give(pid, g, 'dead_eye');
      if (nums[i].picks >= 10 && a >= 0.70) give(pid, g, 'sniper');
      if (conf[i].right + conf[i].wrong >= 3 && conf[i].wrong === 0) give(pid, g, 'perfect_confidence');
      if (won && conf[i].wrong >= 3) give(pid, g, 'reckless_win');
      if (won && d[i] >= 10) give(pid, g, 'comeback_kid');
      if (lastAB && lastAB.log.some(e => e.player === i && e.correct)) give(pid, g, 'last_laugh');
      if (won) {
        const firstInning = r.halves.filter(h => parseInt(h.half, 10) === 1).reduce((s, h) => s + h.pts[i], 0);
        if (firstInning === 0) give(pid, g, 'cold_start');
        const b = last.scoresBefore;
        const trailing = b[i] < Math.max(...b.filter((_, j) => j !== i));
        if (trailing && last.log.some(e => e.player === i && e.correct)) give(pid, g, 'walk_off');
        if (!priorityEverChanged && (g.setup && g.setup.priority || 0) === i) give(pid, g, 'perfect_game');
      }
    });
  }

  // One player's award list for the Awards screen:
  // [{ ...award, tier (0 = not yet), earnedAt: [{tier, date, gameId}], progress: {value, target} | null }]
  function awardsFor(games, pid) {
    const p = awardBook(games)[pid] || { earned: {}, counts: {} };
    return AWARDS.map(a => {
      const e = (p.earned[a.id] || []).slice().sort((x, y) => x.tier - y.tier);
      const tier = e.length ? Math.max(...e.map(x => x.tier)) : 0;
      let progress = null;
      if (a.kind === 'count') {
        const value = p.counts[a.id] || 0;
        const target = a.tiers[Math.min(tier, a.tiers.length - 1)];
        progress = { value, target, done: tier === a.tiers.length };
      }
      return { ...a, tier, earnedAt: e, progress };
    });
  }

  // Awards earned during one game (for the popup after a play, and the Final screen).
  // `games` = the players' games INCLUDING this one. Returns [{ award, playerId, name, tier, at }]
  function awardsInGame(games, g) {
    const book = awardBook(games), out = [];
    g.players.forEach(pl => {
      const e = (book[pl.id] || { earned: {} }).earned;
      Object.keys(e).forEach(id => e[id].forEach(x => {
        if (x.gameId === g.id) out.push({ award: AWARD[id], playerId: pl.id, name: pl.name, tier: x.tier, at: x.at });
      }));
    });
    return out.sort((a, b) => (a.at === null) - (b.at === null) || (a.at || 0) - (b.at || 0));
  }

  // Who has an award (Award detail "Who has it"), for the players in `games`
  function whoHas(games, awardId) {
    const book = awardBook(games);
    return Object.entries(book).filter(([, p]) => p.earned[awardId])
      .map(([id, p]) => ({ id, tier: Math.max(...p.earned[awardId].map(x => x.tier)), first: p.earned[awardId][0].date }));
  }

  return { AWARDS, CODES, result, outcomeFor, replay, gameNumbers, lineScore, standings, seasons, history,
           records, h2h, opponents, summary, awardBook, awardsFor, awardsInGame, whoHas };
})();



// ════════════════════════════════════════════════════════════════
//  SECTION 4 — THE FILING CABINET (saving and loading)
//  The ONLY code that touches Firebase or the phone's storage.
//  Screens ask it for things ("load the Dodgers' games", "save this
//  play") and never talk to Firebase themselves.
//
//  Offline: every change goes into an outbox kept on the phone first,
//  then gets sent when there's signal — so a play entered with no
//  bars survives even if the app is closed before it syncs.
//
//  Where things live in Firebase (all under /v2):
//    users/<uid>            your private info: name, team, clubs you joined or asked to join, guest claims
//    profiles/<pid>         every player's public name (accounts: pid = uid; guests: random id)
//    clubs/<code>/info      name, public/private      clubs/<code>/members   the roster (+ captains, guests)
//    clubs/<code>/requests  join requests             clubs/<code>/claims    "that's me" guest claims
//    clubs/<code>/games     which games count for the club
//    clubNames/<name>       makes club names unique   clubList/<code>        Find a club list
//    games/<id>             one game, with its scorebook      playerGames/<pid>   each player's "All my games"
//    live/<pid>             who is in a live game right now
// ════════════════════════════════════════════════════════════════
const FilingCabinet = (() => {

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I mix-ups
  const nameKey = s => s.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.#$\[\]\/]/g, '_');
  const clean = o => JSON.parse(JSON.stringify(o)); // drops undefined (Firebase rejects it)

  function create({ db, storage, deviceId, now = () => Date.now(), random = Math.random }) {
    let uid = null;
    const listeners = new Set();
    let online = false;
    const R = p => 'v2/' + p;

    // ── Outbox (kept on the phone) ──
    const load = (k, d) => { try { const v = storage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
    const save = (k, v) => { try { storage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } };
    let outbox = load('gb_outbox', []);

      Object.entries(changes).forEach(([p, v]) => { full[R(p)] = v === undefined ? null : v; });
      const id = now() + '-' + Math.floor(random() * 1e9);
      outbox.push({ id, changes: clean(full) }); save('gb_outbox', outbox); emit();
      // Online: wait for it to land (and report a refusal). Offline: it's safely queued on the phone.
      return flush().then(() => {
        if (denied.has(id)) { const e = denied.get(id); denied.delete(id); throw e; }
      });

      if (flushing) return flushing;

    // ════════════ Account & profile ════════════
    function setUser(u) { uid = u; }

      need();

      return u;
    }
    async function saveProfile({ name, team = null }) {
      need();
      name = name.trim();
      if (!name || name.length > 16) throw new Error('Names are 1–16 characters');
      const first = !(await get('users/' + uid));

        ['profiles/' + uid + '/name']: name, ['profiles/' + uid + '/account']: true };

      let code = newCode();
      while (await get('clubs/' + code + '/info')) code = newCode();

      await queue({ ['clubs/' + code + '/info']: { name, public: !!isPublic, createdAt: now(), createdBy: uid },

    async function findClubs(text = '') {

    }
    async function roster(code) {
      const m = (await get('clubs/' + code + '/members')) || {};

    async function nameTaken(code, name, exceptPid) {

    }
    // Join: public → in right away; private → a request a captain answers. `nickname` if your name is taken there.

      need();

    async function answerRequest(code, who, accept) {

      if (!r) return;
      if (accept && await nameTaken(code, r.name)) throw new Error(`Someone is already called ${r.name} — ask them to request again with a nickname`);
      const ch = { ['clubs/' + code + '/requests/' + who]: null };
      if (accept) ch['clubs/' + code + '/members/' + who] = { name: r.name, captain: false, guest: false, joinedAt: now() };
      await queue(ch);
    }
    async function leaveClub(code) {

      const list = await roster(code);

      const me = list.find(m => m.pid === uid);
      if (!me) return;
      if (people.length === 1) {                           // last member: the club is deleted
        const info = await get('clubs/' + code + '/info');
        return queue({ ['clubs/' + code]: null, ['clubNames/' + nameKey(info.name)]: null, ['clubList/' + code]: null,
          ['users/' + uid + '/clubs/' + code]: null });

        throw Object.assign(new Error('Name another captain before you leave'), { code: 'LAST_CAPTAIN' });

    }
    const setCaptain = (code, pid, on) => queue({ ['clubs/' + code + '/members/' + pid + '/captain']: !!on });
    const removeMember = (code, pid) => queue({ ['clubs/' + code + '/members/' + pid]: null });
    async function updateClub(code, { name, public: pub }) {
      const info = await get('clubs/' + code + '/info');
      const ch = {};
      if (name !== undefined && name.trim() !== info.name) {
        const key = nameKey(name);
        if (await get('clubNames/' + key)) throw new Error(`There's already a club called "${name.trim()}"`);
        ch['clubs/' + code + '/info/name'] = name.trim(); ch['clubList/' + code + '/name'] = name.trim();
        ch['clubNames/' + key] = code; ch['clubNames/' + nameKey(info.name)] = null;
      }
      if (pub !== undefined) { ch['clubs/' + code + '/info/public'] = !!pub; ch['clubList/' + code + '/public'] = !!pub; }
      await queue(ch);
    }

    // ════════════ Guests ════════════
    // A guest joins the club you have selected (code), or is personal to you (code = null).
    async function addGuest(name, code = null) {
      need();
      name = name.trim();
      if (!name || name.length > 16) throw new Error('Names are 1–16 characters');
      if (code && await nameTaken(code, name)) throw Object.assign(new Error(`${name} is already in this club`), { code: 'NAME_TAKEN' });
      const pid = 'g_' + db.newId();
      const ch = { ['profiles/' + pid]: { name, account: false, createdBy: uid, club: code, createdAt: now() } };
      await queue(ch);
      if (code) await queue({ ['clubs/' + code + '/members/' + pid]: { name, captain: false, guest: true, joinedAt: now() } });
      return pid;
    }
    async function renameGuest(code, pid, name) {
      if (await nameTaken(code, name, pid)) throw new Error(`${name} is already in this club`);
      await queue({ ['clubs/' + code + '/members/' + pid + '/name']: name.trim(), ['profiles/' + pid + '/name']: name.trim() });
    }
    // "That's me": ask to take over a guest's games
    async function claimGuest(code, guestPid) {
      need();
      const me = await get('profiles/' + uid);
      await queue({ ['clubs/' + code + '/claims/' + guestPid]: { uid, name: me.name, at: now() },
        ['users/' + uid + '/claims/' + guestPid]: code });
    }
    // Captain approves: the guest's games now count as the claimer's, and they join the club.
    async function answerClaim(code, guestPid, accept) {
      const c = await get('clubs/' + code + '/claims/' + guestPid);
      if (!c) return;
      const ch = { ['clubs/' + code + '/claims/' + guestPid]: null };
      if (accept) {
        ch['profiles/' + guestPid + '/claimedBy'] = c.uid;
        ch['clubs/' + code + '/members/' + guestPid] = null;
        const guest = await get('clubs/' + code + '/members/' + guestPid);
        const already = await get('clubs/' + code + '/members/' + c.uid);
        if (!already) ch['clubs/' + code + '/members/' + c.uid] = { name: (guest && guest.name) || c.name, captain: false, guest: false, joinedAt: (guest && guest.joinedAt) || now() };
      }
      await queue(ch);
    }
    // Guests you've claimed and had approved — their games are yours
    async function myAliases() {
      need();
      const claims = Object.keys((await get('users/' + uid + '/claims')) || {});
      const out = [];
      for (const g of claims) { const p = await get('profiles/' + g); if (p && p.claimedBy === uid) out.push(g); }
      // Publish them on your profile so other people's phones count those games for you too (awards, H2H)
      const listed = Object.keys((await get('profiles/' + uid + '/aliases')) || {});
      const add = {}; out.filter(g => !listed.includes(g)).forEach(g => { add['profiles/' + uid + '/aliases/' + g] = true; });
      if (Object.keys(add).length) await queue(add);
      return out;
    }

    // ════════════ Games ════════════
    // Which of the host's clubs this game counts for: every club that ALL the players belong to.
    async function clubsFor(pids) {
      const mine = Object.keys((await get('users/' + uid + '/clubs')) || {});
      const out = [];
      for (const code of mine) {
        let m = null; try { m = await get('clubs/' + code + '/members'); } catch (e) { continue; }
        if (m && pids.every(p => m[p])) out.push(code);
      }
      return out;
    }
    const indexChanges = (g, value) => {
      const ch = {};
      g.players.forEach(p => { ch['playerGames/' + p.id + '/' + g.id] = value; });
      (g.clubList || []).forEach(c => { ch['clubs/' + c + '/games/' + g.id] = value; });
      return ch;
    };
    const localDate = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

    // Start a live game. players: [{ id, name }] in seat order.
    async function startGame({ players, priority = 0, away = '', home = '', park = '' }) {
      need();
      for (const p of players) {                           // one live game per player
        const l = await get('live/' + p.id);
        if (l && l.gameId) {
          const g = await get('games/' + l.gameId);
          if (g && !g.ended) {
            const host = (await get('profiles/' + g.host)) || { name: 'someone' };
            throw Object.assign(new Error(`${p.name} is already in a live game hosted by ${host.name}.`), { code: 'IN_LIVE_GAME' });
          }
        }
      }
      const t = now();
      const clubList = await clubsFor(players.map(p => p.id));
      const g = { id: db.newId(), host: uid, device: deviceId, era: 'app', date: localDate(t), seq: t, startedAt: t,
        players: players.map(p => ({ id: p.id, name: p.name })), setup: { priority }, events: [],
        away, home, park, clubList, ended: false };
      const ch = { ['games/' + g.id]: g, ...indexChanges(g, { date: g.date, seq: g.seq }) };
      players.forEach(p => { ch['live/' + p.id] = { gameId: g.id, host: uid, at: t }; });
      save('gb_live', g);
      await queue(ch);
      return g;
    }
    const liveGame = () => load('gb_live', null);      // resume after closing the app, even offline
    function addEvent(g, ev) {
      g.events.push(ev); save('gb_live', g);
      return queue({ ['games/' + g.id + '/events/' + (g.events.length - 1)]: ev, ['games/' + g.id + '/updatedAt']: now() });
    }
    function undo(g) {
      if (!g.events.length) return Promise.resolve();
      g.events.pop(); save('gb_live', g);
      return queue({ ['games/' + g.id + '/events/' + g.events.length]: null, ['games/' + g.id + '/updatedAt']: now() });
    }
    // Another device of the same account takes over a live game
    function takeOver(g) { g.device = deviceId; save('gb_live', g); return queue({ ['games/' + g.id + '/device']: deviceId }); }
    // End the game. A game with no plays is thrown away instead of saved.
    async function endGame(g, { scores, mlb = null, note = '' } = {}) {
      const liveOff = {}; g.players.forEach(p => { liveOff['live/' + p.id] = null; });
      const plays = g.events.filter(e => e.type === 'play').length;
      storage.removeItem('gb_live');
      if (!plays) {
        await queue({ ...liveOff, ['games/' + g.id]: null });
        return queue(indexChanges(g, null));
      }
      g.events.push({ type: 'end' });
      Object.assign(g, { ended: true, endedAt: now(), scores, mlb, note: note.slice(0, 280) });
      return queue({ ['games/' + g.id + '/events/' + (g.events.length - 1)]: { type: 'end' },
        ['games/' + g.id + '/ended']: true, ['games/' + g.id + '/endedAt']: g.endedAt,
        ['games/' + g.id + '/scores']: scores, ['games/' + g.id + '/mlb']: mlb, ['games/' + g.id + '/note']: g.note, ...liveOff });
    }
    // Add a game by hand (final scores only). Anyone can; it counts like a pre-app game.
    async function addHandGame({ players, scores, date, away = '', home = '', park = '', mlb = null, note = '' }) {
      need();
      const me = await get('profiles/' + uid);
      const clubList = await clubsFor(players.map(p => p.id));
      const g = { id: db.newId(), host: uid, addedBy: me.name, era: 'hand', date, seq: now(), players, scores,
        away, home, park, mlb, note, clubList, ended: true };
      await queue({ ['games/' + g.id]: g, ...indexChanges(g, { date, seq: g.seq }) });
      return g;
    }
    async function editHandGame(g, fields) {
      const allowed = ['scores', 'date', 'away', 'home', 'park', 'mlb', 'note'];
      const ch = {};
      allowed.forEach(k => { if (k in fields) { g[k] = fields[k]; ch['games/' + g.id + '/' + k] = fields[k]; } });
      if ('date' in fields) Object.assign(ch, indexChanges(g, { date: g.date, seq: g.seq }));
      await queue(ch);
    }
    // Delete a game (captains of its clubs, whoever hand-added it, or Xaq). Stats and awards recalculate.
    async function deleteGame(g) {
      await queue({ ['games/' + g.id]: null });
      await queue(indexChanges(g, null));
    }

    // Load games for a scope. scope: { club: code } or { mine: true }.
    // Returns games ready for the Statistician, with claimed guests folded into their accounts.
    async function loadGames(scope) {
      need();
      let ids = [];
      if (scope.club) ids = Object.keys((await get('clubs/' + scope.club + '/games')) || {});
      else {
        const pids = [uid, ...(await myAliases())];
        for (const p of pids) ids.push(...Object.keys((await get('playerGames/' + p)) || {}));
      }
      return prepare(await fetchGames([...new Set(ids)]), scope.club);
    }
    // Every game a set of players has played (awards need each person's full history)
    async function historyOf(pids) {
      const ids = new Set(), all = new Set(pids);
      for (const p of pids) {                        // only guests a captain actually approved for this person
        for (const a of Object.keys(((await get('profiles/' + p)) || {}).aliases || {})) {
          if (((await get('profiles/' + a)) || {}).claimedBy === p) all.add(a);
        }
      }
      for (const p of all) Object.keys((await get('playerGames/' + p)) || {}).forEach(id => ids.add(id));
      return prepare(await fetchGames([...ids]));
    }
    const gameCache = new Map();                     // finished games never change, so keep them
    async function fetchGames(ids) {
      const out = await Promise.all(ids.map(async id => {
        if (gameCache.has(id)) return gameCache.get(id);
        const g = await get('games/' + id);
        if (g && g.ended) gameCache.set(id, g);
        return g;
      }));
      return out.filter(Boolean);
    }
    // Fold claimed guests into the account that claimed them, and use current names.
    async function prepare(games, club) {
      const ids = [...new Set(games.flatMap(g => g.players.map(p => p.id)))];
      const prof = await profiles(ids);
      let nick = {};
      if (club) { try { nick = (await get('clubs/' + club + '/members')) || {}; } catch (e) { /* not visible */ } }
      const canon = id => (prof[id] && prof[id].claimedBy) || id;
      const acct = await profiles([...new Set(ids.map(canon))]);
      // Firebase drops empty values (e.g. a skipped Pick 3 is null) — put them back so the Umpire can replay.
      const fix = (ev, n) => ev.type !== 'pick3' ? ev
        : { ...ev, picks: Array.from({ length: n }, (_, i) => (ev.picks && ev.picks[i] ? Object.values(ev.picks[i]) : null)) };
      return games.map(g => ({ ...g, events: g.events ? Object.values(g.events).map(ev => fix(ev, g.players.length)) : undefined,
        players: g.players.map(p => { const c = canon(p.id);
          return { id: c, name: (nick[c] && nick[c].name) || (acct[c] && acct[c].name) || p.name }; }) }));
    }

    // ════════════ Admin (Xaq only) ════════════
    const exportAll = () => get('');
    const isAdmin = async () => { need(); return (await get('admins/' + uid)) === true; };

    return { setUser, onStatus: f => { listeners.add(f); f(status()); return () => listeners.delete(f); }, status, flush,
      myAccount, saveProfile, unlinkAccount, profiles,
      createClub, findClubs, myClubs, roster, joinClub, requests, answerRequest, leaveClub, setCaptain, removeMember, updateClub,
      addGuest, renameGuest, claimGuest, answerClaim, myAliases,
      startGame, liveGame, addEvent, undo, takeOver, endGame, addHandGame, editHandGame, deleteGame,
      loadGames, historyOf, exportAll, isAdmin };
  }

  // ── Firebase adapter (used in the app). Pass in the Firebase database module + db instance. ──
  function firebaseAdapter(F, database) {
    return {
      get: async p => (await F.get(F.ref(database, p))).val(),
      update: changes => F.update(F.ref(database), changes),
      onConnected: cb => F.onValue(F.ref(database, '.info/connected'), s => cb(s.val() === true)),
      newId: () => F.push(F.ref(database, 'v2/games')).key,
    };
  }

  return { create, firebaseAdapter, nameKey };
})();



// The checks the real-Firebase test page runs. Kept separate so it can be tried
// against the pretend Firebase first (node fbtest-runner.js).
async function runChecks({ FC, S, adapter, storage, uid, displayName, setOnline, log }) {
  const results = [];
  const step = async (name, fn) => {
    try { const note = await fn(); results.push({ name, ok: true }); log('✓ ' + name + (note ? ' — ' + note : ''), 'ok'); return true; }
    catch (e) { results.push({ name, ok: false }); log('✗ ' + name + ' — ' + (e.code || '') + ' ' + e.message, 'bad'); return false; }
  };
  const refused = async p => { try { await p; } catch (e) { return; } throw new Error('Firebase allowed it (should have refused)'); };
  const fc = FC.create({ db: adapter, storage, deviceId: 'test-page' });
  fc.setUser(uid);
  const tag = Math.random().toString(36).slice(2, 6).toUpperCase();
  let code, guest, game;

  await step('Your profile', async () => {
    const acct = await fc.myAccount();
    if (acct) return 'already set up as ' + acct.name;
    await fc.saveProfile({ name: (displayName || 'Player').split(' ')[0].slice(0, 16) });
    return 'created';
  });
  await step('Create a private test club', async () => { code = await fc.createClub('Test Club ' + tag, false); return code; });
  await step('Club names are unique', () => refused(fc.createClub('test club ' + tag.toLowerCase(), true)));
  await step('Add a guest', async () => { guest = await fc.addGuest('Test Guest', code); });
  await step('Start a live game', async () => {
    game = await fc.startGame({ players: [{ id: uid, name: 'Me' }, { id: guest, name: 'Test Guest' }], away: 'Rockies', home: 'Padres', park: 'Petco Park' });
    if (!game.clubList.includes(code)) throw new Error('game did not count for the test club');
  });
  const pk = p => ({ pick: p, conf: false });
  await step('Save plays and undo one', async () => {
    await fc.addEvent(game, { type: 'pick3', picks: [null, null] });
    await fc.addEvent(game, { type: 'play', outcome: 'walk', picks: { 0: pk('walk'), 1: pk('single') }, runs: 0 });
    await fc.addEvent(game, { type: 'play', outcome: 'single', picks: { 0: pk('walk'), 1: pk('single') }, runs: 1 });
    await fc.undo(game);
    const saved = await adapter.get('v2/games/' + game.id + '/events');
    if (!saved || Object.keys(saved).length !== 2) throw new Error('expected 2 saved plays, found ' + (saved ? Object.keys(saved).length : 0));
  });
  await step('No signal: plays wait on the phone, then sync', async () => {
    setOnline(false);
    await new Promise(r => setTimeout(r, 300));
    await fc.addEvent(game, { type: 'play', outcome: 'strikeout', picks: { 0: pk('strikeout'), 1: pk('walk') }, runs: 0 });
    await fc.addEvent(game, { type: 'play', outcome: 'double', picks: { 0: pk('strikeout'), 1: pk('double') }, runs: 2 });
    const waiting = fc.status().pending;
    if (waiting !== 2) throw new Error('expected 2 waiting, found ' + waiting);
    setOnline(true);
    for (let i = 0; i < 40 && fc.status().pending; i++) await new Promise(r => setTimeout(r, 250));
    if (fc.status().pending) throw new Error('still waiting after coming back online');
    const saved = await adapter.get('v2/games/' + game.id + '/events');
    if (Object.keys(saved).length !== 4) throw new Error('expected 4 saved plays');
    return '2 plays held, then synced';
  });
  await step('One live game at a time', () => refused(fc.startGame({ players: [{ id: uid, name: 'Me' }, { id: guest, name: 'Test Guest' }] })));
  await step('End the game', async () => {
    const s = S.replay({ ...game }).scores;
    await fc.endGame(game, { scores: s, note: 'test' });
    return 'final ' + s.join('–');
  });
  await step('A finished game can\'t be edited', () => refused(adapter.update({ ['v2/games/' + game.id + '/scores']: [99, 0] })));
  await step('Load the club\'s games into the Statistician', async () => {
    const games = await fc.loadGames({ club: code });
    const st = S.standings(games);
    if (games.length !== 1) throw new Error('expected 1 game');
    return st.map(r => `${r.name} ${r.w}–${r.l}`).join(', ');
  });
  await step('Nobody can make themselves admin', () => refused(adapter.update({ ['v2/admins/' + uid]: true })));
  await step('The old app\'s data is still readable', async () => {
    const v = await adapter.get('config/rootGroupName');
    return 'club name "' + v + '"';
  });
  await step('Clean up: delete the test game, guest and club', async () => {
    await fc.deleteGame(game);
    await fc.flush();
    await adapter.update({ ['v2/profiles/' + guest]: null });
    await fc.leaveClub(code);
    const left = await adapter.get('v2/clubList/' + code);
    if (left) throw new Error('test club still listed');
  });
  const bad = results.filter(r => !r.ok).length;
  log(bad ? `${bad} of ${results.length} checks failed` : `All ${results.length} checks passed`, bad ? 'bad' : 'ok');
  return results;
}
