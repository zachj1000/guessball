<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GB Test">
<title>Guess Ball sign-in test</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #F5F5F7; font: 16px -apple-system, system-ui, sans-serif;
         padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: #A1A1AA; font-size: 14px; margin: 0 0 20px; }
  .card { background: #1C1C1F; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 15px; }
  .row span:first-child { color: #A1A1AA; }
  .row span:last-child { text-align: right; word-break: break-all; }
  .big { font-size: 20px; font-weight: 700; }
  .ok { color: #5BD27A; } .bad { color: #FF6B5E; } .wait { color: #F2C14E; }
  button { display: block; width: 100%; height: 52px; border: 0; border-radius: 26px; margin-bottom: 10px;
           font: 700 17px -apple-system, system-ui, sans-serif; color: #fff; background: #2F6FE4; }
  button.alt { background: #2A2A2F; }
  button:disabled { opacity: .4; }
  #log { font: 12px ui-monospace, Menlo, monospace; color: #C7C7CC; white-space: pre-wrap; margin: 0; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<h1>Sign-in test</h1>
<p class="sub">Checks that Google sign-in works in the home-screen app. Nothing here touches your game data.</p>

<div class="card">
  <div class="row"><span>Status</span><span id="status" class="big wait">Loading…</span></div>
  <div class="row"><span>Account</span><span id="who">—</span></div>
  <div class="row"><span>Opened from</span><span id="mode">—</span></div>
  <div class="row"><span>Method used</span><span id="method">—</span></div>
</div>

<button id="popup" disabled>Sign in with Google (popup)</button>
<button id="redirect" class="alt" disabled>Sign in with Google (redirect)</button>
<button id="out" class="alt" disabled>Sign out</button>

<div class="card"><pre id="log"></pre></div>

<script type="module">
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += new Date().toLocaleTimeString() + '  ' + m + '\n'; };
window.addEventListener('error', e => log('JS error: ' + e.message));

const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
$('mode').textContent = standalone ? 'Home-screen app' : 'Safari tab';
log('Opened from: ' + $('mode').textContent);
log('Device: ' + navigator.userAgent.replace(/^Mozilla\/5.0 /, ''));

const setStatus = (text, cls) => { $('status').textContent = text; $('status').className = 'big ' + cls; };

try {
  const V = '10.12.2';
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);

  const app = initializeApp({
    apiKey: "AIzaSyB3VLeSJyIVS5yn2Jn-u_YNN4sqIdRaWSU",
    authDomain: "guessball-888cd.firebaseapp.com",
    projectId: "guessball-888cd",
    appId: "1:485572357359:web:f312002c77140c94c5ff1a"
  });
  const auth = A.initializeAuth(app, {
    persistence: [A.indexedDBLocalPersistence, A.browserLocalPersistence],
    popupRedirectResolver: A.browserPopupRedirectResolver
  });
  const provider = new A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  log('Firebase loaded.');

  const fail = (how, e) => {
    setStatus('Failed', 'bad');
    $('method').textContent = how;
    log(how + ' FAILED: ' + (e.code || '') + ' ' + (e.message || e));
    try { localStorage.removeItem('gbtest_pending'); } catch (_) {}
  };

  // Did we just come back from a redirect?
  let pending = null;
  try { pending = localStorage.getItem('gbtest_pending'); } catch (_) {}
  if (pending) log('Coming back from a redirect sign-in…');
  try {
    const r = await A.getRedirectResult(auth);
    if (r && r.user) { $('method').textContent = 'Redirect'; log('Redirect sign-in WORKED.'); }
    else if (pending) log('Redirect came back with no account (this is the known iPhone problem).');
  } catch (e) { fail('Redirect', e); }
  try { localStorage.removeItem('gbtest_pending'); } catch (_) {}

  A.onAuthStateChanged(auth, user => {
    if (user) {
      setStatus('Signed in', 'ok');
      $('who').textContent = user.displayName ? `${user.displayName} (${user.email})` : user.email;
      log('Signed in as ' + user.email + ' — close the app fully and reopen to check it remembers you.');
    } else {
      if ($('status').textContent !== 'Failed') setStatus('Signed out', 'wait');
      $('who').textContent = '—';
    }
    $('out').disabled = !user;
  });

  $('popup').onclick = async () => {
    log('Trying popup…');
    try { await A.signInWithPopup(auth, provider); $('method').textContent = 'Popup'; log('Popup sign-in WORKED.'); }
    catch (e) { fail('Popup', e); }
  };
  $('redirect').onclick = async () => {
    log('Trying redirect…');
    try { localStorage.setItem('gbtest_pending', '1'); } catch (_) {}
    try { await A.signInWithRedirect(auth, provider); } catch (e) { fail('Redirect', e); }
  };
  $('out').onclick = async () => { await A.signOut(auth); $('method').textContent = '—'; log('Signed out.'); };
  $('popup').disabled = $('redirect').disabled = false;
} catch (e) {
  setStatus('Could not load', 'bad');
  log('Setup error: ' + (e.code || '') + ' ' + (e.message || e));
}
</script>
</body>
</html>
