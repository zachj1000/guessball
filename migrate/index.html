<script>
// ════════════════════════════════════════════════════════════════
//  ONE-TIME MIGRATION (build 7)
//  Moves the old v1.9 games into the new app, into either the real data (/v2) or QA (/qa).
//    1. Clear out test data: every club, game, guest, live-game marker and offer.
//       Kept: the admin list and everyone who has signed in (their account profile, minus old links).
//    2. Create the "Dodgers" club with Xaq as captain.
//    3. Every old player becomes a guest in it (Stu, Jacob, Kelly, HailsBear16, …).
//       "Zach" is linked straight to Xaq's account, exactly as if he had claimed it and a captain approved.
//    4. Add the 40 old games (pre-app + beta), counting for the Dodgers club and each player's "All my games".
//  Runs as Xaq (admin) through the normal security rules — nothing here gets extra powers.
//  The old v1.9 data is only read, never changed.
// ════════════════════════════════════════════════════════════════
const Migration = (() => {
  const MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
  function isoDate(s) {
    const m = /^(\w{3}) (\d{1,2}), (\d{4})$/.exec(String(s).trim());
    if (!m) throw new Error('Unreadable date: ' + s);
    return `${m[3]}-${String(MONTHS[m[1]]).padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  }
  const guestId = name => 'guest:dodgers:' + name.toLowerCase().replace(/[.#$\[\]\/\s]/g, '_');
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const clean = o => JSON.parse(JSON.stringify(o));

  // Old export → new-format games (same conversion the Statistician tests use)
  function convert(old) {
    const list = (Array.isArray(old.gameHistory) ? old.gameHistory : Object.values(old.gameHistory || {})).filter(Boolean);
    return list.map((g, k) => {
      const beta = !g.historical;
      const out = {
        id: 'legacy-' + String(list.length - k).padStart(3, '0'),
        date: isoDate(g.date), seq: list.length - k,
        era: beta ? 'beta' : 'preapp',
        players: g.players.map(p => ({ id: guestId(p.name), name: p.name })), scores: g.players.map(p => Number(p.score) || 0),
        away: g.awayTeam || '', home: g.homeTeam || '', park: g.stadium || '',
        mlb: (g.awayScore || g.homeScore) ? { away: Number(g.awayScore) || 0, home: Number(g.homeScore) || 0 } : null,
        note: g.notes || '', ended: true,
      };
      if (beta) out.beta = g.players.map(p => {
        const s = (g.stats || []).find(x => x.name === p.name) || {};
        return { correct: s.correct || 0, picks: s.totalPicks || 0, confRight: s.confCorrect || 0, confWrong: s.confWrong || 0 };
      });
      return out;
    });
  }

  // Work out everything that will happen, without changing anything.
  // current = what's in /<root> now (admin can read it all); old = the v1.9 data at the database top level.
  function plan({ current, old, adminUid, clubName = 'Dodgers', isPublic = false, claimName = 'Zach', now = Date.now(), code = null, random = Math.random }) {
    current = current || {};
    const games = convert(old);
    if (!games.length) throw new Error('No old games found');
    const me = (current.profiles || {})[adminUid];
    if (!me || me.account !== true) throw new Error('Set up your profile in this copy of the app first (sign in once), then run this');
    code = code || Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(random() * CODE_CHARS.length)]).join('');

    // ── 1. Clear test data (leaf by leaf, so each change passes the normal rules) ──
    const wipe = {};
    const del = (p, obj, depth) => Object.keys(obj || {}).forEach(k => {
      if (depth > 1) del(p + '/' + k, obj[k], depth - 1); else wipe[p + '/' + k] = null;
    });
    del('clubs', current.clubs, 1); del('clubNames', current.clubNames, 1); del('clubList', current.clubList, 1);
    del('games', current.games, 1); del('playerGames', current.playerGames, 2); del('live', current.live, 1); del('offers', current.offers, 2);
    const keptAccounts = [];
    Object.entries(current.profiles || {}).forEach(([pid, p]) => {
      if (p && p.account === true) {                         // someone who signed in: keep, but drop links to old test guests
        keptAccounts.push(p.name || pid);
        if (p.aliases) wipe['profiles/' + pid + '/aliases'] = null;
        if (p.club) wipe['profiles/' + pid + '/club'] = null;
      } else wipe['profiles/' + pid] = null;                  // test guests
    });
    // Xaq's own account info: forget test clubs and claims (other people's account info is private — their app tidies itself)
    const myUser = (current.users || {})[adminUid] || {};
    if (myUser.clubs) wipe['users/' + adminUid + '/clubs'] = null;
    if (myUser.claims) wipe['users/' + adminUid + '/claims'] = null;

    // ── 2–4. Build the Dodgers club ──
    const names = [];                                         // every old player, in order of first appearance (oldest game first)
    [...games].sort((a, b) => a.seq - b.seq).forEach(g => g.players.forEach(p => { if (!names.includes(p.name)) names.push(p.name); }));
    const firstDate = {};
    [...games].sort((a, b) => a.seq - b.seq).forEach(g => g.players.forEach(p => { firstDate[p.name] = firstDate[p.name] || g.date; }));
    const joined = n => Date.parse(firstDate[n] + 'T12:00:00Z') || now;
    const claimed = names.find(n => n.toLowerCase() === String(claimName).toLowerCase()) || null;

    const create = {};
    create['clubs/' + code + '/info'] = { name: clubName, public: !!isPublic, createdAt: now, createdBy: adminUid };
    create['clubNames/' + clubName.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.#$\[\]\/]/g, '_')] = code;
    create['clubList/' + code] = { name: clubName, public: !!isPublic };
    const memberAt = claimed ? joined(claimed) : now;
    create['clubs/' + code + '/members/' + adminUid] = { name: claimed || me.name, captain: true, guest: false, joinedAt: memberAt };
    create['users/' + adminUid + '/clubs/' + code] = true;
    names.forEach(n => {
      const pid = guestId(n);
      create['profiles/' + pid] = clean({ name: n, account: false, createdBy: adminUid, club: code, createdAt: joined(n),
        claimedBy: n === claimed ? adminUid : undefined });
      if (n === claimed) {                                    // Zach = Xaq: already claimed and approved
        create['users/' + adminUid + '/claims/' + pid] = code;
        create['profiles/' + adminUid + '/aliases/' + pid] = true;
      } else create['clubs/' + code + '/members/' + pid] = { name: n, captain: false, guest: true, joinedAt: joined(n) };
    });
    const gameChanges = {};
    games.forEach(g => {
      gameChanges['games/' + g.id] = clean({ ...g, host: adminUid, clubList: [code] });
      gameChanges['clubs/' + code + '/games/' + g.id] = { date: g.date, seq: g.seq };
      g.players.forEach(p => { gameChanges['playerGames/' + p.id + '/' + g.id] = { date: g.date, seq: g.seq }; });
    });

    // Plain-English summary for the preview
    const rec = {};
    games.forEach(g => {
      const top = Math.max(...g.scores), winners = g.scores.filter(s => s === top).length;
      g.players.forEach((p, i) => { const r = rec[p.name] = rec[p.name] || { w: 0, l: 0, t: 0, games: 0 }; r.games++;
        if (g.scores[i] === top && winners > 1) r.t++; else if (g.scores[i] === top) r.w++; else r.l++; });
    });
    const count = o => Object.keys(o || {}).length;
    const summary = {
      code, clubName, isPublic: !!isPublic,
      removing: { clubs: count(current.clubs), games: count(current.games), guests: Object.values(current.profiles || {}).filter(p => p && p.account !== true).length,
                  liveMarkers: count(current.live) },
      keptAccounts,
      guests: names.filter(n => n !== claimed), claimed,
      games: games.length, preapp: games.filter(g => g.era === 'preapp').length, beta: games.filter(g => g.era === 'beta').length,
      firstDate: [...games].sort((a, b) => a.date.localeCompare(b.date))[0].date,
      lastDate: [...games].sort((a, b) => b.date.localeCompare(a.date))[0].date,
      records: Object.entries(rec).sort((a, b) => b[1].games - a[1].games).map(([name, r]) => ({ name, ...r })),
    };
    return { code, games, wipe, create, gameChanges, summary };
  }

  // Send the plan in steps (each step is all-or-nothing). db.update takes { path: value } relative to the top.
  async function run(p, { db, root, onStep = () => {} }) {
    const pre = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [root + '/' + k, v]));
    const chunks = (o, n) => { const e = Object.entries(o), out = []; for (let i = 0; i < e.length; i += n) out.push(Object.fromEntries(e.slice(i, i + n))); return out; };
    if (Object.keys(p.wipe).length) { onStep('Clearing test data…'); for (const c of chunks(p.wipe, 400)) await db.update(pre(c)); }
    onStep('Creating the ' + p.summary.clubName + ' club and guests…'); await db.update(pre(p.create));
    onStep('Adding ' + p.games.length + ' games…'); for (const c of chunks(p.gameChanges, 200)) await db.update(pre(c));
    onStep('Done');
  }

  // Read it all back and check it matches the plan
  async function verify(p, { db, root, adminUid }) {
    const problems = [];
    const club = await db.get(root + '/clubs/' + p.code);
    if (!club || !club.info) problems.push('club missing');
    const idx = Object.keys((club && club.games) || {});
    if (idx.length !== p.games.length) problems.push(`club lists ${idx.length} games, expected ${p.games.length}`);
    for (const g of p.games) {
      const saved = await db.get(root + '/games/' + g.id);
      if (!saved) { problems.push('missing game ' + g.id); continue; }
      if (JSON.stringify(saved.scores) !== JSON.stringify(g.scores)) problems.push('scores differ in ' + g.id);
    }
    const members = Object.keys((club && club.members) || {});
    if (!members.includes(adminUid)) problems.push('you are not in the club');
    if (members.length !== p.summary.guests.length + 1) problems.push(`roster has ${members.length}, expected ${p.summary.guests.length + 1}`);
    return problems;
  }

  return { convert, plan, run, verify, guestId };
})();


</script>

const CONSOLE = 'https://console.firebase.google.com/project/guessball-888cd/database/guessball-888cd-default-rtdb/rules';
function draw() {
  const m = $('#m'); let h = '<h1>Move the old games</h1>';
  h += `<h2>Step 1 · Security rules</h2><div class="card"><p class="muted" style="margin:0 0 10px">Copy the new rules, open Firebase, select everything in the rules box, paste, and tap Publish.</p>
    <div class="seg"><button id="copyrules" class="alt">${st.copied ? 'Copied ✓' : 'Copy rules'}</button><button class="alt" onclick="window.open('${CONSOLE}')">Open Firebase</button></div>
    <p class="muted mono" style="margin:10px 0 0">${RULES.length.toLocaleString()} characters · starts <b>{"rules":{"v2"</b> · ends <b>}}}</b></p></div>
    <h2>Step 2 · Move the games</h2>`;
  if (!st.user) {
    h += `<p class="muted">One-time move of the old Guess Ball games into the new app. Sign in as yourself (the admin).</p><button id="signin">Continue with Google</button>`;
  } else if (!st.admin) {
    h += `<div class="card bad">Only the Guess Ball admin can use this page.</div>`;
  } else {
    const T = TARGETS[st.target];
    h += `<p class="muted">Signed in as ${esc(st.user.email || st.user.uid)}. Nothing changes until you press the red button.</p>
    <h2>Where to</h2>
    <div class="seg">
      <button data-t="qa" class="${st.target === 'qa' ? 'on' : ''}">QA first<small>Guess Ball Next · the rehearsal</small></button>
      <button data-t="live" class="${st.target === 'live' ? 'on' : ''}" ${st.qaDone ? '' : 'disabled'}>Real app<small>${st.qaDone ? 'the real thing' : 'after QA is done'}</small></button>
    </div>`;
    if (st.error) h += `<div class="card bad">${esc(st.error)}</div>`;
    if (st.plan && !st.problems) {
      const s = st.plan.summary;
      h += `<h2>What will happen in ${esc(T.long)}</h2>
      <div class="card">
        <div class="row"><span>Clear out test data</span><span>${s.removing.clubs} clubs · ${s.removing.games} games · ${s.removing.guests} guests · ${s.removing.liveMarkers} live-game markers</span></div>
        <div class="row"><span>Accounts kept</span><span>${esc(s.keptAccounts.join(', ') || '—')}</span></div>
        <div class="row"><span>New club</span><span>${esc(s.clubName)} · ${s.isPublic ? 'public' : 'private'} · you're captain</span></div>
        <div class="row"><span>“${esc(s.claimed || '—')}”</span><span>linked to your account</span></div>
        <div class="row"><span>Guests</span><span style="text-align:right">${esc(s.guests.join(', '))}</span></div>
        <div class="row"><span>Old games</span><span>${s.games} (${s.preapp} pre-app, ${s.beta} beta) · ${s.firstDate} to ${s.lastDate}</span></div>
      </div>
      <h2>Records after the move</h2>
      <div class="card"><table><tr><th>Player</th><th>W</th><th>L</th><th>T</th><th>Games</th></tr>
        ${s.records.map(r => `<tr><td>${esc(r.name)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t || ''}</td><td>${r.games}</td></tr>`).join('')}</table></div>
      <h2>Go</h2>
      <p class="muted">Type <b>${T.label}</b> to confirm${st.target === 'live' ? ' — this clears the test data in the real app for good' : ''}.</p>
      <input id="typed" autocomplete="off" autocapitalize="characters" value="${esc(st.typed)}" placeholder="${T.label}">
      <button id="run" class="danger" ${st.busy || st.typed.trim().toUpperCase() !== T.label ? 'disabled' : ''}>${st.busy ? 'Working…' : 'Move the old games into ' + esc(T.label)}</button>`;
    }
    if (st.log.length) h += `<div class="card mono">${st.log.map(esc).join('<br>')}</div>`;
    if (st.problems) h += st.problems.length
      ? `<div class="card bad"><b>Something doesn't match:</b><br>${st.problems.map(esc).join('<br>')}<br><br>Send Claude a screenshot of this.</div>`

  }

  const on = (s, f) => { const e = $(s); if (e) e.onclick = f; };

  on('#signin', async () => { const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); try { await A.signInWithPopup(auth, p, A.browserPopupRedirectResolver); } catch (e) { st.error = e.message; draw(); } });

  const ty = $('#typed'); if (ty) ty.oninput = () => { st.typed = ty.value; const r = $('#run'); if (r) r.disabled = st.busy || st.typed.trim().toUpperCase() !== TARGETS[st.target].label; };
  on('#run', go); on('#again', () => { st.problems = null; st.log = []; st.typed = ''; prepare(); });
}

async function prepare() {
  st.plan = null; st.error = null; draw();
  try {
    st.qaDone = !!(await db.get('qa/games/legacy-001'));
    const T = TARGETS[st.target];
    const [current, gameHistory] = await Promise.all([db.get(T.root), db.get('gameHistory')]);
    st.plan = Migration.plan({ current, old: { gameHistory }, adminUid: st.user.uid });
  } catch (e) {
    st.error = /profile/.test(e.message) ? `Open ${TARGETS[st.target].long} and sign in once so your profile exists there, then come back and refresh this page.` : e.message;
  }
  draw();
}
async function go() {
  const T = TARGETS[st.target]; st.busy = true; st.log = []; draw();
  try {
    await Migration.run(st.plan, { db, root: T.root, onStep: x => { st.log.push(x); draw(); } });
    st.problems = await Migration.verify(st.plan, { db, root: T.root, adminUid: st.user.uid });
    if (st.target === 'qa') st.qaDone = true;
  } catch (e) { st.error = 'Stopped: ' + e.message; }
  st.busy = false; draw();
}
A.onAuthStateChanged(auth, async u => {
  st.user = u; st.admin = false;
  if (u) { try { st.admin = (await db.get('v2/admins/' + u.uid)) === true; } catch (e) { st.admin = false; } }
  draw(); if (u && st.admin) prepare();
});
